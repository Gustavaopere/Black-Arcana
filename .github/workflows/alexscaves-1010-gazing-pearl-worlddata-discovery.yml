name: Alex's Caves 1.0.10 Gazing Pearl ACWorldData reputation discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-worlddata-discovery.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py'
      - 'docs/qa/alexscaves_1010_gazing_pearl_worlddata_checks.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-WORLDDATA-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-WORLDDATA-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/gazing-pearl.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gazing_pearl_worlddata_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax validation for read-only probe
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_worlddata_checks.py
      - name: Download pinned publisher JAR
        run: |
          mkdir -p build/gazing-pearl-worlddata-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/gazing-pearl-worlddata-1010/publisher.jar
      - name: Produce bounded class and exact reputation callers report
        run: |
          python3 docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py \
            --jar build/gazing-pearl-worlddata-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-worlddata-1010/report.json
      - name: Reject empty or incorrectly scoped read-only evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/gazing-pearl-worlddata-1010/report.json')
          data=json.loads(p.read_text(encoding='utf8'))
          n=data['native']
          assert data['scope']=='GAZING_PEARL_ACWORLD_DATA_REPUTATION_DISCOVERY_ONLY'
          assert n['publisher_classfiles_scanned']==1555
          assert n['selected_method_count']==len(n['selected_methods'])
          assert 'com/github/alexmodguy/alexscaves/server/item/GazingPearlItem' in n['reputation_reference_owners']
          assert data['static_contract']=='NOT_CERTIFIED'
          assert data['mutation']=='NO_MUTATION'
          assert data['physical_qa']=='NOT_TESTED'
          print('PASS: bounded discovery report schema and fail-closed status')
          PY
      - name: Verify fixed publisher reputation, serialization, and caller pivots
        run: |
          python3 docs/qa/alexscaves_1010_gazing_pearl_worlddata_checks.py \
            --report build/gazing-pearl-worlddata-1010/report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-WORLDDATA-1.0.10.json'
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, copy
          report=json.loads(Path('build/gazing-pearl-worlddata-1010/report.json').read_text())
          seal=json.loads(Path('wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-WORLDDATA-1.0.10.json').read_text())
          for kind,method,offset in (
              ('setter-clamp','setDeepOneReputation',10),
              ('load-restore','load',64),
          ):
              altered=copy.deepcopy(report)
              s=copy.deepcopy(seal)
              body=next(x for x in altered['native']['selected_methods']
                        if x['declaration']['name']==method)
              instruction=next(x for x in body['instructions'] if x['offset']==offset)
              instruction['opcode']='nop'
              normal=json.dumps(body['instructions'],ensure_ascii=False,sort_keys=True,indent=2)+'\n'
              body['instruction_sha256']=hashlib.sha256(normal.encode('utf8')).hexdigest()
              next(x for x in s['owner']['methods'] if x['name']==method)['instruction_sha256']=(
                  body['instruction_sha256'])
              raw=json.dumps(altered,ensure_ascii=False,sort_keys=True).encode('utf8')
              s['evidence']['report_sha256']=hashlib.sha256(raw).hexdigest()
              s['evidence']['report_bytes']=len(raw)
              Path('build/gazing-pearl-worlddata-1010/bad-'+kind+'.json').write_bytes(raw)
              Path('build/gazing-pearl-worlddata-1010/bad-'+kind+'-seal.json').write_text(
                  json.dumps(s,ensure_ascii=False),encoding='utf8')
          PY
          for kind in setter-clamp load-restore; do
            if python3 docs/qa/alexscaves_1010_gazing_pearl_worlddata_checks.py \
              --report "build/gazing-pearl-worlddata-1010/bad-$kind.json" \
              --manifest "build/gazing-pearl-worlddata-1010/bad-$kind-seal.json"; then
              echo "FAIL: forged Deep One reputation $kind report accepted"
              exit 1
            fi
          done
      - name: Upload exact reputation dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gazing-pearl-worlddata
          path: build/gazing-pearl-worlddata-1010/report.json
          if-no-files-found: warn
          retention-days: 14
