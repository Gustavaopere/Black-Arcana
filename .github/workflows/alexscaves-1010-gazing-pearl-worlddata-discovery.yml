name: Alex's Caves 1.0.10 Gazing Pearl ACWorldData reputation discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-worlddata-discovery.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-WORLDDATA-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gazing_pearl_worlddata_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax validation for read-only probe
        run: python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py
      - name: Download pinned publisher JAR
        run: |
          mkdir -p build/gazing-pearl-worlddata-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/gazing-pearl-worlddata-1010/publisher.jar
      - name: Produce bounded class and exact reputation callers report
        run: |
          python3 docs/qa/alexscaves_1010_gazing_pearl_worlddata_probe.py \
            --jar build/gazing-pearl-worlddata-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-worlddata-1010/report.json
      - name: Reject empty or incorrectly scoped read-only evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/gazing-pearl-worlddata-1010/report.json')
          data=json.loads(p.read_text(encoding='utf8'))
          n=data['native']
          assert data['scope']=='GAZING_PEARL_ACWORLD_DATA_REPUTATION_DISCOVERY_ONLY'
          assert n['publisher_classfiles_scanned']==1555
          assert n['selected_method_count']==len(n['selected_methods'])
          assert 'com/github/alexmodguy/alexscaves/server/item/GazingPearlItem' in n['reputation_reference_owners']
          assert data['static_contract']=='NOT_CERTIFIED'
          assert data['mutation']=='NO_MUTATION'
          assert data['physical_qa']=='NOT_TESTED'
          print('PASS: bounded discovery report schema and fail-closed status')
          PY
      - name: Upload exact reputation dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gazing-pearl-worlddata
          path: build/gazing-pearl-worlddata-1010/report.json
          if-no-files-found: warn
          retention-days: 14
