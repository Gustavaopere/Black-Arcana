name: Audit exact Goety Cataclysm 1.8.2 ritual identities

on:
  push:
    branches:
      - audit/goety-cataclysm-182-ritual-paths-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_ritual_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain publisher artifact and verify physical SHA-1
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/goety_cataclysm-1.21.1-1.8.2.jar"
          urls=(
            "https://www.curseforge.com/api/v1/mods/1224214/files/8518940/download"
            "https://mediafilez.forgecdn.net/files/8518/940/goety_cataclysm-1.21.1-1.8.2.jar"
            "https://edge.forgecdn.net/files/8518/940/goety_cataclysm-1.21.1-1.8.2.jar"
          )
          success=0
          for u in "${urls[@]}"; do
            rm -f "$jar"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 120 "$u" -o "$jar"; then
              got="$(sha1sum "$jar" | awk '{print $1}')"
              if [ "$got" = "4e3052a082200371b36e1a88fdce05e294d82757" ]; then
                success=1
                break
              fi
            fi
          done
          test "$success" -eq 1 || { echo "FAIL CLOSED — exact artifact was not retrieved"; exit 1; }
          echo "EXACT_PHYSICAL_SHA1=4e3052a082200371b36e1a88fdce05e294d82757"
          echo "PUBLISHER_ARTIFACT_BYTES=$(stat -c %s "$jar")"
      - name: Emit facts only from exact artifact recipes
        shell: bash
        env:
          JAR_PATH: ${{ runner.temp }}/goety_cataclysm-1.21.1-1.8.2.jar
          RECIPE_ROOT: data/goety_cataclysm/recipe
          AUDIT_OUT: audit-targeted
        run: |
          set -euo pipefail
          python .github/goety_addon_targeted_semantic.py
          cat audit-targeted/summary.txt
          python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(l) for l in Path('audit-targeted/ritual-targeted.jsonl').read_text().splitlines()]
          assert len(records) == 48, f"Unexpected goety:ritual count {len(records)}"
          assert sum(r['focus_acquisition'] for r in records) == 24
          assert sum(not r['focus_acquisition'] for r in records) == 24
          assert len({r['path'] for r in records}) == 48
          assert not any(r['conditions'] for r in records)
          for i,r in enumerate(records,1):
              print("RITUAL_ROW="+json.dumps({"index":i,"path":r["path"],"type":r["ritual_type"],"result_ids":r["result_ids"],"outcome_ids":r["semantic_outcome_ids"],"conditions":r["conditions"],"focus_acquisition":r["focus_acquisition"]}, sort_keys=True, separators=(',',':')))
          PY
      - name: Confirm clean-room isolated audit
        run: |
          set -euo pipefail
          test ! -e ./goety_cataclysm-1.21.1-1.8.2.jar
          echo "NON_MERGE_CLEAN_ROOM_AUDIT=true"
