name: Alex's Caves 1.0.10 Lanternfish Bucket individual transport discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_lanternfish_bucket_probe.py'
      - '.github/workflows/alexscaves-1010-lanternfish-bucket.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/lanternfish-bucket.md'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_gossamer_worm_bucket_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_lanternfish_bucket_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_lanternfish_bucket_probe.py
          python3 docs/qa/alexscaves_1010_lanternfish_bucket_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/lanternfish-bucket
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/lanternfish-bucket/publisher.jar
      - name: Project individual registry, fluid, entity and transport consumers
        run: |
          python3 docs/qa/alexscaves_1010_lanternfish_bucket_probe.py --jar build/lanternfish-bucket/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/lanternfish-bucket/report.json
      - name: Independent deterministic replay
        run: |
          python3 docs/qa/alexscaves_1010_lanternfish_bucket_probe.py --jar build/lanternfish-bucket/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/lanternfish-bucket/replay.json
          cmp build/lanternfish-bucket/report.json build/lanternfish-bucket/replay.json
          sha256sum build/lanternfish-bucket/report.json
      - name: Archive read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lanternfish-bucket
          path: build/lanternfish-bucket/report.json
          if-no-files-found: warn
          retention-days: 14
