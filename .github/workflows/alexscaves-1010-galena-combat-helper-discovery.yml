name: Alex's Caves 1.0.10 Galena combat ACCompat helper discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-combat-helper-discovery.yml'
      - 'docs/qa/alexscaves_1010_galena_combat_helpers_probe.py'
      - 'docs/qa/alexscaves_1010_galena_combat_helpers_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ACCOMPAT-COMBAT-BRIDGES-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ACCOMPAT-COMBAT-BRIDGES-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/equipment/galena-gauntlet.md'
      - 'docs/qa/alexscaves_1010_galena_gauntlet_discovery.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  galena_combat_helper_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate probe syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_galena_combat_helpers_probe.py docs/qa/alexscaves_1010_galena_combat_helpers_checks.py
      - name: Retrieve and verify exact publisher artifact
        run: |
          mkdir -p build/galena-combat-helpers-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/galena-combat-helpers-1010/publisher.jar
          test "$(stat -c %s build/galena-combat-helpers-1010/publisher.jar)" -eq 75279314
          test "$(sha256sum build/galena-combat-helpers-1010/publisher.jar | cut -d ' ' -f1)" = '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c'
      - name: Replay Galena full native caller report
        run: |
          python3 docs/qa/alexscaves_1010_galena_gauntlet_discovery.py \
            --jar build/galena-combat-helpers-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-combat-helpers-1010/caller-report.json \
            > build/galena-combat-helpers-1010/caller.log
          test "$(sha256sum build/galena-combat-helpers-1010/caller-report.json | cut -d ' ' -f1)" = 'c91a48f9892be09c4ab951c8083703b0c5ffbb026fc43e7d808c2033dde8bba9'
      - name: Discover 14 pinned direct Galena helper bodies
        run: |
          python3 docs/qa/alexscaves_1010_galena_combat_helpers_probe.py \
            --jar build/galena-combat-helpers-1010/publisher.jar \
            --caller-report build/galena-combat-helpers-1010/caller-report.json \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-combat-helpers-1010/bridge-report.json
      - name: Verify SHA-exact helper report and adversarial forged instructions
        run: |
          test "$(sha256sum build/galena-combat-helpers-1010/bridge-report.json | cut -d ' ' -f1)" = 'a88dbcda0906f344ecfcd8d4ecea0ea7ba0babae2013643f938a1a2604861bfa'
          test "$(stat -c %s build/galena-combat-helpers-1010/bridge-report.json)" -eq 44637
          python3 docs/qa/alexscaves_1010_galena_combat_helpers_checks.py \
            --report build/galena-combat-helpers-1010/bridge-report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ACCOMPAT-COMBAT-BRIDGES-1.0.10.json' \
            --adversarial
      - name: Upload observational evidence, never third-party bytecode
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: galena-1010-combat-helper-discovery
          path: |
            build/galena-combat-helpers-1010/bridge-report.json
            build/galena-combat-helpers-1010/caller.log
          if-no-files-found: warn
          retention-days: 14
