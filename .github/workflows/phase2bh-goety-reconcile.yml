name: Phase 2BH Goety durable reconciliation

on:
  push:
    branches:
      - docs/magic-catalog-phase2bh-goety-exact
    paths:
      - .github/workflows/phase2bh-goety-reconcile.yml

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download accepted evidence artifacts
        run: |
          mkdir -p /tmp/goety/a /tmp/goety/f /tmp/goety/r /tmp/goety/s
          gh run download 34670150370 -n goety-3.1.4-exact-artifact-audit -D /tmp/goety/a
          gh run download 34670458172 -n goety-3.1.4-focus-reachability-audit -D /tmp/goety/f
          gh run download 34670556329 -n goety-3.1.4-ritual-identity-audit -D /tmp/goety/r
          gh run download 34670758163 -n goety-3.1.4-ritual-semantic-dedup-audit -D /tmp/goety/s
      - name: Reconcile durable catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter, OrderedDict
          import re

          ROOT = Path('.')
          EXPECTED_SHA = 'a0770e180e4b1b87d8fa9c8356e9dbf34d82a7'
          MODLIST_SHA = '7aaece7acbfb07ba4d0c66029042f36c50d046f0'

          def read(p): return (ROOT / p).read_text()
          def write(p, s):
              q = ROOT / p; q.parent.mkdir(parents=True, exist_ok=True); q.write_text(s)
          def repl(t, old, new, label):
              n=t.count(old)
              if n != 1: raise SystemExit(f'{label}: anchor count {n}')
              return t.replace(old,new,1)
          def rex(t, pat, new, label, flags=0):
              out,n=re.subn(pat,new,t,count=1,flags=flags)
              if n != 1: raise SystemExit(f'{label}: regex count {n}')
              return out

          audit = Path('/tmp/goety/a/report.txt').read_text()
          focus = Path('/tmp/goety/f/report.txt').read_text()
          ritual = Path('/tmp/goety/r/report.txt').read_text()
          semantic = Path('/tmp/goety/s/report.txt').read_text()
          for label, text in [('audit',audit),('focus',focus),('ritual',ritual),('semantic',semantic)]:
              if f'actual_sha1={EXPECTED_SHA}' not in text:
                  raise SystemExit(f'{label}: exact SHA mismatch')

          # Exact Focus inventory: 123 active IDs, excluding the proxy empty_focus.
          fsec = focus.split('== per-Focus acquisition classification ==\n',1)[1]
          focus_ids = [ln.split('|',1)[0] for ln in fsec.splitlines() if '|type=' in ln and ln.split('|',1)[0].endswith('_focus')]
          if len(focus_ids) != 123 or len(set(focus_ids)) != 123:
              raise SystemExit(f'focus inventory mismatch: {len(focus_ids)}')
          required_focus = ['active_focus_ids_excluding_empty=123','same_named_focus_recipe_count=123','conditioned_same_named_recipe_count=0','mismatched_focus_result_count=0','goety:ritual=80','minecraft:crafting_shaped=43']
          for needle in required_focus:
              if needle not in focus: raise SystemExit(f'missing Focus evidence: {needle}')

          # Exact ritual inventory: remove unavailable Cyclic/VanillaTweaks identities and dedupe by semantic signature.
          if not all(x in ritual for x in ['ritual_recipe_count=342','focus_acquisition_ritual_count=83','non_focus_ritual_recipe_count=259']):
              raise SystemExit('ritual identity counts drifted')
          ssec = semantic.split('== all non-Focus semantic signatures ==\n',1)[1]
          rows=[]
          for ln in ssec.splitlines():
              if '|class=' not in ln: continue
              path=ln.split('|',1)[0]
              parts={p.split('=',1)[0]:p.split('=',1)[1] for p in ln.split('|')[1:] if '=' in p}
              rows.append((path,parts))
          if len(rows) != 259: raise SystemExit(f'non-Focus row mismatch {len(rows)}')
          available=[]
          for path,p in rows:
              c=p.get('conditions','')
              if 'modid=cyclic' in c or 'modid=vanillatweaks' in c: continue
              available.append((path,p))
          by=OrderedDict()
          for path,p in available:
              sig=p['signature']
              if sig not in by or (by[sig][1].get('conditions') != '<none>' and p.get('conditions') == '<none>'):
                  by[sig]=(path,p)
          if len(by) != 238: raise SystemExit(f'current-pack ritual semantic count mismatch {len(by)}')
          classes=Counter(p['class'] for _,p in by.values())
          craft=Counter(p['craftType'] for _,p in by.values())

          focus_list='\n'.join(f'- `{x}`' for x in focus_ids)
          ritual_list='\n'.join(f'- `{path}` → `{p["signature"]}` (`{p["class"]}`, `{p["craftType"]}`)' for path,p in by.values())
          inventory=f'''# Goety 3.1.4 — exact semantic inventory

Status: `PHASE 2BH CANDIDATE / EXACT HASH-MATCHED ARTIFACT / 361 SEMANTIC OBJECTS`

This file preserves only factual identity data needed to reconstruct the Phase 2BH semantic count. It does **not** preserve recipe ingredients, numerical balance, implementation bodies, localization prose, assets, models or sounds.

## Physical authority

- JAR: `goety-3.1.4.jar`
- mod id/runtime: `goety` / `3.1.4`
- SHA-1: `{EXPECTED_SHA}`
- CurseForge: project `586095`, file `8689429`
- physical modlist: 595 top-level entries; SHA-1 `{MODLIST_SHA}`

## Exact Focus actions — 123

The exact artifact exposes 124 `_focus` identities/fields. `empty_focus` is the non-action/proxy slot and is excluded. Every one of the remaining **123** active Focus identities has a same-named base acquisition recipe in the exact artifact; 80 are `goety:ritual` and 43 are shaped crafting. None of those 123 base recipes has a mod-loaded condition, and none resolves to a mismatched Focus result.

{focus_list}

## Exact non-Focus ritual actions — 238

The exact artifact contains **342** `goety:ritual` recipe resources. **83** are Focus-acquisition resources and are excluded because the resulting Focus action is already counted. The remaining **259** non-Focus resources collapse to **255** semantic signatures after four alternate-recipe duplicate groups are deduplicated: `ominous_saddle`, `terminus_scroll`, `thrash_glove`, and `summon_apostle`.

Under the physical provider set, sixteen Cyclic enchantment rituals and one VanillaTweaks ritual are unavailable and excluded. The resulting current-pack inventory is **238 distinct available non-Focus ritual actions**.

Class distribution: `{dict(classes)}`.

Craft-type distribution: `{dict(craft)}`.

### Counted ritual identities

{ritual_list}

## Semantic arithmetic

- active Focus actions: **123**
- available distinct non-Focus rituals: **238**
- Goety candidate subtotal: `123 + 238 = 361`
- canonical baseline entering Phase 2BH: **888**
- candidate strict minimum after promotion: `888 + 361 = 1249`

These values remain **candidate** until the durable PR is merged and exact post-merge CI evidence is recorded. Runtime balance, Soul Energy settlement, research gates, servant lifecycle, Lichdom, supported adapter/API seams and complete modpack runtime QA remain separate fail-closed gates.

## Evidence

- `34670150370 / 10290083272` — exact identity/Focus registry
- `34670458172 / 10290222369` — Focus reachability/acquisition
- `34670556329 / 10290527131` — ritual identity inventory
- `34670758163 / 10289884505` — ritual semantic deduplication

Discarded harness-failure runs `34670348040` and `34670400350` are not evidence.
'''
          write('wiki/modpack-catalog/providers/goety/EXACT-3.1.4-SEMANTIC-INVENTORY.md', inventory)

          exact_audit=f'''# Goety 3.1.4 — exact-artifact audit

Status: `PHASE 2BH CANDIDATE / EXACT HASH-MATCHED ARTIFACT / CATALOG IDENTITY CLOSED / RUNTIME API QA SEPARATE`

## Authority

Physical authority is `goety-3.1.4.jar`, mod id/runtime `goety` / `3.1.4`, SHA-1 `{EXPECTED_SHA}`, Minecraft 1.21.1 / NeoForge 21.1.248. The physical modlist contains 595 top-level entries and has SHA-1 `{MODLIST_SHA}`. CurseForge project/file is `586095 / 8689429`.

## Exact clean-room evidence

Isolated non-merge PR #197 materialized the exact distributed artifact. Accepted evidence is limited to cryptographic identity, metadata/resource/registry IDs, member/type signatures and narrow structural facts needed for catalog identity/reachability/deduplication. No implementation bodies, recipe ingredient lists, numerical balance, localization prose, assets, models or sounds are copied or adapted.

Accepted run/artifact pairs: `34670150370/10290083272`, `34670458172/10290222369`, `34670556329/10290527131`, `34670758163/10289884505`. Discarded harness-failure runs `34670348040` and `34670400350` are not evidence.

## Semantic closure

- 124 `_focus` identities/fields; `empty_focus` excluded as proxy; **123 active Focus actions**.
- 123/123 active Focuses have same-named base acquisition recipes; 80 ritual + 43 shaped; zero conditions and zero mismatched results.
- 342 exact Goety ritual recipe resources; 83 Focus-acquisition; 259 non-Focus.
- 259 non-Focus resources → 255 semantic signatures after four duplicate groups → **238 available distinct non-Focus ritual actions** after physical-provider condition filtering.
- Phase 2BH candidate Goety subtotal: **361**.
- canonical baseline entering this durable PR: **888 / 56 of 100**; candidate: **1249 / 57 of 100**, component #57.

See [`EXACT-3.1.4-SEMANTIC-INVENTORY.md`](EXACT-3.1.4-SEMANTIC-INVENTORY.md).

## Fail-closed boundary

This closure does not prove numerical costs/cooldowns/damage/range, Soul Energy transaction hooks, research predicates, servant ownership/persistence/Summon Down, Lichdom lifecycle, ritual completion/cancellation events, supported adapter/API seams, or assembled-modpack runtime behavior. Goety retains provider authority for those systems; Black Arcana must not double-cast, double-charge, mirror Soul Energy or infer completion from client/visual state.

## Provenance

Exact artifact metadata reports `MIT License`; the public 1.21.1 source line has mixed MIT/All-Rights-Reserved scopes. Neither is used as permission to copy implementation or assets. Phase 2BH is `REFERENCE_ONLY / COMPATIBILITY_TARGET`; any derivation requires separate exact-file license review.
'''
          write('wiki/modpack-catalog/providers/goety/EXACT-3.1.4-ARTIFACT-AUDIT.md', exact_audit)

          checkpoint=f'''# Phase 2BH — Goety 3.1.4 exact checkpoint

Status: `DURABLE PROMOTION CANDIDATE — NOT CANONICAL UNTIL MERGE + EXACT POST-MERGE CI`

Base audited: `main@7d14874e7d477c8ae2b3c8643c1519feea5a90cc`.

Exact physical identity: `goety-3.1.4.jar`, `goety` / `3.1.4`, SHA-1 `{EXPECTED_SHA}`, CurseForge `586095 / 8689429`, modlist 595 / `{MODLIST_SHA}`.

Evidence: PR #197; `34670150370/10290083272`, `34670458172/10290222369`, `34670556329/10290527131`, `34670758163/10289884505`.

Candidate disposition: 123 active Focus actions + 238 available distinct non-Focus ritual actions = **+361**; strict semantic minimum **888 → 1249**; provider-component coverage **56/100 → 57/100**, candidate component #57.

Numerical balance, Soul Energy settlement APIs, research, servants/Summon Down, Lichdom, ritual completion hooks, full-modpack runtime QA and Black Arcana adapter seams remain separate fail-closed gates. No runtime/Stage authority changes are part of Phase 2BH.

Promotion requires clean reconciled durable HEAD, GREEN PR-head CI, merge against latest main, and GREEN exact-SHA post-merge CI. A final-evidence reconciliation must then promote candidate totals to canonical values.
'''
          write('wiki/modpack-catalog/meta/PHASE2BH-GOETY-3.1.4-EXACT-CHECKPOINT.md', checkpoint)

          # Provider summaries.
          p='wiki/modpack-catalog/providers/goety/README.md'; t=read(p)
          t=repl(t,'`OPEN CURRENT REGISTRY / EXACT 3.1.4 JAR-SOURCE RECONCILIATION PENDING / RUNTIME QA PENDING`','`PHASE 2BH CANDIDATE / EXACT 3.1.4 ARTIFACT IDENTITY + SEMANTIC INVENTORY CLOSED / RUNTIME API QA PENDING`','README status')
          anchor='The current physical modlist is authoritative for installed JAR/runtime identity. CurseForge independently confirms the public 3.1.4 release identity. Neither surface proves source-to-binary equivalence.\n'
          overlay='''The current physical modlist is authoritative for installed JAR/runtime identity. CurseForge independently confirms the public 3.1.4 release identity.

## Phase 2BH exact-artifact closure candidate

Exact PR #197 evidence supersedes source-only uncertainty for catalog identity: **123 active Focus actions + 238 available distinct non-Focus ritual actions = 361**. Candidate totals are **1249 semantic objects / 57 of 100 components** from canonical baseline 888 / 56. These values remain candidate until durable merge + exact post-merge CI. See `EXACT-3.1.4-ARTIFACT-AUDIT.md` and `EXACT-3.1.4-SEMANTIC-INVENTORY.md`. Runtime/API/balance and provider-owned Soul Energy/research/servant/Lichdom settlement remain fail-closed.
'''
          t=repl(t,anchor,overlay,'README overlay')
          t=rex(t,r'## Semantic denominator and Phase 3 gate\n.*?\Z','''## Semantic denominator and Phase 3 gate

Canonical baseline entering Phase 2BH is **888 / 56 of 100**. The exact 3.1.4 artifact proposes Goety as `COUNTED_EXACT` with **361**, producing candidate **1249 / 57 of 100**. Canonical promotion still requires durable merge and exact post-merge CI. Runtime integration remains fail-closed until provider boundaries are separately proven.
''','README semantic tail',re.S)
          write(p,t)

          p='wiki/modpack-catalog/providers/goety/FOCUS-CATALOG.md'; t=read(p)
          t=repl(t,'Status: `PUBLIC 1.21.1 SOURCE REGISTRY 123 ACTIVE FOCUS ITEMS / LEGACY WIKI SUBSET 110 NAMES / EXACT 3.1.4 JAR-SOURCE RECONCILIATION PENDING`','Status: `PHASE 2BH CANDIDATE / EXACT 3.1.4 JAR 123 ACTIVE FOCUS ACTIONS / LEGACY WIKI SUBSET 110 NAMES / RUNTIME NUMERICS QA PENDING`','Focus status')
          t=repl(t,'## Source registry checkpoint\n','''## Exact 3.1.4 closure candidate

Exact artifact evidence closes **123 active/acquirable Focus actions**; `empty_focus` is excluded as proxy. All 123 have same-named base acquisition recipes (80 ritual + 43 shaped), with no mod-loaded condition. Phase 2BH therefore proposes **+123 Focus actions**. See `EXACT-3.1.4-SEMANTIC-INVENTORY.md`.

## Source registry checkpoint
''','Focus overlay')
          t=rex(t,r'## Semantic-count rule\n.*?(?=## Semantic overlap constraints)','''## Semantic-count rule

Phase 2BH exact-artifact evidence satisfies strict inclusion for **123 active player-acquirable provider Focus actions** as candidate `COUNTED_EXACT`. `empty_focus` and alternate acquisition recipes add zero identities. Numerical mechanics and stable integration APIs remain separate fail-closed gates.

''','Focus semantic',re.S)
          write(p,t)

          p='wiki/modpack-catalog/providers/goety/RITUALS-PROGRESSION.md'; t=read(p)
          t=repl(t,'Status: `OFFICIAL PUBLIC-DOCUMENTATION SURFACE CATALOGED / EXACT 3.1.4 RUNTIME SETTLEMENT AND REACHABILITY PENDING`','Status: `PHASE 2BH CANDIDATE / EXACT 3.1.4 RITUAL IDENTITY + CURRENT-PACK AVAILABILITY CLOSED / RUNTIME SETTLEMENT/API QA PENDING`','Ritual status')
          t=repl(t,'## Soul Energy authority\n','''## Exact 3.1.4 ritual closure candidate

Exact artifact evidence closes 342 ritual resources: 83 Focus acquisition (not recounted), 259 non-Focus → 255 semantic signatures after four duplicate groups → **238 available distinct non-Focus ritual actions** after current-pack condition filtering. Phase 2BH proposes **+238**. Identity/availability is closed; Soul Energy, sacrifices, research, cancellation/restart, servant ownership and completion hooks remain provider-owned/fail-closed.

## Soul Energy authority
''','Ritual overlay')
          t=t.replace('1. confirm the exact Focus/ritual/research registries packaged in `goety-3.1.4.jar` without violating clean-room constraints;','1. exact Focus and ritual identity inventories are closed by Phase 2BH; research/runtime semantics remain separate where needed;')
          write(p,t)

          p='wiki/modpack-catalog/providers/goety/TECHNICAL-AUDIT.md'; t=read(p)
          t=repl(t,'Status: `OPEN CURRENT REGISTRY / EXACT 3.1.4 JAR-SOURCE RECONCILIATION PENDING / RUNTIME/API QA PENDING`','Status: `PHASE 2BH CANDIDATE / EXACT 3.1.4 ARTIFACT REGISTRY + SEMANTIC INVENTORY CLOSED / RUNTIME/API QA PENDING`','Tech status')
          t=repl(t,'## Public 1.21.1 source line\n','''## Phase 2BH exact-artifact closure candidate

Exact hash-matched artifact evidence closes **123 active Focus actions + 238 available distinct non-Focus rituals = 361** for catalog identity. This does not claim source-to-binary equivalence and does not authorize inference of numerical mechanics, Soul Energy settlement, servant/research/Lichdom hooks or stable APIs.

## Public 1.21.1 source line
''','Tech overlay')
          t=t.replace('Therefore the global semantic total remains **797** and Goety remains non-additive at this checkpoint.','Phase 2BH proposes Goety as `COUNTED_EXACT` for **361** semantic objects. Canonical baseline is **888**; candidate strict minimum is **1249** pending durable merge + exact post-merge CI.')
          t=t.replace('| exact 3.1.4 Focus registry | UNVERIFIED |','| exact 3.1.4 Focus registry | EXACT ARTIFACT: 124 `_focus` identities, 123 active after proxy exclusion |')
          t=t.replace('| exact 3.1.4 semantic Focus inventory | UNVERIFIED |','| exact 3.1.4 semantic Focus inventory | CANDIDATE `COUNTED_EXACT`: 123 active/acquirable Focus actions |')
          t=t.replace('| exact 3.1.4 ritual identity inventory | UNVERIFIED |','| exact 3.1.4 ritual identity inventory | EXACT ARTIFACT: 342 resources; candidate 238 available distinct non-Focus semantic rituals |')
          write(p,t)

          write('wiki/modpack-catalog/providers/goety/focuses/README.md','# Goety 3.1.4 — Focus inventory\n\nPhase 2BH exact-artifact evidence closes **123 active Focus actions**; `empty_focus` is excluded as a proxy. See `../EXACT-3.1.4-SEMANTIC-INVENTORY.md`. Numerical/runtime API claims remain fail-closed.\n')
          write('wiki/modpack-catalog/providers/goety/rituals/README.md','# Goety 3.1.4 — ritual inventory\n\nPhase 2BH exact-artifact evidence closes **238 available distinct non-Focus ritual actions** under the physical provider set. See `../EXACT-3.1.4-SEMANTIC-INVENTORY.md`. Settlement/runtime API claims remain provider-owned/fail-closed.\n')

          # Global candidate overlays. Keep canonical 888/56 until final-evidence PR.
          p='wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'; t=read(p)
          candidate='''## Phase 2BH candidate — Goety 3.1.4

Canonical baseline entering this PR remains **888 semantic magic objects / 56 of 100 provider components**. Exact hash-matched 3.1.4 evidence closes **123 active Focus actions + 238 available distinct non-Focus ritual actions = +361**. Phase 2BH proposes candidate strict minimum **1249** and candidate component **#57 / 57 of 100**. These values do not become canonical until durable merge + exact post-merge CI. Runtime/API/balance QA remains separate.

'''
          t=repl(t,'## Phase 2BG canonical — Leyline Spellbooks 1.0.3\n',candidate+'## Phase 2BG canonical — Leyline Spellbooks 1.0.3\n','Semantic candidate')
          t=rex(t,r'^\| \[Goety\]\(\.\./providers/goety/README\.md\).*?\n','', 'Remove Goety open row', re.M)
          write(p,t)

          p='wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'; t=read(p)
          t=rex(t,r'The current Goety reconciliation remains an \*\*evidence-only \+0 delta\*\*:.*?\n\n','''Phase 2BH now has a **durable promotion candidate** for Goety 3.1.4 from exact hash-matched artifact evidence: **123 active Focus actions + 238 available distinct non-Focus ritual actions = 361**. Canonical values remain **888 / 56 of 100** until durable merge + exact post-merge CI; candidate values are **1249 / 57 of 100**. Runtime/API/balance gates remain separate.

''','Coverage Goety paragraph',re.S)
          t=repl(t,'## Phase 2BG — Leyline Spellbooks 1.0.3 component #56, canonical\n','''## Phase 2BH promotion candidate — Goety 3.1.4

Exact 3.1.4 artifact identity closes candidate **+361** and candidate component #57. See `PHASE2BH-GOETY-3.1.4-EXACT-CHECKPOINT.md` and `../providers/goety/EXACT-3.1.4-ARTIFACT-AUDIT.md`. Canonical baseline remains 888 / 56/100 pending promotion.

## Phase 2BG — Leyline Spellbooks 1.0.3 component #56, canonical
''','Coverage candidate')
          write(p,t)

          p='wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'; t=read(p)
          t=rex(t,r'## Checkpoint Goety — reconciliação de evidência 3\.1\.x\n.*?(?=## Regra de completude)','''## Checkpoint Goety — Phase 2BH exact candidate

Exact `goety-3.1.4.jar` evidence closes **123 active Focus actions + 238 available distinct non-Focus ritual actions = +361**. Candidate totals: **1249 semantic objects / 57 of 100 components**; canonical values remain 888 / 56 until durable merge + exact post-merge CI. Runtime/API/provider settlement remains fail-closed.

''','Current Goety',re.S)
          write(p,t)

          p='wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'; t=read(p)
          t=repl(t,'## Phase 2BG — Leyline Spellbooks 1.0.3 — componente #56 canônico\n','''## Phase 2BH — Goety 3.1.4 — candidate component #57

Exact evidence PR #197 closes **123 Focus + 238 non-Focus rituals = +361 candidate semantic objects**. Accepted run/artifact pairs: `34670150370/10290083272`, `34670458172/10290222369`, `34670556329/10290527131`, `34670758163/10289884505`. Canonical baseline remains **888 / 56/100**; candidate **1249 / 57/100**.

## Phase 2BG — Leyline Spellbooks 1.0.3 — componente #56 canônico
''','Queue candidate')
          write(p,t)

          p='SOURCES.md'; t=read(p)
          t=rex(t,r'^\| \[Goety public 1\.21\.1 source line\].*?\n','''| [Goety `3.1.4`](https://www.curseforge.com/minecraft/mc-mods/goety/files/8689429) | exact installed-artifact read-only catalog audit; SHA-1 `a0770e180e4b1b87d8fa9c8356e9dbf34d82a7`; 123 active Focus actions + 238 available distinct non-Focus ritual actions for Phase 2BH semantic inventory/deduplication | `REFERENCE_ONLY / COMPATIBILITY_TARGET / CURRENT-SOURCE MISMATCH`; exact binary inspection retained only cryptographic identity, metadata/resource/registry IDs, member/type signatures and narrow structural facts. Public source remains 3.1.0/3.1.1 mixed-license evidence only. No implementation bodies/assets/text are copied/adapted; runtime/API semantics remain fail-closed |
''','Sources Goety',re.M)
          write(p,t)

          p='THIRD_PARTY_NOTICES.md'; t=read(p)
          t=rex(t,r'^\| Goety \|.*?\n','''| Goety | installed `3.1.4`; JAR `goety-3.1.4.jar`; CurseForge File ID `8689429`; physical/audit SHA-1 `a0770e180e4b1b87d8fa9c8356e9dbf34d82a7`; exact artifact evidence closes 123 Focus + 238 non-Focus ritual actions | `REFERENCE_ONLY / COMPATIBILITY_TARGET` exact-artifact factual audit for Phase 2BH; no runtime/API authority transfer | exact artifact metadata reports `MIT License`; public source remains mixed MIT/ARR. Apply stricter clean-room posture: no implementation bodies, recipe ingredient lists, assets/models/sounds/localization prose copied/adapted; runtime/API integration remains `REVIEW_REQUIRED`/fail-closed |
''','Notice Goety',re.M)
          write(p,t)

          # Candidate invariants.
          assert 'Phase 2BH candidate — Goety 3.1.4' in read('wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md')
          assert 'Goety candidate subtotal: `123 + 238 = 361`' in read('wiki/modpack-catalog/providers/goety/EXACT-3.1.4-SEMANTIC-INVENTORY.md')
          assert '**888 semantic magic objects are currently reconstructible' in read('wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md')
          PY
      - name: Commit durable candidate and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2bh-goety-reconcile.yml
          git add SOURCES.md THIRD_PARTY_NOTICES.md wiki/modpack-catalog
          git diff --cached --check
          git commit -m 'docs: close Goety 3.1.4 exact magic catalog'
          git push origin HEAD
