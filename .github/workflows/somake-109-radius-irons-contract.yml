name: Somake 1.0.9 radius CFG and Iron's 3.16.3 API binary contract (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-radius-irons-contract.yml'
      - 'docs/qa/somake_109_radius_irons_contract.py'
      - 'docs/qa/somake_109_radius_irons_contract_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-RADIUS-IRONS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radius_irons_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict synthetic control-flow and API descriptor fixtures
        run: python3 docs/qa/somake_109_radius_irons_contract_test.py -v
      - name: Obtain SHA-pinned installed Somake publisher JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-radius-api
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-radius-api/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-radius-api/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Obtain official versioned Iron's addon-facing API jar
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://code.redspace.io/releases/io/redspace/irons_spellbooks/1.21.1-3.16.3/irons_spellbooks-1.21.1-3.16.3-api.jar' \
            --output build/somake-radius-api/irons_spellbooks-1.21.1-3.16.3-api.jar
          sha256sum build/somake-radius-api/irons_spellbooks-1.21.1-3.16.3-api.jar
      - name: Validate radius CFG and exact Iron's API method descriptor
        run: |
          python3 docs/qa/somake_109_radius_irons_contract.py \
            --somake build/somake-radius-api/somakespells-1.0.9-1.21.1.jar \
            --irons-api build/somake-radius-api/irons_spellbooks-1.21.1-3.16.3-api.jar \
            --output build/somake-radius-api/evidence.json
      - name: Publish symbolic metadata only, never publisher JARs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-radius-irons-methods-${{ github.sha }}
          path: build/somake-radius-api/evidence.json
          if-no-files-found: ignore
          retention-days: 14
