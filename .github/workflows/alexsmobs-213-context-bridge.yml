name: Alexs Mobs 2.1.13 context bridge read-only discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-context-bridge.yml'
      - 'docs/qa/alexsmobs_213_context_bridge_probe.py'
      - 'docs/qa/alexsmobs_213_context_bridge_probe_test.py'
      - 'docs/qa/alexsmobs-213-context-bridge-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-context-bridge.yml'
      - 'docs/qa/alexsmobs_213_context_bridge_probe.py'
      - 'docs/qa/alexsmobs_213_context_bridge_probe_test.py'
      - 'docs/qa/alexsmobs-213-context-bridge-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
permissions:
  contents: read
jobs:
  context_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run 8 deterministic candidate-only tests
        run: |
          python3 -m py_compile docs/qa/alexsmobs_213_context_bridge_probe.py docs/qa/alexsmobs_213_context_bridge_probe_test.py
          python3 docs/qa/alexsmobs_213_context_bridge_probe_test.py -v
      - name: Download exact current modlist publisher JAR
        run: |
          set -euo pipefail
          mkdir -p build/alexsmobs-213-context-bridge
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856498/alexs-mobs-continued-1635121-8856498.jar' \
            --output build/alexsmobs-213-context-bridge/alexsmobs-2.1.13.jar
          printf '%s  %s\n' 'eef0b4d36f1e40292b23f90ad3052e2e9aace3a33c6a48c65b8b5f2b061ab6c8' \
            'build/alexsmobs-213-context-bridge/alexsmobs-2.1.13.jar' | sha256sum -c -
          test "$(stat -c '%s' build/alexsmobs-213-context-bridge/alexsmobs-2.1.13.jar)" = '27452738'
      - name: Discover concrete AMNetContext classes and setup bootstrap
        run: |
          python3 docs/qa/alexsmobs_213_context_bridge_probe.py \
            --jar build/alexsmobs-213-context-bridge/alexsmobs-2.1.13.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexsmobs-213-context-bridge/report.json
      - name: Keep catalogue certificate gates consistent
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexsmobs-213-context-bridge-readonly
          path: build/alexsmobs-213-context-bridge/report.json
          if-no-files-found: ignore
          retention-days: 14
