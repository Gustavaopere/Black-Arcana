name: Deeper and Darker Spellbooks 1.3.3 Version B physical spell registry audit

on:
  push:
    branches:
      - 'audit/deeper-darker-spellbooks-133b-*'

permissions:
  contents: read

jobs:
  static-jar-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify publisher Version B JAR matches physical sibling SHA
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/darkermagic-1.3.3-1.21.1-ver.b.jar"
          EXPECTED='783123ae86c91c01527c10f338679caaef42eb42'
          for URL in \
            'https://mediafilez.forgecdn.net/files/7897/469/darkermagic-1.3.3-1.21.1-ver.b.jar' \
            'https://media.forgecdn.net/files/7897/469/darkermagic-1.3.3-1.21.1-ver.b.jar' \
            'https://www.curseforge.com/api/v1/mods/0/files/7897469/download'
          do
            rm -f "$FILE"
            if curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 95 "$URL" -o "$FILE"; then
              if file "$FILE" | grep -qE 'Zip archive|Java archive'; then
                echo 'OFFICIAL_FILE_ID=7897469'
                break
              fi
            fi
          done
          test -s "$FILE"
          echo "$EXPECTED  $FILE" | sha1sum --check
          echo "PHYSICAL_SHA1_MATCH=$EXPECTED"
          echo "JAR_BYTES=$(wc -c < "$FILE")"
          echo "EXACT_AUDIT_JAR=$FILE" >> "$GITHUB_ENV"
      - name: Check four static summon registrations and exact entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, zipfile
          jar=os.environ['EXACT_AUDIT_JAR']
          base='net/rev/darkermagic/'
          pairs=[
              ('SummonWardenSpell','summoned_warden','SUMMON_WARDEN_SPELL'),
              ('SummonShatteredSpell','summoned_shattered','SUMMON_SHATTERED_SPELL'),
              ('SummonSculkCentipedeSpell','summoned_sculk_centipede','SUMMON_SCULK_CENTIPEDE_SPELL'),
              ('SummonSculkSnapperSpell','summoned_sculk_snapper','SUMMON_SCULK_SNAPPER_SPELL'),
          ]
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None,'invalid ZIP entry'
              entries=set(z.namelist())
              owned=sorted(x for x in entries if x.startswith(base+'spells/eldritch/')
                           and x.endswith('Spell.class') and '$' not in x)
              print('OWNED_CONCRETE_SPELL_CLASSES='+repr(owned))
              print('OWNED_SPELL_CLASS_COUNT='+str(len(owned)))
              assert len(owned)==4, 'binary spell class count changed'
              for meta in sorted(x for x in entries if x.endswith('neoforge.mods.toml')):
                  print('METADATA='+meta)
                  for line in z.read(meta).decode('utf-8',errors='replace').splitlines():
                      if re.match(r'^\s*(modId|version|displayName)\s*=',line):
                          print('  '+line.strip()[:190])
          def inspect(cls):
              return subprocess.check_output(['javap','-p','-c','-classpath',jar,cls],text=True)
          registrars=sorted(x for x in entries if x.startswith(base)
                            and x.endswith('.class') and '$' not in x
                            and 'Spell' in x and ('Registery' in x or 'Registry' in x))
          print('BINARY_REGISTRAR_CANDIDATES='+repr(registrars))
          print('TOP_LEVEL_BINARY_CLASSES='+repr(sorted(
              x for x in entries if x.startswith(base) and x.endswith('.class')
              and x.count('/')<=4 and '$' not in x)))
          assert len(registrars)==1,'registrar classes do not resolve uniquely'
          registry_cls=registrars[0][:-6].replace('/','.')
          reg=inspect(registry_cls)
          static=reg.split('static {};')[-1]
          registrations=len(re.findall(r'// Method registerSpell:',static))
          helpers=len(re.findall(r'// Method net/neoforged/neoforge/registries/DeferredRegister.register:\(Ljava/lang/String;',reg))
          print('STATIC_REGISTER_SPELL_INVOCATIONS='+str(registrations))
          print('DEFERRED_REGISTER_HELPER_CALLS='+str(helpers))
          print('REGISTRY_BUS_WIRING='+str('DeferredRegister.register:(Lnet/neoforged/bus/api/IEventBus;)' in reg))
          assert registrations==4 and helpers==1, 'registrar registration chain is incomplete'
          assert 'DeferredRegister.register:(Lnet/neoforged/bus/api/IEventBus;)' in reg, 'registrar not on bus'
          mod=inspect('net.rev.darkermagic.DarkerMagic')
          wired=(registry_cls.rsplit('.',1)[-1]+'.register:(Lnet/neoforged/bus/api/IEventBus;)') in mod
          print('ENTRYPOINT_TO_REGISTRY='+str(wired))
          assert wired,'entrypoint does not attach registrar'
          for classname,spellid,slot in pairs:
              path=base+'spells/eldritch/'+classname+'.class'
              assert path in owned, 'missing concrete spell class '+classname
              s=inspect('net.rev.darkermagic.spells.eldritch.'+classname)
              literals=set(re.findall(r'// String ([a-z0-9_]+)',s))
              print('EXACT_BINARY_SPELL=darkermagic:'+spellid+';class='+classname+';field='+slot+';literals='+repr(sorted(literals & {spellid,'darkermagic'})))
              assert spellid in literals, 'spell ResourceLocation path absent: '+spellid
              assert 'getSpellResource()' in s, 'spell registry resource method absent: '+classname
              assert 'extends io.redspace.ironsspellbooks.api.spells.AbstractSpell' in s, 'not an Iron Spells AbstractSpell: '+classname
              assert ('Field '+slot+':' in static), 'static register slot absent: '+slot
          assert len({id for _,id,_ in pairs})==4
          print('RESULT=FOUR_EXACT_BINARY_STATIC_SUMMON_SPELL_REGISTRATIONS')
          print('LIMITATIONS=NO_EXECUTION_NO_CAST_TEST_NO_133_HOTFIX_SEMANTIC_PARITY_NO_CONFIG_NO_SURVIVAL')
          PY
