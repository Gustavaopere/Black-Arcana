name: Alex's Caves 1.0.10 Bouncing Bolt exact ricochet evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bouncing-bolt.yml'
      - 'docs/qa/alexscaves_1010_bouncing_bolt_probe.py'
      - 'docs/qa/alexscaves_1010_bouncing_bolt_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCING-BOLT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bouncing-bolt.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bouncing-bolt.yml'
      - 'docs/qa/alexscaves_1010_bouncing_bolt_probe.py'
      - 'docs/qa/alexscaves_1010_bouncing_bolt_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCING-BOLT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bouncing-bolt.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'

permissions:
  contents: read

jobs:
  exact_bouncing_bolt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic negative regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_bouncing_bolt_probe.py docs/qa/alexscaves_1010_bouncing_bolt_probe_test.py
          python3 docs/qa/alexscaves_1010_bouncing_bolt_probe_test.py -v
      - name: Download SHA-exact publisher 1.0.10 JAR
        run: |
          mkdir -p build/alexscaves-bouncing-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-bouncing-1010/alexscaves-1.0.10.jar
      - name: Audit enchantment JSON and bounded exact-JVM consumers
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCING-BOLT-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_bouncing_bolt_probe.py \
              --jar build/alexscaves-bouncing-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-bouncing-1010/evidence.json
          else
            echo 'UNSEALED DISCOVERY ONLY — not merge certification'
            python3 docs/qa/alexscaves_1010_bouncing_bolt_probe.py \
              --jar build/alexscaves-bouncing-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-bouncing-1010/evidence.json
          fi
      - name: Generate and log canonical catalog index snapshots
        run: |
          python3 scripts/catalog/generate_perk_ready_indexes.py
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          for f in (
              'wiki/modpack-catalog/providers/INDEX.md',
              'wiki/modpack-catalog/providers/✅-alexs-caves-continued/INDEX.md',
              'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/INDEX.md',
          ):
              print('CATALOG_INDEX_SNAPSHOT='+f+'|'+json.dumps(Path(f).read_text(encoding='utf8'),ensure_ascii=True))
          PY
      - name: Archive bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-bouncing-bolt-evidence
          path: build/alexscaves-bouncing-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
