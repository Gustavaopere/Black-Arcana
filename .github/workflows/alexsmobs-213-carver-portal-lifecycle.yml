name: Alex's Mobs 2.1.13 Carver portal lifecycle exact evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-carver-portal-lifecycle.yml'
      - 'docs/qa/alexsmobs_213_carver_portal_lifecycle_probe.py'
      - 'docs/qa/alexsmobs_213_carver_portal_lifecycle_probe_test.py'
      - 'docs/qa/alexsmobs-213-carver-portal-lifecycle-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-CARVER-PORTAL-LIFECYCLE-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/dimensional-carver-passage.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-carver-portal-lifecycle.yml'
      - 'docs/qa/alexsmobs_213_carver_portal_lifecycle_probe.py'
      - 'docs/qa/alexsmobs_213_carver_portal_lifecycle_probe_test.py'
      - 'docs/qa/alexsmobs-213-carver-portal-lifecycle-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-CARVER-PORTAL-LIFECYCLE-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/dimensional-carver-passage.md'
permissions:
  contents: read
jobs:
  alexsmobs_213_carver_portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test bounded clean-room probe
        run: |
          python3 -m py_compile docs/qa/alexsmobs_213_carver_portal_lifecycle_probe.py docs/qa/alexsmobs_213_carver_portal_lifecycle_probe_test.py
          python3 docs/qa/alexsmobs_213_carver_portal_lifecycle_probe_test.py -v
      - name: Fetch exact installed publisher JAR (not redistributed)
        run: |
          set -euo pipefail
          mkdir -p build/alexsmobs-213-carver
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856498/alexs-mobs-continued-1635121-8856498.jar' \
            --output build/alexsmobs-213-carver/alexsmobs-2.1.13.jar
          printf '%s  %s\n' 'eef0b4d36f1e40292b23f90ad3052e2e9aace3a33c6a48c65b8b5f2b061ab6c8' \
            'build/alexsmobs-213-carver/alexsmobs-2.1.13.jar' | sha256sum -c -
          test "$(stat -c '%s' build/alexsmobs-213-carver/alexsmobs-2.1.13.jar)" = '27452738'
      - name: Inspect exact Carver and EntityVoidPortal classes
        run: |
          set -euo pipefail
          SNAPSHOT='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-CARVER-PORTAL-LIFECYCLE-2.1.13.json'
          if [[ -f "$SNAPSHOT" ]]; then
            python3 docs/qa/alexsmobs_213_carver_portal_lifecycle_probe.py \
              --jar build/alexsmobs-213-carver/alexsmobs-2.1.13.jar \
              --javap "$JAVA_HOME/bin/javap" --snapshot "$SNAPSHOT" \
              --output build/alexsmobs-213-carver/report.json
          else
            python3 docs/qa/alexsmobs_213_carver_portal_lifecycle_probe.py \
              --jar build/alexsmobs-213-carver/alexsmobs-2.1.13.jar \
              --javap "$JAVA_HOME/bin/javap" --print-candidate \
              --output build/alexsmobs-213-carver/report.json
          fi
      - name: Preserve canonical perk indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexsmobs-213-carver-portal-cleanroom-evidence
          path: build/alexsmobs-213-carver/report.json
          if-no-files-found: ignore
          retention-days: 14
