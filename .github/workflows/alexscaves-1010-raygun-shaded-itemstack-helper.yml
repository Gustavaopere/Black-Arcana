name: Alex's Caves 1.0.10 shaded Citadel ItemStack helper ABI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_itemstack_helper_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_itemstack_helper_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-network-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ITEMSTACK-HELPER-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-shaded-itemstack-helper.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_itemstack_helper_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_itemstack_helper_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-network-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ITEMSTACK-HELPER-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-shaded-itemstack-helper.yml'

permissions:
  contents: read

jobs:
  exact_raygun_shaded_itemstack_helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed helper tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_itemstack_helper_probe.py docs/qa/alexscaves_1010_raygun_itemstack_helper_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_itemstack_helper_probe_test.py -v
      - name: Fetch exact publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Inspect shaded Citadel ItemStack reader and writer
        run: |
          python3 docs/qa/alexscaves_1010_raygun_itemstack_helper_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --packet-codec-manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-PACKET-CODEC-1.0.10.json' \
            --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ITEMSTACK-HELPER-1.0.10.json' \
            --output build/alexscaves-1010/raygun-itemstack-helper.json
      - name: Publish selected ABI references (no full provider method)
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-shaded-itemstack-helper-abi
          path: build/alexscaves-1010/raygun-itemstack-helper.json
          retention-days: 14
          if-no-files-found: error
