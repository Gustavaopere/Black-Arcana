name: Somake 1.0.9 exact crafting method references (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-perk-methods.yml'
      - 'docs/qa/somake_109_perk_method_probe.py'
      - 'docs/qa/somake_109_perk_method_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-CRAFTING-METHOD-SEAMS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_crafting_symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic allowCrafting bytecode parser tests
        run: python3 docs/qa/somake_109_perk_method_probe_test.py -v
      - name: Fetch publisher Somake 1.0.9 artifact with physical SHA-1 gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-109-perk-qa
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-109-perk-qa/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-109-perk-qa/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Check seven exact class methods and bounded member signatures
        run: |
          python3 docs/qa/somake_109_perk_method_probe.py \
            --jar build/somake-109-perk-qa/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-109-perk-qa/evidence.json
      - name: Upload JSON evidence only, never publisher code or JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-crafting-symbols-${{ github.sha }}
          path: build/somake-109-perk-qa/evidence.json
          if-no-files-found: ignore
          retention-days: 14
