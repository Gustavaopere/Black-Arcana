name: Phase 2BF Somake exact-registry docs reconciliation

on:
  push:
    branches:
      - docs/somake-1.0.8-fix-exact-registry-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/somake-1.0.8-fix-exact-registry-reconciliation
      - name: Reconcile canonical Somake evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Provider README: supersede the old evidence ceiling without rewriting historical provenance files.
          path = 'wiki/modpack-catalog/providers/somake-spells/README.md'
          replace(path,
              'Status: `EXACT-ARTIFACT+RELEASE PINNED / OFFICIAL 1.0.x RELEASE SURFACE AUDITED / COMPLETE CURRENT REGISTRY UNVERIFIED / PHASE 2AI CLOSURE BLOCKED / FAIL-CLOSED`',
              'Status: `EXACT HASH-MATCHED 1.0.8-FIX ARTIFACT / 67 CURRENT REGISTRY IDENTITIES CLOSED UNDER PHYSICAL OPTIONAL SET / SURVIVAL REACHABILITY + EFFECTIVE COMMON CONFIG UNVERIFIED / CONDITIONAL +0 / FAIL-CLOSED`')
          text = Path(path).read_text(encoding='utf-8')
          start = text.index('## Phase 2AI closure audit')
          end = text.index('## Current public scope')
          new_block = '''## Phase 2BF exact-artifact reconciliation\n\nPhase 2AI correctly stopped at the publisher evidence ceiling. Phase 2BF supersedes only that technical ceiling by materializing the exact CurseForge/Curse Maven File ID `8417850` and requiring SHA-1 equality with the physical modlist: `b0ad94c1504709662bee2d08700375ccecbb5ec7`.\n\nClean-room inspection closes the current spell registry at **67 provider registrations**: 67 `DeferredHolder<AbstractSpell, ...>` fields, 67 unique `DeferredRegister.register(String, Supplier)` spell IDs and 67 standalone provider `*Spell` classes. Six registrations are optional-provider gated: three by `ModList.isLoaded("mowziesmobs")` and three by `MagicFromTheEastCompat.isLoaded()`, whose exact implementation tests `ModList.isLoaded("iss_magicfromtheeast")`. Both mod IDs are physically present, so all **67/67 registry identities are active under the current physical optional-provider set**.\n\nThat closes registry identity, not semantic reachability. Somake registers `enableSpellLockSystem` as a `COMMON` config in `somakespells/general/common.toml`; its code default is `false`, and `PlayerSpellMastery.getUnlockedLevel()` returns `100` while disabled. When enabled, the provider's `/somake` command surface is permission-level 2 and the pre-cast path can reject unlearned spell levels. The deployed pack's actual COMMON config value is not present in the repository or supplied project files, and complete object-level survival acquisition/reachability is not yet proven. Under the canonical ledger rule, the 67 identities therefore remain `CONDITIONAL` and contribute **+0** to the strict semantic sum.\n\nSee [`EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md`](EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md) and [`../../meta/PHASE2BF-SOMAKE-1.0.8-FIX-EXACT-CHECKPOINT.md`](../../meta/PHASE2BF-SOMAKE-1.0.8-FIX-EXACT-CHECKPOINT.md).\n\n'''
          Path(path).write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          replace(path,
              '- [TECHNICAL-AUDIT.md](TECHNICAL-AUDIT.md) — exact artifact/provenance/dependency/QA boundary;',
              '- [TECHNICAL-AUDIT.md](TECHNICAL-AUDIT.md) — exact artifact/provenance/dependency/QA boundary;\n- [EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md](EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md) — hash-matched registry/gate/config facts from the installed binary;')
          replace(path,
              'Presence satisfies a compatibility precondition only; it is not evidence that every optional integration path is runtime-active. Because Magic From the East is physically present, the publisher-described **Symmetry integration path is eligible**; exact active spells/IDs still require runtime/config evidence.',
              'Presence alone is not generally enough to prove an optional integration path. For the six conditionally registered Somake spells, however, the exact 1.0.8-fix bytecode closes the predicates themselves: `mowziesmobs` gates Blessed/Guardian/Cursed Connection and `iss_magicfromtheeast` gates Mirror Strike/Spirit Empowerment/Symmetry Empowerment. Both predicates are true under the current physical modlist, so those six registrations join the 61 unconditional registrations for 67/67 current registry identities. Runtime behavior, acquisition and config-dependent usability remain separate.')
          old = '''## Publicly named current-line spell evidence\n\n1.0.8 directly adds/references Ritual Flame, Custodia Caeli, Bloody Legacy, Fragmented Requiem, The Rose's Secret, Jingle Bell, Chain Connection (moved to Aqua), Fire Orbs (rework) and Ignis Shield (rework).\n\n1.0.7 publicly introduced Guardian/Blessed/Cursed Connection, Bloodmark, Water Control and Firestorm Vortex. Those older names remain separately marked `CURRENT REGISTRY UNVERIFIED` unless 1.0.8 re-confirms them.\n\n1.0.6 explicitly removed Tsunami and renamed Tidal Grasp/Dash to Ceraunus Grasp/Dash.\n\nSee the dedicated inventory for exact evidence posture. None of these names imply registry IDs or values.\n'''
          new = '''## Publicly named current-line spell evidence\n\nThe publisher changelog files remain provenance for names and release semantics, but they no longer define the registry ceiling. The exact 1.0.8-fix artifact now supplies the complete 67-ID registry inventory in `EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md`. Historical naming contradictions remain useful for editorial provenance and must not be substituted for current bytecode-backed IDs, school mechanics or numerical values.\n'''
          replace(path, old, new)
          old = '''## Evidence ceiling\n\n- installed identity/hash — `HIGH`, physical modlist;\n- exact File ID/release/fix semantics — `HIGH`, publisher;\n- 50+ scale / Aqua / equipment / compatibility — `HIGH` at public feature level;\n- changelog names/semantics — `HIGH` for the release in which they are stated;\n- exact current complete spell list — `UNVERIFIED`;\n- registry IDs/classes/values/config defaults/acquisition/API/hooks/networking/persistence — `UNVERIFIED / FAIL-CLOSED`;\n- Somake↔T.O Aqua authority on the current dual-installed stack — `RUNTIME QA REQUIRED`.\n\nNo source code or bytecode implementation details are treated as reusable material.'''
          new = '''## Evidence ceiling\n\n- installed identity/hash — `HIGH`, physical modlist + exact artifact hash match;\n- exact File ID/release/fix semantics — `HIGH`, publisher;\n- exact current spell registry — `HIGH`, 67/67 IDs closed from the hash-matched artifact under the physical optional-provider set;\n- exact optional registry predicates — `HIGH`, `mowziesmobs` and `iss_magicfromtheeast`, both physically satisfied;\n- `enableSpellLockSystem` code default/path — `HIGH`, default `false`, `COMMON`, `somakespells/general/common.toml`;\n- deployed value of that COMMON config — `UNVERIFIED`;\n- complete object-level survival acquisition/reachability — `UNVERIFIED / CONDITIONAL`;\n- values/formulas/stable integration API/hooks/networking/persistence — `UNVERIFIED / FAIL-CLOSED` except for narrow facts explicitly recorded by the artifact audit;\n- Somake↔T.O Aqua authority on the current dual-installed stack — `RUNTIME QA REQUIRED`.\n\nThe ARR artifact was inspected only to retain factual hash/metadata, resource/registry identities, class/member signatures and narrow control-flow/config predicates needed for catalog interoperability. No implementation body, source reconstruction, asset, model, sound or upstream prose is copied/adapted or treated as reusable material.'''
          replace(path, old, new)

          # Technical audit: record the exact binary evidence and correct old no-bytecode wording.
          path = 'wiki/modpack-catalog/providers/somake-spells/TECHNICAL-AUDIT.md'
          marker = '## Source / clean-room\n'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('technical source marker missing')
          exact = '''## Phase 2BF exact-artifact facts\n\nThe exact File ID `8417850` was materialized from Curse Maven and required to match the physical SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7`. Read-only clean-room inspection establishes:\n\n- `ModSpells` owns a `DeferredRegister<AbstractSpell>`;\n- 67 typed `DeferredHolder<AbstractSpell, ...>` fields;\n- 67 unique spell `register(String, Supplier)` calls / IDs;\n- 67 standalone provider `*Spell` classes;\n- 61 registrations are unconditional;\n- `blessed_connection`, `guardian_connection`, `cursed_connection` are gated by `ModList.isLoaded("mowziesmobs")`;\n- `mirror_strike`, `spirit_empowerment`, `symmetry_empowerment` are gated by `MagicFromTheEastCompat.isLoaded()`, which exactly calls `ModList.isLoaded("iss_magicfromtheeast")`;\n- both optional mod IDs are present in the current physical pack, therefore 67/67 registry identities are active for this provider set.\n\nThe same exact artifact registers `Config.SPEC` as `ModConfig.Type.COMMON` at `somakespells/general/common.toml`. `enableSpellLockSystem` has code default `false`; when disabled, `PlayerSpellMastery.getUnlockedLevel()` returns `100`. If enabled, Somake's pre-cast path can cancel spell levels above provider mastery, and `/somake` command registration is gated by the same config with command permission level 2. The actual deployed COMMON config file/value is not available in the repository or supplied project files.\n\nTherefore exact registry membership is closed, while current survival usability/acquisition remains `CONDITIONAL` and is not promoted into the strict semantic numerator.\n\n'''
          p.write_text(text.replace(marker, exact + marker, 1), encoding='utf-8')
          old = '''Por ser `All Rights Reserved`:\n\n- nenhum bytecode é decompilado para copiar implementação;\n- nenhuma classe/método/signature é inferida;\n- nenhuma textura/modelo/som/texto é reutilizado;\n- changelogs e descrição pública são usados somente como fatos comportamentais/editoriais para catálogo e deduplicação.\n\nUma eventual inspeção técnica do JAR para interoperabilidade exigiria o artefato exato e continuaria não autorizando cópia da implementação.'''
          new = '''Por ser `All Rights Reserved`, a inspeção binária é estritamente clean-room e factual:\n\n- o artefato exato foi hash-matched antes da inspeção;\n- são retidos somente metadata/hash, paths/IDs de recursos e registry, signatures de classe/membro e fatos estreitos de control-flow/config necessários para interoperabilidade e catálogo;\n- nenhuma implementação é copiada, reconstruída ou adaptada;\n- nenhuma textura/modelo/som/texto upstream é reutilizado;\n- changelogs/descrição pública continuam sendo evidência editorial/comportamental, não licença de derivação.\n\nA inspeção técnica do JAR não autoriza cópia da implementação e não cria um contrato de API que o provider não publique.'''
          replace(path, old, new)
          replace(path,
              '- Magic From the East / `iss_magicfromtheeast` `1.1.5` — presente; o publisher 1.0.8 o marca como opcional e diz que, quando presente, seus spells continuam disponíveis para Symmetry; registry/config activation exata permanece runtime-QA pending;',
              '- Magic From the East / `iss_magicfromtheeast` `1.1.5` — presente; o gate exato `MagicFromTheEastCompat.isLoaded()` testa esse mod id e ativa os três registros ISS-gated no pack atual; runtime mechanics/config continuam separados;')
          old = '''## Public inventory ceiling\n\nPublisher current page:\n\n- `over 50 new spells`;\n- Lightning / Fire / Aqua / Symmetry como famílias principais;\n- `1 Blood` e `1 Ender` na descrição geral;\n- uma `charge` por elemento, com integrações para outros elementos/addons.\n\nEsse texto não permite reconstruir:\n\n- count exato;\n- registry IDs;\n- current school assignment de todos os spells;\n- min/max level / rarity;\n- mana/cooldown/cast type;\n- formulas de damage/heal;\n- acquisition tables;\n- item/block/entity/effect registries;\n- config defaults completos;\n- networking/persistence;\n- supported API/hooks.'''
          new = '''## Exact registry / remaining runtime ceiling\n\nThe old publisher-only `over 50 new spells` ceiling is superseded for registry identity by the exact artifact: **67 current registrations** under the physical optional-provider set. The publisher text remains useful for release semantics but not for registry totals.\n\nThe exact artifact audit still does not close:\n\n- deployed `somakespells/general/common.toml` values;\n- complete object-level survival acquisition/reachability;\n- authoritative current school/runtime semantics for every identity;\n- complete min/max level / rarity / mana / cooldown / cast-type tables;\n- formulas de damage/heal;\n- complete item/block/entity/effect inventories;\n- stable supported integration API/hooks;\n- networking/persistence contracts;\n- Somake↔T.O Aqua runtime ownership on the dual-installed stack.'''
          replace(path, old, new)
          replace(path,
              '`EXACT ARTIFACT PINNED / PUBLISHER RELEASE-LINE SURFACE ADVANCED / COMPLETE REGISTRY+API UNKNOWN / T.O AQUA COEXISTENCE QA-BLOCKED / ARR CLEAN-ROOM / FAIL-CLOSED`.',
              '`EXACT HASH-MATCHED ARTIFACT / 67 CURRENT REGISTRY IDENTITIES CLOSED / EFFECTIVE COMMON CONFIG + SURVIVAL REACHABILITY UNVERIFIED / SEMANTIC CONDITIONAL +0 / T.O AQUA COEXISTENCE QA-BLOCKED / ARR CLEAN-ROOM / FAIL-CLOSED`.')

          # Semantic ledger: registry is no longer open, but strict count remains excluded.
          path = 'wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'
          replace(path,
              '| [Somake Spells](../providers/somake-spells/README.md) 1.0.8-fix | publisher states **over 50 spells** | `LOWER_BOUND / OPEN CURRENT REGISTRY` | complete current registry, IDs and Aqua/T.O authority under the physical dual-installed stack remain unresolved |',
              '| [Somake Spells](../providers/somake-spells/README.md) 1.0.8-fix | exact hash-matched artifact closes **67 current spell registrations** under the physical optional-provider set; 61 unconditional + 3 `mowziesmobs`-gated + 3 `iss_magicfromtheeast`-gated, with both gates physically satisfied | `CONDITIONAL / EXACT REGISTRY CLOSED / +0` | deployed `somakespells/general/common.toml` is unavailable and complete object-level survival acquisition/reachability remains unclosed; code default `enableSpellLockSystem=false` is not substituted for the actual pack config |')

          # Current providers: record the evidence-only checkpoint without changing metrics.
          path = 'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
          marker = '## Checkpoint Cataclysm: Spellbooks — Phase 2BE\n'
          p = Path(path); text = p.read_text(encoding='utf-8')
          block = '''## Checkpoint Somake Spells — Phase 2BF\n\nThe exact physical `somakespells-1.0.8-1.21.1-fix.jar` / SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7` was materialized from File ID `8417850` and hash-matched. The provider owns **67 exact current spell registrations** under the present optional-provider set: 61 unconditional, three gated by physical `mowziesmobs`, and three gated by physical `iss_magicfromtheeast`.\n\nThis does **not** add to the strict semantic numerator. Somake's `enableSpellLockSystem` is a `COMMON` config at `somakespells/general/common.toml`, code-default `false`; the deployed config is not available in authoritative project material, and full per-object survival acquisition/reachability is not closed. The canonical totals therefore remain **874 semantic objects** and **55/100 structural components**. Runtime mechanics, Aqua/T.O coexistence and any Black Arcana adapter remain fail-closed.\n\n'''
          if marker not in text: raise SystemExit('current providers marker missing')
          p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          # Coverage top-level note; no numerator mutation.
          path = 'wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
          marker = '**Canonical provider-component coverage after Phase 2BE: 55/100 = 55%.**\n'
          p = Path(path); text = p.read_text(encoding='utf-8')
          note = marker + '\nPhase 2BF exact-artifact reconciliation closes Somake 1.0.8-fix registry identity at 67 current registrations under the physical optional-provider set, but the provider remains `CONDITIONAL` because the deployed COMMON spell-lock config and complete survival acquisition/reachability are not authoritative. Phase 2BF therefore changes neither metric: **874** strict semantic objects and **55/100** closed provider components.\n'
          if marker not in text: raise SystemExit('coverage marker missing')
          p.write_text(text.replace(marker, note, 1), encoding='utf-8')

          # Queue: refresh main authority and add Phase 2BF +0 evidence section.
          path = 'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
          replace(path,
              '- `main` canônica após Phase 2BE / PR #189: `cce7f51794e4e65b0d97511eb55f710afc6e02f0`; HEAD auditado `e787699d25b283b8040cd179f605143e8ee396de` CI #2483 GREEN; post-merge CI #2484 attempt 2 GREEN após attempt 1 falhar somente por timeout externo no download da API do Iron\'s;',
              '- `main` canônica de referência para Phase 2BF: `41e96385c7ef5903b2595a4b027c9e2d053f09d6`; Phase 2BE foi fechada por PR #189/#190, com HEAD de catálogo `e787699d25b283b8040cd179f605143e8ee396de` CI #2483 GREEN, merge de catálogo `cce7f51794e4e65b0d97511eb55f710afc6e02f0` CI #2484 attempt 2 GREEN, e reconciliação final `main@41e96385c7ef5903b2595a4b027c9e2d053f09d6` CI #2486 GREEN;')
          replace(path,
              '- delta semântico Cataclysm: Spellbooks 1.1.13: **+59**;\n- mínimo estrito global canônico: **874**;',
              '- delta semântico Cataclysm: Spellbooks 1.1.13: **+59**;\n- delta semântico Somake 1.0.8-fix Phase 2BF: **+0** (`67 exact registry`, reachability/config efetivo ainda `CONDITIONAL`);\n- mínimo estrito global canônico: **874**;')
          marker = '## Phase 2BE — Cataclysm: Spellbooks 1.1.13 — componente #55 canônico\n'
          p = Path(path); text = p.read_text(encoding='utf-8')
          block = '''## Phase 2BF — Somake Spells 1.0.8-fix — exact registry, sem novo componente\n\n| Mod ID | Artefato físico | Estado |\n|---|---|---|\n| `somakespells` | `somakespells-1.0.8-1.21.1-fix.jar` | EXACT PHYSICAL / EXACT CURSEFORGE FILE / EXACT HASH-MATCHED ARTIFACT AUDIT / 67 CURRENT REGISTERED SPELL IDENTITIES UNDER PHYSICAL OPTIONAL SET / EFFECTIVE COMMON CONFIG + SURVIVAL REACHABILITY CONDITIONAL / +0 STRICT SEMANTIC DELTA / 55/100 UNCHANGED |\n\n### Evidence boundary\n\n- physical/audit SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7`;\n- CurseForge project/file `1461634 / 8417850`;\n- isolated non-merge evidence PR #191; initial exact-registry run `34659320633`, reachability run `34664093646`, targeted gate run `34664411845`;\n- exact registry: 67 typed fields, 67 unique registration IDs, 67 provider `*Spell` classes;\n- 61 unconditional registrations; three require `mowziesmobs`; three require `iss_magicfromtheeast`; both mod IDs are in the physical pack, so all 67 registry identities are current for this provider set;\n- `enableSpellLockSystem` is COMMON at `somakespells/general/common.toml`, code-default `false`; actual deployed value is not available in authoritative materials;\n- complete per-object survival acquisition/reachability, T.O Aqua runtime ownership and supported adapter/API seams remain open/fail-closed;\n- ARR clean-room: no implementation/source reconstruction/assets/text are copied or adapted.\n\nThis closes the old `over 50 / registry unknown` blocker but does not satisfy the ledger's player-reachability gate. Somake is not component #56 and contributes +0 until the effective config and survival path are closed strongly enough.\n\n'''
          if marker not in text: raise SystemExit('queue phase marker missing')
          p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          # Provenance rows: exact binary inspection is now factual evidence, not a derivation grant.
          path = 'SOURCES.md'
          old = '| [Somake Spells `1.0.8-fix`](https://www.curseforge.com/minecraft/mc-mods/somake-spells-irons-spells-addon/files/8417850) | exact installed identity + publisher-current/release-line factual catalog for Somake\'s 50+ spell scale, Aqua/Symmetry/Elemental Charge surfaces, book/grimoire/Upgrade Forge progression, Soul Fire/Infernal Fire rituals, equipment and semantic deduplication | `REFERENCE_ONLY / COMPATIBILITY_TARGET / ARR`; physical hash `b0ad94c1504709662bee2d08700375ccecbb5ec7` and exact File ID 8417850 are pinned. No publisher source revision was located and no implementation code/assets are copied or decompiled. Complete registry/API remains fail-closed; dual-installed Somake Aqua + deprecated T.O Magic 1.21.1 alpha is a runtime-QA blocker, not proof of authority migration |'
          new = '| [Somake Spells `1.0.8-fix`](https://www.curseforge.com/minecraft/mc-mods/somake-spells-irons-spells-addon/files/8417850) | exact installed-artifact read-only catalog audit; SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7`; 67 current provider spell registrations closed under the physical optional-provider set, plus publisher release-line facts for Aqua/Symmetry/Elemental Charges/progression/rituals/equipment | `REFERENCE_ONLY / COMPATIBILITY_TARGET / ARR`; exact binary inspection retained only hash/metadata, resource/registry IDs, class/member signatures and narrow optional/config control-flow facts. No implementation body/source reconstruction/assets/models/sounds/upstream prose are copied/adapted. Effective COMMON config, complete survival acquisition/reachability, stable API/adapter contracts and Somake↔deprecated-T.O Aqua runtime ownership remain fail-closed |'
          replace(path, old, new)

          path = 'THIRD_PARTY_NOTICES.md'
          old = '| Somake Spells | installed `1.0.8`; JAR `somakespells-1.0.8-1.21.1-fix.jar`; CurseForge File ID `8417850`; physical SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7` | `REFERENCE_ONLY / COMPATIBILITY_TARGET` exact-release plus publisher-current/changelog audit of Somake spell families, Elemental Charges, Aqua/Symmetry, tier books/Grimoires/Upgrade Forge, Soul Fire/Infernal Fire rituals and equipment | project is **All Rights Reserved**. No publisher source revision matching 1.0.8-fix was located. No source/JAR bytecode or assets are copied, decompiled or adapted. Complete registry/API is `REVIEW_REQUIRED`/fail-closed. The pack also contains deprecated T.O Magic 1.21.1 alpha; Somake\'s future Aqua-migration statement does not authorize or prove runtime authority transfer to that artifact |'
          new = '| Somake Spells | installed `1.0.8`; JAR `somakespells-1.0.8-1.21.1-fix.jar`; CurseForge File ID `8417850`; physical/audit SHA-1 `b0ad94c1504709662bee2d08700375ccecbb5ec7` | `REFERENCE_ONLY / COMPATIBILITY_TARGET` exact-artifact factual audit closing 67 current spell registrations under the current optional-provider set, plus publisher release-line evidence for Elemental Charges, Aqua/Symmetry, progression, rituals and equipment | project is **All Rights Reserved**. No matching publisher source revision was located. Binary inspection was restricted to cryptographic identity, factual archive/resource/registry IDs, class/member signatures and narrow gate/config control-flow facts; no implementation body/source reconstruction/assets/models/sounds/upstream prose are copied/adapted. Effective COMMON config, survival acquisition/reachability, stable API seams and Somake↔deprecated-T.O Aqua runtime ownership remain `REVIEW_REQUIRED`/fail-closed |'
          replace(path, old, new)

          # New exact audit document.
          Path('wiki/modpack-catalog/providers/somake-spells/EXACT-1.0.8-FIX-ARTIFACT-AUDIT.md').write_text('''# Somake Spells 1.0.8-fix — exact artifact audit\n\n## Verdict\n\n`EXACT HASH-MATCHED ARTIFACT / 67 CURRENT REGISTRY IDENTITIES / PHYSICAL OPTIONAL GATES SATISFIED / SEMANTIC REACHABILITY CONDITIONAL / +0 STRICT DELTA / ARR CLEAN-ROOM`\n\nThis audit closes Somake's exact installed spell-registry identity. It intentionally does **not** promote those identities into the strict semantic numerator because current deployed COMMON configuration and complete object-level survival acquisition/reachability are not available as authoritative evidence.\n\n## Exact physical artifact\n\n- installed JAR: `somakespells-1.0.8-1.21.1-fix.jar`\n- mod id/runtime: `somakespells` / `1.0.8`\n- CurseForge project/file: `1461634 / 8417850`\n- expected physical SHA-1: `b0ad94c1504709662bee2d08700375ccecbb5ec7`\n- materialized artifact SHA-1: `b0ad94c1504709662bee2d08700375ccecbb5ec7`\n- exact hash match: yes\n- license posture: All Rights Reserved / read-only clean-room factual inspection\n\n## Evidence runs\n\nEvidence was isolated in non-merge PR #191.\n\n- initial exact-registry audit: run `34659320633`;\n- reachability/resource audit: run `34664093646`, artifact `10288333124`;\n- targeted optional/config gate audit: run `34664411845`, artifact `10288675409`, HEAD `397e09e4bfd65f66b82b1b82151915a91c15148d`;\n- each audit re-downloads File ID `8417850` and requires the physical SHA-1 before inspection.\n\n## Exact registry topology\n\n`com.somake.somakespells.registries.ModSpells` exposes a `DeferredRegister<AbstractSpell>`. The hash-matched artifact contains:\n\n- **67** typed `DeferredHolder<AbstractSpell, ...>` spell fields;\n- **67** unique `DeferredRegister.register(String, Supplier)` spell registrations;\n- **67** standalone provider `*Spell` classes;\n- no extra provider spell identity is added from localization-only text.\n\nExact registered IDs:\n\n`combustion`, `ritual_flame`, `damned_demomans`, `eruption`, `fire_blast`, `firestorm_vortex`, `pumpkin_bomb`, `ignis_shield`, `incinerator_slash`, `abyssal_burn`, `fire_orbs`, `abyssal_orbs`, `apocalyptic_burst`, `earthbound`, `submerge`, `tidal_grasp`, `tsunami`, `tidal_dash`, `thunder_cloud`, `water_control`, `water_spear`, `hydro_slash`, `sea_serpent`, `sea_serpent_jet`, `storm_aura`, `water_ball`, `summon_zombie`, `lightning_spear`, `ender_corruption`, `phantom_barrage`, `overgrowth`, `permafrost`, `blessing`, `custodia_caeli`, `blessed_connection`, `guardian_connection`, `cursed_connection`, `blood_rush`, `blood_cut`, `bloody_legacy`, `bloodmark`, `fragmented_requiem`, `rose_secret`, `eldritch_gambit`, `chain_connection`, `evocation_fortitude`, `reverberation`, `slumber_melody`, `resonant_pulse`, `ram_tchum`, `jingle_bell`, `lightning_ball`, `lightning_dance`, `lightning_field`, `lightning_strike`, `lightning_cut`, `lightning_spark`, `lightning_swarm`, `lightning_lash`, `halberd_strike`, `mirror_strike`, `render_rush`, `axe_cleave`, `desert_wrath`, `soul_grab`, `spirit_empowerment`, `symmetry_empowerment`.\n\nThese are registry identities, not a claim that package/folder names equal canonical schools or that current numerical mechanics have been reconstructed.\n\n## Optional registration gates\n\nThe static registry initializer has six optional-provider-gated registrations.\n\n- `MOWZIE_LOADED = ModList.get().isLoaded("mowziesmobs")` gates `blessed_connection`, `guardian_connection`, `cursed_connection`.\n- `ISS_LOADED = MagicFromTheEastCompat.isLoaded()` gates `mirror_strike`, `spirit_empowerment`, `symmetry_empowerment`.\n- exact `MagicFromTheEastCompat.isLoaded()` calls `ModList.get().isLoaded("iss_magicfromtheeast")`.\n\nThe physical modlist contains `mowziesmobs` 1.8.2 and `iss_magicfromtheeast` 1.1.5. Therefore the current physical provider set satisfies both gates and all **67/67** registry identities are active.\n\n## Spell-lock / usability gate\n\nThe exact artifact registers its general spec as `ModConfig.Type.COMMON` at `somakespells/general/common.toml`. `Config.ENABLE_SPELL_LOCK_SYSTEM` is declared under `enableSpellLockSystem` with code default **false**.\n\nProvider behavior established narrowly by signatures/control flow:\n\n- `PlayerSpellMastery.getUnlockedLevel(spellId)` returns `100` when the spell-lock config is false;\n- when the config is true, it reads the provider-owned unlocked-level map;\n- `MagicBlockHandler.onSpellPreCast` is server-side for non-creative players and cancels the cast when requested spell level exceeds that provider mastery;\n- `SpellCommand.register` exists only when spell-lock is enabled and the top-level `/somake` command requires command permission level **2**.\n\nThe code default is **not** substituted for deployed pack state. No authoritative copy of `somakespells/general/common.toml` was found in the Black Arcana repository or supplied project files.\n\n## Acquisition/reachability evidence\n\nThe artifact packages provider-native progression/acquisition surfaces including tier spellbooks, Grimoires, Upgrade Forge recipes/progression, loot modifiers and item/entity loot resources. Multiple provider spellbooks and runtime handlers refer directly to `ModSpells` identities. This proves real provider acquisition infrastructure, but the audit does not yet close an object-by-object survival path for all 67 spells.\n\nUnder `SEMANTIC-MAGIC-COVERAGE.md`, a current registry identity whose effective config/survival reachability is not closed remains `CONDITIONAL`. Therefore:\n\n- exact registry inventory: **67**;\n- active registry identities under current physical optional set: **67**;\n- strict semantic contribution in Phase 2BF: **+0**;\n- canonical global strict minimum remains **874**;\n- structural component coverage remains **55/100**.\n\n## Clean-room boundary\n\nThe artifact is All Rights Reserved. Retained evidence is limited to hash/metadata, archive/resource and registry IDs, class/member signatures and narrow gate/config control-flow facts needed to determine current identity/eligibility. No implementation body is copied, reconstructed or adapted; no source, texture, model, sound or upstream prose is incorporated into Black Arcana.\n\nThis audit does not create a stable Somake API. Any runtime adapter remains fail-closed until a provider-native boundary is proven. Iron's remains host casting/resource/cooldown authority; Somake remains authority for its own spells, charges and provider-specific progression; Black Arcana must not duplicate those runtimes or transfer them to RPG Skill Tree.\n''', encoding='utf-8')

