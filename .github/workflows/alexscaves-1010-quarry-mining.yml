name: Alex's Caves 1.0.10 Quarry Smasher mining causal discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_quarry_mining_probe.py'
      - '.github/workflows/alexscaves-1010-quarry-mining.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/quarry-smasher.md'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_quarry_mining_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_quarry_mining_probe.py
          python3 docs/qa/alexscaves_1010_quarry_mining_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/quarry-mining
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/quarry-mining/publisher.jar
      - name: Project mining tick and typed consumer census
        run: |
          python3 docs/qa/alexscaves_1010_quarry_mining_probe.py --jar build/quarry-mining/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/quarry-mining/report.json
      - name: Independent deterministic replay
        run: |
          python3 docs/qa/alexscaves_1010_quarry_mining_probe.py --jar build/quarry-mining/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/quarry-mining/replay.json
          cmp build/quarry-mining/report.json build/quarry-mining/replay.json
          sha256sum build/quarry-mining/report.json
      - name: Archive read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarry-mining
          path: build/quarry-mining/report.json
          if-no-files-found: warn
          retention-days: 14
