name: Phase 2BE Cataclysm Catalog Reconciliation

on:
  push:
    branches:
      - docs/cataclysm-spellbooks-1.1.13-exact-catalog-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile Phase 2BE ledgers and provenance
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'Phase 2BE promotion target: 55/100 = 55%' wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md; then
            echo 'Phase 2BE catalog reconciliation already applied.'
            exit 0
          fi
          python3 .github/scripts/phase2be_catalog_reconcile.py

      - name: Commit reconciled durable docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            SOURCES.md \
            THIRD_PARTY_NOTICES.md \
            wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md \
            wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md \
            wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md \
            wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit.'
            exit 0
          fi
          git commit -m 'docs: reconcile Phase 2BE Cataclysm catalog closure'
          git push origin HEAD:docs/cataclysm-spellbooks-1.1.13-exact-catalog-closure
