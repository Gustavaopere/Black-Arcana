name: Alex's Caves 1.0.10 Soak Seeking exact read-only discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-soak-seeking-static.yml'
      - 'docs/qa/alexscaves_1010_soak_seeking_static_probe.py'
      - 'docs/qa/alexscaves_1010_soak_seeking_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-soak-seeking-static.yml'
      - 'docs/qa/alexscaves_1010_soak_seeking_static_probe.py'
      - 'docs/qa/alexscaves_1010_soak_seeking_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'

permissions:
  contents: read

jobs:
  soak_seeking_exact_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify synthetic fail-closed behavior
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_soak_seeking_static_probe.py
          python3 docs/qa/alexscaves_1010_soak_seeking_static_probe_test.py -v
      - name: Download publisher artifact pinned to installed NeoForge 1.21.1
        run: |
          mkdir -p build/alexscaves-soak-seeking-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-soak-seeking-1010/publisher.jar
      - name: Compare Soak Seeking JAR bytes and selected consumers to existing proven Sea Staff contract
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SOAK-SEEKING-STATIC-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_soak_seeking_static_probe.py \
              --jar build/alexscaves-soak-seeking-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --seal "$SEAL" --output build/alexscaves-soak-seeking-1010/evidence.json
          else
            echo 'SOAK_SEEKING_DISCOVERY_PARTIAL_ONLY_NO_CERTIFICATION'
            python3 docs/qa/alexscaves_1010_soak_seeking_static_probe.py \
              --jar build/alexscaves-soak-seeking-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-soak-seeking-1010/evidence.json
          fi
      - name: Verify catalog index consistency
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-soak-seeking-1010-bounded-probe
          path: build/alexscaves-soak-seeking-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
