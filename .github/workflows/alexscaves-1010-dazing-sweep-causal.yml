name: Alex's Caves 1.0.10 Dazing Sweep exact causal audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-dazing-sweep-causal.yml'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_probe.py'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DAZING-SWEEP-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/dazing-sweep.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-dazing-sweep-causal.yml'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_probe.py'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_dazing_sweep_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DAZING-SWEEP-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/dazing-sweep.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
permissions:
  contents: read
jobs:
  dazing_sweep_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed synthetic unit tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_dazing_sweep_causal_probe.py docs/qa/alexscaves_1010_dazing_sweep_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_dazing_sweep_causal_probe_test.py -v
          if test -f docs/qa/alexscaves_1010_dazing_sweep_causal_cards_test.py; then
            python3 docs/qa/alexscaves_1010_dazing_sweep_causal_cards_test.py -v
          fi
      - name: Download exact installed Alex's Caves publisher 1.0.10
        run: |
          mkdir -p build/alexscaves-dazing-sweep
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-dazing-sweep/alexscaves-1.0.10.jar
      - name: Reproduce individual JVM consumers and exact resources
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DAZING-SWEEP-CAUSAL-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_dazing_sweep_causal_probe.py \
              --jar build/alexscaves-dazing-sweep/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EFFECT-CONTRACTS-1.0.10.json' \
              --seal "$SEAL" \
              --output build/alexscaves-dazing-sweep/causal.json
          else
            python3 docs/qa/alexscaves_1010_dazing_sweep_causal_probe.py \
              --jar build/alexscaves-dazing-sweep/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EFFECT-CONTRACTS-1.0.10.json' \
              --output build/alexscaves-dazing-sweep/causal.json
          fi
      - name: Verify indexes and object evidence ledger
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-dazing-sweep-causal
          path: build/alexscaves-dazing-sweep/causal.json
          if-no-files-found: ignore
          retention-days: 14
