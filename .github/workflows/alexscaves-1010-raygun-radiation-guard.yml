name: Alex's Caves 1.0.10 Raygun radiation resistance guard ABI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-radiation-guard.yml'
      - 'docs/qa/alexscaves_1010_raygun_radiation_guard_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_radiation_guard_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-radiation-guard-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RADIATION-GUARDS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/effects/irradiated.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-radiation-guard.yml'
      - 'docs/qa/alexscaves_1010_raygun_radiation_guard_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_radiation_guard_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-radiation-guard-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RADIATION-GUARDS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/effects/irradiated.md'

permissions:
  contents: read

jobs:
  exact_radiation_guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Negative synthetic guard and datapack regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_radiation_guard_probe.py docs/qa/alexscaves_1010_raygun_radiation_guard_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_radiation_guard_probe_test.py -v
      - name: Fetch exact Alex's Caves Continued 1.0.10 publisher JAR
        run: |
          mkdir -p build/raygun-radiation-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/raygun-radiation-1010/alexscaves-1.0.10.jar
      - name: Verify publisher resistance tag and exact compiled guard
        run: |
          SEAL=wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RADIATION-GUARDS-1.0.10.json
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_raygun_radiation_guard_probe.py \
              --jar build/raygun-radiation-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/raygun-radiation-1010/guard-evidence.json
          else
            echo 'UNSEALED RADIATION GUARD DISCOVERY: not merge evidence.'
            python3 docs/qa/alexscaves_1010_raygun_radiation_guard_probe.py \
              --jar build/raygun-radiation-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/raygun-radiation-1010/guard-evidence.json
          fi
          python3 -m json.tool build/raygun-radiation-1010/guard-evidence.json
      - name: Archive bounded clean-room metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-radiation-guard-abi
          path: build/raygun-radiation-1010/guard-evidence.json
          if-no-files-found: ignore
          retention-days: 14
