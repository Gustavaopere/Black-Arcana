name: Phase 2BH Goety reconciliation fixer

on:
  push:
    branches:
      - docs/magic-catalog-phase2bh-goety-exact
    paths:
      - .github/workflows/phase2bh-goety-fix.yml

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download accepted evidence artifacts
        run: |
          mkdir -p /tmp/goety/a /tmp/goety/f /tmp/goety/r /tmp/goety/s
          gh run download 34670150370 -n goety-3.1.4-exact-artifact-audit -D /tmp/goety/a
          gh run download 34670458172 -n goety-3.1.4-focus-reachability-audit -D /tmp/goety/f
          gh run download 34670556329 -n goety-3.1.4-ritual-identity-audit -D /tmp/goety/r
          gh run download 34670758163 -n goety-3.1.4-ritual-semantic-dedup-audit -D /tmp/goety/s
      - name: Extract and execute reconciliation script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/phase2bh-goety-reconcile.yml')
          s=p.read_text()
          marker="          python - <<'PY'\n"
          a=s.index(marker)+len(marker)
          b=s.index("\n          PY",a)
          lines=[]
          for line in s[a:b].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reconcile.py').write_text('\n'.join(lines)+'\n')
          PY
          python /tmp/reconcile.py
      - name: Commit durable candidate and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2bh-goety-reconcile.yml .github/workflows/phase2bh-goety-fix.yml
          git add SOURCES.md THIRD_PARTY_NOTICES.md wiki/modpack-catalog
          git diff --cached --check
          git commit -m 'docs: close Goety 3.1.4 exact magic catalog'
          git push origin HEAD
