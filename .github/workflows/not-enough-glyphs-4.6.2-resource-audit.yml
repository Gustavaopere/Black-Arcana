name: Not Enough Glyphs 4.6.2 Clean-room Resource Audit

on:
  push:
    branches:
      - audit/not-enough-glyphs-4.6.2-resource-2026-09-19

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact release and retain metadata-only evidence
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.cursemaven.com/curse/maven/not-enough-glyphs-1023517/8880291/not-enough-glyphs-1023517-8880291.jar'
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 180 "$URL" -o neg.jar
          mkdir -p audit
          {
            echo 'Not Enough Glyphs 4.6.2 clean-room resource audit'
            echo 'project_file=1023517/8880291'
            echo "release_sha1=$(sha1sum neg.jar | awk '{print $1}')"
            echo "release_sha256=$(sha256sum neg.jar | awk '{print $1}')"
            echo
            echo '== selected metadata paths =='
            jar tf neg.jar | grep -E '(^META-INF/(neoforge\.mods\.toml|mods\.toml|jarjar/)|not_enough_glyphs\.mixins\.json$)' | sort || true
            echo
            echo '== selected class-path presence only =='
            jar tf neg.jar | grep -E 'alexthw/not_enough_glyphs/(init/ArsNouveauRegistry|common/glyphs/effects/EffectMomentum)\.class$' | sort || true
          } > audit/report.txt

          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          z = zipfile.ZipFile('neg.jar')
          names = set(z.namelist())
          out = Path('audit/report.txt')

          with out.open('a', encoding='utf-8') as f:
              f.write('\n== mod metadata ==\n')
              for path in ('META-INF/neoforge.mods.toml','META-INF/mods.toml'):
                  if path in names:
                      text = z.read(path).decode('utf-8', errors='replace')
                      for line in text.splitlines():
                          s=line.strip()
                          if s.startswith(('modId','version','displayName','license','mandatory','type','ordering','side','versionRange')):
                              f.write(s+'\n')

              f.write('\n== jarjar metadata ==\n')
              path='META-INF/jarjar/metadata.json'
              if path in names:
                  data=json.loads(z.read(path).decode('utf-8'))
                  for jar in data.get('jars', []):
                      ident=jar.get('identifier', {})
                      version=jar.get('version', {})
                      f.write('group=' + str(ident.get('group','')) + '\n')
                      f.write('artifact=' + str(ident.get('artifact','')) + '\n')
                      f.write('range=' + str(version.get('range','')) + '\n')
                      f.write('artifactVersion=' + str(version.get('artifactVersion','')) + '\n')
                      f.write('path=' + str(jar.get('path','')) + '\n')
              else:
                  f.write('jarjar_metadata_missing=true\n')
          PY

          cat audit/report.txt

      - name: Upload text-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: not-enough-glyphs-4.6.2-resource-audit
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
