name: Alex's Caves 1.0.10 Field Extension full-method static certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-field-extension-causal.yml'
      - 'docs/qa/alexscaves_1010_field_extension_causal_audit.py'
      - 'docs/qa/alexscaves_1010_field_extension_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FIELD-EXTENSION-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/field-extension.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-field-extension-causal.yml'
      - 'docs/qa/alexscaves_1010_field_extension_causal_audit.py'
      - 'docs/qa/alexscaves_1010_field_extension_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FIELD-EXTENSION-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/field-extension.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'

permissions:
  contents: read

jobs:
  field_extension_static_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Python and run synthetic fail-closed tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_field_extension_causal_audit.py docs/qa/alexscaves_1010_field_extension_causal_cards_test.py
          python3 docs/qa/alexscaves_1010_field_extension_causal_cards_test.py -v
      - name: Download SHA-exact publisher 1.0.10
        run: |
          set -euo pipefail
          mkdir -p build/field-extension-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/field-extension-causal/alexscaves-1.0.10.jar
          printf '%s  %s\n' \
            '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c' \
            'build/field-extension-causal/alexscaves-1.0.10.jar' | sha256sum -c -
      - name: Verify 13 native full methods and individual range-targeting pivots
        run: |
          python3 docs/qa/alexscaves_1010_field_extension_causal_audit.py \
            --jar build/field-extension-causal/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/field-extension-causal/report.json
      - name: Canonical provider ledger and all indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: field-extension-1010-static-causal-report
          path: build/field-extension-causal/report.json
          if-no-files-found: ignore
          retention-days: 14
