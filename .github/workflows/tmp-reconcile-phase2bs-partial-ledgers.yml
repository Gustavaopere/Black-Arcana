name: Temporary Phase 2BS Partial Ledger Reconciler

on:
  push:
    branches:
      - docs/reconcile-provider-ledgers-phase2bs

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertive Phase 2BS shared-ledger patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, text): (root / path).write_text(text, encoding='utf-8')

          marker = "Phase 2BS — T.O Magic n' Extras / Traveloptics 4.4.0.1-1.21.1"

          p = 'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
          s = read(p)
          if marker not in s:
              anchor = 'Capítulos e tabelas históricas abaixo continuam úteis para rastrear deltas, mas não prevalecem sobre o snapshot físico atual.\n'
              assert s.count(anchor) == 1, 'CURRENT freshness anchor drift'
              para = "Phase 2BS adiciona T.O Magic n' Extras / `traveloptics` 4.4.0.1-1.21.1 ao conjunto **⚠️ parcial/condicionado**: o publisher file exato `6342780` fecha 33 identidades de spell registradas e exclui 32 roots de localization residuais, mas `traveloptics:blackout` permanece sem rota survival objeto-a-objeto fechada e o JAR exato apresenta risco estrutural em `TOLootModifiers` (`KeyLootModifier.CODEC` referenciado duas vezes; `UniversalLootModifier.CODEC` zero). Portanto Phase 2BS contribui **+0 strict**, não cria componente #67 e mantém **1344 / 66 de 100**.\n\n"
              s = s.replace(anchor, para + anchor)
              h = "## Checkpoint GTBC's Geomancy Plus — Phase 2BR canonical"
              assert s.count(h) == 1, 'CURRENT Phase 2BR header drift'
              block = (
                  "## Phase 2BS — T.O Magic n' Extras / Traveloptics 4.4.0.1-1.21.1 — partial canonical\n\n"
                  "O exact publisher release file `6342780` fecha **33** registrations `traveloptics:<id>` no `TOSpells`, com 33 field→classe→ID mappings e zero branches no initializer. Outros **32** root localization spell IDs existem no alpha, mas não estão registrados e são excluídos. `AbstractUniqueSpell.allowCrafting=false`; nove dos dez Unique registrados possuem rotas de loot estruturadas, enquanto `traveloptics:blackout` não possui referência estruturada nem referência provider-owned fora do registry encontrada pelo audit.\n\n"
                  "O audit de risco também prova que `TOLootModifiers` contém os nomes `key_loot` e `universal_loot`, mas referencia `KeyLootModifier.CODEC` duas vezes e `UniversalLootModifier.CODEC` zero vezes. Um patch de terceiro descreve esse mesmo wiring como defeito de startup, porém Black Arcana não declara crash reproduzido. A promoção fica fail-closed até runtime físico autoritativo e reachability de Blackout. Durable PR #228 mergeou em `main@0bd1c04460e63a03b6b484b785247e75f6e44178`; post-merge CI #2682 / run `34741699505` passou e publicou artifact `10311724779` (`sha256:05e28f0dc516e3b51bbd9016a37816cd1854e45caeaa71745189b20297ae3813`). Estado: **⚠️ parcial/condicionado / +0 strict / componente aberto**.\n\n"
              )
              s = s.replace(h, block + h)
              write(p, s)

          p = 'wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'
          s = read(p)
          if marker not in s:
              lines = s.splitlines(True)
              idxs = [i for i,l in enumerate(lines) if l.startswith("- Phase 2BR GTBC's Geomancy Plus closure is validated at")]
              assert len(idxs) == 1, 'SEMANTIC authority anchor drift'
              lines.insert(idxs[0]+1, "- Phase 2BS T.O Magic n' Extras partial catalog is validated at `main@0bd1c04460e63a03b6b484b785247e75f6e44178`: durable PR #228 passed exact-head CI #2679 / run `34741531727`; the merge SHA passed exact-SHA post-merge CI #2682 / run `34741699505` and published canonical QA artifact `10311724779` (`sha256:05e28f0dc516e3b51bbd9016a37816cd1854e45caeaa71745189b20297ae3813`). Phase 2BS catalogs 33 exact registered identities but contributes +0 strict and no component closure.\n")
              s = ''.join(lines)
              h = "## Phase 2BR — GTBC's Geomancy Plus 1.1.0-1.21.1 release-bounded spell closure"
              assert s.count(h) == 1, 'SEMANTIC Phase 2BR header drift'
              block = (
                  "## Phase 2BS — T.O Magic n' Extras / Traveloptics 4.4.0.1-1.21.1 partial catalog\n\n"
                  "Exact publisher file `6342780` closes **33 unique registered `traveloptics:<id>` spell identities**, 33 field→class→ID mappings and zero registry initializer branches. The same exact alpha carries 32 additional root localization spell IDs that are not registered and are excluded. Provider ancestry proves `AbstractUniqueSpell.allowCrafting() = false` and `AbstractWeaponSpell.allowCrafting() = true`; nine of ten Unique registrations have direct structured loot anchors, while `traveloptics:blackout` remains object-level survival-unresolved.\n\n"
                  "A focused exact-artifact audit also proves a runtime-risk wiring fact: `TOLootModifiers` registers both `key_loot` and `universal_loot`, while `KeyLootModifier.CODEC` is referenced twice and `UniversalLootModifier.CODEC` zero times. Black Arcana does not claim the reported runtime crash is reproduced, but runtime viability remains fail-closed. Consequently all 33 registry identities remain catalog inventory rather than a strict counted promotion: Phase 2BS contributes **+0 strict**, the reconstructible minimum stays **1344**, and technical component closure stays **66/100**.\n\n"
              )
              s = s.replace(h, block + h)
              write(p, s)

          p = 'wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
          s = read(p)
          if marker not in s:
              h = 'Phase 2BR has a semantic delta of **+12 `COUNTED_RELEASE_BOUNDED`**:'
              assert s.count(h) == 1, 'CATALOG Phase 2BR paragraph drift'
              para = "Phase 2BS — T.O Magic n' Extras / Traveloptics 4.4.0.1-1.21.1 — is a **partial catalog with +0 strict semantic delta and +0 component delta**. Exact publisher file `6342780` closes 33 registered spell identities and excludes 32 residual localization-only roots. `traveloptics:blackout` remains reachability-unresolved under `AbstractUniqueSpell.allowCrafting=false`, and exact `TOLootModifiers` wiring references `KeyLootModifier.CODEC` twice while `UniversalLootModifier.CODEC` is absent from that registration path. Runtime crash is not claimed reproduced. Phase 2BS therefore leaves the strict minimum at **1344** and technical closure at **66/100**. See [`../providers/traveloptics/README.md`](../providers/traveloptics/README.md), [`../providers/traveloptics/EXACT-4.4.0.1-ARTIFACT-AUDIT.md`](../providers/traveloptics/EXACT-4.4.0.1-ARTIFACT-AUDIT.md) and [`PHASE2BS-TRAVELOPTICS-4.4.0.1-PARTIAL-CHECKPOINT.md`](./PHASE2BS-TRAVELOPTICS-4.4.0.1-PARTIAL-CHECKPOINT.md).\n\n"
              s = s.replace(h, para + h)
              write(p, s)

          p = 'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
          s = read(p)
          if marker not in s:
              lines = s.splitlines(True)
              idxs = [i for i,l in enumerate(lines) if l.startswith('- estado de evidência pós-Phase 2BR:')]
              assert len(idxs) == 1, 'QUEUE authority anchor drift'
              lines.insert(idxs[0]+1, "- estado de evidência pós-Phase 2BS parcial: `main@0bd1c04460e63a03b6b484b785247e75f6e44178`; PR #228 cataloga 33 identidades `traveloptics` exatas sem promoção strict/component; exact merge SHA passou CI #2682 / run `34741699505` e publicou QA artifact `10311724779` (`sha256:05e28f0dc516e3b51bbd9016a37816cd1854e45caeaa71745189b20297ae3813`);\n")
              s = ''.join(lines)
              h = "## Phase 2BR — GTBC's Geomancy Plus 1.1.0-1.21.1 — componente #66 / semantic +12"
              assert s.count(h) == 1, 'QUEUE Phase 2BR header drift'
              block = (
                  "## Phase 2BS — T.O Magic n' Extras / Traveloptics 4.4.0.1-1.21.1 — partial / +0 / component open\n\n"
                  "| Mod ID | Artefato físico | Estado |\n"
                  "|---|---|---|\n"
                  "| `traveloptics` | linha física `4.4.0.1-1.21.1`; publisher file exato `6342780` | ⚠️ PARTIAL / 33 EXACT REGISTERED SPELL IDS / 32 RESIDUAL LOCALIZATION IDS EXCLUDED / `BLACKOUT` SURVIVAL REACHABILITY UNRESOLVED / STRUCTURAL `TOLootModifiers` CODEC WIRING RISK / +0 STRICT / COMPONENT OPEN / RUNTIME FAIL-CLOSED |\n\n"
                  "Audit anchors: exact artifact run `34740821956`, registry run `34740904391`, semantic 33/33 run `34741045570`, corrected runtime-risk run `34741368134`. Durable PR #228 merge `main@0bd1c04460e63a03b6b484b785247e75f6e44178`; post-merge CI #2682 / run `34741699505` GREEN; QA artifact `10311724779`. Phase 2BS does not allocate component #67 and does not change **1344 / 66 of 100**. Keep T.O parked until authoritative runtime viability and `blackout` reachability are resolved.\n\n"
              )
              s = s.replace(h, block + h)
              write(p, s)
          PY

          git diff --check
          if git diff --quiet -- wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md; then
            echo 'No ledger changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md \
                  wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md \
                  wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md \
                  wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md
          git commit -m 'docs: reconcile shared ledgers after Phase 2BS'
          git push origin HEAD:docs/reconcile-provider-ledgers-phase2bs
