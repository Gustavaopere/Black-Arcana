name: audit-dimensional-sable-1.0.5

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact Modrinth artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/dimensional-sable
          cd build/audit/dimensional-sable
          curl -fL --retry 3 --retry-all-errors \
            "https://cdn.modrinth.com/data/Iq9c4mLa/versions/l9l5j4Zh/dimensional_sable-1.0.5.jar" \
            -o dimensional_sable-1.0.5.jar
          test -s dimensional_sable-1.0.5.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/dimensional-sable
          EXPECTED_SHA1="67e519029aa95e0b4a0694bf31190163ada0bc81"
          ACTUAL_SHA1="$(sha1sum dimensional_sable-1.0.5.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum dimensional_sable-1.0.5.jar | awk '{print $1}')"
          BYTES="$(stat -c %s dimensional_sable-1.0.5.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "modrinth_project=Iq9c4mLa"
            echo "modrinth_version=l9l5j4Zh"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Inventory exact artifact
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/dimensional-sable
          jar tf dimensional_sable-1.0.5.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib,re,zipfile
          with zipfile.ZipFile('dimensional_sable-1.0.5.jar') as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              sem=re.compile(r'(dimension|teleport|warp|command|spell|magic|ritual|ability|portal|transfer|sublevel|sable)',re.I)
              cand=[n for n in names if sem.search(n)]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\nsemantic_like_paths={len(cand)}\n',
                  encoding='utf-8')
              pathlib.Path('classes.txt').write_text('\n'.join(classes)+'\n',encoding='utf-8')
              pathlib.Path('semantic-like-paths.txt').write_text('\n'.join(cand)+'\n',encoding='utf-8')
          PY

      - name: Dump exact command and transfer seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/dimensional-sable
          : > javap-all.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all.txt
            javap -classpath dimensional_sable-1.0.5.jar -p -c -constants "$cls" >> javap-all.txt 2>&1 || true
          done < classes.txt
          grep -nEi 'dimension_set|literal.*dimension|command|teleport|transfer|sublevel|serverlevel|setLevel|spell|magic|ritual|ability|portal' javap-all.txt > transfer-command-seams.txt || true

      - name: Extract exact provider data
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/dimensional-sable
          python3 - <<'PY'
          import json,pathlib,zipfile
          rows=[]
          with zipfile.ZipFile('dimensional_sable-1.0.5.jar') as z:
              for name in sorted(z.namelist()):
                  if not name.startswith('data/') or not name.endswith('.json'): continue
                  try:
                      raw=z.read(name).decode('utf-8')
                      obj=json.loads(raw)
                      compact=json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  except Exception as e:
                      compact='INVALID_JSON:'+type(e).__name__
                  rows.append((name,compact))
          pathlib.Path('provider-data-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
          pathlib.Path('provider-data-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dimensional-sable-1.0.5-exact-artifact-audit
          path: |
            build/audit/dimensional-sable/hashes.txt
            build/audit/dimensional-sable/inventory.txt
            build/audit/dimensional-sable/jar-entries.txt
            build/audit/dimensional-sable/semantic-like-paths.txt
            build/audit/dimensional-sable/javap-all.txt
            build/audit/dimensional-sable/transfer-command-seams.txt
            build/audit/dimensional-sable/provider-data-json.txt
            build/audit/dimensional-sable/provider-data-count.txt
          if-no-files-found: error
