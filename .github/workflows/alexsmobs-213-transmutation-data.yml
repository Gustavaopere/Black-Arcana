name: Alexs Mobs 2.1.13 TransmutationData NBT and display static audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-data.yml'
      - 'docs/qa/alexsmobs_213_transmutation_data_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_data_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-data-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-DATA-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-data.yml'
      - 'docs/qa/alexsmobs_213_transmutation_data_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_data_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-data-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-DATA-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
permissions:
  contents: read
jobs:
  transmutation_data:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run 13 synthetic read-only fail-closed checks
        run: |
          python3 -m py_compile docs/qa/alexsmobs_213_transmutation_data_probe.py docs/qa/alexsmobs_213_transmutation_data_probe_test.py
          python3 docs/qa/alexsmobs_213_transmutation_data_probe_test.py -v
      - name: Acquire historically modlist-matched exact publisher JAR
        run: |
          set -euo pipefail
          mkdir -p build/alexsmobs-213-data
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856498/alexs-mobs-continued-1635121-8856498.jar' \
            --output build/alexsmobs-213-data/alexsmobs-2.1.13.jar
          printf '%s  %s\n' \
            'eef0b4d36f1e40292b23f90ad3052e2e9aace3a33c6a48c65b8b5f2b061ab6c8' \
            'build/alexsmobs-213-data/alexsmobs-2.1.13.jar' | sha256sum -c -
          test "$(stat -c '%s' build/alexsmobs-213-data/alexsmobs-2.1.13.jar)" = '27452738'
      - name: Read-only native data NBT and display discovery, SHA-exact
        run: |
          set -euo pipefail
          PUBLISHER='build/alexsmobs-213-data/alexsmobs-2.1.13.jar'
          PRIOR='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-C2S-2.1.13.json'
          LOCK='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-DATA-2.1.13.json'
          if [[ -f "$LOCK" ]]; then
            python3 docs/qa/alexsmobs_213_transmutation_data_probe.py \
              --jar "$PUBLISHER" --javap "$JAVA_HOME/bin/javap" \
              --predecessor "$PRIOR" --lock "$LOCK" \
              --output build/alexsmobs-213-data/report.json
          else
            python3 docs/qa/alexsmobs_213_transmutation_data_probe.py \
              --jar "$PUBLISHER" --javap "$JAVA_HOME/bin/javap" \
              --predecessor "$PRIOR" \
              --output build/alexsmobs-213-data/report.json
          fi
      - name: Verify catalog index and certificates stay consistent
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexsmobs-213-transmutation-data-readonly
          path: build/alexsmobs-213-data/report.json
          if-no-files-found: ignore
          retention-days: 14
