name: Identity2 2.2.4 cooldown bytecode gated audit (NeoForge 1.21.1)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/identity2-224-cooldown-binary.yml'
      - 'docs/qa/identity2_224_cooldown_binary.py'
  workflow_dispatch:
    inputs:
      curseforge_file_id:
        description: 'Verified publisher file ID: Identity2 2.2.4 NeoForge Minecraft 1.21.1 only'
        required: true
        type: string
      expected_sha1:
        description: 'Independently verified SHA-1 (40 lowercase hexadecimal digits) of publisher JAR'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Six deterministic synthetic tests of bounded check and fail-closed paths
        run: python3 docs/qa/identity2_224_cooldown_binary.py --self-test
      - name: Fetch user-confirmed official publisher JAR (never guess file ID)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CF_FILE: ${{ inputs.curseforge_file_id }}
          SHA1_EXPECTED: ${{ inputs.expected_sha1 }}
        run: |
          set -euo pipefail
          [[ "$CF_FILE" =~ ^[0-9]{7,9}$ ]] || { echo 'Invalid CurseForge numeric file ID'; exit 2; }
          [[ "$SHA1_EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected SHA1 must be 40 lowercase hex'; exit 2; }
          mkdir -p build/identity2-224-audit
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            "https://cursemaven.com/curse/maven/identity2-1238155/${CF_FILE}/identity2-1238155-${CF_FILE}.jar" \
            --output build/identity2-224-audit/publisher.jar
          echo "$SHA1_EXPECTED  build/identity2-224-audit/publisher.jar" | sha1sum --check
      - name: Bounded Java 21 classfile check (dispatch only; no client/runtime claims)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SHA1_EXPECTED: ${{ inputs.expected_sha1 }}
        run: |
          set -euo pipefail
          python3 docs/qa/identity2_224_cooldown_binary.py \
            --jar build/identity2-224-audit/publisher.jar \
            --expected-sha1 "$SHA1_EXPECTED" \
            --output build/identity2-224-audit/identity2-bytecode-report.json
      - name: Publish JSON evidence only, never publisher JAR
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: identity2-224-bounded-bytecode-${{ github.sha }}
          path: build/identity2-224-audit/identity2-bytecode-report.json
          if-no-files-found: ignore
          retention-days: 14
