name: Leylines 1.0.3 Exact Artifact Audit

on:
  push:
    branches:
      - docs/provider-artifact-audit-leylines-1.0.3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and inspect exact artifact
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA1='dfa6908731f432905caaaa1e53b4aedeaa26ed59'
          URL='https://www.cursemaven.com/curse/maven/leylines-irons-spells-n-spellbooks-addon-1636676/8565076/leylines-irons-spells-n-spellbooks-addon-1636676-8565076.jar'
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 180 "$URL" -o leylines.jar
          ACTUAL_SHA1="$(sha1sum leylines.jar | awk '{print $1}')"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          mkdir -p audit
          {
            echo 'Leylines 1.0.3 exact-artifact audit'
            echo "expected_sha1=$EXPECTED_SHA1"
            echo "actual_sha1=$ACTUAL_SHA1"
            echo
            echo '== metadata paths =='
            jar tf leylines.jar | grep -E '(^|/)(neoforge\.mods\.toml|mods\.toml|MANIFEST\.MF)$' || true
            echo
            echo '== provider metadata facts =='
            unzip -p leylines.jar META-INF/neoforge.mods.toml 2>/dev/null \
              | grep -E '^(modId|version|displayName|license)|modId="|version="|displayName="|license=' \
              || true
            echo
            echo '== spell/resource paths =='
            jar tf leylines.jar | grep -Ei '(^|/)(spell|spells)/|spell.*\.json$' | sort || true
            echo
            echo '== registry-name candidate classes =='
            jar tf leylines.jar | grep '\.class$' \
              | grep -Ei '(spell.*registr|registr.*spell|modspells|spellregistry|spellregistries)' \
              | sort || true
            echo
            echo '== standalone Spell-suffixed classes =='
            jar tf leylines.jar | grep '\.class$' | grep -E '/[^/$]*Spell\.class$' | sort || true
            echo
            echo '== acquisition/reachability data paths =='
            jar tf leylines.jar \
              | grep -Ei '^data/leylines/(loot|recipes|recipe|tags|advancement|advancements|irons_spellbooks|neoforge|minecraft)/|loot_table|spellbook|scroll|trade' \
              | sort || true
          } > audit/report.txt

          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          jar = zipfile.ZipFile('leylines.jar')
          names = set(jar.namelist())
          out = Path('audit/report.txt')
          with out.open('a', encoding='utf-8') as f:
              f.write('\n== language spell/school keys ==\n')
              for path in sorted(p for p in names if p.endswith('/lang/en_us.json')):
                  try:
                      data = json.loads(jar.read(path).decode('utf-8'))
                  except Exception as exc:
                      f.write(f'{path}: parse_error={exc}\n')
                      continue
                  keys = sorted(k for k in data if k.startswith('spell.') or '.spell.' in k or k.startswith('school.'))
                  f.write(f'[{path}] key_count={len(keys)}\n')
                  for key in keys:
                      f.write(key + '\n')

              f.write('\n== exact namespace spell-like data paths ==\n')
              for path in sorted(p for p in names if p.startswith('data/leylines/') and 'spell' in p.lower()):
                  f.write(path + '\n')

              f.write('\n== structured acquisition JSON references ==\n')
              for path in sorted(p for p in names if p.startswith('data/leylines/') and p.endswith('.json')):
                  low = path.lower()
                  if not any(t in low for t in ('loot', 'recipe', 'advancement', 'tag', 'spellbook', 'scroll', 'trade')):
                      continue
                  try:
                      data = json.loads(jar.read(path).decode('utf-8'))
                  except Exception:
                      continue
                  text = json.dumps(data, sort_keys=True, separators=(',', ':'))
                  refs = sorted(set(part.strip('"{}[],:') for part in text.replace(',', ' ').split()
                                    if 'leylines:' in part or 'irons_spellbooks:' in part))
                  f.write(path + '\n')
                  for ref in refs[:100]:
                      f.write(f'  ref={ref}\n')
          PY

          mapfile -t ALL_CLASSES < <(jar tf leylines.jar | grep '\.class$' | sed 's#/#.#g; s#\.class$##' | sort -u)
          : > audit/registry-classes.txt
          for cls in "${ALL_CLASSES[@]}"; do
            SIG="$(javap -classpath leylines.jar -p "$cls" 2>/dev/null || true)"
            if printf '%s\n' "$SIG" | grep -q 'AbstractSpell' \
              && printf '%s\n' "$SIG" | grep -Eq 'DeferredRegister|DeferredHolder|Supplier|RegistryObject'; then
              printf '%s\n' "$cls" >> audit/registry-classes.txt
            fi
          done

          mapfile -t NAMED_REGISTRY_CLASSES < <(jar tf leylines.jar | grep '\.class$' \
            | grep -Ei '(spell.*registr|registr.*spell|modspells|spellregistry|spellregistries)' \
            | sed 's#/#.#g; s#\.class$##' | sort -u || true)
          for cls in "${NAMED_REGISTRY_CLASSES[@]}"; do
            grep -qxF "$cls" audit/registry-classes.txt || echo "$cls" >> audit/registry-classes.txt
          done
          sort -u -o audit/registry-classes.txt audit/registry-classes.txt

          mapfile -t REGISTRY_CLASSES < audit/registry-classes.txt
          {
            echo
            echo '== inferred registry classes from signatures =='
            printf '%s\n' "${REGISTRY_CLASSES[@]}"
            echo "candidate_registry_class_count=${#REGISTRY_CLASSES[@]}"
            echo
            echo '== candidate registry signatures =='
            for cls in "${REGISTRY_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath leylines.jar -p "$cls" 2>/dev/null || true
            done
            echo
            echo '== filtered candidate registry bytecode facts =='
            for cls in "${REGISTRY_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath leylines.jar -p -c "$cls" 2>/dev/null \
                | grep -E 'AbstractSpell|registerSpell|DeferredRegister|DeferredHolder|Supplier|RegistryObject|putstatic|new[[:space:]]|// String |if(eq|ne|lt|le|gt|ge|null|nonnull)|goto|invokedynamic' \
                || true
            done
          } >> audit/report.txt

          mapfile -t SPELL_CLASSES < <(jar tf leylines.jar | grep '\.class$' \
            | grep -E '/[^/$]*Spell\.class$' | sed 's#/#.#g; s#\.class$##' | sort -u || true)
          {
            echo
            echo '== Spell-class constructor/root string facts =='
            for cls in "${SPELL_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath leylines.jar -p -c "$cls" 2>/dev/null \
                | grep -E '<init>|// String [A-Za-z0-9_./:-]+$|AbstractSpell\.<init>|DefaultConfig|SpellRarity|School|ResourceLocation' \
                || true
            done
            echo "standalone_spell_class_count=${#SPELL_CLASSES[@]}"
          } >> audit/report.txt

          mapfile -t ACQ_CLASSES < <(jar tf leylines.jar | grep '\.class$' \
            | grep -Ei '(loot|scroll|spellbook|trade|villag|recipe|creative|config|pillar|rift|event|command)' \
            | sed 's#/#.#g; s#\.class$##' | sort -u || true)
          {
            echo
            echo '== acquisition/reachability candidate signatures =='
            for cls in "${ACQ_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath leylines.jar -p "$cls" 2>/dev/null || true
            done
            echo "acquisition_candidate_class_count=${#ACQ_CLASSES[@]}"
          } >> audit/report.txt

          cat audit/report.txt

      - name: Upload text-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: leylines-1.0.3-exact-artifact-audit
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
