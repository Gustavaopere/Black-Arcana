name: Alex's Caves 1.0.10 Galena movement and entity registry discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-movement.yml'
      - 'docs/qa/alexscaves_1010_galena_movement_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-MOVEMENT-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_movement_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_galena_movement_probe.py
          python3 docs/qa/alexscaves_1010_galena_movement_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/galena-movement
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' -o build/galena-movement/publisher.jar
      - name: Project movement and registration twice
        run: |
          python3 docs/qa/alexscaves_1010_galena_movement_probe.py --jar build/galena-movement/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/galena-movement/report.json
          python3 docs/qa/alexscaves_1010_galena_movement_probe.py --jar build/galena-movement/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/galena-movement/replay.json
          cmp build/galena-movement/report.json build/galena-movement/replay.json
          sha256sum build/galena-movement/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: galena-movement
          path: build/galena-movement/report.json
          if-no-files-found: warn
          retention-days: 14
