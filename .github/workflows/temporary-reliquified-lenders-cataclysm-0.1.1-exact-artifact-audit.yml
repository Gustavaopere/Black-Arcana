name: Temporary Reliquified Lenders Cataclysm 0.1.1 Exact Artifact Audit

on:
  push:
    branches:
      - audit/reliquified-lenders-cataclysm-0.1.1-exact-artifact-2026-09-27

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and hash-gate exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          URL="https://cdn.modrinth.com/data/rBEndPUc/versions/ZHAIRSeF/reliquified_lenders_cataclysm-1.21.1-0.1.1.jar"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o /tmp/provider.jar
          ACTUAL="$(sha1sum /tmp/provider.jar | awk '{print $1}')"
          EXPECTED="be89d697455f04a1531ed81b45bcc038354430c8"
          printf 'expected_physical_sha1=%s\nactual_publisher_sha1=%s\n' "$EXPECTED" "$ACTUAL" | tee audit/hash.txt
          test "$ACTUAL" = "$EXPECTED"
          sha256sum /tmp/provider.jar | tee audit/sha256.txt

      - name: Discover exact class and ability topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          from zipfile import ZipFile

          jar='/tmp/provider.jar'
          item_ids=[
              'scouring_eye','void_vortex_in_bottle','void_mantle','void_cloak',
              'vacuum_glove','void_bubble','ring_of_the_flame_kindler',
              'mask_of_rage','fire_plate','volcano'
          ]
          ability_ids=[
              'glowing_scour','spawn_vortex','void_invulnerability','void_rune',
              'seismic_zone','vacuum_slowdown','protective_bubble',
              'flame_summon','ram_mode','spawn_shield','jetpack'
          ]
          target_classes=[
              'it.hurts.octostudios.reliquified_lenders_cataclysm.init.ItemRegistry',
              'it.hurts.octostudios.reliquified_lenders_cataclysm.items.relics.back.VoidCloakItem',
              'it.hurts.octostudios.reliquified_lenders_cataclysm.items.relics.charm.ScouringEyeItem',
              'it.hurts.octostudios.reliquified_lenders_cataclysm.items.relics.charm.VoidVortexInBottleItem',
              'it.hurts.octostudios.reliquified_lenders_cataclysm.items.relics.hands.VacuumGloveItem',
              'it.hurts.octostudios.reliquified_lenders_cataclysm.items.relics.head.VoidBubbleItem'
          ]

          out=["RELIQUIFIED L_ENDER'S CATACLYSM 0.1.1 EXACT DISCOVERY",""]
          with ZipFile(jar) as z:
              names=set(z.namelist())
              classes=sorted(n for n in names if n.endswith('.class'))

              out.append('[metadata]')
              for p in ('META-INF/neoforge.mods.toml','META-INF/mods.toml','META-INF/MANIFEST.MF'):
                  if p in names:
                      txt=z.read(p).decode('utf-8','replace')
                      for line in txt.splitlines():
                          s=line.strip()
                          if s.startswith(('modId=','version=','displayName=','license=','Implementation-Version:')):
                              out.append(s)
              out.append('')

              out.append('[relic/item-like classes]')
              candidates=[
                  n for n in classes
                  if '/relic' in n.lower() or n.endswith('Item.class') or n.endswith('Items.class')
              ]
              out.extend(candidates)
              out.append(f'candidate_class_count={len(candidates)}')
              out.append('')

              out.append('[item-id token locations]')
              for token in item_ids:
                  hits=[n for n in classes if token.encode() in z.read(n)]
                  out.append(f'{token}=' + (','.join(hits) if hits else '<none>'))
              out.append('')

              out.append('[ability-id token locations]')
              for token in ability_ids:
                  hits=[n for n in classes if token.encode() in z.read(n)]
                  out.append(f'{token}=' + (','.join(hits) if hits else '<none>'))
              out.append('')

              out.append('[AbilityTemplate references]')
              hits=[n for n in classes if b'AbilityTemplate' in z.read(n)]
              out.extend(hits or ['<none>'])
              out.append(f'ability_template_class_count={len(hits)}')
              out.append('')

              out.append('[loot-token locations]')
              for token in ('THE_NETHER','THE_END','CURSED_PYRAMID','FROSTED_PRISON','cursed_pyramid','frosted_prison_treasure'):
                  hits=[n for n in classes if token.encode() in z.read(n)]
                  out.append(f'{token}=' + (','.join(hits) if hits else '<none>'))
              out.append('')

          out.append('[narrow javap string constants]')
          for cls in target_classes:
              p=subprocess.run(['javap','-classpath',jar,'-c','-p',cls],text=True,capture_output=True)
              out.append(f'## {cls}')
              if p.returncode != 0:
                  out.append('<javap failed>')
                  continue
              strings=[]
              for line in p.stdout.splitlines():
                  marker='// String '
                  if marker not in line:
                      continue
                  s=line.split(marker,1)[1].strip()
                  if s not in strings:
                      strings.append(s)
              out.extend(strings)
              out.append(f'string_constant_count={len(strings)}')
          out.append('')

          txt='\n'.join(out)+'\n'
          pathlib.Path('audit/facts.txt').write_text(txt,encoding='utf-8')
          print(txt)
          PY

      - name: Publish text-only audit report
        uses: actions/upload-artifact@v7
        with:
          name: reliquified-lenders-cataclysm-0.1.1-exact-discovery
          path: audit/*.txt
          if-no-files-found: error
          retention-days: 3
