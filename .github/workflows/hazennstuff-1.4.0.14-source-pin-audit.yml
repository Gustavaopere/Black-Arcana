name: Hazen N Stuff 1.4.0.14 Source Pin Audit NON-MERGE

on:
  push:
    branches:
      - audit/hazennstuff-1.4.0.14-source-pin

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Black Arcana
        uses: actions/checkout@v4

      - name: Clone exact official Hazen N Stuff source pin
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Hazentouvel/Hazen_N_Stuff.git upstream
          git -C upstream checkout --detach 5fcaf39cf399609f6c1c87d14f8d4807098c9cce
          test "$(git -C upstream rev-parse HEAD)" = "5fcaf39cf399609f6c1c87d14f8d4807098c9cce"
          test "$(git -C upstream show -s --format=%s HEAD)" = "1.4.0.14 beta."

      - name: Reconcile exact registry, ids, gates, dependencies and acquisition anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('upstream')
          JAVA = ROOT / 'src/main/java'
          PIN = '5fcaf39cf399609f6c1c87d14f8d4807098c9cce'
          NS = 'hazennstuff'
          report = []

          def emit(s=''):
              report.append(str(s))

          def text(path):
              return path.read_text(encoding='utf-8')

          def package_name(src):
              m = re.search(r'^\s*package\s+([\w.]+)\s*;', src, flags=re.M)
              return m.group(1) if m else ''

          def imports(src):
              explicit = {}
              wildcards = []
              for name in re.findall(r'^\s*import\s+(?!static)([\w.*]+)\s*;', src, flags=re.M):
                  if name.endswith('.*'):
                      wildcards.append(name[:-2])
                  else:
                      explicit[name.rsplit('.', 1)[-1]] = name
              return explicit, wildcards

          def fqcn_path(fqcn):
              p = JAVA / (fqcn.replace('.', '/') + '.java')
              return p if p.is_file() else None

          def resolve_type(type_name, context_path, context_src):
              simple = type_name.rsplit('.', 1)[-1]
              if '.' in type_name:
                  p = fqcn_path(type_name)
                  return p, type_name
              explicit, wildcards = imports(context_src)
              if simple in explicit:
                  fqcn = explicit[simple]
                  return fqcn_path(fqcn), fqcn
              pkg = package_name(context_src)
              same = f'{pkg}.{simple}' if pkg else simple
              p = fqcn_path(same)
              if p:
                  return p, same
              matches = []
              for wpkg in wildcards:
                  fqcn = f'{wpkg}.{simple}'
                  p = fqcn_path(fqcn)
                  if p:
                      matches.append((p, fqcn))
              if len(matches) == 1:
                  return matches[0]
              if len(matches) > 1:
                  raise AssertionError(
                      f'{simple}: ambiguous wildcard resolution from {context_path.relative_to(ROOT)}: '
                      + ', '.join(fqcn for _, fqcn in matches)
                  )
              return None, explicit.get(simple, simple)

          props = {}
          for raw in text(ROOT / 'gradle.properties').splitlines():
              line = raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
          assert props.get('mod_id') == NS, props.get('mod_id')
          assert props.get('mod_version') == '1.4.0.14', props.get('mod_version')

          emit('HAZEN N STUFF 1.4.0.14 SOURCE-PIN AUDIT')
          emit(f'source_pin={PIN}')
          emit(f'mod_id={props.get("mod_id")}')
          emit(f'mod_version={props.get("mod_version")}')
          emit(f'minecraft_version={props.get("minecraft_version", "<not-declared>")}')
          emit(f'neo_version={props.get("neo_version", props.get("neoforge_version", "<not-declared>"))}')
          emit()

          reg_path = JAVA / 'net/hazen/hazennstuff/Spells/HnSSpellRegistries.java'
          raw_reg = text(reg_path)
          no_block = re.sub(r'/\*.*?\*/', '', raw_reg, flags=re.S)
          active_reg = re.sub(r'//.*', '', no_block)
          pat = re.compile(
              r'public\s+static\s+final\s+Supplier<AbstractSpell>\s+(\w+)\s*=\s*registerSpell\(new\s+(\w+)\s*\(\s*\)\s*\)\s*;'
          )
          regs = pat.findall(active_reg)
          assert len(regs) == 38, f'expected 38 active registrations, got {len(regs)}'
          assert len({f for f, _ in regs}) == 38
          assert len({c for _, c in regs}) == 38
          assert 'REIGN_OF_TYROS' not in {f for f, _ in regs}
          assert re.search(
              r'//\s*public\s+static\s+final\s+Supplier<AbstractSpell>\s+REIGN_OF_TYROS\s*=\s*registerSpell\(new\s+ReignOfTyrosSpell\(\)\);',
              raw_reg,
          ), 'commented Reign of Tyros prototype not found'

          emit('REGISTRY')
          emit(f'active_registration_count={len(regs)}')
          emit('excluded_commented_registration=REIGN_OF_TYROS -> ReignOfTyrosSpell')
          emit()

          rl_patterns = [
              re.compile(r'ResourceLocation\.fromNamespaceAndPath\(\s*HazenNStuff\.MOD_ID\s*,\s*"([a-z0-9_./-]+)"\s*\)'),
              re.compile(r'ResourceLocation\.fromNamespaceAndPath\(\s*"hazennstuff"\s*,\s*"([a-z0-9_./-]+)"\s*\)'),
              re.compile(r'ResourceLocation\.parse\(\s*"hazennstuff:([a-z0-9_./-]+)"\s*\)'),
          ]

          mappings = []
          class_path = {}
          unresolved = []
          for field, cls in regs:
              p, fqcn = resolve_type(cls, reg_path, raw_reg)
              assert p is not None, f'{cls}: registry import resolution did not resolve local source ({fqcn})'
              src = text(p)
              class_path[cls] = p
              ids = []
              for rp in rl_patterns:
                  ids.extend(rp.findall(src))
              preferred = []
              for m in re.finditer(
                  r'(?:ID|SPELL_ID|spellId|spellID)\s*=\s*ResourceLocation\.fromNamespaceAndPath\(\s*(?:HazenNStuff\.MOD_ID|"hazennstuff")\s*,\s*"([a-z0-9_./-]+)"\s*\)',
                  src,
              ):
                  preferred.append(m.group(1))
              for m in re.finditer(
                  r'getSpellResource\s*\([^)]*\)\s*\{.{0,500}?ResourceLocation\.fromNamespaceAndPath\(\s*(?:HazenNStuff\.MOD_ID|"hazennstuff")\s*,\s*"([a-z0-9_./-]+)"\s*\)',
                  src,
                  flags=re.S,
              ):
                  preferred.append(m.group(1))
              pool = list(dict.fromkeys(preferred or ids))
              if len(pool) != 1:
                  unresolved.append((field, cls, fqcn, str(p.relative_to(ROOT)), pool))
                  continue
              mappings.append((field, cls, pool[0], fqcn, str(p.relative_to(ROOT))))

          if unresolved:
              emit('UNRESOLVED_ID_MAPPINGS')
              for row in unresolved:
                  emit(' | '.join(map(str, row)))
              Path('hazennstuff-1.4.0.14-source-pin-audit.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
              raise AssertionError(f'unresolved/ambiguous spell ids for {len(unresolved)} classes')
          assert len(mappings) == 38
          assert len({m[2] for m in mappings}) == 38, 'spell ids are not unique'

          emit('FIELD_CLASS_ID_MAP')
          for field, cls, sid, fqcn, path in mappings:
              emit(f'{field} -> {fqcn} -> {NS}:{sid} | {path}')
          emit()

          gate_names = ('allowCrafting', 'isEnabled', 'canBeCraftedBy', 'allowLooting')
          gate_rows = []
          for field, cls, sid, fqcn, path in mappings:
              chain = []
              declarations = []
              p = class_path[cls]
              seen_paths = set()
              while p is not None and p not in seen_paths:
                  seen_paths.add(p)
                  src = text(p)
                  owner = p.stem
                  chain.append(owner)
                  for g in gate_names:
                      if re.search(r'\b' + re.escape(g) + r'\s*\(', src):
                          literal = '?'
                          mm = re.search(
                              r'\b' + re.escape(g) + r'\s*\([^)]*\)\s*\{.{0,700}?return\s+(true|false)\s*;',
                              src,
                              flags=re.S,
                          )
                          if mm:
                              literal = mm.group(1)
                          declarations.append(f'{owner}.{g}={literal}')
                  m = re.search(r'\bclass\s+' + re.escape(owner) + r'\s+extends\s+([\w.]+)', src)
                  if not m:
                      break
                  parent_name = m.group(1)
                  parent_path, parent_fqcn = resolve_type(parent_name, p, src)
                  if parent_path is None:
                      chain.append(parent_fqcn)
                      break
                  p = parent_path
              gate_rows.append((sid, ' -> '.join(chain), ', '.join(declarations) if declarations else '<provider-no-override>'))

          emit('PROVIDER_ANCESTRY_AND_GATES')
          for sid, chain, declarations in gate_rows:
              emit(f'{NS}:{sid} | ancestry={chain} | gates={declarations}')
          emit()

          init_surface = active_reg.split('public static void register(IEventBus eventBus)', 1)[0]
          branch_hits = re.findall(r'\b(if|switch|for|while)\s*\(', init_surface)
          assert not branch_hits, f'registry control-flow found: {branch_hits}'
          emit('REGISTRY_GATES')
          emit('registry_control_flow_count=0')
          emit()

          tomls = list(dict.fromkeys(
              list((ROOT / 'src/main/resources').rglob('*mods.toml'))
              + list((ROOT / 'src/main/resources').rglob('neoforge.mods.toml'))
          ))
          emit('METADATA_FILES')
          if not tomls:
              emit('<none>')
          for p in tomls:
              emit(str(p.relative_to(ROOT)))
              current = None
              deps = []
              for line in text(p).splitlines():
                  st = line.strip()
                  if st.startswith('[[dependencies.'):
                      if current:
                          deps.append(current)
                      current = {}
                  elif current is not None and '=' in st and not st.startswith('#'):
                      k, v = st.split('=', 1)
                      k = k.strip(); v = v.strip().strip('"')
                      if k in {'modId','type','versionRange','ordering','side','reason'}:
                          current[k] = v
              if current:
                  deps.append(current)
              for dep in deps:
                  emit('dependency=' + json.dumps(dep, sort_keys=True, ensure_ascii=False))
          emit()

          all_text_paths = [
              p for p in ROOT.rglob('*')
              if p.is_file() and p.suffix.lower() in {'.java','.json','.toml','.mcmeta','.txt'}
          ]
          structured_suffixes = {'.json','.toml','.mcmeta'}
          emit('OBJECT_REFERENCE_SURFACE')
          for field, cls, sid, fqcn, path in mappings:
              needles = {sid, f'{NS}:{sid}'}
              structured = []
              java_refs = []
              own = class_path[cls]
              for p in all_text_paths:
                  if p == reg_path or p == own:
                      continue
                  try:
                      src = text(p)
                  except UnicodeDecodeError:
                      continue
                  if any(n in src for n in needles):
                      rel = str(p.relative_to(ROOT))
                      if p.suffix.lower() in structured_suffixes:
                          structured.append(rel)
                      elif p.suffix.lower() == '.java':
                          java_refs.append(rel)
              structured = sorted(set(structured))
              java_refs = sorted(set(java_refs))
              emit(f'{NS}:{sid} | structured={len(structured)} | java={len(java_refs)}')
              for rel in structured:
                  emit(f'  structured_ref={rel}')
              for rel in java_refs:
                  emit(f'  java_ref={rel}')
          emit()

          emit('RELEVANT_RESOURCE_PATHS')
          for p in sorted((ROOT / 'src/main/resources').rglob('*')):
              if p.is_file():
                  rel = str(p.relative_to(ROOT))
                  low = rel.lower()
                  if any(k in low for k in ('loot', 'spell', 'school', 'focus', 'recipe', 'trade')):
                      emit(rel)
          emit()

          java_files = list(JAVA.rglob('*.java'))
          emit('CONFIG_AND_ELIGIBILITY_REFERENCES')
          config_paths = [p for p in java_files if 'config' in p.name.lower() or 'config' in str(p.parent).lower()]
          for p in sorted(config_paths):
              src = text(p)
              hits = []
              for field, cls, sid, fqcn, path in mappings:
                  if field in src or cls in src or sid in src:
                      hits.append(sid)
              if hits:
                  emit(f'{p.relative_to(ROOT)} | ids={",".join(sorted(set(hits)))}')
          emit()

          out = Path('hazennstuff-1.4.0.14-source-pin-audit.txt')
          out.write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload clean-room audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazennstuff-1.4.0.14-source-pin-audit
          path: hazennstuff-1.4.0.14-source-pin-audit.txt
          if-no-files-found: ignore
