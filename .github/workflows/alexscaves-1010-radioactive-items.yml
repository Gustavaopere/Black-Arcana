name: Alex's Caves 1.0.10 Radioactive item and block item discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_radioactive_items_probe.py'
      - 'docs/qa/alexscaves_1010_radioactive_block_bindings_probe.py'
      - '.github/workflows/alexscaves-1010-radioactive-items.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RADIOACTIVE-ITEMS-1.0.10.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_radioactive_items_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_radioactive_items_probe.py
          python3 docs/qa/alexscaves_1010_radioactive_items_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/radioactive-items
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/radioactive-items/publisher.jar
      - name: Project three exact item outer classes and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_radioactive_items_probe.py --jar build/radioactive-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-items/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_radioactive_items_probe.py --jar build/radioactive-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-items/replay.json
          cmp build/radioactive-items/report.json build/radioactive-items/replay.json
          test "$(wc -c < build/radioactive-items/report.json)" -eq 232851
          echo 'b8fd8880d0f888ee137a436ec0aa81ea7916c6e6883acc0237d2915525499c97  build/radioactive-items/report.json' | sha256sum -c -
      - name: Project and replay block item binding candidates
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_radioactive_block_bindings_probe.py
          python3 docs/qa/alexscaves_1010_radioactive_block_bindings_probe.py --self-test
          python3 docs/qa/alexscaves_1010_radioactive_block_bindings_probe.py --jar build/radioactive-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-items/bindings.json
          python3 docs/qa/alexscaves_1010_radioactive_block_bindings_probe.py --jar build/radioactive-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-items/bindings-replay.json
          cmp build/radioactive-items/bindings.json build/radioactive-items/bindings-replay.json
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radioactive-items
          path: |
            build/radioactive-items/report.json
            build/radioactive-items/bindings.json
          if-no-files-found: warn
          retention-days: 14
