name: Alex's Caves 1.0.10 Ice Cream Scoop variants milk cure and inherited engine discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-ice-cream-scoop-cure.yml'
      - 'docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_destroyed_item_engine_reference.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_ice_cream_scoop_cure_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and scope filters
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py
          python3 docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py --self-test
      - name: Download exact official NeoForge 21.1.250 server installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ice-cream-scoop-cure
          cd build/ice-cream-scoop-cure
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "$base/neoforge-21.1.250-installer.jar" -o installer.jar
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 60 "$base/neoforge-21.1.250-installer.jar.sha256" -o installer.jar.sha256
          actual="$(sha256sum installer.jar | cut -d' ' -f1)"
          expect="$(head -c 64 installer.jar.sha256)"
          [[ "$expect" =~ ^[0-9a-fA-F]{64}$ ]]
          test "$actual" = "${expect,,}"
          test "$actual" = '0e47a91ba2139a8db4bf7627af081f7b5789b508bb039ee8dea1272b79693d60'
          echo "NEOFORGE_EXACT_INSTALLER_SHA256 $actual"
          unzip -tq installer.jar
      - name: Materialize publisher-exact server/SRG distributions (not a running game)
        shell: bash
        run: |
          set -euo pipefail
          cd build/ice-cream-scoop-cure
          java -jar installer.jar --installServer > install.log 2>&1 || {
            echo "::error::NEOFORGE_211250_INSTALL_SERVER_FAILED"
            tail -n 80 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Fetch official universal artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/ice-cream-scoop-cure
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250'
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "$base/neoforge-21.1.250-universal.jar" -o universal.jar
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$base/neoforge-21.1.250-universal.jar.sha256" -o universal.jar.sha256
          unzip -tq universal.jar
      - name: Download exact publisher artifact
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/ice-cream-scoop-cure/publisher.jar
      - name: Inspect Ice Cream Scoop variants, milk cure and projectile boundaries
        run: |
          python3 docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py \
            --installer build/ice-cream-scoop-cure/installer.jar \
            --server build/ice-cream-scoop-cure/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/ice-cream-scoop-cure/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/ice-cream-scoop-cure/universal.jar \
            --publisher build/ice-cream-scoop-cure/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/ice-cream-scoop-cure/report.json
      - name: Reproduce the same discovery report independently
        run: |
          python3 docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py \
            --installer build/ice-cream-scoop-cure/installer.jar \
            --server build/ice-cream-scoop-cure/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/ice-cream-scoop-cure/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/ice-cream-scoop-cure/universal.jar \
            --publisher build/ice-cream-scoop-cure/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/ice-cream-scoop-cure/report-replay.json
          cmp build/ice-cream-scoop-cure/report.json build/ice-cream-scoop-cure/report-replay.json
          test "$(wc -c < build/ice-cream-scoop-cure/report.json)" = 1066455
          echo 'b839c6a00f19fe9d044ff6af8dff3a5c22e9b4e041aedde27d5d318fc345fd8f  build/ice-cream-scoop-cure/report.json' | sha256sum -c -
      - name: Inspect acquisition data and delegated removal and projectile state
        run: |
          for output in acquisition-delegation acquisition-delegation-replay; do
            python3 docs/qa/alexscaves_1010_ice_cream_scoop_cure_probe.py \
              --schema 2 \
              --installer build/ice-cream-scoop-cure/installer.jar \
              --server build/ice-cream-scoop-cure/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
              --srg build/ice-cream-scoop-cure/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
              --universal build/ice-cream-scoop-cure/universal.jar \
              --publisher build/ice-cream-scoop-cure/publisher.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output "build/ice-cream-scoop-cure/$output.json"
          done
          cmp build/ice-cream-scoop-cure/acquisition-delegation.json build/ice-cream-scoop-cure/acquisition-delegation-replay.json
          sha256sum build/ice-cream-scoop-cure/acquisition-delegation.json
      - name: Archive bounded discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ice-cream-scoop-cure
          path: |
            build/ice-cream-scoop-cure/report.json
            build/ice-cream-scoop-cure/acquisition-delegation.json
          if-no-files-found: warn
          retention-days: 14
