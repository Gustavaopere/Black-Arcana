name: Alex's Caves 1.0.10 exact damage consumer bytecode

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_damage_consumer_probe.py'
      - 'docs/qa/alexscaves_1010_damage_consumer_probe_test.py'
      - '.github/workflows/alexscaves-1010-damage-consumers.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/**'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_damage_consumer_probe.py'
      - 'docs/qa/alexscaves_1010_damage_consumer_probe_test.py'
      - '.github/workflows/alexscaves-1010-damage-consumers.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/**'

permissions:
  contents: read

jobs:
  exact_damage_consumer_bytecode:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic parser and fail-closed regression
        run: python3 docs/qa/alexscaves_1010_damage_consumer_probe_test.py -v
      - name: Fetch exact publisher binary
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Inspect SHA-exact factory and direct callsite bytecode
        run: |
          python3 docs/qa/alexscaves_1010_damage_consumer_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/damage-consumer-evidence.json
      - name: Upload bounded observed evidence
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-damage-consumers
          path: build/alexscaves-1010/damage-consumer-evidence.json
          if-no-files-found: error
          retention-days: 14
