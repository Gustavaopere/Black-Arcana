name: Alex's Caves 1.0.10 Double Stab native causal audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-double-stab-causal.yml'
      - 'docs/qa/alexscaves_1010_double_stab_causal_probe.py'
      - 'docs/qa/alexscaves_1010_double_stab_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_double_stab_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DOUBLE-STAB-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/double-stab.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-double-stab-causal.yml'
      - 'docs/qa/alexscaves_1010_double_stab_causal_probe.py'
      - 'docs/qa/alexscaves_1010_double_stab_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_double_stab_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DOUBLE-STAB-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/double-stab.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
permissions:
  contents: read
jobs:
  double_stab_static:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run fail-closed synthetic tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_double_stab_causal_probe.py docs/qa/alexscaves_1010_double_stab_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_double_stab_causal_probe_test.py -v
          if test -f docs/qa/alexscaves_1010_double_stab_causal_cards_test.py; then
            python3 docs/qa/alexscaves_1010_double_stab_causal_cards_test.py -v
          fi
      - name: Obtain SHA-pinned publisher JAR
        run: |
          mkdir -p build/alexscaves-double-stab
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-double-stab/alexscaves-1.0.10.jar
      - name: Verify exact native producer, spawned entity and damage consumers
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DOUBLE-STAB-CAUSAL-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_double_stab_causal_probe.py \
              --jar build/alexscaves-double-stab/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DESOLATE-DAGGER-CONTRACTS-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --seal "$SEAL" \
              --output build/alexscaves-double-stab/native.json
          else
            python3 docs/qa/alexscaves_1010_double_stab_causal_probe.py \
              --jar build/alexscaves-double-stab/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DESOLATE-DAGGER-CONTRACTS-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-double-stab/native.json
          fi
      - name: Verify canonical indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-double-stab-native
          path: build/alexscaves-double-stab/native.json
          if-no-files-found: ignore
          retention-days: 14
