name: Alex's Caves 1.0.10 Bonking native death-loot causal graph
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bonking-causal.yml'
      - 'docs/qa/alexscaves_1010_bonking_causal_probe.py'
      - 'docs/qa/alexscaves_1010_bonking_causal_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BONKING-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bonking.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bonking-causal.yml'
      - 'docs/qa/alexscaves_1010_bonking_causal_probe.py'
      - 'docs/qa/alexscaves_1010_bonking_causal_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BONKING-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bonking.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
permissions:
  contents: read
jobs:
  bonking_causal_static:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate negative regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_bonking_causal_probe.py docs/qa/alexscaves_1010_bonking_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_bonking_causal_probe_test.py -v
      - name: Get SHA-exact publisher 1.0.10
        run: |
          mkdir -p build/bonking-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/bonking-causal/alexscaves-1.0.10.jar
      - name: Verify native death event graph and equipment chance restore
        run: |
          SNAP='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BONKING-CAUSAL-1.0.10.json'
          if test -f "$SNAP"; then
            python3 docs/qa/alexscaves_1010_bonking_causal_probe.py --jar build/bonking-causal/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BONKING-1.0.10.json' --javap "$JAVA_HOME/bin/javap" \
              --snapshot "$SNAP" --output build/bonking-causal/evidence.json
          else
            python3 docs/qa/alexscaves_1010_bonking_causal_probe.py --jar build/bonking-causal/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BONKING-1.0.10.json' --javap "$JAVA_HOME/bin/javap" \
              --output build/bonking-causal/evidence.json
          fi
      - name: Ensure catalog indexes remain canonical
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bonking-native-causal-evidence
          path: build/bonking-causal/evidence.json
          retention-days: 14
          if-no-files-found: ignore
