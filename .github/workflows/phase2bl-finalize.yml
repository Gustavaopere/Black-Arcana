name: Phase 2BL Goety addon exact reconciliation

on:
  push:
    branches:
      - docs/magic-catalog-phase2bl-goety-addons-exact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/magic-catalog-phase2bl-goety-addons-exact
          fetch-depth: 0
      - name: Apply Phase 2BL durable docs
        run: python .github/phase2bl_finalize.py
      - name: Validate durable postconditions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '1316 semantic magic objects' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '| [Goety Iron]' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '| [Goety Cataclysm]' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F 'Canonical provider-component coverage after Phase 2BL: 60/100 = 60%.' wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md
          grep -F 'NON-MERGE PR #205' wiki/modpack-catalog/providers/goety-iron/README.md
          grep -F 'NON-MERGE PR #206' wiki/modpack-catalog/providers/goety-cataclysm/README.md
          test -z "$(git diff --name-only | grep -E '^src/' || true)"
      - name: Commit durable docs and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/modpack-catalog SOURCES.md THIRD_PARTY_NOTICES.md
          git commit -m 'docs: close exact Goety addon semantic inventories'
          rm -f .github/phase2bl_finalize.py .github/workflows/phase2bl-finalize.yml
          git add -A .github
          git commit -m 'ci: remove Phase 2BL reconciliation harness'
          git push origin HEAD:docs/magic-catalog-phase2bl-goety-addons-exact
