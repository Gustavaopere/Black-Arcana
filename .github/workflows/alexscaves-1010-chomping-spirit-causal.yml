name: Alex's Caves 1.0.10 Chomping Spirit exact native causal audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-chomping-spirit-causal.yml'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_probe.py'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CHOMPING-SPIRIT-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/chomping-spirit.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-chomping-spirit-causal.yml'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_probe.py'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_chomping_spirit_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CHOMPING-SPIRIT-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/chomping-spirit.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
permissions:
  contents: read
jobs:
  chomping_spirit_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run fail-closed synthetic regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_chomping_spirit_causal_probe.py docs/qa/alexscaves_1010_chomping_spirit_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_chomping_spirit_causal_probe_test.py -v
          if test -f docs/qa/alexscaves_1010_chomping_spirit_causal_cards_test.py; then
            python3 docs/qa/alexscaves_1010_chomping_spirit_causal_cards_test.py -v
          fi
      - name: Retrieve installed exact publisher JAR
        run: |
          mkdir -p build/chomping-spirit-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/chomping-spirit-causal/alexscaves-1.0.10.jar
      - name: Reconcile original Spirit Dinosaur contracts and Chomping Spirit JVM
        run: |
          SNAP='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CHOMPING-SPIRIT-CAUSAL-1.0.10.json'
          if test -f "$SNAP"; then
            python3 docs/qa/alexscaves_1010_chomping_spirit_causal_probe.py \
              --jar build/chomping-spirit-causal/alexscaves-1.0.10.jar \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SPIRIT-DINOSAUR-CONTRACT-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --snapshot "$SNAP" \
              --output build/chomping-spirit-causal/causal.json > build/chomping-spirit-causal/result.txt
          else
            python3 docs/qa/alexscaves_1010_chomping_spirit_causal_probe.py \
              --jar build/chomping-spirit-causal/alexscaves-1.0.10.jar \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SPIRIT-DINOSAUR-CONTRACT-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/chomping-spirit-causal/causal.json > build/chomping-spirit-causal/result.txt
          fi
          python3 -c 'import json; d=json.load(open("build/chomping-spirit-causal/causal.json")); print("CHOMPING_CAUSAL_SUMMARY="+json.dumps({"owner_method_counts":[x["declared_method_count"] for x in d["owner_method_rosters"]],"selected":[{"owner":x["owner"],"name":x["name"],"instructions":x["instruction_count"],"branches":len(x["verified_direct_branches"]),"switches":x["verified_switch_tables"]} for x in d["core_consumers"]],"direct_class_tokens":d["direct_class_token_CHOMPING_SPIRIT"],"own_nbt":d["spirit_own_nbt_overrides"]},ensure_ascii=False,separators=(",",":")))'
      - name: Check catalog ledger and indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-chomping-spirit-causal
          path: |
            build/chomping-spirit-causal/causal.json
            build/chomping-spirit-causal/result.txt
          if-no-files-found: ignore
          retention-days: 14
