name: Alex's Caves 1.0.10 Nuclear exact numeric branches

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_numeric_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_numeric_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-NUMERIC-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - '.github/workflows/alexscaves-1010-nuclear-numeric.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_numeric_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_numeric_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-NUMERIC-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - '.github/workflows/alexscaves-1010-nuclear-numeric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_nuclear_numeric:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run negative selected-bytecode regression tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_nuclear_numeric_probe.py
          python3 docs/qa/alexscaves_1010_nuclear_numeric_probe_test.py -v
      - name: Download publisher JAR (exact modpack 1.0.10)
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Compare exact selected methods with publisher JAR
        run: |
          python3 docs/qa/alexscaves_1010_nuclear_numeric_probe.py --jar build/alexscaves-1010/alexscaves-1.0.10.jar --javap "$JAVA_HOME/bin/javap" --output build/alexscaves-1010/nuclear-numeric.json --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-NUMERIC-1.0.10.json'
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-nuclear-numeric
          path: build/alexscaves-1010/nuclear-numeric.json
          if-no-files-found: error
          retention-days: 14
