name: Alex's Caves 1.0.10 Quarry Smasher, Radiant Essence and radiation-removing foods discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_quarry_radiant_food_probe.py'
      - '.github/workflows/alexscaves-1010-quarry-radiant-food.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-QUARRY-RADIANT-FOOD-1.0.10.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_quarry_radiant_food_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_quarry_radiant_food_probe.py
          python3 docs/qa/alexscaves_1010_quarry_radiant_food_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/quarry-radiant-food
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/quarry-radiant-food/publisher.jar
      - name: Project three exact item outer classes and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_quarry_radiant_food_probe.py --jar build/quarry-radiant-food/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/quarry-radiant-food/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_quarry_radiant_food_probe.py --jar build/quarry-radiant-food/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/quarry-radiant-food/replay.json
          cmp build/quarry-radiant-food/report.json build/quarry-radiant-food/replay.json
          test "$(wc -c < build/quarry-radiant-food/report.json)" -eq 156541
          echo '2bd27341d274f749e8c80b0a0e77e6f37571a92545293d910e7b47deb1cdb945  build/quarry-radiant-food/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarry-radiant-food
          path: build/quarry-radiant-food/report.json
          if-no-files-found: warn
          retention-days: 14
