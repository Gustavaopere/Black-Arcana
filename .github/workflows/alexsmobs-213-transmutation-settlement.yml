name: Alexs Mobs 2.1.13 transmutation settlement static audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-settlement.yml'
      - 'docs/qa/alexsmobs_213_transmutation_settlement_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_settlement_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-settlement-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-SETTLEMENT-2.1.13.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-settlement.yml'
      - 'docs/qa/alexsmobs_213_transmutation_settlement_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_settlement_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-settlement-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-SETTLEMENT-2.1.13.json'
permissions:
  contents: read
jobs:
  transmutation_settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run 17 synthetic no-mutation tests
        run: |
          python3 -m py_compile \
            docs/qa/alexsmobs_213_transmutation_settlement_probe.py \
            docs/qa/alexsmobs_213_transmutation_settlement_probe_test.py
          python3 docs/qa/alexsmobs_213_transmutation_settlement_probe_test.py -v
      - name: Download historical physically matched publisher JAR (SHA-bound)
        run: |
          set -euo pipefail
          mkdir -p build/alexsmobs-213-settlement
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856498/alexs-mobs-continued-1635121-8856498.jar' \
            --output build/alexsmobs-213-settlement/alexsmobs-2.1.13.jar
          printf '%s  %s\n' \
            'eef0b4d36f1e40292b23f90ad3052e2e9aace3a33c6a48c65b8b5f2b061ab6c8' \
            'build/alexsmobs-213-settlement/alexsmobs-2.1.13.jar' \
            | sha256sum -c -
          test "$(stat -c '%s' build/alexsmobs-213-settlement/alexsmobs-2.1.13.jar)" = '27452738'
      - name: Analyze exact native transaction, menu lifecycle and persistence boundaries
        run: |
          set -euo pipefail
          PUBLISHER='build/alexsmobs-213-settlement/alexsmobs-2.1.13.jar'
          SEALED='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-C2S-2.1.13.json'
          SNAPSHOT='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-SETTLEMENT-2.1.13.json'
          if [[ -f "$SNAPSHOT" ]]; then
            python3 docs/qa/alexsmobs_213_transmutation_settlement_probe.py \
              --jar "$PUBLISHER" --javap "$JAVA_HOME/bin/javap" \
              --sealed "$SEALED" --snapshot "$SNAPSHOT" \
              --output build/alexsmobs-213-settlement/report.json
          else
            python3 docs/qa/alexsmobs_213_transmutation_settlement_probe.py \
              --jar "$PUBLISHER" --javap "$JAVA_HOME/bin/javap" \
              --sealed "$SEALED" \
              --output build/alexsmobs-213-settlement/report.json
          fi
      - name: Verify catalog links and certification counters unchanged
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexsmobs-213-transmutation-settlement-readonly
          path: build/alexsmobs-213-settlement/report.json
          if-no-files-found: ignore
          retention-days: 14
