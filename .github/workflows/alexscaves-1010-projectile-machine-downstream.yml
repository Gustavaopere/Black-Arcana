name: Alex's Caves 1.0.10 projectile and machine downstream discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_projectile_machine_downstream_probe.py'
      - '.github/workflows/alexscaves-1010-projectile-machine-downstream.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PROJECTILE-MACHINE-DOWNSTREAM-1.0.10.md'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_downstream:
    strategy:
      fail-fast: false
      matrix:
        group: [projectiles, machines]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_projectile_machine_downstream_probe.py
          python3 docs/qa/alexscaves_1010_projectile_machine_downstream_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/projectile-machine
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/projectile-machine/publisher.jar
      - name: Project and replay selected native entity and ancestor bodies
        run: |
          python3 docs/qa/alexscaves_1010_projectile_machine_downstream_probe.py --jar build/projectile-machine/publisher.jar --javap "$JAVA_HOME/bin/javap" --group ${{ matrix.group }} --output build/projectile-machine/report.json
          python3 docs/qa/alexscaves_1010_projectile_machine_downstream_probe.py --jar build/projectile-machine/publisher.jar --javap "$JAVA_HOME/bin/javap" --group ${{ matrix.group }} --output build/projectile-machine/replay.json
          cmp build/projectile-machine/report.json build/projectile-machine/replay.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: projectile-machine-${{ matrix.group }}
          path: build/projectile-machine/report.json
          if-no-files-found: warn
          retention-days: 14
