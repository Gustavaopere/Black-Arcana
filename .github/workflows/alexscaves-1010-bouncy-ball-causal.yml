name: Alex's Caves 1.0.10 Bouncy Ball causal reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bouncy-ball-causal.yml'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_probe.py'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bouncy-ball.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-bouncy-ball-causal.yml'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_probe.py'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_bouncy_ball_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/bouncy-ball.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**/INDEX.md'
permissions:
  contents: read
jobs:
  bouncy_ball_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and fail-closed negative regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_bouncy_ball_causal_probe.py docs/qa/alexscaves_1010_bouncy_ball_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_bouncy_ball_causal_probe_test.py -v
          python3 -m py_compile docs/qa/alexscaves_1010_bouncy_ball_causal_cards_test.py
          python3 docs/qa/alexscaves_1010_bouncy_ball_causal_cards_test.py -v
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/bouncy-ball-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/bouncy-ball-causal/alexscaves-1.0.10.jar
      - name: Recheck sealed Bouncy Ball JAR evidence
        run: |
          python3 docs/qa/alexscaves_1010_bouncy_ball_probe.py \
            --jar build/bouncy-ball-causal/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-1.0.10.json' \
            --output build/bouncy-ball-causal/parent.json > /dev/null
      - name: Reconcile full class rosters, exact branch edges and local NBT
        run: |
          SNAP='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-CAUSAL-1.0.10.json'
          if test -f "$SNAP"; then
            python3 docs/qa/alexscaves_1010_bouncy_ball_causal_probe.py \
              --jar build/bouncy-ball-causal/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-1.0.10.json' \
              --state 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-STATE-1.0.10.json' \
              --snapshot "$SNAP" \
              --output build/bouncy-ball-causal/causal.json
          else
            python3 docs/qa/alexscaves_1010_bouncy_ball_causal_probe.py \
              --jar build/bouncy-ball-causal/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOUNCY-BALL-1.0.10.json' \
              --state 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-STATE-1.0.10.json' \
              --output build/bouncy-ball-causal/causal.json
          fi
      - name: Check all generated catalog indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-bouncy-ball-causal-evidence
          path: build/bouncy-ball-causal/causal.json
          if-no-files-found: ignore
          retention-days: 14
