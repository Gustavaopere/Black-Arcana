name: Alex's Mobs 2.1.13 Transmutation Table C2S static audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-c2s.yml'
      - 'docs/qa/alexsmobs_213_transmutation_c2s_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_c2s_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-c2s-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-C2S-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexsmobs-213-transmutation-c2s.yml'
      - 'docs/qa/alexsmobs_213_transmutation_c2s_probe.py'
      - 'docs/qa/alexsmobs_213_transmutation_c2s_probe_test.py'
      - 'docs/qa/alexsmobs-213-transmutation-c2s-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-C2S-2.1.13.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-mobs-continued/actions/item-transmutation.md'
permissions:
  contents: read
jobs:
  alexsmobs_213_transmutation_c2s:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run 13 synthetic static fail-closed checks
        run: |
          python3 -m py_compile docs/qa/alexsmobs_213_transmutation_c2s_probe.py docs/qa/alexsmobs_213_transmutation_c2s_probe_test.py
          python3 docs/qa/alexsmobs_213_transmutation_c2s_probe_test.py -v
      - name: Fetch publisher JAR matching installed physical modlist
        run: |
          set -euo pipefail
          mkdir -p build/alexsmobs-213-c2s
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856498/alexs-mobs-continued-1635121-8856498.jar' \
            --output build/alexsmobs-213-c2s/alexsmobs-2.1.13.jar
          printf '%s  %s\n' 'eef0b4d36f1e40292b23f90ad3052e2e9aace3a33c6a48c65b8b5f2b061ab6c8' \
            'build/alexsmobs-213-c2s/alexsmobs-2.1.13.jar' | sha256sum -c -
          test "$(stat -c '%s' build/alexsmobs-213-c2s/alexsmobs-2.1.13.jar)" = '27452738'
      - name: Replay exact native sender receiver menu and settlement references
        run: |
          set -euo pipefail
          SNAPSHOT='wiki/modpack-catalog/providers/✅-alexs-mobs-continued/EXACT-TRANSMUTATION-C2S-2.1.13.json'
          if [[ -f "$SNAPSHOT" ]]; then
            python3 docs/qa/alexsmobs_213_transmutation_c2s_probe.py \
              --jar build/alexsmobs-213-c2s/alexsmobs-2.1.13.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --snapshot "$SNAPSHOT" --output build/alexsmobs-213-c2s/report.json
          else
            python3 docs/qa/alexsmobs_213_transmutation_c2s_probe.py \
              --jar build/alexsmobs-213-c2s/alexsmobs-2.1.13.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --print-candidate --output build/alexsmobs-213-c2s/report.json
          fi
      - name: Verify provider catalog and perk-ready indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexsmobs-213-transmutation-c2s-readonly
          path: build/alexsmobs-213-c2s/report.json
          if-no-files-found: ignore
          retention-days: 14
