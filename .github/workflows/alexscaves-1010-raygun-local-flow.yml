name: Alex's Caves 1.0.10 Raygun JVM local slot census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-local-flow.yml'
      - 'docs/qa/alexscaves_1010_raygun_local_flow_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_local_flow_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-local-flow-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-LOCAL-FLOW-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-local-flow.yml'
      - 'docs/qa/alexscaves_1010_raygun_local_flow_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_local_flow_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-local-flow-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-LOCAL-FLOW-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'

permissions:
  contents: read

jobs:
  exact_local_flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed slot and manifest regression tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_local_flow_probe.py docs/qa/alexscaves_1010_raygun_local_flow_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_local_flow_probe_test.py -v
      - name: Download exact Alex's Caves 1.0.10 publisher artifact
        run: |
          mkdir -p build/alexscaves-1010-raygun-locals
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010-raygun-locals/alexscaves-1.0.10.jar
      - name: Collect and SHA-seal bounded JVM slot observations
        run: |
          SEAL=wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-LOCAL-FLOW-1.0.10.json
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_raygun_local_flow_probe.py \
              --jar build/alexscaves-1010-raygun-locals/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-1010-raygun-locals/local-evidence.json
          else
            echo 'UNSEALED LOCAL SLOT DISCOVERY: do not merge.'
            python3 docs/qa/alexscaves_1010_raygun_local_flow_probe.py \
              --jar build/alexscaves-1010-raygun-locals/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-1010-raygun-locals/local-evidence.json
          fi
          python3 -m json.tool build/alexscaves-1010-raygun-locals/local-evidence.json
      - name: Archive selected evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-jvm-locals
          path: build/alexscaves-1010-raygun-locals/local-evidence.json
          if-no-files-found: ignore
          retention-days: 14
