name: audit-bosses-of-mass-destruction-1.3.3

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/bomd
          cd build/audit/bomd
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/bosses-of-mass-destruction-forge-941573/8448640/bosses-of-mass-destruction-forge-941573-8448640.jar" \
            -o BOMD-NeoForge-1.21-1.3.3.jar
          test -s BOMD-NeoForge-1.21-1.3.3.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          EXPECTED_SHA1="446ff63afb858ad49149d24b72541739de83d38d"
          ACTUAL_SHA1="$(sha1sum BOMD-NeoForge-1.21-1.3.3.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum BOMD-NeoForge-1.21-1.3.3.jar | awk '{print $1}')"
          BYTES="$(stat -c %s BOMD-NeoForge-1.21-1.3.3.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=941573/8448640"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Extract bounded archive inventory
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          jar tf BOMD-NeoForge-1.21-1.3.3.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib,re,zipfile
          jar=pathlib.Path('BOMD-NeoForge-1.21-1.3.3.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              item_classes=[n for n in classes if re.search(r'/(item|items)/',n,re.I) and '$' not in n]
              block_classes=[n for n in classes if re.search(r'/(block|blocks)/',n,re.I) and '$' not in n]
              semantic=[n for n in names if re.search(r'summon|altar|monolith|soul.?star|void.?blossom|obsidilith|gauntlet|lich|portal|ritual|magic',n,re.I)]
              data=[n for n in names if n.startswith('data/')]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\n'
                  f'item_classes={len(item_classes)}\nblock_classes={len(block_classes)}\n'
                  f'semantic_paths={len(semantic)}\ndata_paths={len(data)}\n',encoding='utf-8')
              pathlib.Path('item-classes.txt').write_text('\n'.join(item_classes)+'\n',encoding='utf-8')
              pathlib.Path('block-classes.txt').write_text('\n'.join(block_classes)+'\n',encoding='utf-8')
              pathlib.Path('semantic-paths.txt').write_text('\n'.join(semantic)+'\n',encoding='utf-8')
              pathlib.Path('data-paths.txt').write_text('\n'.join(data)+'\n',encoding='utf-8')
          PY

      - name: Dump all provider class signatures and bytecode
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          : > javap-all-signatures.txt
          : > javap-all-bytecode.txt
          grep '\.class$' jar-entries.txt | while IFS= read -r path; do
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all-signatures.txt
            javap -classpath BOMD-NeoForge-1.21-1.3.3.jar -p -s "$cls" >> javap-all-signatures.txt 2>&1 || true
            echo "===== $cls =====" >> javap-all-bytecode.txt
            javap -classpath BOMD-NeoForge-1.21-1.3.3.jar -p -c -constants "$cls" >> javap-all-bytecode.txt 2>&1 || true
          done

      - name: Index exact player activation surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('javap-all-signatures.txt').read_text(encoding='utf-8',errors='replace')
          sections=re.split(r'^===== (.+?) =====$',text,flags=re.M)
          pats={
            'use':re.compile(r'\buse\s*\('),
            'useOn':re.compile(r'\buseOn\s*\('),
            'releaseUsing':re.compile(r'\breleaseUsing\s*\('),
            'onUseTick':re.compile(r'\bonUseTick\s*\('),
            'finishUsingItem':re.compile(r'\bfinishUsingItem\s*\('),
            'interactLivingEntity':re.compile(r'\binteractLivingEntity\s*\('),
            'useItemOn':re.compile(r'\buseItemOn\s*\('),
            'entityInside':re.compile(r'\bentityInside\s*\('),
            'stepOn':re.compile(r'\bstepOn\s*\('),
            'neighborChanged':re.compile(r'\bneighborChanged\s*\('),
          }
          rows=[]
          for i in range(1,len(sections),2):
              cls,body=sections[i],sections[i+1]
              found=[n for n,p in pats.items() if p.search(body)]
              if found: rows.append((cls,','.join(found)))
          pathlib.Path('activation-index.txt').write_text(
              '\n'.join(f'{cls}\t{methods}' for cls,methods in rows)+'\n',encoding='utf-8')
          PY

      - name: Extract exact summon and supernatural seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          grep -nEi 'summon|spawn|altar|monolith|soul.?star|void.?lil|void.?blossom|obsidilith|gauntlet|lich|charged.?ender.?pearl|levitation|mob.?ward|addFreshEntity|InteractionResult|useOn|useItemOn|consume|shrink|discard' \
            javap-all-bytecode.txt > summon-action-seams.txt || true

      - name: Extract exact provider data and localization
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/bomd
          python3 - <<'PY'
          import json,pathlib,re,zipfile
          with zipfile.ZipFile('BOMD-NeoForge-1.21-1.3.3.jar') as z:
              names=sorted(z.namelist())
              rows=[]
              for name in names:
                  if not name.startswith('data/') or not name.endswith('.json'): continue
                  if any(x in name for x in ('/recipe/','/recipes/','/loot_table/','/loot_tables/','/advancement/','/advancements/','/tags/','/structure/')):
                      try:
                          data=json.loads(z.read(name))
                          compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                      except Exception as e:
                          compact='INVALID_JSON:'+type(e).__name__
                      rows.append((name,compact))
              pathlib.Path('provider-data-json.txt').write_text(
                  '\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
              sem=[(n,j) for n,j in rows if re.search(r'summon|altar|monolith|soul|void|obsid|gauntlet|lich|star|lily|pearl',n+' '+j,re.I)]
              pathlib.Path('semantic-data-json.txt').write_text(
                  '\n'.join(f'===== {n} =====\n{j}' for n,j in sem)+'\n',encoding='utf-8')
              for name in names:
                  if name.endswith('/lang/en_us.json'):
                      pathlib.Path('en-us.txt').write_bytes(z.read(name)); break
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: bosses-of-mass-destruction-1.3.3-exact-artifact-audit
          path: |
            build/audit/bomd/hashes.txt
            build/audit/bomd/inventory.txt
            build/audit/bomd/jar-entries.txt
            build/audit/bomd/item-classes.txt
            build/audit/bomd/block-classes.txt
            build/audit/bomd/semantic-paths.txt
            build/audit/bomd/data-paths.txt
            build/audit/bomd/javap-all-signatures.txt
            build/audit/bomd/javap-all-bytecode.txt
            build/audit/bomd/activation-index.txt
            build/audit/bomd/summon-action-seams.txt
            build/audit/bomd/provider-data-json.txt
            build/audit/bomd/semantic-data-json.txt
            build/audit/bomd/en-us.txt
          if-no-files-found: error
