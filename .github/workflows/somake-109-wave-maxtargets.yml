name: Somake 1.0.9 wave maxTargets native callsite scout (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-wave-maxtargets.yml'
      - 'docs/qa/somake_109_wave_maxtargets.py'
      - 'docs/qa/somake_109_wave_maxtargets_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/registry-1.0.9/funeral-bloom.md'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-RADIUS-CONSUMERS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cardinality_scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic scanner unit tests
        run: python3 docs/qa/somake_109_wave_maxtargets_test.py -v
      - name: Download and SHA-verify official publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-wave
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-wave/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-wave/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Run clean-room callsite and branch census
        run: |
          python3 docs/qa/somake_109_wave_maxtargets.py \
            --jar build/somake-wave/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-wave/evidence.json
      - name: Upload derived observations only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-wave-cardinality-scout
          path: build/somake-wave/evidence.json
          if-no-files-found: ignore
          retention-days: 14
