name: Alex's Caves 1.0.10 Solar Raygun exact static discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-solar-static.yml'
      - 'docs/qa/alexscaves_1010_solar_static_probe.py'
      - 'docs/qa/alexscaves_1010_solar_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-solar-static.yml'
      - 'docs/qa/alexscaves_1010_solar_static_probe.py'
      - 'docs/qa/alexscaves_1010_solar_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
permissions:
  contents: read
jobs:
  solar_exact_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Solar read-only fail-closed regression tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_solar_static_probe.py
          python3 docs/qa/alexscaves_1010_solar_static_probe_test.py -v
      - name: Fetch exact physical/publisher Alexs Caves Continued 1.0.10
        run: |
          mkdir -p build/alexscaves-solar-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-solar-1010/publisher.jar
      - name: Audit Solar tag, JVM consumer and charge path against exact JAR
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SOLAR-STATIC-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_solar_static_probe.py \
              --jar build/alexscaves-solar-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --seal "$SEAL" --output build/alexscaves-solar-1010/evidence.json
          else
            echo 'SOLAR_DISCOVERY_ONLY_NO_CERTIFICATION'
            python3 docs/qa/alexscaves_1010_solar_static_probe.py \
              --jar build/alexscaves-solar-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-solar-1010/evidence.json
          fi
      - name: Verify generated index consistency
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-solar-1010-bounded-discovery
          path: build/alexscaves-solar-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
