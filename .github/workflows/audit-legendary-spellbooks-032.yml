name: Legendary Spellbooks 0.3.2 physical binary discovery
on:
  push:
    branches:
      - 'audit/legendary-spellbooks-032-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce exact CurseForge-to-physical SHA and inspect registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile, urllib.request, subprocess, re
          want='bda5b1fbe50ad834a6a76ad36789743c1057ebf5'
          urls=[
            'https://cursemaven.com/curse/maven/legendary-spellbooks-1478875/8255715/legendary-spellbooks-1478875-8255715.jar',
            'https://mediafilez.forgecdn.net/files/8255/715/legendary_spellbooks-1.21.1%2Bneo-0.3.2.jar',
            'https://media.forgecdn.net/files/8255/715/legendary_spellbooks-1.21.1%2Bneo-0.3.2.jar',
          ]
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'legendary_spellbooks-0.3.2.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-binary-cleanroom'})
              with urllib.request.urlopen(req,timeout=75) as resp:
                data=resp.read(25000000)
              actual=hashlib.sha1(data).hexdigest()
              print('CANDIDATE_BYTES='+str(len(data))+' SHA1='+actual,flush=True)
              if actual==want:
                path.write_bytes(data)
                break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:200],flush=True)
          else:raise SystemExit('FAIL-CLOSED: no publisher archive matches physical SHA1')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('CERTIFIED_FILE_ID=8255715')
          print('CERTIFIED_BYTES='+str(len(data)))
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            items=z.namelist()
            meta=z.read('META-INF/neoforge.mods.toml').decode('utf8','replace')
            print('MODID_DECLARATION='+repr([x.strip() for x in meta.splitlines() if 'modId' in x][:5]))
            assert re.search(r'modId\s*=\s*["\x27]legendary_spellbooks',meta),'wrong mod'
          classes=[x[:-6].replace('/','.') for x in items if x.endswith('.class') and '$' not in x]
          regs=[x for x in classes if ('spellregistry' in x.lower() or 'spellregistr' in x.lower() or 'lsspell' in x.lower())]
          print('CANDIDATE_REGISTRARS='+repr(regs))
          for c in regs:
            if not ('regist' in c.lower()):continue
            p=subprocess.run(['javap','-c','-p','-classpath',str(path),c],capture_output=True,text=True,timeout=30)
            if p.returncode or 'AbstractSpell' not in p.stdout:continue
            print('REGISTRAR_CLASS='+c)
            for line in p.stdout.splitlines():
              if ('String ' in line or '// class ' in line or 'DeferredRegister' in line or 'SpellRegistry' in line or 'registerSpell' in line or 'static {};' in line or 'Mobs' in line):
                print('REG_BYTECODE='+line.strip()[:210])
          print('SPELL_CLASS_CANDIDATES='+repr([x for x in classes if x.lower().endswith('spell')][:80]))
          print('DISCOVERY_ONLY_NOT_RUNTIME=TRUE')
          PY
