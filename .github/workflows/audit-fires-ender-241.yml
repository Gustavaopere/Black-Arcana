name: Fire's Ender Expansion 2.4.1 SHA-exact spell registry audit
on:
  push:
    branches:
      - 'audit/fires-ender-expansion-241-*'
permissions:
  contents: read
jobs:
  physical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate official CurseForge 2.4.1 by CurseMaven metadata and SHA-verify physical version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request,re,zipfile,pathlib,xml.etree.ElementTree as ET
          exp="da87a4a0c926dd75236766584cddbae69c6aeff7"
          name="firesenderexpansion-2.4.1.jar"
          slug="fires-ender-expansion-1245989"
          base="https://cursemaven.com/curse/maven/"+slug+"/"
          def read(url,timeout=35):
            req=urllib.request.Request(url,headers={"User-Agent":"Black-Arcana-static-physical-audit/1"})
            with urllib.request.urlopen(req,timeout=timeout) as res:return res.read(12000000)
          verified_fileid="8167304"
          urls=[
            "https://cursemaven.com/curse/maven/"+slug+"/"+verified_fileid+"/"+slug+"-"+verified_fileid+".jar",
            "https://mediafilez.forgecdn.net/files/8167/304/"+name,
            "https://media.forgecdn.net/files/8167/304/"+name,
          ]
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/name
          got=False
          for url in urls:
            try:
              buf=read(url,timeout=65)
              sha=hashlib.sha1(buf).hexdigest()
              print("CANDIDATE_URL="+url+" BYTES="+str(len(buf))+" SHA1="+sha,flush=True)
              if sha!=exp:continue
              out.write_bytes(buf)
              with zipfile.ZipFile(out) as z:assert z.testzip() is None
              print("PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS",flush=True)
              print("CERTIFIED_FILE_ID="+verified_fileid,flush=True)
              print("CERTIFIED_BYTES="+str(len(buf)),flush=True)
              with open(os.environ["GITHUB_ENV"],"a") as env:env.write("EXACT_FEE_JAR="+str(out)+"\nEXACT_FEE_ID="+verified_fileid+"\nEXACT_FEE_BYTES="+str(len(buf))+"\n")
              got=True;break
            except Exception as exc:print("CANDIDATE_ERROR="+repr(exc)[:180],flush=True)
          if not got:raise SystemExit("FAIL-CLOSED: SHA1-exact JAR not located; source pin is not physical registry proof")
          PY
      - name: Inspect compiled registry and 11 spell IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,zipfile,subprocess
          jar=os.environ["EXACT_FEE_JAR"]
          def java(cls):
            result=subprocess.run(["javap","-p","-c","-classpath",jar,cls],text=True,capture_output=True,timeout=30)
            assert result.returncode==0,(cls,result.stderr[:180])
            return result.stdout
          with zipfile.ZipFile(jar) as z:
            names=z.namelist()
            print("BINARY_CLASS_COUNT="+str(sum(s.endswith(".class") for s in names)))
            for p in names:
              if p.endswith("neoforge.mods.toml"):
                txt=z.read(p).decode("utf8",errors="replace")
                print("MOD_IDS="+repr(re.findall(r'modId\s*=\s*["\x27]([^"\x27]+)',txt)))
            print("SPELL_CLASS_FILES="+repr([s for s in names if s.endswith("Spell.class") and s.startswith("net/fireofpower/firesenderexpansion/spells/")]))
          main=java("net.fireofpower.firesenderexpansion.FiresEnderExpansion")
          spells=java("net.fireofpower.firesenderexpansion.registries.SpellRegistries")
          print("ENTRYPOINT_REGISTER="+str("SpellRegistries.register:" in main))
          print("BOOTSTRAP_START")
          for line in spells.splitlines():
            if line.strip().startswith("static {};"):
              print("STATIC_INIT_BEGIN")
            if "// class net/fireofpower/firesenderexpansion/spells/" in line or "registerSpell:" in line or "SpellRegistry.SPELL_REGISTRY_KEY:" in line or "DeferredRegister.create:" in line or "DeferredRegister.register:" in line:
              print("REGISTRY_BC="+line.strip()[:220])
          print("BOOTSTRAP_END")
          print("DISCOVERY_ONLY=TRUE")
          PY
      - name: Assert 11 unconditional compiled Iron's spell registrations with exact IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,zipfile
          jar=os.environ["EXACT_FEE_JAR"]
          expected=[
             ("arcane_slice","ArcaneSliceSpell"),
             ("aspect_of_the_shulker","AspectOfTheShulkerSpell"),
             ("hollow_crystal","HollowCrystalSpell"),
             ("dimensional_adaptation","DimensionalAdaptationSpell"),
             ("obsidian_rod","ObsidianRodSpell"),
             ("infinite_void","InfiniteVoidSpell"),
             ("dragons_fury","DragonsFurySpell"),
             ("gate_of_ender","GateOfEnderSpell"),
             ("displacement_cage","DisplacementCageSpell"),
             ("binary_stars","BinaryStarsSpell"),
             ("scintillating_stride","ScintillatingStrideSpell"),
          ]
          base="net.fireofpower.firesenderexpansion."
          def java(c):
            proc=subprocess.run(["javap","-c","-p","-classpath",jar,c],capture_output=True,text=True,timeout=35)
            assert proc.returncode==0,(c,proc.stderr[:200])
            return proc.stdout
          with zipfile.ZipFile(jar) as z:
            paths=set(z.namelist())
            toml=z.read("META-INF/neoforge.mods.toml").decode("utf8")
            assert re.search(r'modId\s*=\s*"firesenderexpansion"',toml)
          root=java(base+"FiresEnderExpansion")
          registry=java(base+"registries.SpellRegistries")
          assert 'SpellRegistries.register:(Lnet/neoforged/bus/api/IEventBus;)V' in root
          assert "SpellRegistry.SPELL_REGISTRY_KEY:" in registry
          assert 'DeferredRegister.create:' in registry and '// String firesenderexpansion' in registry
          bus=registry.split("public static void register(",1)[1].split("public static",1)[0]
          assert "DeferredRegister.register:(Lnet/neoforged/bus/api/IEventBus;)V" in bus
          wrapper=registry.split("public static java.util.function.Supplier",1)[1].split("static {};",1)[0]
          assert "DeferredRegister.register:(Ljava/lang/String;Ljava/util/function/Supplier;)" in wrapper
          clinit=registry.split("static {};",1)[1]
          classes=re.findall(r"// class net/fireofpower/firesenderexpansion/spells/([A-Za-z0-9_]+Spell)",clinit)
          assert classes==[cls for _,cls in expected],("compiled registration order",classes)
          calls=clinit.count("Method registerSpell:(Lio/redspace/ironsspellbooks/api/spells/AbstractSpell;)")
          assert calls==11,("expected 11, got",calls)
          assert not re.search(r'^\s*\d+:\s+(?:ifeq|ifne|ifnull|ifnonnull|goto|tableswitch|lookupswitch)\b',clinit,re.M),"initializer gated"
          for index,(suffix,cls) in enumerate(expected,1):
            assert "net/fireofpower/firesenderexpansion/spells/"+cls+".class" in paths
            text=java(base+"spells."+cls)
            assert "extends io.redspace.ironsspellbooks.api.spells.AbstractSpell" in text,cls
            assert "getSpellResource();" in text,cls
            assert "ResourceLocation.fromNamespaceAndPath:" in text,cls
            assert "// String "+suffix in text,("compiled exact spell suffix",cls,suffix)
            assert "SchoolRegistry.ENDER_RESOURCE:" in text,("default Ender school",cls)
            print("PHYSICAL_EXACT_SPELL_"+str(index)+"=firesenderexpansion:"+suffix+"|"+cls)
          print("PHYSICAL_SPELL_REGISTRATIONS=11")
          print("EXCLUDED_ADDITIONAL_SPELLS=0")
          print("NEW_SEMANTIC_ROOTS=0")
          print("EXACT_STATIC_REGISTRY_PROOF=PASS")
          print("INSTALLED_PACK_RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE")
          PY
