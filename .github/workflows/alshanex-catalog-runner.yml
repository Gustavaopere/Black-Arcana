name: Phase 2BD Alshanex Catalog Reconciliation

on:
  push:
    branches:
      - docs/alshanex-4.0.3-exact-catalog-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile generated catalog state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def reconcile(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              assert (old_count, new_count) in {(1, 0), (0, 1)}, (
                  f'{label}: expected exactly one old or reconciled occurrence, '
                  f'found old={old_count}, reconciled={new_count}'
              )
              if old_count == 1:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')

          reconcile(
              'wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md',
              'Bloodlines remains **28 counted actions**, and the strict total remains **797**.',
              'Bloodlines remains **28 counted actions**, and the strict total remains **815**.',
              'Bloodlines strict-total cross-reference',
          )
          reconcile(
              'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md',
              'A última correção de contagem continua sendo **Werewolves Leap +1**:',
              'A correção de contagem imediatamente anterior ao fechamento Alshanex continua sendo **Werewolves Leap +1**:',
              'queue latest-correction wording',
          )
          reconcile(
              'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md',
              'O valor 53/100 nunca substitui a métrica semântica de magias.',
              'O valor 54/100 nunca substitui a métrica semântica de magias.',
              'queue component metric cross-reference',
          )
          reconcile(
              'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md',
              '`AUDITORIA EM ANDAMENTO — autoridade física 2026-09-09`',
              '`AUDITORIA EM ANDAMENTO — autoridade física 2026-09-11`',
              'current provider physical-authority date',
          )
          reconcile(
              'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md',
              'Esse 52/100 é uma métrica técnica de fechamento de componentes e **não** é a porcentagem de spells/magias.',
              'Esse 54/100 é uma métrica técnica de fechamento de componentes e **não** é a porcentagem de spells/magias.',
              'current provider component metric cross-reference',
          )
          print('Phase 2BD generated-state reconciliation complete.')
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated catalog is already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md \
                  wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md \
                  wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md
          git commit -m 'docs: reconcile Phase 2BD generated catalog state'
          git push origin HEAD:docs/alshanex-4.0.3-exact-catalog-closure
