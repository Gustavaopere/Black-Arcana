name: Mobstein 5.4.4 Clean-room Resource Audit

on:
  push:
    branches:
      - audit/mobstein-resource-audit-2026-09-17

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact artifact and retain resource-only evidence
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA1='3672d88f940ddd474a5429d7066b099cd0ce0c29'
          URL='https://www.cursemaven.com/curse/maven/mobstein-upgrade-useless-animals-1193873/8040734/mobstein-upgrade-useless-animals-1193873-8040734.jar'

          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 180 "$URL" -o mobstein.jar
          ACTUAL_SHA1="$(sha1sum mobstein.jar | awk '{print $1}')"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          mkdir -p audit

          {
            echo 'Mobstein 5.4.4 clean-room resource audit'
            echo "expected_sha1=$EXPECTED_SHA1"
            echo "actual_sha1=$ACTUAL_SHA1"
            echo
            echo '== metadata paths =='
            jar tf mobstein.jar | grep -E '(^|/)(neoforge\.mods\.toml|mods\.toml|MANIFEST\.MF)$' | sort || true
            echo
            echo '== namespace data resource paths =='
            jar tf mobstein.jar | grep '^data/mobstein/' | sort || true
            echo
            echo '== namespace asset metadata paths (no binary assets) =='
            jar tf mobstein.jar \
              | grep '^assets/mobstein/' \
              | grep -Ev '/(textures|models|sounds)/' \
              | sort || true
            echo
            echo '== class count only =='
            printf 'class_count='
            jar tf mobstein.jar | grep -c '\.class$' || true
          } > audit/report.txt

          python3 - <<'PY'
          import collections
          import json
          import zipfile
          from pathlib import Path

          jar = zipfile.ZipFile('mobstein.jar')
          names = set(jar.namelist())
          out = Path('audit/report.txt')

          def prefix_bucket(key: str) -> str:
              parts = key.split('.')
              if not parts:
                  return '<empty>'
              if parts[0] in {'item','block','entity','effect','container','gui','advancement','biome','structure','death','subtitles'}:
                  return parts[0]
              return parts[0]

          with out.open('a', encoding='utf-8') as f:
              f.write('\n== mods metadata ==\n')
              for path in ('META-INF/neoforge.mods.toml','META-INF/mods.toml'):
                  if path in names:
                      text = jar.read(path).decode('utf-8', errors='replace')
                      for line in text.splitlines():
                          s = line.strip()
                          if s.startswith(('modId','version','displayName','license','mandatory','type','ordering','side')) or 'modId=' in s:
                              f.write(s + '\n')

              f.write('\n== localization key inventory (keys only; values omitted) ==\n')
              lang = 'assets/mobstein/lang/en_us.json'
              if lang in names:
                  data = json.loads(jar.read(lang).decode('utf-8'))
                  keys = sorted(data.keys())
                  buckets = collections.Counter(prefix_bucket(k) for k in keys)
                  f.write(f'key_count={len(keys)}\n')
                  for bucket, count in sorted(buckets.items()):
                      f.write(f'prefix_count {bucket}={count}\n')
                  f.write('\n-- action-like or uncategorized keys --\n')
                  known = ('item.','block.','entity.','effect.','container.','gui.','advancement.','biome.','structure.','death.','subtitles.','itemGroup.','tooltip.')
                  for key in keys:
                      lower = key.lower()
                      if any(token in lower for token in ('spell','ritual','rite','ability','action','cast','magic','syringe','resurrect','reviv','lightning','igor','mobstenio')) or not key.startswith(known):
                          f.write(key + '\n')
              else:
                  f.write('en_us_missing=true\n')

              f.write('\n== data resource type/path summary ==\n')
              data_paths = sorted(p for p in names if p.startswith('data/mobstein/') and p.endswith('.json'))
              f.write(f'json_resource_count={len(data_paths)}\n')
              top = collections.Counter()
              for path in data_paths:
                  rel = path[len('data/mobstein/'):]
                  top[rel.split('/',1)[0]] += 1
              for bucket, count in sorted(top.items()):
                  f.write(f'data_bucket {bucket}={count}\n')

              f.write('\n== action-like data paths ==\n')
              for path in data_paths:
                  lower = path.lower()
                  if any(token in lower for token in ('spell','ritual','rite','ability','action','cast','magic','syringe','resurrect','reviv','lightning','igor','mobstenio')):
                      f.write(path + '\n')
          PY

          cat audit/report.txt

      - name: Upload text-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: mobstein-5.4.4-clean-room-resource-audit
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
