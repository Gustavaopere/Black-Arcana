name: Alex's Caves 1.0.10 Crystallization native causal audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-crystallization-causal.yml'
      - 'docs/qa/alexscaves_1010_crystallization_causal_probe.py'
      - 'docs/qa/alexscaves_1010_crystallization_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_crystallization_causal_cards_test.py'
      - 'docs/qa/alexscaves_1010_charting_call_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/crystallization.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-crystallization-causal.yml'
      - 'docs/qa/alexscaves_1010_crystallization_causal_probe.py'
      - 'docs/qa/alexscaves_1010_crystallization_causal_probe_test.py'
      - 'docs/qa/alexscaves_1010_crystallization_causal_cards_test.py'
      - 'docs/qa/alexscaves_1010_charting_call_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/crystallization.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
permissions:
  contents: read
jobs:
  crystallization_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed static contracts
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_crystallization_causal_probe.py docs/qa/alexscaves_1010_crystallization_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_crystallization_causal_probe_test.py -v
          if test -f docs/qa/alexscaves_1010_crystallization_causal_cards_test.py; then
            python3 docs/qa/alexscaves_1010_crystallization_causal_cards_test.py -v
          fi
      - name: Download exact installed publisher 1.0.10 JAR
        run: |
          mkdir -p build/crystallization-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/crystallization-causal/alexscaves-1.0.10.jar
      - name: Reproduce SHA-exact parent and verify 11 consumer JVM causal graph
        run: |
          python3 docs/qa/alexscaves_1010_crystallization_probe.py \
            --jar build/crystallization-causal/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json' \
            --output build/crystallization-causal/parent.json > /dev/null
          SNAP='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-CAUSAL-1.0.10.json'
          if test -f "$SNAP"; then
            python3 docs/qa/alexscaves_1010_crystallization_causal_probe.py \
              --jar build/crystallization-causal/alexscaves-1.0.10.jar \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --snapshot "$SNAP" \
              --output build/crystallization-causal/causal.json
          else
            python3 docs/qa/alexscaves_1010_crystallization_causal_probe.py \
              --jar build/crystallization-causal/alexscaves-1.0.10.jar \
              --parent 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json' \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/crystallization-causal/causal.json
          fi
      - name: Check canonical 544 provider indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-crystallization-causal
          path: build/crystallization-causal/causal.json
          if-no-files-found: ignore
          retention-days: 14
