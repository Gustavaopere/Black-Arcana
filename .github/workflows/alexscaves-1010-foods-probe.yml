name: Alex's Caves 1.0.10 ACFoods exact discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-foods-probe.yml'
      - 'docs/qa/alexscaves_1010_foods_probe.py'
      - 'docs/qa/alexscaves_1010_foods_probe_test.py'
      - 'docs/qa/alexscaves_1010_foods_boundary.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOODS-DISCOVERY-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOODS-DISCOVERY-1.0.10.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foods_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/foods-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/foods-1010/alexscaves-1.0.10.jar
      - name: Inspect field construction, all suppliers and typed consumers
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_foods_probe.py
          python3 docs/qa/alexscaves_1010_foods_probe.py \
            --jar build/foods-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/foods-1010/report.json
      - name: Audit supplier holder and vanilla constructor defaults
        run: |
          python3 docs/qa/alexscaves_1010_foods_boundary.py \
            --jar build/foods-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/foods-1010/boundary.json
      - name: Verify every property, effect supplier, consumer site and boundary
        run: |
          AC_FOODS_REPORT=build/foods-1010/report.json AC_FOODS_BOUNDARY=build/foods-1010/boundary.json python3 docs/qa/alexscaves_1010_foods_probe_test.py -v
      - name: Verify canonical generated indexes
        run: python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-foods-discovery
          path: |
            build/foods-1010/report.json
            build/foods-1010/boundary.json
          retention-days: 14
          if-no-files-found: ignore
