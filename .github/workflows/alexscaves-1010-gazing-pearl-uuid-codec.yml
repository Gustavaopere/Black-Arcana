name: Alex's Caves 1.0.10 Gazing Pearl exact ACCompat UUID codec discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-uuid-codec.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_uuid_codec_probe.py'
      - 'docs/qa/alexscaves_1010_gazing_pearl_uuid_codec_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-UUID-CODEC-1.0.10.*'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/gazing-pearl.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uuid_codec_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check bounded read-only Python parser syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_uuid_codec_probe.py
      - name: Obtain exact publisher JAR and verify SHA-256 before inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gazing-pearl-uuid-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            -o build/gazing-pearl-uuid-1010/publisher.jar
          actual="$(sha256sum build/gazing-pearl-uuid-1010/publisher.jar | cut -d' ' -f1)"
          test "$actual" = '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c'
          test "$(stat -c %s build/gazing-pearl-uuid-1010/publisher.jar)" -eq 75279314
          unzip -tq build/gazing-pearl-uuid-1010/publisher.jar
          echo "PUBLISHER_SHA256 $actual"
      - name: Extract UUID helper and typed caller metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/alexscaves_1010_gazing_pearl_uuid_codec_probe.py \
            --jar build/gazing-pearl-uuid-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-uuid-1010/report.json \
            | tee build/gazing-pearl-uuid-1010/probe.log
      - name: Discovery guard - no metadata promoted to complete magical contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('build/gazing-pearl-uuid-1010/report.json').read_text())
          assert data['scope']=='GAZING_PEARL_1010_ACCOMPAT_UUID_CODEC_DISCOVERY_ONLY'
          assert data['artifact']['publisher_sha256']=='36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c'
          assert {x['name'] for x in data['compat']['uuid_wrappers']}=={'putUUID','getUUID'}
          assert data['world']['caller_count']>=2
          assert data['limits']['mutation']=='NO_MUTATION'
          assert data['limits']['static_contract']=='NOT_CERTIFIED'
          assert data['limits']['mutating_hook']=='NOT_VERIFIED'
          assert data['limits']['physical_qa']=='NOT_TESTED'
          assert data['limits']['provider_universe_closed'] is False
          assert data['limits']['semantic_magic_roots_delta']==0
          PY
      - name: Preserve metadata-only report and log for SHA-exact sealing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gazing-pearl-1010-uuid-codec-discovery
          path: |
            build/gazing-pearl-uuid-1010/report.json
            build/gazing-pearl-uuid-1010/probe.log
          if-no-files-found: warn
          retention-days: 14
