name: Alex's Caves 1.0.10 item registry discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-item-registry-probe.yml'
      - 'docs/qa/alexscaves_1010_item_registry_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  item_registry_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/item-registry-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/item-registry-1010/alexscaves-1.0.10.jar
      - name: Inspect registry methods, field writes, supplier bindings and typed references
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_item_registry_probe.py
          python3 docs/qa/alexscaves_1010_item_registry_probe.py \
            --jar build/item-registry-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/item-registry-1010/report.json
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-item-registry-discovery
          path: build/item-registry-1010/report.json
          retention-days: 14
          if-no-files-found: ignore
