name: Alex's Caves 1.0.10 bottle and fertilizer contracts
on:
  pull_request:
    branches: [main]
    paths: &contract_paths
      - '.github/workflows/alexscaves-1010-bottle-fertilizer-catalog.yml'
      - 'docs/qa/alexscaves_1010_bottle_fertilizer_catalog.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_destroyed_item_engine_reference.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_action_contract_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BOTTLE-FERTILIZER-CATALOG-1.0.10.*'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EFFECT-CONTRACTS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOOD-BUILDER-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOODS-NATIVE-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ITEM-REGISTRY-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/fertilizer.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/purple-soda-bottle.md'
  push:
    branches: [main]
    paths: *contract_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bottle_fertilizer_catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned publisher and upstream references
        run: |
          mkdir -p build/bottle-fertilizer-1010
          cd build/bottle-fertilizer-1010
          download() {
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
              "$1" --output "$2"
          }
          download 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' alexscaves.jar
          download 'https://piston-data.mojang.com/v1/objects/30c73b1c5da787909b2f73340419fdf13b9def88/client.jar' client.jar
          download 'https://piston-data.mojang.com/v1/objects/2244b6f072256667bcd9a73df124d6c58de77992/client.txt' client.txt
          neo=https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250
          download "$neo/neoforge-21.1.250-universal.jar" universal.jar
          download "$neo/neoforge-21.1.250-userdev.jar" userdev.jar
      - name: Verify inputs and reproduce sealed evidence
        run: |
          evidence=build/bottle-fertilizer-1010
          python3 docs/qa/alexscaves_1010_bottle_fertilizer_catalog.py \
            --jar "$evidence/alexscaves.jar" \
            --client "$evidence/client.jar" --mappings "$evidence/client.txt" \
            --universal "$evidence/universal.jar" --userdev "$evidence/userdev.jar" \
            --javap "$JAVA_HOME/bin/javap" --output "$evidence/catalog.json"
      - name: Archive verified evidence
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-bottle-fertilizer-catalog
          path: build/bottle-fertilizer-1010/catalog.json
          retention-days: 14
