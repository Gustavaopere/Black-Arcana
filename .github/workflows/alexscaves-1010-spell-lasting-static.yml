name: Alex's Caves 1.0.10 Spell Lasting exact Hex static audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-spell-lasting-static.yml'
      - 'docs/qa/alexscaves_1010_spell_lasting_static_probe.py'
      - 'docs/qa/alexscaves_1010_spell_lasting_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-spell-lasting-static.yml'
      - 'docs/qa/alexscaves_1010_spell_lasting_static_probe.py'
      - 'docs/qa/alexscaves_1010_spell_lasting_static_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
permissions:
  contents: read
jobs:
  exact_spell_lasting_readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile/test fail-closed Spell Lasting evidence probe
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_spell_lasting_static_probe.py
          python3 docs/qa/alexscaves_1010_spell_lasting_static_probe_test.py -v
      - name: Download pinned publisher 1.0.10 JAR (no commit)
        run: |
          mkdir -p build/alexscaves-spell-lasting-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-spell-lasting-1010/publisher.jar
      - name: Verify exact Hex producer, lifespan, state and publisher JSON
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SPELL-LASTING-STATIC-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_spell_lasting_static_probe.py \
              --jar build/alexscaves-spell-lasting-1010/publisher.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-spell-lasting-1010/evidence.json
          else
            echo 'SPELL_LASTING_DISCOVERY_ONLY_NOT_YET_CERTIFIED'
            python3 docs/qa/alexscaves_1010_spell_lasting_static_probe.py \
              --jar build/alexscaves-spell-lasting-1010/publisher.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-spell-lasting-1010/evidence.json
          fi
      - name: Check canonical perk-ready catalogue
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-spell-lasting-1010-bounded-static-evidence
          path: build/alexscaves-spell-lasting-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
