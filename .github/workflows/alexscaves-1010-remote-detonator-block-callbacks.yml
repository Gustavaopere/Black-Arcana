name: Alex's Caves 1.0.10 Remote Detonator block callback discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-remote-detonator-block-callbacks.yml'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-BLOCK-CALLBACKS-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher_callbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate scanner syntax and candidate filters
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py
          python3 docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py --self-test
      - name: Fetch exact publisher
        run: |
          mkdir -p build/remote-block-callbacks
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/remote-block-callbacks/publisher.jar
      - name: Inspect publisher block callbacks and registry bootstrap links
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py \
            --jar build/remote-block-callbacks/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/remote-block-callbacks/report.json
          report=build/remote-block-callbacks/report.json
          test "$(stat -c %s "$report")" -eq 128197
          test "$(sha256sum "$report" | cut -d' ' -f1)" = '5b4ab93082e611bfd5a540e4ea33316fc2d472bec303561ae78bee33fc3f5635'
      - name: Archive discovery-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-remote-detonator-block-callbacks
          path: build/remote-block-callbacks/report.json
          if-no-files-found: warn
          retention-days: 14
