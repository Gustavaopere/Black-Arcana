name: Alex's Caves 1.0.10 Cave Boat SHA-exact discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-cave-boat-probe.yml'
      - 'docs/qa/alexscaves_1010_cave_boat_probe.py'
      - 'docs/qa/alexscaves_1010_cave_boat_static_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cave_boat_exact_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check probe syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_cave_boat_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_cave_boat_static_checks.py
      - name: Download publisher JAR
        run: |
          mkdir -p build/cave-boat-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/cave-boat-1010/alexscaves-1.0.10.jar
      - name: Capture exact class bytecode and hashes
        run: |
          python3 docs/qa/alexscaves_1010_cave_boat_probe.py \
            --jar build/cave-boat-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output-dir build/cave-boat-1010/evidence
      - name: Verify SHA-pinned item, boat entity and type edges
        run: |
          python3 docs/qa/alexscaves_1010_cave_boat_static_checks.py             --transcript-dir build/cave-boat-1010/evidence
      - name: Archive exact class observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-cave-boat-discovery
          path: build/cave-boat-1010/evidence/
          retention-days: 14
