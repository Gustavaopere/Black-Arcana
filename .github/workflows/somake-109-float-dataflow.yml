name: Somake 1.0.9 Funeral Bloom exact float dataflow (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-float-dataflow.yml'
      - 'docs/qa/somake_109_float_dataflow.py'
      - 'docs/qa/somake_109_float_dataflow_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-FLOAT-DATAFLOW-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_float_dataflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic and compiled Java21 dataflow regressions
        run: python3 docs/qa/somake_109_float_dataflow_test.py -v
      - name: SHA-1 pin publisher JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-float-dataflow
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-float-dataflow/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-float-dataflow/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Inspect exact float getter JVM stack
        run: |
          python3 docs/qa/somake_109_float_dataflow.py \
            --jar build/somake-float-dataflow/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-float-dataflow/evidence.json
      - name: Upload bounded symbolic metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-float-dataflow-${{ github.sha }}
          path: build/somake-float-dataflow/evidence.json
          if-no-files-found: ignore
          retention-days: 14
