name: Alex's Caves 1.0.10 Nuclear Explosion effect discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-nuclear-explosion-effects.yml'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-EXPLOSION-EFFECTS-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_publisher_effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate scanner and projection filter
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py
          python3 docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/nuclear-explosion-effects
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/nuclear-explosion-effects/publisher.jar
      - name: Inspect exact entity and config boundaries
        run: |
          python3 docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py \
            --jar build/nuclear-explosion-effects/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/nuclear-explosion-effects/report.json
      - name: Seal exact effect report
        run: |
          set -euo pipefail
          report=build/nuclear-explosion-effects/report.json
          test "$(stat -c %s "$report")" -eq 206285
          test "$(sha256sum "$report" | cut -d' ' -f1)" = '9bb19b18b085cec164ebea4f4f23735f1560e3deda766b3df8194cb1ddc6bd2e'
      - name: Archive discovery-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuclear-explosion-effects-discovery
          path: build/nuclear-explosion-effects/report.json
          if-no-files-found: warn
          retention-days: 14
