name: Alex's Caves 1.0.10 Nuclear target and world guards

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_target_world_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_target_world_probe_test.py'
      - '.github/workflows/alexscaves-1010-nuclear-target-world.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-TARGET-WORLD-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_target_world_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_target_world_probe_test.py'
      - '.github/workflows/alexscaves-1010-nuclear-target-world.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-TARGET-WORLD-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_nuclear_target_world:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed boundaries
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_nuclear_target_world_probe.py
          python3 docs/qa/alexscaves_1010_nuclear_target_world_probe_test.py -v
      - name: Fetch exact physical publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Compare exact SHA-pinned target and world guards
        run: |
          python3 docs/qa/alexscaves_1010_nuclear_target_world_probe.py --jar build/alexscaves-1010/alexscaves-1.0.10.jar --javap "$JAVA_HOME/bin/javap" --output build/alexscaves-1010/nuclear-target-world.json --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-TARGET-WORLD-1.0.10.json'
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-nuclear-target-world
          path: build/alexscaves-1010/nuclear-target-world.json
          if-no-files-found: error
          retention-days: 14
