name: NeoForge 21.1.248 Gazing Pearl SavedData write-chain discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neoforge-211248-gazing-pearl-ioworker-discovery.yml'
      - 'docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/gazing-pearl.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-SAVEDDATA-ABI.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_saveddata_write_chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only JVM auditor
        run: |
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py
      - name: Download official NeoForge 21.1.248 installer and verify Maven checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gazing-pearl-ioworker-211248/server
          cd build/gazing-pearl-ioworker-211248/server
          BASE='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar.sha256" -o installer.sha256
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar" -o neoforge-installer.jar
          EXPECTED="$(awk '{print $1}' installer.sha256)"
          ACTUAL="$(sha256sum neoforge-installer.jar | awk '{print $1}')"
          test "$(printf '%s' "$EXPECTED" | wc -c)" -eq 64
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = '68eeab77059ba53df1812f1afa5bf530ab2566a3cdcd5f924aa6e71be42e410c'
          unzip -tq neoforge-installer.jar
          echo "OFFICIAL_NEOFORGE_211248_INSTALLER_SHA256=$ACTUAL"
      - name: Install exact NeoForge 21.1.248 server class distribution
        shell: bash
        run: |
          set -euo pipefail
          cd build/gazing-pearl-ioworker-211248/server
          java -jar neoforge-installer.jar --installServer > install.log 2>&1 || {
            tail -n 90 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Discover exact SaveData lambda handles and IOUtilities.withIOWorker body
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py \
            --server build/gazing-pearl-ioworker-211248/server/libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar \
            --srg build/gazing-pearl-ioworker-211248/server/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-ioworker-211248/report.json
      - name: Reject unsupported durability, physical QA or hook claims
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/gazing-pearl-ioworker-211248/report.json').read_text())
          assert r['scope']=='NEOFORGE_211248_SAVEDDATA_WRITE_LAMBDA_IOWORKER_DISTRIBUTED_ONLY'
          assert set(r['classes'])=={'storage','saved_data','worker'}
          assert r['engine']['neoforge_version']=='21.1.248'
          assert r['engine']['modlauncher_loaded_bytes']=='NOT_OBSERVED'
          assert r['modlauncher_loaded']=='NOT_OBSERVED'
          assert r['io_completion_durability']=='NOT_VERIFIED'
          assert r['installed_modpack_parity']=='NOT_VERIFIED'
          assert r['mutation']=='NO_MUTATION' and r['mutating_hook']=='NOT_VERIFIED'
          assert r['physical_qa']=='NOT_TESTED' and r['static_contract']=='NOT_CERTIFIED'
          assert r['semantic_magic_roots_delta']==0
          for label in ('storage','saved_data'):
              assert r['classes'][label]['save_lambda_bootstrap']['linked_local']
          print('PASS: exact distributed read-only boundaries; no false runtime claims')
          PY
      - name: Preserve bounded evidence; never publish original JARs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-211248-gazing-pearl-ioworker-jvm-evidence
          path: build/gazing-pearl-ioworker-211248/report.json
          retention-days: 14
          if-no-files-found: ignore
