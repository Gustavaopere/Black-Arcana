name: NeoForge 21.1.248 Gazing Pearl SavedData write-chain discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neoforge-211248-gazing-pearl-ioworker-discovery.yml'
      - 'docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/gazing-pearl.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-SAVEDDATA-ABI.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_saveddata_write_chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only JVM auditor
        run: |
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_checks.py
      - name: Download official NeoForge 21.1.248 installer and verify Maven checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gazing-pearl-ioworker-211248/server
          cd build/gazing-pearl-ioworker-211248/server
          BASE='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar.sha256" -o installer.sha256
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar" -o neoforge-installer.jar
          EXPECTED="$(awk '{print $1}' installer.sha256)"
          ACTUAL="$(sha256sum neoforge-installer.jar | awk '{print $1}')"
          test "$(printf '%s' "$EXPECTED" | wc -c)" -eq 64
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = '68eeab77059ba53df1812f1afa5bf530ab2566a3cdcd5f924aa6e71be42e410c'
          unzip -tq neoforge-installer.jar
          echo "OFFICIAL_NEOFORGE_211248_INSTALLER_SHA256=$ACTUAL"
      - name: Install exact NeoForge 21.1.248 server class distribution
        shell: bash
        run: |
          set -euo pipefail
          cd build/gazing-pearl-ioworker-211248/server
          java -jar neoforge-installer.jar --installServer > install.log 2>&1 || {
            tail -n 90 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Enumerate official NeoForge 21.1.248 library class authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          root=Path('build/gazing-pearl-ioworker-211248/server/libraries')
          exact=root/'net/neoforged/neoforge/21.1.248'
          assert exact.is_dir(), 'exact NeoForge installed library path missing'
          files=sorted(exact.glob('*.jar'))
          assert 1<=len(files)<=16
          wanted='net/neoforged/neoforge/common/IOUtilities.class'
          found=[]
          for f in files:
              with ZipFile(f) as z:
                  members=z.namelist()
                  assert len(members)==len(set(members))
                  if wanted in members:
                      found.append(f)
                      print('IOUTILITIES_LIBRARY='+str(f.relative_to(root)))
                      print('IOUTILITIES_LIBRARY_SHA256='+hashlib.sha256(f.read_bytes()).hexdigest())
                      print('IOUTILITIES_CLASS_SHA256='+hashlib.sha256(z.read(wanted)).hexdigest())
          print('OFFICIAL_NEOFORGE_JAR_COUNT='+str(len(files)))
          print('IOUTILITIES_CLASS_MATCHES='+str(len(found)))
          assert len(found)==1, 'cannot use source-ambiguous IOUtilities'
          PY
      - name: Discover exact SaveData lambda handles and IOUtilities.withIOWorker body
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_probe.py \
            --server build/gazing-pearl-ioworker-211248/server/libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar \
            --srg build/gazing-pearl-ioworker-211248/server/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --libraries build/gazing-pearl-ioworker-211248/server/libraries \
            --output build/gazing-pearl-ioworker-211248/report.json
      - name: Reject unsupported durability, physical QA or hook claims
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/gazing-pearl-ioworker-211248/report.json').read_text())
          assert r['scope']=='NEOFORGE_211248_SAVEDDATA_WRITE_LAMBDA_IOWORKER_DISTRIBUTED_ONLY'
          assert set(r['classes'])=={'storage','saved_data','worker'}
          assert r['engine']['neoforge_version']=='21.1.248'
          assert r['engine']['modlauncher_loaded_bytes']=='NOT_OBSERVED'
          assert r['modlauncher_loaded']=='NOT_OBSERVED'
          assert r['io_completion_durability']=='NOT_VERIFIED'
          assert r['installed_modpack_parity']=='NOT_VERIFIED'
          assert r['mutation']=='NO_MUTATION' and r['mutating_hook']=='NOT_VERIFIED'
          assert r['physical_qa']=='NOT_TESTED' and r['static_contract']=='NOT_CERTIFIED'
          assert r['semantic_magic_roots_delta']==0
          for label in ('storage','saved_data'):
              assert r['classes'][label]['save_lambda_bootstrap']['linked_local']
          print('PASS: exact distributed read-only boundaries; no false runtime claims')
          PY
      - name: Verify SHA-exact native write lambda links and async worker pivots
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_checks.py \
            --report build/gazing-pearl-ioworker-211248/report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.json'
      - name: Reject forged async scheduling, dirty clear, write target and null skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import copy, hashlib, json
          folder=Path('build/gazing-pearl-ioworker-211248')
          evidence=json.loads((folder/'report.json').read_text())
          manifest=json.loads(Path('wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-IOWORKER-ABI.json').read_text())
          tests=(
              ('async-scheduler','worker','withIOWorker',7),
              ('premature-dirty-clear','saved_data','save',59),
              ('write-target','saved_data','lambda$save$0',5),
              ('save-null-guard','storage','lambda$save$1',1),
          )
          for case,owner,name,offset in tests:
              report=copy.deepcopy(evidence)
              seal=copy.deepcopy(manifest)
              original=report['classes'][owner]
              found=[m for m in original['selected_methods']
                     if m['declaration']['name']==name]
              assert len(found)==1, 'negative method selection ambiguous'
              row=next(x for x in found[0]['instructions'] if x['offset']==offset)
              assert row['opcode']!='nop'
              row['opcode']='nop'
              raw_instruction=(json.dumps(found[0]['instructions'],ensure_ascii=False,
                                          sort_keys=True,indent=2)+'\n').encode('utf8')
              instr_sha=hashlib.sha256(raw_instruction).hexdigest()
              found[0]['instruction_sha256']=instr_sha
              for entry in seal['classes'][owner]['methods']:
                  if entry['name']==name and entry['descriptor']==found[0]['declaration']['descriptor']:
                      entry['instruction_sha256']=instr_sha
                      break
              else:
                  raise AssertionError('negative seal method not found')
              forged_raw=json.dumps(report,ensure_ascii=False,sort_keys=True).encode('utf8')
              seal['evidence']['report_bytes']=len(forged_raw)
              seal['evidence']['report_sha256']=hashlib.sha256(forged_raw).hexdigest()
              (folder/('bad-'+case+'.json')).write_bytes(forged_raw)
              (folder/('bad-'+case+'-seal.json')).write_text(
                  json.dumps(seal,ensure_ascii=False),encoding='utf8')
          PY
          for case in async-scheduler premature-dirty-clear write-target save-null-guard; do
            if python3 docs/qa/neoforge_211248_gazing_pearl_ioworker_lambda_checks.py \
              --report "build/gazing-pearl-ioworker-211248/bad-$case.json" \
              --manifest "build/gazing-pearl-ioworker-211248/bad-$case-seal.json"; then
              echo "::error::FORGED_SAVEDDATA_IOWORKER_CONTRACT_ACCEPTED_$case"
              exit 1
            fi
          done
      - name: Preserve bounded evidence; never publish original JARs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-211248-gazing-pearl-ioworker-jvm-evidence
          path: build/gazing-pearl-ioworker-211248/report.json
          retention-days: 14
          if-no-files-found: ignore
