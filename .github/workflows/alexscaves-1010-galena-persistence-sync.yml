name: Alex's Caves 1.0.10 Galena Gauntlet persistence and controller sync causal audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-persistence-sync.yml'
      - 'docs/qa/alexscaves_1010_galena_persistence_sync_checks.py'
      - 'docs/qa/alexscaves_1010_galena_gauntlet_discovery.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-GAUNTLET-PERSISTENCE-SYNC-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-GAUNTLET-PERSISTENCE-SYNC-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/equipment/galena-gauntlet.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_galena_persistence_controller_sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only publisher and persistence verifiers
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_galena_gauntlet_discovery.py
          python3 -m py_compile docs/qa/alexscaves_1010_galena_persistence_sync_checks.py
      - name: Download publisher JAR and verify exact artifact
        run: |
          mkdir -p build/galena-persistence-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/galena-persistence-1010/publisher.jar
          test "$(sha256sum build/galena-persistence-1010/publisher.jar | cut -d ' ' -f1)" = \
            '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c'
          test "$(wc -c < build/galena-persistence-1010/publisher.jar)" -eq 75279314
          unzip -tq build/galena-persistence-1010/publisher.jar
      - name: Rebuild SHA-exact publisher discovery report
        run: |
          python3 docs/qa/alexscaves_1010_galena_gauntlet_discovery.py \
            --jar build/galena-persistence-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-persistence-1010/report.json > build/galena-persistence-1010/discovery.log
          test "$(sha256sum build/galena-persistence-1010/report.json | cut -d ' ' -f1)" = \
            'c91a48f9892be09c4ab951c8083703b0c5ffbb026fc43e7d808c2033dde8bba9'
          test "$(wc -c < build/galena-persistence-1010/report.json)" -eq 1780492
      - name: Validate 126 JVM anchors and reject 16 re-sealed causal forgeries
        run: |
          python3 docs/qa/alexscaves_1010_galena_persistence_sync_checks.py \
            --report build/galena-persistence-1010/report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-GAUNTLET-PERSISTENCE-SYNC-1.0.10.json' \
            --adversarial
      - name: Preserve read-only publisher evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-galena-persistence-controller-sync-evidence
          path: build/galena-persistence-1010/report.json
          if-no-files-found: ignore
          retention-days: 14
