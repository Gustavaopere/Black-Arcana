name: Alex's Caves 1.0.10 food builder discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-food-builder-probe.yml'
      - 'docs/qa/alexscaves_1010_food_builder_probe.py'
      - 'docs/qa/alexscaves_1010_food_builder_probe_test.py'
      - 'docs/qa/alexscaves_1010_food_builder_reference.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  food_builder_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact publisher and pinned NeoForge references
        run: |
          mkdir -p build/food-builder-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/food-builder-1010/alexscaves-1.0.10.jar
          for variant in universal userdev; do
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
              "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-$variant.jar" \
              --output "build/food-builder-1010/neoforge-$variant.jar"
          done
      - name: Inspect food builder and typed consumers
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_food_builder_probe.py
          python3 docs/qa/alexscaves_1010_food_builder_probe.py \
            --jar build/food-builder-1010/alexscaves-1.0.10.jar \
            --universal build/food-builder-1010/neoforge-universal.jar \
            --userdev build/food-builder-1010/neoforge-userdev.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/food-builder-1010/report.json
      - name: Inspect pinned vanilla construction and consumption reference
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_food_builder_reference.py
          python3 docs/qa/alexscaves_1010_food_builder_reference.py \
            --native-report build/food-builder-1010/report.json \
            --universal build/food-builder-1010/neoforge-universal.jar \
            --userdev build/food-builder-1010/neoforge-userdev.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/food-builder-1010/reference.json
      - name: Archive bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-food-builder-discovery
          path: |
            build/food-builder-1010/report.json
            build/food-builder-1010/reference.json
          retention-days: 14
          if-no-files-found: ignore
