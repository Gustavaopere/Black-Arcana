name: Alex's Caves 1.0.10 exact Raygun receiver normal CFG

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_receiver_cfg_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_receiver_cfg_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-network-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RECEIVER-CFG-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-receiver-cfg.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_receiver_cfg_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_receiver_cfg_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-network-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RECEIVER-CFG-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-receiver-cfg.yml'

permissions:
  contents: read

jobs:
  raygun_receiver_normal_cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic bounded normal CFG tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_receiver_cfg_probe.py docs/qa/alexscaves_1010_raygun_receiver_cfg_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_receiver_cfg_probe_test.py -v
      - name: Fetch SHA-exact provider JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Audit exact Raygun packet fields and normal CFG
        run: |
          python3 docs/qa/alexscaves_1010_raygun_receiver_cfg_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --receiver-manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RECEIVER-1.0.10.json' \
            --identity-manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-RECEIVER-IDENTITY-1.0.10.json' \
            --output build/alexscaves-1010/raygun-receiver-cfg.json
      - name: Publish bounded receiver evidence
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-receiver-cfg
          path: build/alexscaves-1010/raygun-receiver-cfg.json
          retention-days: 14
          if-no-files-found: error
