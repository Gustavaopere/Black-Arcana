name: Alex's Caves 1.0.10 Marine Snow, fish buckets and Moth Dust discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_marine_fish_moth_probe.py'
      - '.github/workflows/alexscaves-1010-marine-fish-moth.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-MARINE-FISH-MOTH-1.0.10.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_marine_fish_moth_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_marine_fish_moth_probe.py
          python3 docs/qa/alexscaves_1010_marine_fish_moth_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/marine-fish-moth
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/marine-fish-moth/publisher.jar
      - name: Project three exact item outer classes and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_marine_fish_moth_probe.py --jar build/marine-fish-moth/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/marine-fish-moth/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_marine_fish_moth_probe.py --jar build/marine-fish-moth/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/marine-fish-moth/replay.json
          cmp build/marine-fish-moth/report.json build/marine-fish-moth/replay.json
          test "$(wc -c < build/marine-fish-moth/report.json)" -eq 335054
          echo 'a9afad89d2771265dfbb4f86c2981bba8d204943e053d4364af82af69c5a7f41  build/marine-fish-moth/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marine-fish-moth
          path: build/marine-fish-moth/report.json
          if-no-files-found: warn
          retention-days: 14
