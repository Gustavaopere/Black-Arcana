name: Alex's Caves 1.0.10 Gazing Pearl SHA-exact discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-discovery.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_discovery.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gazing_pearl_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Parse Python probe
        run: python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_discovery.py
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/gazing-pearl-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/gazing-pearl-1010/publisher.jar
      - name: Discover Gazing Pearl and native reputation helpers
        run: |
          python3 docs/qa/alexscaves_1010_gazing_pearl_discovery.py \
            --jar build/gazing-pearl-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-1010/report.json
      - name: Preserve full exact discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gazing-pearl-discovery
          path: build/gazing-pearl-1010/report.json
          if-no-files-found: warn
          retention-days: 14
