name: Epic Fight 21.17.3.1 exact skill parameters and symbols (Java 21)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/epicfight-211731-perk-binary.yml'
      - 'docs/qa/epicfight_211731_perk_binary.py'
      - 'docs/qa/epicfight_211731_invocation_order.py'
      - 'docs/qa/epicfight_211731_trident_causal.py'
      - 'docs/qa/epicfight_211731_trident_attack_phase.py'
      - 'docs/qa/epicfight_211731_trident_registry_linkage.py'
      - 'docs/qa/epicfight_211731_attack_phase_consumers.py'
      - 'wiki/modpack-catalog/providers/✅-epic-fight/actions/**'
      - 'wiki/modpack-catalog/providers/✅-epic-fight/skills/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_skill_parameters:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 for javap
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Self-test fail-closed JSON comparator (synthetic only)
        run: python3 docs/qa/epicfight_211731_perk_binary.py --self-test

      - name: Download official publisher Maven proxy artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/catalog-epicfight-211731
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://cursemaven.com/curse/maven/epic-fight-mod-405076/8175609/epic-fight-mod-405076-8175609.jar' \
            --output build/catalog-epicfight-211731/epicfight-exact.jar
          echo 'fb199b7bbea2fc402da28ab586e73f47e32f8fc0  build/catalog-epicfight-211731/epicfight-exact.jar' | sha1sum --check
          echo '8b882554cf10086398340fbdc741819ee72a801a3adce516c7f4768326a39526  build/catalog-epicfight-211731/epicfight-exact.jar' | sha256sum --check

      - name: Inspect all 42 packaged skill JSONs, 43 compiled registry IDs and 43 classfile symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/epicfight_211731_perk_binary.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/skill-perk-evidence.json

      - name: Self-test method-bounded javap invocation gate
        run: python3 docs/qa/epicfight_211731_invocation_order.py --self-test

      - name: Probe bounded method invocation ordering in exact JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/epicfight_211731_invocation_order.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/invocation-order-evidence.json

      - name: Validate three exact trident innate identities and causal method references
        run: |
          python3 docs/qa/epicfight_211731_trident_causal.py --self-test
          python3 docs/qa/epicfight_211731_trident_causal.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/trident-causal-evidence.json

      - name: Prove bounded compiled trident property operands and builder operations
        run: |
          python3 docs/qa/epicfight_211731_trident_attack_phase.py --self-test
          python3 docs/qa/epicfight_211731_trident_attack_phase.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/trident-attack-phase-evidence.json

      - name: Gate exact registry ID to trident supplier bootstrap links
        run: |
          python3 docs/qa/epicfight_211731_trident_registry_linkage.py --self-test
          python3 docs/qa/epicfight_211731_trident_registry_linkage.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/trident-registry-bootstrap-evidence.json

      - name: Gate exact AttackPhase damage, max strikes and armor consumer references
        run: |
          python3 docs/qa/epicfight_211731_attack_phase_consumers.py --self-test
          python3 docs/qa/epicfight_211731_attack_phase_consumers.py \
            --jar build/catalog-epicfight-211731/epicfight-exact.jar \
            --output build/catalog-epicfight-211731/attack-phase-consumer-evidence.json

      - name: Inspect phase property precedence and trident recall source in exact classfiles
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"docs/qa")
          from epicfight_211731_trident_causal import javap,blocks,instructions
          jar=Path("build/catalog-epicfight-211731/epicfight-exact.jar")
          specs=[
            ("wrathful","yesman.epicfight.skill.weaponinnate.WrathfulLightingSkill",
             ["registerPropertiesToAnimation"]),
            ("phase","yesman.epicfight.api.animation.types.AttackAnimation$Phase",["addProperties"]),
            ("everlasting","yesman.epicfight.skill.weaponinnate.EverlastingAllegiance",
             ["registerPropertiesToAnimation"]),
            ("trident","yesman.epicfight.world.capabilities.projectile.ThrownTridentPatch",
             ["tickEnd","recalledBySkill"])
          ]
          for key,klass,wanted in specs:
              body=javap(jar,klass)
              matched=[(n,c) for n,c in blocks(body) if any(t+"(" in n for t in wanted)]
              if not matched or len(matched)>4:
                  raise SystemExit("unexpected methods in "+key+": "+str(len(matched)))
              for name,code in matched:
                  ops=instructions(code)
                  if not ops or len(ops)>850: raise SystemExit("unexpected size "+key)
                  selected=[]
                  for i,(pc,opcode,tail) in enumerate(ops):
                      com=tail.split("//",1)[-1].strip()[:105]
                      if key=="trident":
                          if (any(x in com for x in ["getEntities","inflate:","multiplier","setBaseArmorNegation","getPickupItemStackOrigin",
                              "modifyDamage","hurt:","setPos:","Math.pow:","Math.min:","tickCount","recalledBySkill","dealtDamage",
                              "float 8.0f","double 1.0d","double 10.0d","double 0.05d","double 0.0005d",
                              "INNATE","HOLD","getOwner:"]) or opcode.startswith(("fconst","dconst"))):
                              selected.append([pc,opcode,com])
                      else:
                          selected.append([pc,opcode,com])
                  print("EPIC_NEW_PROBE="+json.dumps({"key":key,"method":name,
                    "instruction_count":len(ops),"ops":selected[:150]},separators=(",",":"))[:26000])
          PY

      - name: Upload bounded JSON evidence, never publisher JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epicfight-211731-perk-binary-${{ github.sha }}
          path: |
            build/catalog-epicfight-211731/skill-perk-evidence.json
            build/catalog-epicfight-211731/invocation-order-evidence.json
            build/catalog-epicfight-211731/trident-causal-evidence.json
            build/catalog-epicfight-211731/trident-attack-phase-evidence.json
            build/catalog-epicfight-211731/trident-registry-bootstrap-evidence.json
            build/catalog-epicfight-211731/attack-phase-consumer-evidence.json
          if-no-files-found: ignore
          retention-days: 14
