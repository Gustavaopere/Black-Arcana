name: Alex's Caves 1.0.10 Sightless exact Totem static probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-sightless-static.yml'
      - 'docs/qa/alexscaves_1010_sightless_static_probe.py'
      - 'docs/qa/alexscaves_1010_sightless_static_probe_test.py'
      - 'docs/qa/alexscaves_1010_sightless_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-sightless-static.yml'
      - 'docs/qa/alexscaves_1010_sightless_static_probe.py'
      - 'docs/qa/alexscaves_1010_sightless_static_probe_test.py'
      - 'docs/qa/alexscaves_1010_sightless_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
permissions:
  contents: read
jobs:
  sightless_exact_binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify read-only JAR fail-closed guards
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_sightless_static_probe.py
          python3 docs/qa/alexscaves_1010_sightless_static_probe_test.py -v
      - name: Download exactly installed publisher 1.0.10 artifact
        run: |
          mkdir -p build/alexscaves-sightless-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-sightless-1010/publisher.jar
      - name: Audit Sightless JVM controls against exact Totem provider
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SIGHTLESS-STATIC-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_sightless_static_probe.py \
              --jar build/alexscaves-sightless-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --seal "$SEAL" --output build/alexscaves-sightless-1010/evidence.json
            python3 docs/qa/alexscaves_1010_sightless_cards_test.py -v
          else
            echo 'SIGHTLESS_DISCOVERY_PARTIAL_ONLY_NO_CERTIFICATION'
            python3 docs/qa/alexscaves_1010_sightless_static_probe.py \
              --jar build/alexscaves-sightless-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-sightless-1010/evidence.json
          fi
      - name: Verify canonical indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-sightless-1010-bounded-probe
          path: build/alexscaves-sightless-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
