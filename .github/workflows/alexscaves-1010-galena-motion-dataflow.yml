name: Alex's Caves 1.0.10 Galena motion local-definition discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-motion-dataflow.yml'
      - 'docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py'
      - 'docs/qa/alexscaves_1010_galena_movement_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-MOTION-DATAFLOW-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_motion_dataflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py
          python3 docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/galena-motion-dataflow
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' -o build/galena-motion-dataflow/publisher.jar
      - name: Project movement and registration twice
        run: |
          python3 docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py --jar build/galena-motion-dataflow/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/galena-motion-dataflow/report.json
          python3 docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py --jar build/galena-motion-dataflow/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/galena-motion-dataflow/replay.json
          cmp build/galena-motion-dataflow/report.json build/galena-motion-dataflow/replay.json
          test "$(wc -c < build/galena-motion-dataflow/report.json)" -eq 92039
          echo '1a7bcfba2c077eaf9d84fd624a34ef8c5c2f11c60f3ee5d0451a0e01f1b046f1  build/galena-motion-dataflow/report.json' | sha256sum -c -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: galena-motion-dataflow
          path: build/galena-motion-dataflow/report.json
          if-no-files-found: warn
          retention-days: 14
