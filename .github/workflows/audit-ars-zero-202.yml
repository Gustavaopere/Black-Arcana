name: Ars Zero 2.0.2 physical JAR static inventory discovery
on:
  push:
    branches:
      - 'audit/ars-zero-202-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact official Ars Zero binary (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request,zipfile
          expected='ac9b6e6f7a2bd403ee7cdc16023509fde7c4e1d0'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'ars_zero-1.21.1-2.0.2.jar'
          urls=[
            'https://mediafilez.forgecdn.net/files/8703/997/ars_zero-1.21.1-2.0.2.jar',
            'https://media.forgecdn.net/files/8703/997/ars_zero-1.21.1-2.0.2.jar',
            'https://cursemaven.com/curse/maven/ars-zero-1377482/8703997/ars-zero-1377482-8703997.jar',
          ]
          ok=False
          for url in urls:
              try:
                  print('TRY='+url)
                  req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-read-only-binary-audit/1'})
                  with urllib.request.urlopen(req,timeout=110) as s:
                      data=s.read(12000000)
                  sha=hashlib.sha1(data).hexdigest()
                  print('BYTES='+str(len(data))+' SHA1='+sha)
                  if sha!=expected: continue
                  dest.write_bytes(data)
                  with zipfile.ZipFile(dest) as z: assert z.testzip() is None
                  print('PHYSICAL_SHA1_MATCH='+expected)
                  ok=True
                  break
              except Exception as e:
                  print('SOURCE_ERROR='+repr(e)[:240])
          assert ok,'Exact physical SHA1 publisher JAR unavailable. No promotion.'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('AUDIT_JAR='+str(dest)+'\n')
          PY
      - name: Inspect exact registrar bytecode and 22 identity constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,zipfile
          jar=os.environ['AUDIT_JAR']
          with zipfile.ZipFile(jar) as z:
              entries=sorted(z.namelist())
              main=[n for n in entries if n.endswith('.class') and n.count('/')==3 and n.startswith('com/github/ars_zero/')]
              print('ROOT_TOPLEVEL_CLASSES='+repr(main))
              for n in entries:
                  if n.startswith('data/ars_zero/recipe') and 'glyph' in n:print('LEARNING_RECIPE='+n)
          def javap(name):
              cp=subprocess.run(['javap','-p','-c','-classpath',jar,name],text=True,capture_output=True,timeout=45)
              assert cp.returncode==0,(name,cp.stderr[:400])
              return cp.stdout
          def section(txt,marker):
              if marker not in txt:return ''
              a=txt.split(marker,1)[1]
              return a.split('\n  public ',1)[0].split('\n  private ',1)[0].split('\n  static {};',1)[0]
          mod=javap('com.github.ars_zero.registry.ModGlyphs')
          body=section(mod,'public static void registerGlyphs();')
          print('MODGLYPHS_REGISTER_BODY_BEGIN')
          print(body[:24000])
          print('MODGLYPHS_REGISTER_BODY_END')
          print('DIRECT_REGISTER_CALLS='+str(body.count('GlyphRegistry.registerSpell:')))
          print('REGISTRY_BRANCH_INSNS='+repr(re.findall(r'^\s+\d+:\s+(?:ifeq|ifne|ifnull|ifnonnull|goto|tableswitch|lookupswitch)\b',body,re.M)))
          helper=section(mod,'public static void addOptionalAugmentCompatibility();')
          print('OPTIONAL_COMPAT_HELPER='+helper[:12000])
          stat=mod.split('static {};',1)[1] if 'static {};' in mod else ''
          print('STATIC_GLYPH_INITIALIZER='+stat[:23500])
          fields=re.findall(r'public static final com\.github\.ars_zero\.[\w.<>]+ (\w+);',mod)
          print('STATIC_GLYPH_FIELDS='+repr(fields))
          for name in ['com.github.ars_zero.ArsZero','com.github.ars_zero.ArsZeroMod','com.github.ars_zero.ArsZeroMain']:
              try:
                  txt=javap(name)
                  print('ENTRYPOINT_CLASS='+name)
                  print('ENTRYPOINT_LINES='+repr([l.strip() for l in txt.splitlines() if re.search(r'ModGlyphs|registerGlyphs|addOptionalAugmentCompatibility|// String ars_zero|prefix:|ResourceLocation\.fromNamespace',l)]))
              except Exception as e:print('NOT_ENTRYPOINT='+name)
          # Inspect every concrete glyph class initialized in ModGlyphs; no runtime execution.
          cls=sorted(set(re.findall(r'com/github/ars_zero/common/glyph/(?:augment/|geometrize/|convergence/)?[A-Za-z_0-9]+',stat)))
          print('INITIALIZER_REFERENCED_GLYPH_CLASSES='+repr(cls))
          for path in cls:
              name=path.replace('/','.')
              try:
                  txt=javap(name)
                  pieces=[l.strip() for l in txt.splitlines() if '// String ' in l or 'ResourceLocation' in l or 'prefix:' in l or 'public static' in l or 'static {};' in l or 'getGlyphName' in l or 'getRegistryName' in l]
                  print('GLYPH_CLASS='+name)
                  for line in pieces[:70]:print('GLYPH_BC='+line[:275])
              except Exception as e:print('GLYPH_INSPECT_FAIL='+name+':'+str(e)[:160])
          print('DISCOVERY_NO_PROMOTION=PASS')
          PY
