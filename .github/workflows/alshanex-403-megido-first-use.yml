name: Alshanex 4.0.3 Megido onCast first-use categories
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-first-use.yml'
      - 'docs/qa/alshanex_403_megido_first_use.py'
      - 'docs/qa/alshanex_403_megido_first_use_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-first-use.yml'
      - 'docs/qa/alshanex_403_megido_first_use.py'
      - 'docs/qa/alshanex_403_megido_first_use_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  megido_first_use:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed first-use tests
        run: python3 docs/qa/alshanex_403_megido_first_use_test.py -v
      - name: Obtain and hash-verify exact JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/alshanex-megido-first-use
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alshanexs-familiars-1171602/8675568/alshanexs-familiars-1171602-8675568.jar' \
            --output build/alshanex-megido-first-use/provider.jar
          echo 'e5051c2385a426d05bf203ba8081a23d891f6686  build/alshanex-megido-first-use/provider.jar' | sha1sum --check
      - name: Audit first-use categories, no third-party bodies published
        run: |
          python3 docs/qa/alshanex_403_megido_first_use.py \
            --jar build/alshanex-megido-first-use/provider.jar \
            --output build/alshanex-megido-first-use/evidence.json
      - name: Publish bounded metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alshanex-403-megido-first-use
          path: build/alshanex-megido-first-use/evidence.json
          if-no-files-found: ignore
          retention-days: 14
