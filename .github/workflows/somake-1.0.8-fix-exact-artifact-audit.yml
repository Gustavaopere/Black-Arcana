name: Somake 1.0.8-fix Exact Artifact Audit

on:
  push:
    branches:
      - docs/provider-artifact-audit-somake-1.0.8-fix

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and inspect exact artifact
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA1='b0ad94c1504709662bee2d08700375ccecbb5ec7'
          URL='https://www.cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8417850/somake-spells-irons-spells-addon-1461634-8417850.jar'
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 180 "$URL" -o somake.jar
          ACTUAL_SHA1="$(sha1sum somake.jar | awk '{print $1}')"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          mkdir -p audit
          {
            echo 'Somake 1.0.8-fix exact-artifact audit'
            echo "expected_sha1=$EXPECTED_SHA1"
            echo "actual_sha1=$ACTUAL_SHA1"
            echo
            echo '== metadata paths =='
            jar tf somake.jar | grep -E '(^|/)(neoforge\.mods\.toml|mods\.toml|MANIFEST\.MF)$' || true
            echo
            echo '== spell/resource paths =='
            jar tf somake.jar | grep -Ei '(^|/)(spell|spells)/|spell.*\.json$' | sort || true
            echo
            echo '== candidate registry classes =='
            jar tf somake.jar | grep '\.class$' | grep -Ei '(spell.*registr|registr.*spell|modspells|spellregistry|spellregistries)' | sort || true
            echo
            echo '== standalone Spell classes =='
            jar tf somake.jar | grep '\.class$' | grep -E '/[^/$]*Spell\.class$' | sort || true
          } > audit/report.txt

          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          jar = zipfile.ZipFile('somake.jar')
          names = set(jar.namelist())
          out = Path('audit/report.txt')
          with out.open('a', encoding='utf-8') as f:
              f.write('\n== language spell-like keys ==\n')
              lang_paths = sorted(p for p in names if p.endswith('/lang/en_us.json'))
              for path in lang_paths:
                  try:
                      data = json.loads(jar.read(path).decode('utf-8'))
                  except Exception as exc:
                      f.write(f'{path}: parse_error={exc}\n')
                      continue
                  keys = sorted(k for k in data if k.startswith('spell.') or '.spell.' in k or k.startswith('school.'))
                  f.write(f'[{path}] key_count={len(keys)}\n')
                  for key in keys:
                      f.write(key + '\n')

              f.write('\n== exact namespace data spell paths ==\n')
              for path in sorted(p for p in names if p.startswith('data/somakespells/') and ('spell' in p.lower())):
                  f.write(path + '\n')
          PY

          mapfile -t REGISTRY_CLASSES < <(jar tf somake.jar | grep '\.class$' | grep -Ei '(spell.*registr|registr.*spell|modspells|spellregistry|spellregistries)' | sed 's#/#.#g; s#\.class$##' | sort -u || true)
          {
            echo
            echo '== candidate registry signatures =='
            for cls in "${REGISTRY_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath somake.jar -p "$cls" 2>/dev/null || true
            done
            echo
            echo '== filtered candidate registry bytecode facts =='
            for cls in "${REGISTRY_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath somake.jar -p -c "$cls" 2>/dev/null \
                | grep -E 'AbstractSpell|registerSpell|DeferredRegister|RegisterEvent|Supplier|putstatic|new[[:space:]]|// String |if(eq|ne|lt|le|gt|ge|null|nonnull)|goto' \
                || true
            done
          } >> audit/report.txt

          mapfile -t SPELL_CLASSES < <(jar tf somake.jar | grep '\.class$' | grep -E '/[^/$]*Spell\.class$' | sed 's#/#.#g; s#\.class$##' | sort -u || true)
          {
            echo
            echo '== Spell class constructor/root string facts =='
            for cls in "${SPELL_CLASSES[@]}"; do
              echo "--- $cls ---"
              javap -classpath somake.jar -p -c "$cls" 2>/dev/null \
                | grep -E '<init>|// String [a-z0-9_./:-]+$|AbstractSpell\."<init>"|AbstractSpell\.<init>' \
                || true
            done
            echo
            echo "candidate_registry_class_count=${#REGISTRY_CLASSES[@]}"
            echo "standalone_spell_class_count=${#SPELL_CLASSES[@]}"
          } >> audit/report.txt

          cat audit/report.txt

      - name: Upload text-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: somake-1.0.8-fix-exact-artifact-audit
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
