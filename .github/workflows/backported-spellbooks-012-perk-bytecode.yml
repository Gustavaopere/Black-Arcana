name: Backported Spellbooks 0.1.2 exact perk-causal bytecode

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/backported-spellbooks-012-perk-bytecode.yml'
      - 'docs/qa/backported_012_perk_consumer_bytecode.py'
      - 'docs/qa/backported_012_bomb_thorn_bytecode.py'
      - 'docs/qa/backported_012_slime_aspect_bytecode.py'
      - 'docs/qa/backported_012_slime_boots_fall_bytecode.py'
      - 'wiki/modpack-catalog/providers/✅-backported-spellbooks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded_compiled_provider_methods:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fail-closed synthetic method and publisher-hash regressions
        run: python3 docs/qa/backported_012_perk_consumer_bytecode.py --self-test

      - name: Download the known publisher JAR and enforce installed SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/catalog-backported-012
          FILE=build/catalog-backported-012/backported-012-exact.jar
          EXPECTED=747847c1f38c73250ebac05ea06b41a381187850
          ok=0
          for URL in \
            'https://mediafilez.forgecdn.net/files/8158/731/backportedspellbooks-0.1.2.jar' \
            'https://media.forgecdn.net/files/8158/731/backportedspellbooks-0.1.2.jar' \
            'https://www.curseforge.com/api/v1/mods/1543731/files/8158731/download'
          do
            rm -f "$FILE"
            if curl --fail --silent --show-error --location --retry 2 \
                    --connect-timeout 12 --max-time 95 "$URL" --output "$FILE"; then
              if echo "$EXPECTED  $FILE" | sha1sum --check --status; then
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1
          test "$(wc -c < "$FILE")" -eq 209868
          echo "EXACT_PUBLISHER_SHA1_MATCH=$EXPECTED"

      - name: Verify three bounded compiled provider methods
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/backported_012_perk_consumer_bytecode.py \
            --jar build/catalog-backported-012/backported-012-exact.jar \
            --output build/catalog-backported-012/perk-consumer-evidence.json

      - name: Fail-closed Sulfur Bomb and Pale Thorn regression tests
        run: python3 docs/qa/backported_012_bomb_thorn_bytecode.py --self-test

      - name: Verify exact Sulfur Bomb and Pale Thorn compiled parameters
        run: |
          python3 docs/qa/backported_012_bomb_thorn_bytecode.py \
            --jar build/catalog-backported-012/backported-012-exact.jar \
            --output build/catalog-backported-012/bomb-thorn-evidence.json

      - name: Fail-closed Slime Aspect modifier and casting method regressions
        run: python3 docs/qa/backported_012_slime_aspect_bytecode.py --self-test

      - name: Verify bounded Slime Aspect publisher classfile operands
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/backported_012_slime_aspect_bytecode.py \
            --jar build/catalog-backported-012/backported-012-exact.jar \
            --output build/catalog-backported-012/slime-aspect-evidence.json

      - name: Bounded diagnostics only when Slime Aspect verification fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          F=build/catalog-backported-012/backported-012-exact.jar
          if [[ -f "$F" ]]; then
            echo "DIAGNOSTIC: javap method bytecode; not gameplay evidence"
            for CLASS in \
              net.redreaper.backported_spellbooks.spells.nature.AspectOfTheSlimeSpell \
              net.redreaper.backported_spellbooks.init.ModMobEffects; do
              javap -p -c -classpath "$F" "$CLASS" | tail -n 175
            done
          fi

      - name: Fail-closed Slime Boots equipment and fall-guard regression tests
        run: python3 docs/qa/backported_012_slime_boots_fall_bytecode.py --self-test

      - name: Verify Slime Boots publisher attributes and separate fall cancel
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/backported_012_slime_boots_fall_bytecode.py \
            --jar build/catalog-backported-012/backported-012-exact.jar \
            --output build/catalog-backported-012/slime-boots-fall-evidence.json

      - name: Bounded fall and Slime Boots diagnostic if gate fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          F=build/catalog-backported-012/backported-012-exact.jar
          if [[ -f "$F" ]]; then
            echo "DIAGNOSTIC: compiled operands, not player QA"
            for CLASS in \
              net.redreaper.backported_spellbooks.item.armor.SlimeBootsArmorItem \
              net.redreaper.backported_spellbooks.events.ServerEvents; do
              javap -p -c -classpath "$F" "$CLASS" | tail -n 170
            done
          fi

      - name: Publish bounded JSON evidence only, never publisher JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backported-012-perk-consumer-${{ github.sha }}
          path: |
            build/catalog-backported-012/perk-consumer-evidence.json
            build/catalog-backported-012/bomb-thorn-evidence.json
            build/catalog-backported-012/slime-aspect-evidence.json
            build/catalog-backported-012/slime-boots-fall-evidence.json
          if-no-files-found: ignore
          retention-days: 14
