name: audit-puffish-skills-0.19.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/puffish-skills
          cd build/audit/puffish-skills
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/puffish-skills-835091/8792775/puffish-skills-835091-8792775.jar" \
            -o puffish_skills-0.19.0-1.21-neoforge.jar
          test -s puffish_skills-0.19.0-1.21-neoforge.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/puffish-skills
          EXPECTED_SHA1="fa134a526ab2f098559b7d824269ae36aaac32b3"
          ACTUAL_SHA1="$(sha1sum puffish_skills-0.19.0-1.21-neoforge.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum puffish_skills-0.19.0-1.21-neoforge.jar | awk '{print $1}')"
          BYTES="$(stat -c %s puffish_skills-0.19.0-1.21-neoforge.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=835091/8792775"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Inventory exact provider surface
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/puffish-skills
          jar tf puffish_skills-0.19.0-1.21-neoforge.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib, re, zipfile
          jar=pathlib.Path('puffish_skills-0.19.0-1.21-neoforge.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              provider_data=[n for n in names if n.startswith('data/puffish_skills/')]
              semantic_paths=[n for n in names if re.search(r'(spell|magic|ritual|rite|glyph|mana|arcane|summon|teleport|ability)', n, re.I)]
              skill_paths=[n for n in names if re.search(r'(skill|reward|experience|category|exchange)', n, re.I)]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\n'
                  f'provider_data={len(provider_data)}\nsemantic_path_hits={len(semantic_paths)}\nskill_path_hits={len(skill_paths)}\n',
                  encoding='utf-8')
              pathlib.Path('provider-data.txt').write_text('\n'.join(provider_data)+'\n',encoding='utf-8')
              pathlib.Path('semantic-paths.txt').write_text('\n'.join(semantic_paths)+'\n',encoding='utf-8')
              pathlib.Path('skill-paths.txt').write_text('\n'.join(skill_paths)+'\n',encoding='utf-8')
          PY

      - name: Dump skill reward and experience classes
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/puffish-skills
          : > candidate-classes.txt
          grep -Ei '(skill|reward|experience|category|exchange).*\.class$' jar-entries.txt > candidate-classes.txt || true
          : > javap-candidates.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-candidates.txt
            javap -classpath puffish_skills-0.19.0-1.21-neoforge.jar -p -c -constants "$cls" >> javap-candidates.txt 2>&1 || true
          done < candidate-classes.txt
          grep -Ei 'attribute|command|scoreboard|tag|point|reward|experience|unlock|skill|category|exchange|spell|magic|ritual|mana|arcane|summon|teleport' javap-candidates.txt > candidate-seams.txt || true

      - name: Parse packaged provider JSON
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/puffish-skills
          python3 - <<'PY'
          import json, pathlib, zipfile
          rows=[]; invalid=[]
          with zipfile.ZipFile('puffish_skills-0.19.0-1.21-neoforge.jar') as z:
              for name in sorted(z.namelist()):
                  if not name.startswith('data/puffish_skills/') or not name.endswith('.json'): continue
                  try:
                      data=json.loads(z.read(name))
                      compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  except Exception as e:
                      invalid.append((name,type(e).__name__))
                      continue
                  rows.append((name,compact))
          pathlib.Path('provider-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
          pathlib.Path('provider-json-counts.txt').write_text(f'valid={len(rows)}\ninvalid={len(invalid)}\n',encoding='utf-8')
          pathlib.Path('provider-json-invalid.txt').write_text('\n'.join(f'{n}\t{e}' for n,e in invalid)+'\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: puffish-skills-0.19.0-exact-artifact-audit
          path: |
            build/audit/puffish-skills/hashes.txt
            build/audit/puffish-skills/inventory.txt
            build/audit/puffish-skills/jar-entries.txt
            build/audit/puffish-skills/provider-data.txt
            build/audit/puffish-skills/semantic-paths.txt
            build/audit/puffish-skills/skill-paths.txt
            build/audit/puffish-skills/candidate-classes.txt
            build/audit/puffish-skills/javap-candidates.txt
            build/audit/puffish-skills/candidate-seams.txt
            build/audit/puffish-skills/provider-json.txt
            build/audit/puffish-skills/provider-json-counts.txt
            build/audit/puffish-skills/provider-json-invalid.txt
          if-no-files-found: error
