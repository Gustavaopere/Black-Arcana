name: Phase 2BH final evidence reconciliation

on:
  push:
    branches:
      - docs/phase2bh-final-evidence
    paths:
      - .github/workflows/phase2bh-final-evidence.yml
      - .github/phase2bh_final_evidence.py

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical Phase 2BH evidence
        run: python .github/phase2bh_final_evidence.py
      - name: Validate diff
        run: |
          git diff --check
          grep -F '**1249 semantic magic objects' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '**Canonical provider-component coverage after Phase 2BH: 57/100 = 57%.**' wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md
          grep -F '## Checkpoint Goety — Phase 2BH canonical' wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md
          grep -F 'componente #57 canônico' wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md
      - name: Commit final evidence and remove temporary harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/phase2bh_final_evidence.py .github/workflows/phase2bh-final-evidence.yml
          git add wiki/modpack-catalog
          git diff --cached --check
          git commit -m 'docs: record Phase 2BH final evidence'
          git push origin HEAD
