name: Epic Fight 21.17.3.1 temporary datapack override restore QA (NeoForge 21.1.250)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/epicfight-211731-datapack-override-cycle.yml'
      - 'src/epicFightCatalogQa/**'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_datapack_override_restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and fingerprint exact physical Epic Fight artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/epicfight-loaded-qa
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://cursemaven.com/curse/maven/epic-fight-mod-405076/8175609/epic-fight-mod-405076-8175609.jar' \
            --output build/epicfight-loaded-qa/epicfight-exact.jar
          echo 'fb199b7bbea2fc402da28ab586e73f47e32f8fc0  build/epicfight-loaded-qa/epicfight-exact.jar' | sha1sum --check
          echo '8b882554cf10086398340fbdc741819ee72a801a3adce516c7f4768326a39526  build/epicfight-loaded-qa/epicfight-exact.jar' | sha256sum --check
          jar tf build/epicfight-loaded-qa/epicfight-exact.jar | grep -Fx 'yesman/epicfight/registry/EpicFightRegistries.class'
          javap -classpath build/epicfight-loaded-qa/epicfight-exact.jar -p yesman.epicfight.skill.Skill | grep -F 'attributes;'

      - name: Build isolated QA companion with physical NeoForge release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pneo_version=21.1.250 epicFightCatalogQaJar
          QAJAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_epicfight_qa-*.jar' | head -n 1)"
          test -n "$QAJAR"
          jar tf "$QAJAR" | grep -Fx 'dev/gustavopere/blackarcana/qa/epicfight/EpicFightCatalogQaMod.class'
          unzip -p "$QAJAR" META-INF/neoforge.mods.toml | grep -Fq 'modId="epicfight"'
          unzip -p "$QAJAR" META-INF/neoforge.mods.toml | grep -Fq 'versionRange="[21.1.250,)"'
          ./gradlew --no-daemon -Pneo_version=21.1.250 jar
          PROD="$(find build/libs -maxdepth 1 -type f -name 'black_arcana-*.jar' | head -n 1)"
          test -n "$PROD"
          if jar tf "$PROD" | grep -Fq 'EpicFightCatalogQaMod'; then
            echo 'QA-only class leaked into production JAR'
            exit 1
          fi

      - name: Boot provider JAR as real NeoForge mod, record loaded skill entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server/mods build/epicfight-loaded-qa
          PUBLISHER="$PWD/build/epicfight-loaded-qa/epicfight-exact.jar"
          QAJAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_epicfight_qa-*.jar' | head -n 1)"
          cp "$PUBLISHER" runs/server/mods/epicfight-21.17.3.1.jar
          cp "$QAJAR" runs/server/mods/"$(basename "$QAJAR")"
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/epicfight-loaded-qa/server.log"
          BLACK_ARCANA_EPICFIGHT_QA_OVERRIDE_CYCLE=1 \
            ./gradlew --no-daemon -Pneo_version=21.1.250 runServer > "$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -f runs/server/mods/epicfight-21.17.3.1.jar
            rm -f runs/server/mods/black_arcana_epicfight_qa-*.jar
          }
          trap cleanup EXIT
          COMPLETE=0
          for _ in $(seq 1 150); do
            if grep -Fq '[BLACK_ARCANA_EPICFIGHT_OVERRIDE_QA] type=end status=' "$LOG" && \
               grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              COMPLETE=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              tail -n 100 "$LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$COMPLETE" != 1 ]]; then
            tail -n 100 "$LOG"
            echo 'Loaded provider QA evidence not available'
            exit 1
          fi

      - name: Verify all 3 datapack phases and write bounded original QA JSON
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runs/server/world/datapacks/black_arcana_epicfight_override_qa
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path("build/epicfight-loaded-qa/server.log").read_text(errors="replace")
          prefix = r"\[BLACK_ARCANA_EPICFIGHT_OVERRIDE_QA\]"
          qa_lines = [line.split("[BLACK_ARCANA_EPICFIGHT_OVERRIDE_QA]", 1)[-1].strip()
                      for line in log.splitlines()
                      if "[BLACK_ARCANA_EPICFIGHT_OVERRIDE_QA]" in line]
          print("OVERRIDE_QA_DIAGNOSTIC_LINES=" + json.dumps(qa_lines[:38]))
          assert re.search(r"\[BLACK_ARCANA_EPICFIGHT_LOADED_QA\] type=begin provider=epicfight loaded=true\b", log)
          expected_base = {
              "adaptive_skin": 0, "adrenaline_fiend": 0, "catharsis": 0,
              "bonebreaker": 0, "vengeance": 0,
              "swordmaster": 2, "forbidden_strength": 2, "technician": 1,
          }
          counts = {}
          for phase in ("baseline", "override", "restored"):
              expected = dict(expected_base)
              if phase == "override":
                  expected["adaptive_skin"] = 1
              found = {}
              for skill, wanted in expected.items():
                  pattern = (prefix + r" type=observation phase=" + phase +
                             r" id=epicfight:" + skill + r" count=(\d+) expected=(\d+)\b")
                  matches = re.findall(pattern, log)
                  assert len(matches) == 1, f"{phase}: expected one entry for {skill}: {matches}"
                  actual, declared = map(int, matches[0])
                  assert actual == declared == wanted, f"{phase}: {skill} {actual}/{wanted}"
                  found["epicfight:" + skill] = actual
              assert re.search(prefix + r" type=phase_end phase=" + phase +
                               r" status=OBSERVED observed=8\b", log), f"{phase} missing phase-end"
              counts[phase] = found
          assert re.search(prefix + r" type=override_begin status=REQUESTED\b", log)
          assert re.search(prefix + r" type=restore_begin status=REQUESTED\b", log)
          assert re.search(prefix + r" type=end status=OBSERVED phases=baseline,override,restored\b", log)
          result = {
              "scope": "ISOLATED_EPICFIGHT_PROVIDER_LOADED_ORIGINAL_TEMPORARY_DATAPACK_OVERRIDE",
              "status": "OVERRIDE_APPLY_AND_RESTORE_OBSERVED",
              "provider": "epicfight", "version": "21.17.3.1", "neoforge": "21.1.250",
              "sha1": "fb199b7bbea2fc402da28ab586e73f47e32f8fc0",
              "fixture": "black_arcana_epicfight_qa:adaptive_skin_control",
              "counts": counts,
              "not_evidenced": ["full_587_modpack", "player_attribute_instance",
                                "skill_equip", "skill_unequip", "client_sync", "mastery_hook"],
          }
          out = pathlib.Path("build/epicfight-loaded-qa/override-cycle-evidence.json")
          out.write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Publish bounded evidence without publisher or QA JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epicfight-datapack-override-restore-evidence-${{ github.sha }}
          path: build/epicfight-loaded-qa/override-cycle-evidence.json
          if-no-files-found: ignore
          retention-days: 14
