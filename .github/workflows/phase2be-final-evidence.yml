name: Phase 2BE Final Evidence Reconciliation

on:
  push:
    branches:
      - docs/phase2be-final-evidence

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile Phase 2BE final evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'Phase 2BE canonicalized at `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0`' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md; then
            echo 'Phase 2BE final evidence already applied.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one occurrence, found {count}'
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          SEM = 'wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'
          CAT = 'wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
          QUEUE = 'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
          CURRENT = 'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
          CHECKPOINT = 'wiki/modpack-catalog/meta/PHASE2BE-CATACLYSM-SPELLBOOKS-1.1.13-EXACT-CHECKPOINT.md'

          replace_once(
              SEM,
              '- latest completed catalog baseline entering Phase 2BE: `main@c5a46a622351b6d9157b4620ca5386889c7bd5f3`, with Black Arcana CI **#2467** GREEN after the Phase 2BD final-evidence reconciliation',
              '- Phase 2BE canonicalized at `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0`: PR #189 exact HEAD `e787699d25b283b8040cd179f605143e8ee396de` passed Black Arcana CI **#2483**; the merge SHA passed Black Arcana CI **#2484 attempt 2** GREEN after attempt 1 ended on an external `code.redspace.io` read timeout before compilation/tests',
              'semantic final evidence anchor',
          )
          replace_once(
              SEM,
              '**Phase 2BE candidate strict minimum: 874 semantic magic objects are reconstructible after applying the exact Cataclysm 1.1.13 closure.**\n\nThe canonical `main` baseline entering PR #189 remains **815** until latest-main reconciliation, merge and exact post-merge validation promote this candidate. The semantic denominator remains incomplete, so neither value is a coverage percentage. Providers with `LOWER_BOUND`, `CONDITIONAL` or `OPEN` state remain outside this sum until their current inventory/eligibility is reconciled.',
              '**874 semantic magic objects are currently reconstructible from canonical provider records after Phase 2BE.**\n\nThis is a counted minimum, not the final denominator and not a coverage percentage. Providers with `LOWER_BOUND`, `CONDITIONAL` or `OPEN` state remain outside this sum until their current inventory/eligibility is reconciled.',
              'semantic canonical headline',
          )

          replace_once(
              CAT,
              'The reconstructible semantic ledger lives in [`SEMANTIC-MAGIC-COVERAGE.md`](./SEMANTIC-MAGIC-COVERAGE.md). Phase 2BE now reconstructs a **candidate strict counted minimum of 874 semantic magic objects** from provider records that meet the ledger\'s inclusion rule. The canonical `main` baseline entering PR #189 remains **815** until latest-main reconciliation, merge and exact post-merge validation. The global denominator is still incomplete and no semantic percentage is declared.',
              'The reconstructible semantic ledger lives in [`SEMANTIC-MAGIC-COVERAGE.md`](./SEMANTIC-MAGIC-COVERAGE.md). Phase 2BE canonically closes a **strict counted minimum of 874 semantic magic objects** from provider records that meet the ledger\'s inclusion rule. The global denominator is still incomplete and no semantic percentage is declared.',
              'coverage canonical semantic framing',
          )
          replace_once(CAT, 'The latest semantic promotion proposed by Phase 2BE is **Cataclysm: Spellbooks +59**.', 'The latest semantic promotion is **Cataclysm: Spellbooks +59**.', 'coverage latest promotion wording')
          replace_once(
              CAT,
              '**Phase 2BE promotion target: 55/100 = 55%. Component #55 remains candidate on PR #189 until merge, latest-main reconciliation and exact post-merge validation.**',
              '**Canonical provider-component coverage after Phase 2BE: 55/100 = 55%.**\n\nPhase 2BE / PR #189 was audited at exact HEAD `e787699d25b283b8040cd179f605143e8ee396de`, which passed Black Arcana CI **#2483**. It was squash-merged to `main` as `cce7f51794e4e65b0d97511eb55f710afc6e02f0`. Black Arcana CI **#2484 attempt 1** ended before compilation/tests on a transient external read timeout fetching Iron\'s API from `code.redspace.io`; rerunning the same job on the unchanged merge SHA produced **#2484 attempt 2 GREEN**, including unit tests, diff sanity, NeoForge build, built-JAR verification, Foundation GameTest server, dedicated-server smoke and canonical QA-JAR publication.',
              'coverage component canonicalization',
          )
          replace_once(CAT, '## Recent canonical closures and current promotion candidate', '## Canonical recent closure sequence', 'coverage sequence heading')
          replace_once(
              CAT,
              '| 55 | Phase 2BE / PR #189 | `cataclysm_spellbooks` | exact 1.1.13 59-spell identity closure; candidate until merge/latest-main reconciliation and post-merge validation |',
              '| 55 | Phase 2BE / PR #189 | `cataclysm_spellbooks` | canonical at `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0`; audited HEAD `e787699d25b283b8040cd179f605143e8ee396de` CI #2483 GREEN; post-merge CI #2484 attempt 2 GREEN |',
              'coverage component 55 row',
          )
          replace_once(CAT, '## Phase 2BE — Cataclysm: Spellbooks 1.1.13 component #55 candidate', '## Phase 2BE — Cataclysm: Spellbooks 1.1.13 component #55, canonical', 'coverage Phase2BE heading')

          replace_once(
              QUEUE,
              '- base auditada para Phase 2BE: `main@c5a46a622351b6d9157b4620ca5386889c7bd5f3`; Phase 2BD final-evidence reconciliation CI #2467 GREEN; fechamento Cataclysm proposto por PR #189;',
              '- `main` canônica após Phase 2BE / PR #189: `cce7f51794e4e65b0d97511eb55f710afc6e02f0`; HEAD auditado `e787699d25b283b8040cd179f605143e8ee396de` CI #2483 GREEN; post-merge CI #2484 attempt 2 GREEN após attempt 1 falhar somente por timeout externo no download da API do Iron\'s;',
              'queue authority anchor',
          )
          replace_once(
              QUEUE,
              'A reconstrução Phase 2BE propõe **874 objetos mágicos semânticos** após aplicar o inventário exato Cataclysm 1.1.13. O baseline canônico de `main` que entra no PR #189 permanece **815** até latest-main reconciliation, merge e validação pós-merge exata. O denominador global continua incompleto e nenhuma porcentagem semântica é declarada.',
              'A reconstrução canônica após Phase 2BE fecha **874 objetos mágicos semânticos** com o inventário exato Cataclysm 1.1.13. O denominador global continua incompleto e nenhuma porcentagem semântica é declarada.',
              'queue semantic canonical framing',
          )
          replace_once(QUEUE, '- mínimo estrito Phase 2BE candidato: **874**;', '- mínimo estrito global canônico: **874**;', 'queue semantic total label')
          replace_once(
              QUEUE,
              '- cobertura-alvo após promoção Phase 2BE: **55/100 = 55%**; componente #55 permanece candidato no PR #189 até merge e validação pós-merge.',
              '- cobertura canônica de componentes após Phase 2BE: **55/100 = 55%**; componente #55 fechado pelo PR #189 com CI pré/pós-merge verde no SHA exato.',
              'queue component canonicalization',
          )
          replace_once(QUEUE, '## Phase 2BE — Cataclysm: Spellbooks 1.1.13 — componente #55 candidato', '## Phase 2BE — Cataclysm: Spellbooks 1.1.13 — componente #55 canônico', 'queue Phase2BE heading')
          replace_once(QUEUE, '/ +59 SEMANTIC MAGICS / #55 CANDIDATE |', '/ +59 SEMANTIC MAGICS / #55 CANONICAL / POST-MERGE CI #2484 ATTEMPT 2 GREEN |', 'queue provider state')
          replace_once(
              QUEUE,
              '| 55 | 2BE / #189 | `cataclysm_spellbooks` | 59/59 exact 1.1.13 spell inventory closure; candidato até merge/latest-main + CI pós-merge |',
              '| 55 | 2BE / #189 | `cataclysm_spellbooks` | CANÔNICO em `main@cce7f517...`; HEAD auditado CI #2483 GREEN; CI pós-merge #2484 attempt 2 GREEN |',
              'queue predecessor row',
          )

          replace_once(
              CURRENT,
              'O denominador interno corrente do catálogo foi reconciliado para **100 componentes mágicos/cross-domain**, dos quais **54 estão canônicos** na base que entra em Phase 2BE; o fechamento Cataclysm propõe o componente #55 via PR #189. O alvo 55/100 é uma métrica técnica de fechamento de componentes e **não** é a porcentagem de spells/magias.',
              'O denominador interno corrente do catálogo foi reconciliado para **100 componentes mágicos/cross-domain**, dos quais **55 estão canônicos** após Phase 2BE / PR #189. Esse 55/100 é uma métrica técnica de fechamento de componentes e **não** é a porcentagem de spells/magias.',
              'current component canonicalization',
          )
          replace_once(
              CURRENT,
              'Esse fechamento é de identidade/contagem. Balance numérico, acquisition, runtime QA e qualquer seam futuro Black Arcana↔Cataclysm Spellbooks continuam separados e fail-closed até evidência provider-native segura.',
              'Esse fechamento é de identidade/contagem. O HEAD exato do PR #189 (`e787699d25b283b8040cd179f605143e8ee396de`) passou CI #2483; o merge `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0` passou CI #2484 attempt 2 completo após um primeiro attempt encerrar por timeout externo no download da API do Iron\'s. Balance numérico, acquisition, runtime QA específico do provider e qualquer seam futuro Black Arcana↔Cataclysm Spellbooks continuam separados e fail-closed até evidência provider-native segura.',
              'current Cataclysm validation evidence',
          )
          replace_once(CURRENT, 'o mínimo semântico estrito global proposto é **874**', 'o mínimo semântico estrito global canônico é **874**', 'current Goety global total wording')

          replace_once(
              CHECKPOINT,
              '- durable closure PR: `#189`\n- isolated non-merge evidence PR: `#188`',
              '- durable closure PR: `#189`\n- audited PR HEAD: `e787699d25b283b8040cd179f605143e8ee396de` — Black Arcana CI **#2483 GREEN**\n- squash merge: `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0`\n- post-merge validation: Black Arcana CI **#2484 attempt 2 GREEN** on that exact merge SHA; attempt 1 ended before compilation/tests on an external `code.redspace.io` read timeout fetching the Iron\'s API dependency\n- isolated non-merge evidence PR: `#188`',
              'checkpoint final evidence anchors',
          )
          replace_once(CHECKPOINT, '## Semantic/catalog delta proposed by PR #189', '## Semantic/catalog delta canonical after PR #189', 'checkpoint delta heading')
          replace_once(CHECKPOINT, '- provider component: candidate **#55** on this PR, becoming canonical only after latest-main reconciliation, merge and exact post-merge validation;\n- structural component coverage candidate: **55/100 = 55%**.', '- provider component: canonical **#55** after merge and exact post-merge validation;\n- structural component coverage canonical: **55/100 = 55%**.', 'checkpoint canonical component')

          for path, needle in [
              (SEM, 'Phase 2BE canonicalized at `main@cce7f51794e4e65b0d97511eb55f710afc6e02f0`'),
              (CAT, 'Canonical provider-component coverage after Phase 2BE: 55/100 = 55%'),
              (QUEUE, 'mínimo estrito global canônico: **874**'),
              (CURRENT, '**55 estão canônicos** após Phase 2BE / PR #189'),
              (CHECKPOINT, 'post-merge validation: Black Arcana CI **#2484 attempt 2 GREEN**'),
          ]:
              assert needle in Path(path).read_text(encoding='utf-8'), f'sanity missing {needle!r}'

          print('Phase 2BE final evidence reconciliation assertions passed')
          PY

      - name: Commit durable evidence reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md \
            wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md \
            wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md \
            wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md \
            wiki/modpack-catalog/meta/PHASE2BE-CATACLYSM-SPELLBOOKS-1.1.13-EXACT-CHECKPOINT.md
          if git diff --cached --quiet; then
            echo 'No final evidence changes to commit.'
            exit 0
          fi
          git commit -m 'docs: record Phase 2BE final merge evidence'
          git push origin HEAD:docs/phase2be-final-evidence
