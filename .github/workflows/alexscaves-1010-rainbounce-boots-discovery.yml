name: Alex's Caves 1.0.10 Rainbounce Boots exact static discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-rainbounce-boots-discovery.yml'
      - 'docs/qa/alexscaves_1010_rainbounce_boots_discovery.py'
      - 'docs/qa/alexscaves_1010_rainbounce_boots_discovery_checks.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rainbounce_boots_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pure read-only discovery scripts
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_rainbounce_boots_discovery.py
          python3 -m py_compile docs/qa/alexscaves_1010_rainbounce_boots_discovery_checks.py
      - name: Retrieve publisher JAR, verified inside the audit
        run: |
          mkdir -p build/rainbounce-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/rainbounce-1010/publisher.jar
      - name: Record exact native methods and typed reference consumers
        run: |
          python3 docs/qa/alexscaves_1010_rainbounce_boots_discovery.py \
            --jar build/rainbounce-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/rainbounce-1010/report.json
      - name: Validate bounded evidence and reject corrupt report
        run: |
          python3 docs/qa/alexscaves_1010_rainbounce_boots_discovery_checks.py \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAINBOUNCE-BOOTS-DISCOVERY-1.0.10.json' \
            --report build/rainbounce-1010/report.json
          echo '{}' > build/rainbounce-1010/invalid.json
          if python3 docs/qa/alexscaves_1010_rainbounce_boots_discovery_checks.py \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAINBOUNCE-BOOTS-DISCOVERY-1.0.10.json' \
              --report build/rainbounce-1010/invalid.json; then
            echo 'FAIL: invalid Rainbounce report was accepted'
            exit 1
          fi
      - name: Store unmodified native discovery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-rainbounce-boots-discovery
          path: build/rainbounce-1010/report.json
          if-no-files-found: warn
          retention-days: 14
