name: Stage 05 Real Client Probe

on:
  push:
    branches:
      - qa/stage05-real-client-probe

permissions:
  contents: read

concurrency:
  group: stage05-real-client-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real_client_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual-display capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri

      - name: Build removable Stage 05 QA companion
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Rebind Black Arcana radial in real client and verify restart persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage05-real-client-probe runs/client/mods runs/client
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          cp "$FIXTURE_JAR" "runs/client/mods/$(basename "$FIXTURE_JAR")"

          cat > runs/client/options.txt <<'EOF'
          fullscreen:false
          guiScale:2
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          maxFps:30
          onboardAccessibility:false
          EOF

          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stage05-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > build/stage05-real-client-probe/xvfb.log 2>&1 &
          XVFB_PID=$!
          GRADLE_PID=""

          stop_client() {
            if [[ -n "${GRADLE_PID:-}" ]]; then
              kill "$GRADLE_PID" 2>/dev/null || true
            fi
            pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
            if [[ -n "${GRADLE_PID:-}" ]]; then
              wait "$GRADLE_PID" 2>/dev/null || true
            fi
            GRADLE_PID=""
            sleep 3
          }

          cleanup() {
            stop_client
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 2

          launch_client() {
            local log_path="$1"
            ./gradlew --no-daemon runClient >"$log_path" 2>&1 &
            GRADLE_PID=$!
            local window_id=""
            for _ in $(seq 1 240); do
              window_id="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n 1 || true)"
              if [[ -n "$window_id" ]]; then
                echo "$window_id"
                return 0
              fi
              if ! kill -0 "$GRADLE_PID" 2>/dev/null; then
                cat "$log_path"
                return 1
              fi
              sleep 1
            done
            cat "$log_path"
            return 1
          }

          FIRST_LOG="$PWD/build/stage05-real-client-probe/gradle-client-first.log"
          WINDOW_ID="$(launch_client "$FIRST_LOG")"
          test -n "$WINDOW_ID"
          xdotool windowactivate --sync "$WINDOW_ID"
          xdotool getwindowgeometry --shell "$WINDOW_ID" > build/stage05-real-client-probe/window-geometry-first.txt
          sleep 24
          ! grep -Fq 'Failed to load options' "$FIRST_LOG"
          scrot build/stage05-real-client-probe/main-menu-before-rebind.png

          # Main menu -> Options -> Controls -> Key Binds.
          xdotool mousemove --window "$WINDOW_ID" 324 416 click 1
          sleep 2
          xdotool mousemove --window "$WINDOW_ID" 584 243 click 1
          sleep 2
          xdotool mousemove --window "$WINDOW_ID" 584 94 click 1
          sleep 2

          # Scroll the native list to the final Black Arcana category.
          xdotool mousemove 700 360
          for _ in $(seq 1 120); do xdotool click 5; done
          sleep 2
          scrot build/stage05-real-client-probe/key-binds-before-rebind.png

          # Open Spell Radial is the top visible Black Arcana row at the list bottom.
          # Click its native binding button and assign B through the ordinary Controls UI.
          xdotool mousemove --window "$WINDOW_ID" 580 75 click 1
          sleep 1
          xdotool key --window "$WINDOW_ID" b
          sleep 2
          scrot build/stage05-real-client-probe/key-binds-after-rebind.png

          # Commit the screen and return to main menu so Minecraft persists options.txt.
          xdotool mousemove --window "$WINDOW_ID" 584 448 click 1
          sleep 2
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2
          cp runs/client/options.txt build/stage05-real-client-probe/options-after-ui-rebind.txt
          grep -i 'black_arcana' runs/client/options.txt > build/stage05-real-client-probe/black-arcana-after-ui-rebind.txt
          grep -Fq 'key_key.black_arcana.open_radial:key.keyboard.b' runs/client/options.txt

          stop_client

          # Relaunch without rewriting options.txt. This is the restart-persistence check.
          SECOND_LOG="$PWD/build/stage05-real-client-probe/gradle-client-restart.log"
          WINDOW_ID="$(launch_client "$SECOND_LOG")"
          test -n "$WINDOW_ID"
          xdotool windowactivate --sync "$WINDOW_ID"
          sleep 24
          ! grep -Fq 'Failed to load options' "$SECOND_LOG"
          scrot build/stage05-real-client-probe/main-menu-after-restart.png
          cp runs/client/options.txt build/stage05-real-client-probe/options-after-restart.txt
          grep -i 'black_arcana' runs/client/options.txt > build/stage05-real-client-probe/black-arcana-after-restart.txt
          grep -Fq 'key_key.black_arcana.open_radial:key.keyboard.b' runs/client/options.txt

          # Observe the persisted B binding in the native Controls UI after restart.
          xdotool windowactivate --sync "$WINDOW_ID"
          xdotool mousemove --window "$WINDOW_ID" 324 416 click 1
          sleep 2
          xdotool mousemove --window "$WINDOW_ID" 584 243 click 1
          sleep 2
          xdotool mousemove --window "$WINDOW_ID" 584 94 click 1
          sleep 2
          xdotool mousemove 700 360
          for _ in $(seq 1 120); do xdotool click 5; done
          sleep 2
          scrot build/stage05-real-client-probe/key-binds-after-restart.png

          if [[ -f runs/client/logs/latest.log ]]; then
            cp runs/client/logs/latest.log build/stage05-real-client-probe/minecraft-latest-after-restart.log
          fi
          grep -Fq 'Black Arcana foundation loaded' "$SECOND_LOG" || grep -Fq 'Black Arcana foundation loaded' runs/client/logs/latest.log

          echo 'Real-client Black Arcana UI rebind/restart preflight: PASS'

      - name: Upload real-client probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage05-real-client-probe-${{ github.sha }}
          path: |
            build/stage05-real-client-probe/**
            runs/client/crash-reports/**
          if-no-files-found: warn
          retention-days: 3
