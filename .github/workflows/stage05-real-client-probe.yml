name: Stage 05 Real Client Probe

on:
  push:
    branches:
      - qa/stage05-real-client-probe

permissions:
  contents: read

concurrency:
  group: stage05-real-client-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconnect_calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual-display capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri

      - name: Build removable Stage 05 QA companion
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Apply server-owned loadout and calibrate save-quit/reconnect UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage05-real-client-probe runs/client/mods runs/client
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          cp "$FIXTURE_JAR" "runs/client/mods/$(basename "$FIXTURE_JAR")"

          cat > runs/client/options.txt <<'EOF'
          version:3955
          fullscreen:false
          guiScale:2
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          maxFps:30
          onboardAccessibility:false
          key_key.black_arcana.open_radial:key.keyboard.r
          key_key.black_arcana.cast_selected:key.keyboard.v
          key_key.black_arcana.edit_loadout:key.keyboard.g
          key_key.black_arcana.quick_cast_1:key.keyboard.unknown
          key_key.black_arcana.quick_cast_2:key.keyboard.unknown
          key_key.black_arcana.quick_cast_3:key.keyboard.unknown
          key_key.black_arcana.quick_cast_4:key.keyboard.unknown
          key_key.black_arcana.quick_cast_5:key.keyboard.unknown
          key_key.black_arcana.quick_cast_6:key.keyboard.unknown
          key_key.black_arcana.quick_cast_7:key.keyboard.unknown
          key_key.black_arcana.quick_cast_8:key.keyboard.unknown
          EOF

          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stage05-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > build/stage05-real-client-probe/xvfb-reconnect-calibration.log 2>&1 &
          XVFB_PID=$!
          CLIENT_LOG="$PWD/build/stage05-real-client-probe/gradle-client-reconnect-calibration.log"
          ./gradlew --no-daemon runClient >"$CLIENT_LOG" 2>&1 &
          GRADLE_PID=$!

          cleanup() {
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          WINDOW_ID=""
          for _ in $(seq 1 240); do
            WINDOW_ID="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n 1 || true)"
            if [[ -n "$WINDOW_ID" ]]; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test -n "$WINDOW_ID"
          sleep 24
          ! grep -Fq 'Failed to load options' "$CLIENT_LOG"

          # Title -> Singleplayer -> Create New World.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          xdotool mousemove --window "$WINDOW_ID" 268 448 click 1

          WORLD_READY=0
          for _ in $(seq 1 180); do
            if [[ -f runs/client/logs/latest.log ]] && grep -Fq 'joined the game' runs/client/logs/latest.log; then WORLD_READY=1; break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test "$WORLD_READY" -eq 1
          sleep 6

          filter_fixture() {
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
            xdotool type --window "$WINDOW_ID" --delay 15 'black_arcana_stage05_qa'
            sleep 1
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
          }

          select_fixture_16() {
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
            for _ in $(seq 1 7); do xdotool key --window "$WINDOW_ID" Up; done
            xdotool key --window "$WINDOW_ID" Page_Down
            sleep 1
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
          }

          open_filtered_editor() {
            xdotool key --window "$WINDOW_ID" g
            sleep 3
            filter_fixture
          }

          open_filtered_editor
          select_fixture_16
          xdotool key --window "$WINDOW_ID" Return
          sleep 5
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout-before-disconnect-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 2
          scrot build/stage05-real-client-probe/loadout-before-disconnect-page2.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2

          # Open Game Menu and capture the exact layout before selecting Save and Quit to Title.
          xdotool key --window "$WINDOW_ID" Escape
          sleep 3
          scrot build/stage05-real-client-probe/pause-menu-before-save-quit.png

          # GUI-scale-2 Save and Quit to Title center measured from the calibration capture.
          xdotool mousemove --window "$WINDOW_ID" 427 384 click 1

          STOPPED=0
          for _ in $(seq 1 90); do
            if [[ -f runs/client/logs/latest.log ]] && grep -Fq 'Stopping server' runs/client/logs/latest.log; then STOPPED=1; break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test "$STOPPED" -eq 1
          sleep 6
          scrot build/stage05-real-client-probe/title-after-save-quit.png

          # Re-enter Singleplayer only far enough to capture the existing-world selection screen.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          scrot build/stage05-real-client-probe/world-select-after-save-quit.png

          cp runs/client/logs/latest.log build/stage05-real-client-probe/minecraft-latest-reconnect-calibration.log
          grep -Fq 'Black Arcana foundation loaded' "$CLIENT_LOG" || grep -Fq 'Black Arcana foundation loaded' runs/client/logs/latest.log
          echo 'Reconnect UI calibration captured.'

      - name: Upload reconnect calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage05-real-client-reconnect-calibration-${{ github.sha }}
          path: |
            build/stage05-real-client-probe/**
            runs/client/logs/latest.log
            runs/client/crash-reports/**
          if-no-files-found: warn
          retention-days: 3
