name: Stage 05 Real Client Probe

on:
  push:
    branches:
      - qa/stage05-real-client-probe

permissions:
  contents: read

concurrency:
  group: stage05-real-client-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radial16_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual-display capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri

      - name: Build removable Stage 05 QA companion
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Exercise all sixteen canonical radial selections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage05-real-client-probe runs/client/mods runs/client
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          cp "$FIXTURE_JAR" "runs/client/mods/$(basename "$FIXTURE_JAR")"

          cat > runs/client/options.txt <<'EOF'
          version:3955
          fullscreen:false
          guiScale:2
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          maxFps:30
          onboardAccessibility:false
          key_key.black_arcana.open_radial:key.keyboard.r
          key_key.black_arcana.cast_selected:key.keyboard.v
          key_key.black_arcana.edit_loadout:key.keyboard.g
          key_key.black_arcana.quick_cast_1:key.keyboard.unknown
          key_key.black_arcana.quick_cast_2:key.keyboard.unknown
          key_key.black_arcana.quick_cast_3:key.keyboard.unknown
          key_key.black_arcana.quick_cast_4:key.keyboard.unknown
          key_key.black_arcana.quick_cast_5:key.keyboard.unknown
          key_key.black_arcana.quick_cast_6:key.keyboard.unknown
          key_key.black_arcana.quick_cast_7:key.keyboard.unknown
          key_key.black_arcana.quick_cast_8:key.keyboard.unknown
          EOF

          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stage05-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > build/stage05-real-client-probe/xvfb-radial16.log 2>&1 &
          XVFB_PID=$!
          CLIENT_LOG="$PWD/build/stage05-real-client-probe/gradle-client-radial16.log"
          ./gradlew --no-daemon runClient >"$CLIENT_LOG" 2>&1 &
          GRADLE_PID=$!

          cleanup() {
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          WINDOW_ID=""
          for _ in $(seq 1 240); do
            WINDOW_ID="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n 1 || true)"
            if [[ -n "$WINDOW_ID" ]]; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test -n "$WINDOW_ID"
          sleep 24
          ! grep -Fq 'Failed to load options' "$CLIENT_LOG"

          joined_count() {
            grep -Fc 'joined the game' runs/client/logs/latest.log 2>/dev/null || true
          }

          wait_join_increment() {
            local baseline="$1"
            for _ in $(seq 1 180); do
              local current
              current="$(joined_count)"
              if (( current > baseline )); then return 0; fi
              if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; return 1; fi
              sleep 1
            done
            return 1
          }

          attempt_count() {
            grep -Fc 'STAGE05_QA_CAST_ATTEMPT' runs/client/logs/latest.log 2>/dev/null || true
          }

          last_attempt() {
            grep 'STAGE05_QA_CAST_ATTEMPT' runs/client/logs/latest.log 2>/dev/null | tail -n 1 || true
          }

          wait_attempt_increment() {
            local baseline="$1"
            for _ in $(seq 1 20); do
              local current
              current="$(attempt_count)"
              if (( current > baseline )); then return 0; fi
              sleep 0.5
            done
            return 1
          }

          filter_fixture() {
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
            xdotool type --window "$WINDOW_ID" --delay 15 'black_arcana_stage05_qa'
            sleep 1
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
          }

          select_fixture_16() {
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
            for _ in $(seq 1 7); do xdotool key --window "$WINDOW_ID" Up; done
            xdotool key --window "$WINDOW_ID" Page_Down
            sleep 1
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
          }

          open_filtered_editor() {
            xdotool key --window "$WINDOW_ID" g
            sleep 3
            filter_fixture
          }

          capture_selected() {
            local slot="$1"
            xdotool key --window "$WINDOW_ID" r
            sleep 1
            printf -v filename 'radial-selected-slot-%02d.png' "$slot"
            scrot "build/stage05-real-client-probe/$filename"
            xdotool key --window "$WINDOW_ID" Escape
            sleep 0.5
          }

          verify_cast_for_slot() {
            local slot="$1"
            local before
            before="$(attempt_count)"
            xdotool key --window "$WINDOW_ID" v
            wait_attempt_increment "$before"
            local after
            after="$(attempt_count)"
            test "$after" -eq $((before + 1))
            printf -v expected 'black_arcana_stage05_qa:slot_%02d' "$slot"
            last_attempt | grep -Fq "spell=$expected"
            printf '%02d %s %s\n' "$slot" "$before" "$after" >> build/stage05-real-client-probe/radial16-cast-confirmations.txt
          }

          select_without_cast() {
            local slot="$1"
            local before
            before="$(attempt_count)"
            xdotool key --window "$WINDOW_ID" r
            sleep 0.75
            if [[ "$slot" -eq 1 ]]; then
              xdotool key --window "$WINDOW_ID" Return
            elif [[ "$slot" -eq 9 ]]; then
              # From selected slot 8: page change preserves relative index 7 -> slot 16;
              # one Tab wraps to slot 9, the first entry on page two.
              xdotool key --window "$WINDOW_ID" Page_Down
              xdotool key --window "$WINDOW_ID" Tab
              xdotool key --window "$WINDOW_ID" Return
            else
              xdotool key --window "$WINDOW_ID" Tab
              xdotool key --window "$WINDOW_ID" Return
            fi
            sleep 0.75
            test "$(attempt_count)" -eq "$before"
            capture_selected "$slot"
            test "$(attempt_count)" -eq "$before"
            verify_cast_for_slot "$slot"
          }

          # Create one legitimate integrated-server world.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          xdotool mousemove --window "$WINDOW_ID" 268 448 click 1
          wait_join_increment 0
          sleep 6

          # Populate exactly 16 server-owned slots via the normal editor intent.
          open_filtered_editor
          select_fixture_16
          xdotool key --window "$WINDOW_ID" Return
          sleep 5
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout16-radial-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 1
          scrot build/stage05-real-client-probe/loadout16-radial-page2.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1

          # Every selection operation must be non-casting. The explicit V immediately after it
          # is the only operation allowed to create one server-side cast-attempt marker.
          for slot in $(seq 1 16); do
            select_without_cast "$slot"
          done

          # PageDown beyond the canonical second page must not expose a third page or change selection.
          BOUND_BEFORE="$(attempt_count)"
          xdotool key --window "$WINDOW_ID" r
          sleep 1
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 1
          scrot build/stage05-real-client-probe/radial-page-down-beyond-slot16.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 0.5
          test "$(attempt_count)" -eq "$BOUND_BEFORE"
          verify_cast_for_slot 16

          test "$(attempt_count)" -eq 17
          test "$(wc -l < build/stage05-real-client-probe/radial16-cast-confirmations.txt)" -eq 17
          cp runs/client/logs/latest.log build/stage05-real-client-probe/minecraft-latest-radial16.log
          cp runs/client/options.txt build/stage05-real-client-probe/options-radial16.txt
          grep -Fq 'Black Arcana foundation loaded' "$CLIENT_LOG" || grep -Fq 'Black Arcana foundation loaded' runs/client/logs/latest.log
          echo 'Real-client sixteen-slot radial reachability preflight evidence captured.'

      - name: Upload sixteen-slot radial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage05-real-client-radial16-${{ github.sha }}
          path: |
            build/stage05-real-client-probe/**
            runs/client/logs/latest.log
            runs/client/crash-reports/**
          if-no-files-found: warn
          retention-days: 3
