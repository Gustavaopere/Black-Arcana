name: Stage 05 Real Client Probe

on:
  push:
    branches:
      - qa/stage05-real-client-probe

permissions:
  contents: read

concurrency:
  group: stage05-real-client-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui_focus_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual-display capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri

      - name: Build removable Stage 05 QA companion
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Exercise GUI-focus suppression with real-client positive controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage05-real-client-probe runs/client/mods runs/client
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          cp "$FIXTURE_JAR" "runs/client/mods/$(basename "$FIXTURE_JAR")"

          cat > runs/client/options.txt <<'EOF'
          version:3955
          fullscreen:false
          guiScale:2
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          maxFps:30
          onboardAccessibility:false
          key_key.black_arcana.open_radial:key.keyboard.r
          key_key.black_arcana.cast_selected:key.keyboard.v
          key_key.black_arcana.edit_loadout:key.keyboard.g
          key_key.black_arcana.quick_cast_1:key.keyboard.unknown
          key_key.black_arcana.quick_cast_2:key.keyboard.unknown
          key_key.black_arcana.quick_cast_3:key.keyboard.unknown
          key_key.black_arcana.quick_cast_4:key.keyboard.unknown
          key_key.black_arcana.quick_cast_5:key.keyboard.unknown
          key_key.black_arcana.quick_cast_6:key.keyboard.unknown
          key_key.black_arcana.quick_cast_7:key.keyboard.unknown
          key_key.black_arcana.quick_cast_8:key.keyboard.unknown
          EOF

          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stage05-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > build/stage05-real-client-probe/xvfb-gui-focus.log 2>&1 &
          XVFB_PID=$!
          CLIENT_LOG="$PWD/build/stage05-real-client-probe/gradle-client-gui-focus.log"
          ./gradlew --no-daemon runClient >"$CLIENT_LOG" 2>&1 &
          GRADLE_PID=$!

          cleanup() {
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          WINDOW_ID=""
          for _ in $(seq 1 240); do
            WINDOW_ID="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n 1 || true)"
            if [[ -n "$WINDOW_ID" ]]; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test -n "$WINDOW_ID"
          sleep 24
          ! grep -Fq 'Failed to load options' "$CLIENT_LOG"

          joined_count() {
            grep -Fc 'joined the game' runs/client/logs/latest.log 2>/dev/null || true
          }

          wait_join_increment() {
            local baseline="$1"
            for _ in $(seq 1 180); do
              local current
              current="$(joined_count)"
              if (( current > baseline )); then return 0; fi
              if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; return 1; fi
              sleep 1
            done
            return 1
          }

          attempt_count() {
            grep -Fc 'STAGE05_QA_CAST_ATTEMPT' runs/client/logs/latest.log 2>/dev/null || true
          }

          wait_attempt_increment() {
            local baseline="$1"
            for _ in $(seq 1 20); do
              local current
              current="$(attempt_count)"
              if (( current > baseline )); then return 0; fi
              sleep 0.5
            done
            return 1
          }

          filter_fixture() {
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
            xdotool type --window "$WINDOW_ID" --delay 15 'black_arcana_stage05_qa'
            sleep 1
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
          }

          select_fixture_16() {
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
            for _ in $(seq 1 7); do xdotool key --window "$WINDOW_ID" Up; done
            xdotool key --window "$WINDOW_ID" Page_Down
            sleep 1
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
          }

          open_filtered_editor() {
            xdotool key --window "$WINDOW_ID" g
            sleep 3
            filter_fixture
          }

          # Create one legitimate integrated-server world.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          xdotool mousemove --window "$WINDOW_ID" 268 448 click 1
          wait_join_increment 0
          sleep 6
          scrot build/stage05-real-client-probe/world-before-loadout.png

          # Populate the canonical server-owned 16-slot loadout through the ordinary editor intent.
          open_filtered_editor
          select_fixture_16
          xdotool key --window "$WINDOW_ID" Return
          sleep 5
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout16-gui-focus-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 2
          scrot build/stage05-real-client-probe/loadout16-gui-focus-page2.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2

          # Positive cast control: V in gameplay must reach the server-owned fixture engine once.
          CAST_BASE="$(attempt_count)"
          xdotool key --window "$WINDOW_ID" v
          wait_attempt_increment "$CAST_BASE"
          CAST_AFTER_WORLD="$(attempt_count)"
          test "$CAST_AFTER_WORLD" -eq $((CAST_BASE + 1))
          echo "$CAST_BASE $CAST_AFTER_WORLD" > build/stage05-real-client-probe/cast-count-positive-control.txt
          sleep 2

          # Positive radial control: non-empty synced loadout + no Screen must open the radial.
          xdotool key --window "$WINDOW_ID" r
          sleep 2
          scrot build/stage05-real-client-probe/radial-positive-control.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1

          # Inventory is a native Screen. Black Arcana radial/cast input must not steal focus or emit a cast intent.
          xdotool key --window "$WINDOW_ID" e
          sleep 2
          scrot build/stage05-real-client-probe/inventory-before-black-arcana-input.png
          CAST_BASE_GUI="$(attempt_count)"
          xdotool key --window "$WINDOW_ID" r
          sleep 1
          xdotool key --window "$WINDOW_ID" v
          sleep 3
          CAST_AFTER_GUI="$(attempt_count)"
          test "$CAST_AFTER_GUI" -eq "$CAST_BASE_GUI"
          echo "$CAST_BASE_GUI $CAST_AFTER_GUI" > build/stage05-real-client-probe/cast-count-with-inventory-open.txt
          scrot build/stage05-real-client-probe/inventory-after-radial-and-cast-input.png

          # Closing the inventory must restore the same positive radial control.
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1
          xdotool key --window "$WINDOW_ID" r
          sleep 2
          scrot build/stage05-real-client-probe/radial-positive-control-after-inventory.png
          xdotool key --window "$WINDOW_ID" Escape

          cp runs/client/logs/latest.log build/stage05-real-client-probe/minecraft-latest-gui-focus.log
          cp runs/client/options.txt build/stage05-real-client-probe/options-gui-focus.txt
          grep -Fq 'Black Arcana foundation loaded' "$CLIENT_LOG" || grep -Fq 'Black Arcana foundation loaded' runs/client/logs/latest.log
          test "$(attempt_count)" -eq "$CAST_AFTER_WORLD"
          echo 'Real-client GUI-focus suppression preflight evidence captured.'

      - name: Upload GUI-focus evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage05-real-client-gui-focus-${{ github.sha }}
          path: |
            build/stage05-real-client-probe/**
            runs/client/logs/latest.log
            runs/client/crash-reports/**
          if-no-files-found: warn
          retention-days: 3
