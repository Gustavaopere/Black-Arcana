name: Stage 05 Real Client Probe

on:
  push:
    branches:
      - qa/stage05-real-client-probe

permissions:
  contents: read

concurrency:
  group: stage05-real-client-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconnect_authority_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual-display capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri

      - name: Build removable Stage 05 QA companion
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Exercise apply clear disconnect reconnect authority in real client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage05-real-client-probe runs/client/mods runs/client
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          cp "$FIXTURE_JAR" "runs/client/mods/$(basename "$FIXTURE_JAR")"

          cat > runs/client/options.txt <<'EOF'
          version:3955
          fullscreen:false
          guiScale:2
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          maxFps:30
          onboardAccessibility:false
          key_key.black_arcana.open_radial:key.keyboard.r
          key_key.black_arcana.cast_selected:key.keyboard.v
          key_key.black_arcana.edit_loadout:key.keyboard.g
          key_key.black_arcana.quick_cast_1:key.keyboard.unknown
          key_key.black_arcana.quick_cast_2:key.keyboard.unknown
          key_key.black_arcana.quick_cast_3:key.keyboard.unknown
          key_key.black_arcana.quick_cast_4:key.keyboard.unknown
          key_key.black_arcana.quick_cast_5:key.keyboard.unknown
          key_key.black_arcana.quick_cast_6:key.keyboard.unknown
          key_key.black_arcana.quick_cast_7:key.keyboard.unknown
          key_key.black_arcana.quick_cast_8:key.keyboard.unknown
          EOF

          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/stage05-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > build/stage05-real-client-probe/xvfb-reconnect-authority.log 2>&1 &
          XVFB_PID=$!
          CLIENT_LOG="$PWD/build/stage05-real-client-probe/gradle-client-reconnect-authority.log"
          ./gradlew --no-daemon runClient >"$CLIENT_LOG" 2>&1 &
          GRADLE_PID=$!

          cleanup() {
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          WINDOW_ID=""
          for _ in $(seq 1 240); do
            WINDOW_ID="$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n 1 || true)"
            if [[ -n "$WINDOW_ID" ]]; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; exit 1; fi
            sleep 1
          done
          test -n "$WINDOW_ID"
          sleep 24
          ! grep -Fq 'Failed to load options' "$CLIENT_LOG"

          joined_count() {
            grep -Fc 'joined the game' runs/client/logs/latest.log 2>/dev/null || true
          }

          stop_count() {
            grep -Fc 'Stopping server' runs/client/logs/latest.log 2>/dev/null || true
          }

          wait_join_increment() {
            local baseline="$1"
            for _ in $(seq 1 180); do
              local current
              current="$(joined_count)"
              if (( current > baseline )); then return 0; fi
              if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; return 1; fi
              sleep 1
            done
            return 1
          }

          wait_stop_increment() {
            local baseline="$1"
            for _ in $(seq 1 90); do
              local current
              current="$(stop_count)"
              if (( current > baseline )); then return 0; fi
              if ! kill -0 "$GRADLE_PID" 2>/dev/null; then cat "$CLIENT_LOG"; return 1; fi
              sleep 1
            done
            return 1
          }

          filter_fixture() {
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
            xdotool type --window "$WINDOW_ID" --delay 15 'black_arcana_stage05_qa'
            sleep 1
            xdotool key --window "$WINDOW_ID" Tab
            sleep 1
          }

          select_fixture_16() {
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
            for _ in $(seq 1 7); do xdotool key --window "$WINDOW_ID" Up; done
            xdotool key --window "$WINDOW_ID" Page_Down
            sleep 1
            for i in $(seq 1 8); do
              xdotool key --window "$WINDOW_ID" space
              sleep 0.25
              if [[ "$i" -lt 8 ]]; then xdotool key --window "$WINDOW_ID" Down; fi
            done
          }

          open_filtered_editor() {
            xdotool key --window "$WINDOW_ID" g
            sleep 3
            filter_fixture
          }

          enter_existing_world() {
            # These coordinates were calibrated from full-screen Xvfb screenshots,
            # so they must remain absolute rather than window-relative.
            xdotool mousemove 520 255 click 1
            sleep 1
            xdotool mousemove 480 516 click 1
          }

          save_quit_to_title() {
            local baseline
            baseline="$(stop_count)"
            xdotool key --window "$WINDOW_ID" Escape
            sleep 3
            xdotool mousemove --window "$WINDOW_ID" 427 384 click 1
            wait_stop_increment "$baseline"
            sleep 6
          }

          # First admission: create the world.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          xdotool mousemove --window "$WINDOW_ID" 268 448 click 1
          wait_join_increment 0
          sleep 6
          scrot build/stage05-real-client-probe/world-first-admission.png

          # Apply all 16 through the ordinary editor intent/server snapshot path.
          open_filtered_editor
          select_fixture_16
          xdotool key --window "$WINDOW_ID" Return
          sleep 5
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout-applied16-before-disconnect-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 2
          scrot build/stage05-real-client-probe/loadout-applied16-before-disconnect-page2.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2

          # Deliberately leave local selection on slot 16 before disconnect.
          xdotool key --window "$WINDOW_ID" r
          sleep 1
          xdotool key --window "$WINDOW_ID" Page_Down
          for _ in $(seq 1 7); do xdotool key --window "$WINDOW_ID" Tab; done
          xdotool key --window "$WINDOW_ID" Return
          sleep 1
          xdotool key --window "$WINDOW_ID" r
          sleep 2
          scrot build/stage05-real-client-probe/radial-selected16-before-disconnect.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1

          # Disconnect by stopping the integrated server.
          save_quit_to_title
          scrot build/stage05-real-client-probe/title-after-first-disconnect.png

          # First reconnect: same persisted world, new integrated-server lifecycle.
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          scrot build/stage05-real-client-probe/world-select-first-reconnect.png
          JOIN_BASE="$(joined_count)"
          enter_existing_world
          wait_join_increment "$JOIN_BASE"
          sleep 6
          scrot build/stage05-real-client-probe/world-after-first-reconnect.png

          # Local slot-16 selection must not be trusted across disconnect; capture reconciled radial state.
          xdotool key --window "$WINDOW_ID" r
          sleep 2
          scrot build/stage05-real-client-probe/radial-after-first-reconnect.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 1

          # Server-owned 16-slot state must be restored by the reconnect snapshot.
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout-after-first-reconnect-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 2
          scrot build/stage05-real-client-probe/loadout-after-first-reconnect-page2.png

          # Clear through the ordinary editor intent, then verify the current server snapshot is empty.
          xdotool key --window "$WINDOW_ID" Delete
          sleep 1
          scrot build/stage05-real-client-probe/loadout-clear-draft-after-reconnect.png
          xdotool key --window "$WINDOW_ID" Return
          sleep 5
          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout-cleared-server-snapshot-before-second-disconnect.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2

          # Disconnect/reconnect again so stale pre-clear client authority cannot explain the result.
          save_quit_to_title
          scrot build/stage05-real-client-probe/title-after-second-disconnect.png
          xdotool mousemove --window "$WINDOW_ID" 427 204 click 1
          sleep 6
          scrot build/stage05-real-client-probe/world-select-second-reconnect.png
          JOIN_BASE="$(joined_count)"
          enter_existing_world
          wait_join_increment "$JOIN_BASE"
          sleep 6
          scrot build/stage05-real-client-probe/world-after-second-reconnect.png

          open_filtered_editor
          scrot build/stage05-real-client-probe/loadout-empty-after-second-reconnect-page1.png
          xdotool key --window "$WINDOW_ID" Page_Down
          sleep 2
          scrot build/stage05-real-client-probe/loadout-empty-after-second-reconnect-page2.png
          xdotool key --window "$WINDOW_ID" Escape
          sleep 2

          xdotool key --window "$WINDOW_ID" r
          sleep 2
          scrot build/stage05-real-client-probe/radial-after-cleared-second-reconnect.png
          xdotool key --window "$WINDOW_ID" Escape || true

          cp runs/client/options.txt build/stage05-real-client-probe/options-after-reconnect-authority.txt
          cp runs/client/logs/latest.log build/stage05-real-client-probe/minecraft-latest-reconnect-authority.log

          test "$(joined_count)" -ge 3
          test "$(stop_count)" -ge 2
          grep -Fq 'Black Arcana foundation loaded' "$CLIENT_LOG" || grep -Fq 'Black Arcana foundation loaded' runs/client/logs/latest.log
          echo 'Real-client reconnect authority preflight evidence captured.'

      - name: Upload reconnect authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage05-real-client-reconnect-authority-${{ github.sha }}
          path: |
            build/stage05-real-client-probe/**
            runs/client/logs/latest.log
            runs/client/crash-reports/**
          if-no-files-found: warn
          retention-days: 3
