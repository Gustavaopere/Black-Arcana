name: Phase 2BJ Gaze exact reconciliation v5

on:
  push:
    branches:
      - docs/magic-catalog-phase2bj-gaze-exact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale selectors only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/phase2bj_finalize.py')
          s = p.read_text(encoding='utf-8')

          old_next = "s = replace_once(s, old_next, new_next, 'semantic next order')"
          new_next = "s = regex_once(s, r'## Next closure order\\n\\n.*?\\n\\nPhase 3 remains blocked', '## Next closure order\\n\\nTo converge on a final denominator efficiently, prioritize:\\n\\n' + new_next + '\\n\\nPhase 3 remains blocked', 'semantic next order', flags=re.S)"
          assert s.count(old_next) == 1
          s = s.replace(old_next, new_next, 1)

          old_notice = "s = regex_once(s, r'^\\| Gaze \\|.*$', new_notice_row, 'notices gaze row', flags=re.M)"
          new_notice = "s = regex_once(s, r'^(\\| Malum \\|.*)$', lambda m: m.group(1) + '\\n' + new_notice_row, 'notices insert gaze after malum', flags=re.M)"
          assert s.count(old_notice) == 1
          s = s.replace(old_notice, new_notice, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Phase 2BJ documentation
        shell: bash
        run: |
          set -euo pipefail
          python .github/phase2bj_finalize.py

      - name: Validate diff and postconditions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '**1250 semantic magic objects are currently reconstructible' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '| [Gaze](../providers/gaze/README.md) | 1.1.7.1 | 1 | `COUNTED_EXACT` |' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '199 + 542 + 42 + 55 + 25 + 26 + 361 = 1250' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '| **Strict total** |  | **1250** |' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F 'does not create component #58' wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md
          grep -F 'NON-MERGE PR #201' SOURCES.md
          grep -F '| Gaze | installed `1.1.7.1`' THIRD_PARTY_NOTICES.md

      - name: Commit durable docs and self-clean harnesses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCES.md THIRD_PARTY_NOTICES.md wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md
          git commit -m 'docs: reconcile Phase 2BJ Gaze semantic evidence'
          git rm -f .github/phase2bj_finalize.py \
            .github/workflows/phase2bj-finalize.yml \
            .github/workflows/phase2bj-finalize-v2.yml \
            .github/workflows/phase2bj-finalize-v3.yml \
            .github/workflows/phase2bj-finalize-v4.yml \
            .github/workflows/phase2bj-finalize-v5.yml
          git commit -m 'ci: remove Phase 2BJ reconciliation harness'
          git push
