name: NeoForge 21.1.248 Gazing Pearl SavedData exact distributed boundary
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neoforge-211248-gazing-pearl-saveddata-engine.yml'
      - 'docs/qa/neoforge_211248_gazing_pearl_saveddata_engine_probe.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_saveddata_engine_checks.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/neoforge_211248_custom_data_delegate_probe.py'
      - 'docs/qa/neoforge_211248_itemstack_server_codec_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-SAVEDDATA-ABI.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-SAVEDDATA-ABI.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/gazing-pearl.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distributed_saveddata_engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile bounded read-only auditor
        run: |
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_saveddata_engine_probe.py
      - name: Obtain checksum-verified official NeoForge 21.1.248 server installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gazing-pearl-saveddata-211248/server
          cd build/gazing-pearl-saveddata-211248/server
          BASE='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar.sha256" -o installer.sha256
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar" -o neoforge-installer.jar
          EXPECTED="$(awk '{print $1}' installer.sha256)"
          ACTUAL="$(sha256sum neoforge-installer.jar | awk '{print $1}')"
          test "$(printf '%s' "$EXPECTED" | wc -c)" -eq 64
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = '68eeab77059ba53df1812f1afa5bf530ab2566a3cdcd5f924aa6e71be42e410c'
          unzip -tq neoforge-installer.jar
          echo "EXACT_NEOFORGE_INSTALLER_SHA256=$ACTUAL"
      - name: Materialize exact official distributed Minecraft and NeoForge classes
        shell: bash
        run: |
          set -euo pipefail
          cd build/gazing-pearl-saveddata-211248/server
          java -jar neoforge-installer.jar --installServer > install.log 2>&1 || {
            echo "::error::NEOFORGE_211248_INSTALL_FAILED"
            tail -n 95 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
          echo 'EXACT_INSTALLED_SERVER_CLASSLIBS_OBSERVED=true'
      - name: Discover engine SavedData factory, dirty, load, cache and save boundaries
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_saveddata_engine_probe.py \
            --server build/gazing-pearl-saveddata-211248/server/libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar \
            --srg build/gazing-pearl-saveddata-211248/server/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-saveddata-211248/report.json
      - name: Reject unsafe status changes or missing bounded classes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('build/gazing-pearl-saveddata-211248/report.json').read_text())
          assert r['schema_version']==1
          assert r['scope']=='GAZING_PEARL_OFFICIAL_NEOFORGE_211248_SAVEDDATA_DISTRIBUTED_ABI_ONLY'
          assert r['native']['artifacts']['neoforge_version']=='21.1.248'
          assert set(r['native']['classes'])=={'storage','saved_data','factory'}
          assert r['native']['artifacts']['modlauncher_loaded_bytes']=='NOT_OBSERVED'
          assert r['static_contract']=='NOT_CERTIFIED'
          assert r['mutating_hook']=='NOT_VERIFIED'
          assert r['physical_qa']=='NOT_TESTED'
          assert r['mutation']=='NO_MUTATION'
          assert r['semantic_magic_roots_delta']==0
          print('PASS: only bounded official distribution ABI, no loaded-runtime inference')
          PY
      - name: Publish bounded static engine ABI only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-211248-gazing-pearl-saveddata-engine-abi
          path: build/gazing-pearl-saveddata-211248/report.json
          retention-days: 14
          if-no-files-found: ignore
