name: Alex's Caves 1.0.10 Raygun bounded control evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_control_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_control_probe_test.py'
      - '.github/workflows/alexscaves-1010-raygun-control.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_control_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_control_probe_test.py'
      - '.github/workflows/alexscaves-1010-raygun-control.yml'

permissions:
  contents: read

jobs:
  exact_raygun_control:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed synthetic audit regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_control_probe.py docs/qa/alexscaves_1010_raygun_control_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_control_probe_test.py -v
      - name: Fetch SHA-exact publisher artifact
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Read bounded Raygun classfile and selected control operands
        run: |
          python3 docs/qa/alexscaves_1010_raygun_control_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/raygun-selected-evidence.json
      - name: Export only bounded method references, not provider bytecode
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-selected-control
          path: build/alexscaves-1010/raygun-selected-evidence.json
          if-no-files-found: error
          retention-days: 14
