name: Alex's Caves 1.0.10 Gumball producer references

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_gumball_producer_probe.py'
      - 'docs/qa/alexscaves_1010_gumball_producer_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-PRODUCERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/gumball.md'
      - '.github/workflows/alexscaves-1010-gumball-producers.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_gumball_producer_probe.py'
      - 'docs/qa/alexscaves_1010_gumball_producer_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-PRODUCERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/gumball.md'
      - '.github/workflows/alexscaves-1010-gumball-producers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_gumball_producer_references:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and synthetic bounded probe regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gumball_producer_probe.py
          python3 docs/qa/alexscaves_1010_gumball_producer_probe_test.py -v
      - name: Download SHA-verified publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Probe bounded direct Gumball producer references
        run: |
          python3 docs/qa/alexscaves_1010_gumball_producer_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-PRODUCERS-1.0.10.json' \
            --output build/alexscaves-1010/gumball-producers-evidence.json
      - name: Export bounded evidence (not a perk certificate)
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gumball-producers
          path: build/alexscaves-1010/gumball-producers-evidence.json
          if-no-files-found: error
          retention-days: 14
