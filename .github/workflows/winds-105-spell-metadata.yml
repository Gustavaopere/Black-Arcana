name: Wind's Spellbooks 1.0.5 exact-JAR method and operand inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/winds-105-spell-metadata.yml'
      - 'docs/qa/winds_105_spell_metadata.py'
      - 'docs/qa/winds_105_spell_metadata_test.py'
      - 'docs/qa/winds-105-spell-parameter-gate.md'
      - 'docs/qa/winds_105_getter_formulas.py'
      - 'docs/qa/winds_105_getter_formulas_test.py'
      - 'docs/qa/winds_105_formula_contract.py'
      - 'docs/qa/winds_105_formula_contract_test.py'
      - 'docs/qa/winds_105_mobility_getters.py'
      - 'docs/qa/winds_105_mobility_getters_test.py'
      - 'docs/qa/winds_105_mobility_contract.py'
      - 'docs/qa/winds_105_mobility_contract_test.py'
      - 'docs/qa/winds_105_getter_consumer_edges.py'
      - 'docs/qa/winds_105_getter_consumer_edges_test.py'
      - 'docs/qa/winds_105_cross_class_getter_calls.py'
      - 'docs/qa/winds_105_cross_class_getter_calls_test.py'
      - 'docs/qa/winds_105_cross_class_contract.py'
      - 'docs/qa/winds_105_cross_class_contract_test.py'
      - 'docs/qa/winds_105_effect_boundaries.py'
      - 'docs/qa/winds_105_effect_boundaries_test.py'
      - 'docs/qa/winds_105_effect_contract.py'
      - 'docs/qa/winds_105_effect_contract_test.py'
      - 'docs/qa/winds-105-effect-boundary-evidence.md'
      - 'docs/qa/winds-105-cross-class-callers-gate.md'
      - 'docs/qa/winds-105-getter-consumer-evidence.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/wind/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/winds-105-spell-metadata.yml'
      - 'docs/qa/winds_105_spell_metadata.py'
      - 'docs/qa/winds_105_spell_metadata_test.py'
      - 'docs/qa/winds_105_getter_formulas.py'
      - 'docs/qa/winds_105_getter_formulas_test.py'
      - 'docs/qa/winds_105_formula_contract.py'
      - 'docs/qa/winds_105_formula_contract_test.py'
      - 'docs/qa/winds_105_mobility_getters.py'
      - 'docs/qa/winds_105_mobility_getters_test.py'
      - 'docs/qa/winds_105_mobility_contract.py'
      - 'docs/qa/winds_105_mobility_contract_test.py'
      - 'docs/qa/winds_105_getter_consumer_edges.py'
      - 'docs/qa/winds_105_getter_consumer_edges_test.py'
      - 'docs/qa/winds_105_cross_class_getter_calls.py'
      - 'docs/qa/winds_105_cross_class_getter_calls_test.py'
      - 'docs/qa/winds_105_cross_class_contract.py'
      - 'docs/qa/winds_105_cross_class_contract_test.py'
      - 'docs/qa/winds_105_effect_boundaries.py'
      - 'docs/qa/winds_105_effect_boundaries_test.py'
      - 'docs/qa/winds_105_effect_contract.py'
      - 'docs/qa/winds_105_effect_contract_test.py'
      - 'docs/qa/winds-105-effect-boundary-evidence.md'
      - 'docs/qa/winds-105-cross-class-callers-gate.md'
      - 'docs/qa/winds-105-getter-consumer-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_method_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed metadata tests
        run: python3 docs/qa/winds_105_spell_metadata_test.py -v
      - name: Synthetic fail-closed scalar dataflow tests
        run: python3 docs/qa/winds_105_getter_formulas_test.py -v
      - name: Synthetic pinned-formula drift tests
        run: python3 docs/qa/winds_105_formula_contract_test.py -v
      - name: Synthetic fail-closed mobility getter tests
        run: python3 docs/qa/winds_105_mobility_getters_test.py -v
      - name: Synthetic pinned mobility AST drift tests
        run: python3 docs/qa/winds_105_mobility_contract_test.py -v
      - name: Synthetic direct-getter consumer edge regression tests
        run: python3 docs/qa/winds_105_getter_consumer_edges_test.py -v
      - name: Synthetic exact-JAR cross-class callsite attribution tests
        run: python3 docs/qa/winds_105_cross_class_getter_calls_test.py -v
      - name: Synthetic pinned cross-class direct invoke regression tests
        run: python3 docs/qa/winds_105_cross_class_contract_test.py -v
      - name: Synthetic Wind effect registry provenance and fail-closed tests
        run: python3 docs/qa/winds_105_effect_boundaries_test.py -v
      - name: Synthetic pinned Aeropic/Tailwind effect symbol regression tests
        run: python3 docs/qa/winds_105_effect_contract_test.py -v
      - name: Download exact published Wind's Spellbooks 1.0.5 and verify frozen physical SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/winds-105
          JAR=build/winds-105/wind_spellbooks-1.0.5.jar
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://mediafilez.forgecdn.net/files/8485/822/wind_spellbooks-1.0.5.jar' --output "$JAR"
          echo "8744886899bc245ae147a44baa2b183689cec7da  $JAR" | sha1sum --check
      - name: Inspect seven compiled classes without executing provider bytecode
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_spell_metadata.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/spell-methods.json
      - name: Audit four scalar getters with strict symbolic JVM stack
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_getter_formulas.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/scalar-getters.json
      - name: Verify four SHA-exact reference ASTs (fail-closed on any mismatch)
        run: python3 docs/qa/winds_105_formula_contract.py --json build/winds-105/scalar-getters.json
      - name: Audit five more pure float getters on exact JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_mobility_getters.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/mobility-getters.json
      - name: Verify five SHA-pinned pure float ASTs fail-closed
        run: python3 docs/qa/winds_105_mobility_contract.py --json build/winds-105/mobility-getters.json
      - name: Inspect nine SHA-exact direct getter caller edges and onCast co-present sinks
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_getter_consumer_edges.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/getter-consumer-edges.json
      - name: Scan cross-class direct getter invoke sites across exact Wind provider package
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_cross_class_getter_calls.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/cross-class-getter-calls.json
      - name: Pin exact 64-class 16-invoke cross-class evidence without gameplay claims
        run: python3 docs/qa/winds_105_cross_class_contract.py --json build/winds-105/cross-class-getter-calls.json
      - name: Inventory Wind's effect/registry method surfaces in exact JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_effect_boundaries.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/effect-boundaries.json
      - name: Verify pinned Aeropic/Tailwind native effect symbol boundaries
        run: python3 docs/qa/winds_105_effect_contract.py --json build/winds-105/effect-boundaries.json
      - name: Publish clean-room JSON only (never redistribute provider JAR)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wind-spellbooks-105-methods
          path: |
            build/winds-105/spell-methods.json
            build/winds-105/scalar-getters.json
            build/winds-105/mobility-getters.json
            build/winds-105/getter-consumer-edges.json
            build/winds-105/cross-class-getter-calls.json
            build/winds-105/effect-boundaries.json
          retention-days: 14
          if-no-files-found: ignore
