name: audit-weapons-of-miracles-2.0.178

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/wom
          cd build/audit/wom
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/weapons-of-miracles-epicfight-918614/8829395/weapons-of-miracles-epicfight-918614-8829395.jar" \
            -o WeaponsOfMiracles-2.0.178.jar
          test -s WeaponsOfMiracles-2.0.178.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          EXPECTED_SHA1="b507eb376778cfd1cbecec2841c38891b26a7349"
          ACTUAL_SHA1="$(sha1sum WeaponsOfMiracles-2.0.178.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum WeaponsOfMiracles-2.0.178.jar | awk '{print $1}')"
          BYTES="$(stat -c %s WeaponsOfMiracles-2.0.178.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=918614/8829395"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Extract bounded skill inventory
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          jar tf WeaponsOfMiracles-2.0.178.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib, re, zipfile
          jar=pathlib.Path('WeaponsOfMiracles-2.0.178.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              skill_classes=[n for n in classes if re.search(r'/(skill|skills)/', n, re.I) or re.search(r'Skill[^/]*\.class$', n)]
              skill_resources=[n for n in resources if re.search(r'(^|/)(skill|skills)(/|_)', n, re.I) or 'skill' in pathlib.PurePosixPath(n).name.lower()]
              wom_data=[n for n in names if n.startswith('data/wom/')]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\n'
                  f'skill_classes={len(skill_classes)}\nskill_resources={len(skill_resources)}\nwom_data={len(wom_data)}\n',
                  encoding='utf-8')
              pathlib.Path('skill-classes.txt').write_text('\n'.join(skill_classes)+'\n',encoding='utf-8')
              pathlib.Path('skill-resources.txt').write_text('\n'.join(skill_resources)+'\n',encoding='utf-8')
              pathlib.Path('wom-data.txt').write_text('\n'.join(wom_data)+'\n',encoding='utf-8')
          PY

      - name: Dump all skill-like classes
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          : > javap-skills.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-skills.txt
            javap -classpath WeaponsOfMiracles-2.0.178.jar -p -c -constants "$cls" >> javap-skills.txt 2>&1 || true
          done < skill-classes.txt

      - name: Extract registry and player-action seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          grep -Ei 'register|skill|guard|dodge|passive|identity|mover|weapon|cooldown|stamina|execute|activate|animation|particle|damage|projectile|summon|teleport|heal|shield' javap-skills.txt > skill-seams.txt || true
          grep -Ei 'skill|skills|weapon|artefact|artifact' wom-data.txt > provider-semantic-paths.txt || true

      - name: Extract exact skill metadata and acquisition trees
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          python3 - <<'PY'
          import json, pathlib, re, zipfile
          jar='WeaponsOfMiracles-2.0.178.jar'
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              # English localization entries whose key/value identifies WOM skill presentation.
              lang={}
              for candidate in ('assets/wom/lang/en_us.json','assets/wom/lang/en_us.json5'):
                  if candidate in names:
                      try: lang=json.loads(z.read(candidate))
                      except Exception: pass
              with open('skill-localization.txt','w',encoding='utf-8') as f:
                  for k,v in sorted(lang.items()):
                      lk=k.lower()
                      if 'skill' in lk or any(tok in lk for tok in ('ender_step','voodoo','orbital','solar_arc','lunar_eclipse','demonic_ascension')):
                          f.write(f'{k}\t{v}\n')

              def dump_group(prefix, outname):
                  rows=[]
                  for name in sorted(names):
                      if name.startswith(prefix) and name.endswith('.json'):
                          try:
                              data=json.loads(z.read(name))
                              compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                          except Exception as e:
                              compact='INVALID_JSON:'+type(e).__name__
                          rows.append((name,compact))
                  pathlib.Path(outname).write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
                  return len(rows)

              counts={
                  'skill_parameters':dump_group('data/wom/skill_parameters/','skill-parameters-json.txt'),
                  'epicskills':dump_group('data/wom/epicskills/','epicskills-json.txt'),
                  'weapon_capabilities':dump_group('data/wom/capabilities/weapons/','weapon-capabilities-json.txt'),
              }

              loot=[]
              for name in sorted(names):
                  low=name.lower()
                  if name.startswith('data/') and ('loot_table' in low or '/loot/' in low or '/loot_tables/' in low):
                      if name.endswith('.json'):
                          try: raw=z.read(name).decode('utf-8')
                          except Exception: continue
                          if 'wom:' in raw or 'weapons_of_miracles' in raw.lower(): loot.append(name)
              pathlib.Path('wom-loot-references.txt').write_text('\n'.join(loot)+'\n',encoding='utf-8')
              pathlib.Path('semantic-json-counts.txt').write_text('\n'.join(f'{k}={v}' for k,v in counts.items())+'\n',encoding='utf-8')
          PY

      - name: Extract exact registry IDs
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('javap-skills.txt').read_text(encoding='utf-8',errors='replace')
          start=text.find('===== reascer.wom.gameasset.WOMSkills =====')
          end=text.find('\n===== ',start+10)
          sec=text[start:end if end!=-1 else None]
          names=[]
          for m in re.finditer(r'// String ([^\n]+)',sec):
              name=m.group(1).strip()
              if 'DeferredRegister.register:' in sec[m.end():m.end()+450] and name not in names:
                  names.append(name)
          pathlib.Path('exact-skill-registry-ids.txt').write_text('\n'.join(names)+'\n',encoding='utf-8')
          pathlib.Path('exact-skill-registry-count.txt').write_text(f'count={len(names)}\n',encoding='utf-8')
          PY

      - name: Prove exact WOM item bindings and acquisition surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          : > javap-owner-acquisition.txt
          for cls in \
            reascer.wom.world.item.WOMItems \
            reascer.wom.world.capabilities.item.WOMWeaponCapabilityPresets \
            reascer.wom.world.loot.WOMChestLootTables \
            reascer.wom.world.loot.WOMLootDropTables; do
              echo "===== $cls =====" >> javap-owner-acquisition.txt
              javap -classpath WeaponsOfMiracles-2.0.178.jar -p -c -constants "$cls" >> javap-owner-acquisition.txt 2>&1 || true
          done
          grep -Ei 'WOMSkills|WEAPON_INNATE|WEAPON_PASSIVE|register|loot|drop|chest|recipe|antitheus|agony|blackstar|ender_blaster|evil_tachi|gesetz|herrscher|jabberwocky|moonless|napoleon|nova|orbit|ruine|satsujin|solar|tormented_mind' \
            javap-owner-acquisition.txt > owner-acquisition-seams.txt || true
          python3 - <<'PY'
          import json, pathlib, zipfile
          with zipfile.ZipFile('WeaponsOfMiracles-2.0.178.jar') as z:
              names=set(z.namelist())
              rows=[]
              for name in sorted(names):
                  if name.startswith('data/wom/recipe/') and name.endswith('.json'):
                      try:
                          data=json.loads(z.read(name))
                          compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                      except Exception as e:
                          compact='INVALID_JSON:'+type(e).__name__
                      rows.append((name,compact))
              pathlib.Path('recipes-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
              pathlib.Path('recipe-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Prove Nova reachability across exact provider
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/wom
          : > javap-all-provider.txt
          grep '\.class        uses: actions/upload-artifact@v4
        with:
          name: weapons-of-miracles-2.0.178-exact-artifact-audit
          path: |
            build/audit/wom/hashes.txt
            build/audit/wom/inventory.txt
            build/audit/wom/jar-entries.txt
            build/audit/wom/skill-classes.txt
            build/audit/wom/skill-resources.txt
            build/audit/wom/wom-data.txt
            build/audit/wom/javap-skills.txt
            build/audit/wom/skill-seams.txt
            build/audit/wom/provider-semantic-paths.txt
            build/audit/wom/skill-localization.txt
            build/audit/wom/skill-parameters-json.txt
            build/audit/wom/epicskills-json.txt
            build/audit/wom/weapon-capabilities-json.txt
            build/audit/wom/wom-loot-references.txt
            build/audit/wom/semantic-json-counts.txt
            build/audit/wom/exact-skill-registry-ids.txt
            build/audit/wom/exact-skill-registry-count.txt
            build/audit/wom/javap-owner-acquisition.txt
            build/audit/wom/owner-acquisition-seams.txt
            build/audit/wom/recipes-json.txt
            build/audit/wom/recipe-count.txt
            build/audit/wom/nova-class-references.txt
            build/audit/wom/nova-data-references.txt
            build/audit/wom/nova-data-reference-count.txt
          if-no-files-found: error
 jar-entries.txt | while IFS= read -r path; do
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all-provider.txt
            javap -classpath WeaponsOfMiracles-2.0.178.jar -p -c -constants "$cls" >> javap-all-provider.txt 2>&1 || true
          done
          grep -nEi 'WOMItems\.NOVA|String nova|wom:nova|NOVA:' javap-all-provider.txt > nova-class-references.txt || true
          python3 - <<'PY'
          import pathlib, zipfile
          hits=[]
          with zipfile.ZipFile('WeaponsOfMiracles-2.0.178.jar') as z:
              for name in sorted(z.namelist()):
                  if not name.startswith('data/wom/') or name.endswith('/'): continue
                  try: raw=z.read(name).decode('utf-8')
                  except Exception: continue
                  if 'wom:nova' in raw or '"nova"' in raw or ':nova' in raw:
                      hits.append((name, raw[:20000]))
          pathlib.Path('nova-data-references.txt').write_text(
              '\n'.join(f'===== {n} =====\n{raw}' for n,raw in hits)+'\n', encoding='utf-8')
          pathlib.Path('nova-data-reference-count.txt').write_text(f'count={len(hits)}\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: weapons-of-miracles-2.0.178-exact-artifact-audit
          path: |
            build/audit/wom/hashes.txt
            build/audit/wom/inventory.txt
            build/audit/wom/jar-entries.txt
            build/audit/wom/skill-classes.txt
            build/audit/wom/skill-resources.txt
            build/audit/wom/wom-data.txt
            build/audit/wom/javap-skills.txt
            build/audit/wom/skill-seams.txt
            build/audit/wom/provider-semantic-paths.txt
            build/audit/wom/skill-localization.txt
            build/audit/wom/skill-parameters-json.txt
            build/audit/wom/epicskills-json.txt
            build/audit/wom/weapon-capabilities-json.txt
            build/audit/wom/wom-loot-references.txt
            build/audit/wom/semantic-json-counts.txt
            build/audit/wom/exact-skill-registry-ids.txt
            build/audit/wom/exact-skill-registry-count.txt
            build/audit/wom/javap-owner-acquisition.txt
            build/audit/wom/owner-acquisition-seams.txt
            build/audit/wom/recipes-json.txt
            build/audit/wom/recipe-count.txt
          if-no-files-found: error
