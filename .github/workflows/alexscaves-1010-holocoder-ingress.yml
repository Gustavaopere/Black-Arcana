name: Alex's Caves 1.0.10 Holocoder ingress and inventory bridge discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_holocoder_ingress_probe.py'
      - '.github/workflows/alexscaves-1010-holocoder-ingress.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-HOLOCODER-INGRESS-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_holocoder_ingress_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_holocoder_ingress_probe.py
          python3 docs/qa/alexscaves_1010_holocoder_ingress_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/holocoder-ingress
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/holocoder-ingress/publisher.jar
      - name: Project typed ingress and concrete inventory adapter bodies
        run: |
          python3 docs/qa/alexscaves_1010_holocoder_ingress_probe.py --jar build/holocoder-ingress/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/holocoder-ingress/report.json
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: holocoder-ingress
          path: build/holocoder-ingress/report.json
          if-no-files-found: warn
          retention-days: 14
