name: Iron's 3.16.3 exact published host recast ABI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/irons-3163-aeropic-host-abi.yml'
      - 'docs/qa/irons_3163_aeropic_host_abi.py'
      - 'docs/qa/irons_3163_aeropic_host_abi_test.py'
      - 'docs/qa/irons_3163_aeropic_host_contract.py'
      - 'docs/qa/irons_3163_aeropic_host_contract_test.py'
      - 'docs/qa/irons-3163-aeropic-recast-host-gate.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/wind/aeropic.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/irons-3163-aeropic-host-abi.yml'
      - 'docs/qa/irons_3163_aeropic_host_abi.py'
      - 'docs/qa/irons_3163_aeropic_host_abi_test.py'
      - 'docs/qa/irons_3163_aeropic_host_contract.py'
      - 'docs/qa/irons_3163_aeropic_host_contract_test.py'
      - 'docs/qa/irons-3163-aeropic-recast-host-gate.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/wind/aeropic.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_host_abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed metadata and JVM ABI synthetic regression tests
        run: python3 docs/qa/irons_3163_aeropic_host_abi_test.py -v
      - name: Synthetic SHA-frozen host release and Aeropic ABI contract tests
        run: python3 docs/qa/irons_3163_aeropic_host_contract_test.py -v
      - name: Fetch official exact Modrinth publisher release metadata (not mirror)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/irons-3163
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 120 \
            --header 'Accept: application/json' \
            --header 'User-Agent: Black-Arcana-Cleanroom-ABI-Audit/1.0' \
            'https://api.modrinth.com/v2/version/slKLosTb' \
            --output build/irons-3163/publisher-version.json
      - name: Download exact publisher host JAR without redistribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 240 \
            'https://cdn.modrinth.com/data/s4OWxYQQ/versions/slKLosTb/irons_spellbooks-1.21.1-3.16.3.jar' \
            --output build/irons-3163/irons_spellbooks-1.21.1-3.16.3.jar
      - name: Inspect SHA512-matched host ABI and recast classes without executing JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/irons_3163_aeropic_host_abi.py \
            --jar build/irons-3163/irons_spellbooks-1.21.1-3.16.3.jar \
            --publisher-json build/irons-3163/publisher-version.json \
            --output build/irons-3163/host-recast-abi.json
      - name: Verify publisher SHA512 and five immutable host JVM signatures
        run: python3 docs/qa/irons_3163_aeropic_host_contract.py --json build/irons-3163/host-recast-abi.json
      - name: Upload structured clean-room evidence only (never JAR/publisher dump)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: irons-3163-exact-host-recast-abi
          path: build/irons-3163/host-recast-abi.json
          retention-days: 14
          if-no-files-found: ignore
