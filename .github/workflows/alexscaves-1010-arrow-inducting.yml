name: Alex's Caves 1.0.10 Arrow Inducting exact consumer evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-arrow-inducting.yml'
      - 'docs/qa/alexscaves_1010_arrow_inducting_probe.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_probe_test.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-LIFECYCLE-ROSTER-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/arrow-inducting.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-arrow-inducting.yml'
      - 'docs/qa/alexscaves_1010_arrow_inducting_probe.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_probe_test.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe.py'
      - 'docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-LIFECYCLE-ROSTER-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/arrow-inducting.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'

permissions:
  contents: read

jobs:
  exact_arrow_inducting:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic negative and schema regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_arrow_inducting_probe.py docs/qa/alexscaves_1010_arrow_inducting_probe_test.py
          python3 docs/qa/alexscaves_1010_arrow_inducting_probe_test.py -v
          python3 -m py_compile docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe.py docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe_test.py
          python3 docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe_test.py -v
      - name: Download SHA-exact publisher 1.0.10 JAR
        run: |
          mkdir -p build/alexscaves-arrow-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-arrow-1010/alexscaves-1.0.10.jar
      - name: Inspect publisher resource and native consumer windows
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_arrow_inducting_probe.py \
              --jar build/alexscaves-arrow-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-arrow-1010/arrow-inducting-evidence.json
          else
            echo 'UNSEALED DISCOVERY — not a merge certification'
            python3 docs/qa/alexscaves_1010_arrow_inducting_probe.py \
              --jar build/alexscaves-arrow-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-arrow-1010/arrow-inducting-evidence.json
          fi
      - name: Inspect exact native SeekingArrow lifecycle
        run: |
          python3 docs/qa/alexscaves_1010_arrow_inducting_lifecycle_probe.py \
            --jar build/alexscaves-arrow-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --roster-seal "wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ARROW-INDUCTING-LIFECYCLE-ROSTER-1.0.10.json" \
            --output build/alexscaves-arrow-1010/arrow-lifecycle-discovery.json
      - name: Check canonical generated indexes without rewriting
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive bounded clean-room evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-arrow-inducting-evidence
          path: |
            build/alexscaves-arrow-1010/arrow-inducting-evidence.json
            build/alexscaves-arrow-1010/arrow-lifecycle-discovery.json
          if-no-files-found: ignore
          retention-days: 14
