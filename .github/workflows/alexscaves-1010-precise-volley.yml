name: Alex's Caves 1.0.10 Precise Volley exact resource

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-precise-volley.yml'
      - 'docs/qa/alexscaves_1010_precise_volley_probe.py'
      - 'docs/qa/alexscaves_1010_precise_volley_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PRECISE-VOLLEY-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/precise-volley.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-precise-volley.yml'
      - 'docs/qa/alexscaves_1010_precise_volley_probe.py'
      - 'docs/qa/alexscaves_1010_precise_volley_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PRECISE-VOLLEY-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/precise-volley.md'
permissions:
  contents: read
jobs:
  exact_resource:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check probe syntax
        run: python3 -m py_compile docs/qa/alexscaves_1010_precise_volley_probe.py
      - name: Fetch exact publisher JAR
        run: |
          mkdir -p build/precise-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/precise-1010/alexscaves-1.0.10.jar
      - name: Verify exact native resource and classfiles
        run: |
          python3 docs/qa/alexscaves_1010_precise_volley_probe.py \
            --jar build/precise-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DREADBOW-CONTRACTS-1.0.10.json' \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PRECISE-VOLLEY-CONTRACT-1.0.10.json' \
            --output build/precise-1010/evidence.json
      - name: Precise Volley native semantic regressions
        run: python3 docs/qa/alexscaves_1010_precise_volley_cards_test.py -v
      - name: Compute exact SHA-256 of Precise Volley dossier
        run: sha256sum 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/precise-volley.md'
      - name: Export bounded JSON evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-precise-volley-evidence
          path: build/precise-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
