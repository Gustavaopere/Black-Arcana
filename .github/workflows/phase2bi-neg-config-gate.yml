name: Phase 2BI NEG config gate reconciliation

on:
  push:
    branches:
      - docs/magic-catalog-phase2bi-neg-config-gate

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 2BI documentation
        run: python .github/scripts/phase2bi_neg_config_gate.py
      - name: Validate scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CONFIG AUTHORITY CLOSED / DEPLOYED VALUES MISSING / SEMANTIC DELTA +0' wiki/modpack-catalog/meta/PHASE2BI-NOT-ENOUGH-GLYPHS-CONFIG-GATE.md
          grep -q 'CONDITIONAL / CONFIG AUTHORITY CLOSED / +0' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -q 'strict semantic minimum remains \*\*1249\*\*' wiki/modpack-catalog/providers/not-enough-glyphs/README.md
          grep -q 'provider-component closure remains \*\*57/100\*\*' wiki/modpack-catalog/providers/not-enough-glyphs/README.md
      - name: Commit documentation and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/phase2bi_neg_config_gate.py .github/workflows/phase2bi-neg-config-gate.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No durable changes generated' >&2
            exit 1
          fi
          git commit -m 'docs: close NEG 4.6.1 config authority gate'
          git push origin HEAD:docs/magic-catalog-phase2bi-neg-config-gate
