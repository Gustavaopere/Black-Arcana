name: Alex's Caves 1.0.10 Gazing Pearl barter and color boundary
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-barter-color.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_barter_color_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-BARTER-COLOR-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_barter_color:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_barter_color_probe.py
          python3 docs/qa/alexscaves_1010_gazing_pearl_barter_color_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/gazing-barter-color
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' -o build/gazing-barter-color/publisher.jar
      - name: Replay boundary discovery
        run: |
          for n in report replay; do
            python3 docs/qa/alexscaves_1010_gazing_pearl_barter_color_probe.py --jar build/gazing-barter-color/publisher.jar --javap "$JAVA_HOME/bin/javap" --output "build/gazing-barter-color/$n.json"
          done
          cmp build/gazing-barter-color/report.json build/gazing-barter-color/replay.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gazing-barter-color
          path: build/gazing-barter-color/report.json
          if-no-files-found: warn
          retention-days: 14
