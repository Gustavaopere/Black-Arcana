name: audit-create-mechanical-spawner-1.3.2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/mechanical_spawner
          cd build/audit/mechanical_spawner
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/create-mechanical-spawner-821828/8418593/create-mechanical-spawner-821828-8418593.jar" \
            -o create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar
          test -s create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/mechanical_spawner
          EXPECTED_SHA1="d9a5a2ee44238e4a90f70057ba9ec8414594fe24"
          ACTUAL_SHA1="$(sha1sum create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar | awk '{print $1}')"
          BYTES="$(stat -c %s create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=821828/8418593"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Extract exact archive and semantic inventory
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/mechanical_spawner
          jar tf create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import json, pathlib, zipfile
          jar=pathlib.Path('create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              data=[n for n in names if n.startswith('data/create_mechanical_spawner/')]
              keywords=('spell','magic','ritual','ability','mana','arcane','glyph','summon','soul','spawn','wither','loot','recipe')
              counts={k:sum(k in n.lower() for n in names) for k in keywords}
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\nprovider_data={len(data)}\n' +
                  '\n'.join(f'{k}={v}' for k,v in counts.items())+'\n',encoding='utf-8')
              pathlib.Path('classes.txt').write_text('\n'.join(classes)+'\n',encoding='utf-8')
              pathlib.Path('provider-data.txt').write_text('\n'.join(data)+'\n',encoding='utf-8')

              rows=[]
              recipe_rows=[]
              for name in data:
                  if not name.endswith('.json'): continue
                  try:
                      obj=json.loads(z.read(name))
                      compact=json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  except Exception as e:
                      compact='INVALID_JSON:'+type(e).__name__
                  low=(name+' '+compact).lower()
                  if any(k in low for k in keywords): rows.append((name,compact[:30000]))
                  if '/recipe/' in name or '/recipes/' in name:
                      recipe_rows.append((name,compact[:30000]))
              pathlib.Path('semantic-json.txt').write_text(
                  '\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
              pathlib.Path('recipes-json.txt').write_text(
                  '\n'.join(f'===== {n} =====\n{j}' for n,j in recipe_rows)+'\n',encoding='utf-8')
              pathlib.Path('recipe-count.txt').write_text(f'count={len(recipe_rows)}\n',encoding='utf-8')
          PY

      - name: Dump every provider class and activation signature
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/mechanical_spawner
          : > javap-all.txt
          : > javap-signatures.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-signatures.txt
            javap -classpath create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar -p -s "$cls" >> javap-signatures.txt 2>&1 || true
            echo "===== $cls =====" >> javap-all.txt
            javap -classpath create_mechanical_spawner-1.21.1-1.3.2-6.0.10.jar -p -c -constants "$cls" >> javap-all.txt 2>&1 || true
          done < classes.txt

          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('javap-signatures.txt').read_text(encoding='utf-8',errors='replace')
          sections=re.split(r'^===== (.+?) =====$',text,flags=re.M)
          methods=['use','useOn','useWithoutItem','releaseUsing','onUseTick','finishUsingItem','interactLivingEntity','hurtEnemy','inventoryTick','onArmorTick','onItemUseFirst']
          rows=[]
          for i in range(1,len(sections),2):
              cls=sections[i]; body=sections[i+1]
              found=[m for m in methods if re.search(r'\b'+re.escape(m)+r'\s*\(',body)]
              if found: rows.append((cls,','.join(found)))
          pathlib.Path('activation-index.txt').write_text('\n'.join(f'{c}\t{m}' for c,m in rows)+'\n',encoding='utf-8')
          PY

      - name: Extract exact spawn and settlement seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/mechanical_spawner
          grep -nEi 'Spawner|spawn|addFreshEntity|EntityType|processingTime|customLoot|LootCollector|fluid|KubeJS|wither|rotation|speed|stress|recipe' javap-all.txt > spawn-seams.txt || true
          grep -nEi 'spawner|spawn|wither|customLoot|processingTime|fluid|loot' semantic-json.txt > spawn-data-seams.txt || true

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: create-mechanical-spawner-1.3.2-exact-artifact-audit
          path: |
            build/audit/mechanical_spawner/hashes.txt
            build/audit/mechanical_spawner/inventory.txt
            build/audit/mechanical_spawner/jar-entries.txt
            build/audit/mechanical_spawner/classes.txt
            build/audit/mechanical_spawner/provider-data.txt
            build/audit/mechanical_spawner/semantic-json.txt
            build/audit/mechanical_spawner/recipes-json.txt
            build/audit/mechanical_spawner/recipe-count.txt
            build/audit/mechanical_spawner/javap-signatures.txt
            build/audit/mechanical_spawner/javap-all.txt
            build/audit/mechanical_spawner/activation-index.txt
            build/audit/mechanical_spawner/spawn-seams.txt
            build/audit/mechanical_spawner/spawn-data-seams.txt
          if-no-files-found: error
