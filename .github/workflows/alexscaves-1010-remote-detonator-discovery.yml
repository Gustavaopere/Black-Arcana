name: Alex's Caves 1.0.10 Remote Detonator exact static discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-remote-detonator-discovery.yml'
      - 'docs/qa/alexscaves_1010_remote_detonator_discovery.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_discovery_checks.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_downstream_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_resource_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_boundary_checks.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote_detonator_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only discovery and fail-closed gate
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_discovery.py
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_discovery_checks.py
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_downstream_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_resource_probe.py docs/qa/alexscaves_1010_remote_detonator_boundary_checks.py
          python3 docs/qa/alexscaves_1010_remote_detonator_resource_probe.py --self-test
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/remote-detonator-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/remote-detonator-1010/publisher.jar
      - name: Discover exact native methods, consumers and bounded resources
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_discovery.py \
            --jar build/remote-detonator-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/remote-detonator-1010/report.json
      - name: Validate report and reject malformed evidence
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_discovery_checks.py \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-DISCOVERY-1.0.10.json' \
            --report build/remote-detonator-1010/report.json
          echo '{}' > build/remote-detonator-1010/invalid.json
          if python3 docs/qa/alexscaves_1010_remote_detonator_discovery_checks.py \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-DISCOVERY-1.0.10.json' \
              --report build/remote-detonator-1010/invalid.json; then
            echo 'FAIL: malformed RemoteDetonator evidence accepted'
            exit 1
          fi
      - name: Trace exact chunk-force and fire-dispatch boundaries read-only
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_downstream_probe.py \
            --jar build/remote-detonator-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/remote-detonator-1010/boundaries.json
      - name: Seal existing exact boundary evidence
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_boundary_checks.py \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-BOUNDARIES-1.0.10.json' \
            --report build/remote-detonator-1010/boundaries.json
          echo '{}' > build/remote-detonator-1010/invalid-boundary.json
          if python3 docs/qa/alexscaves_1010_remote_detonator_boundary_checks.py \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-BOUNDARIES-1.0.10.json' \
              --report build/remote-detonator-1010/invalid-boundary.json; then
            echo 'FAIL: malformed boundary evidence accepted'
            exit 1
          fi
      - name: Open SHA-pinned publisher tag, recipe, advancement and model resources
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_resource_probe.py \
            --jar build/remote-detonator-1010/publisher.jar \
            --output build/remote-detonator-1010/resource-projection.json
          report=build/remote-detonator-1010/resource-projection.json
          test "$(stat -c %s "$report")" -eq 2501
          test "$(sha256sum "$report" | cut -d' ' -f1)" = '13041591c74cb720a7f3b74535ae861d03083defecbdbef3ca9fc871f412d280'
      - name: Preserve resource projection (no runtime certification)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-remote-detonator-resource-projection
          path: build/remote-detonator-1010/resource-projection.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve bounded downstream boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-remote-detonator-boundaries
          path: build/remote-detonator-1010/boundaries.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist publisher native discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-remote-detonator-discovery
          path: build/remote-detonator-1010/report.json
          if-no-files-found: warn
          retention-days: 14
