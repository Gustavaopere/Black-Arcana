name: Somake 1.0.9 Funeral Bloom radius typed two-path proof (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-radius-typed-paths.yml'
      - 'docs/qa/somake_109_radius_typed_paths.py'
      - 'docs/qa/somake_109_radius_typed_paths_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-RADIUS-TYPED-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_radius_typed_paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute synthetic positive, negative and compiled Java 21 regression tests
        run: python3 docs/qa/somake_109_radius_typed_paths_test.py -v
      - name: Acquire official Somake 1.0.9 JAR under exact publisher SHA-1 gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-radius-typed
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-radius-typed/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-radius-typed/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Examine exact compiled getter under bounded typed two-path interpretation
        run: |
          python3 docs/qa/somake_109_radius_typed_paths.py \
            --jar build/somake-radius-typed/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-radius-typed/proof.json
      - name: Archive symbolic proof only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-radius-typed-${{ github.sha }}
          path: build/somake-radius-typed/proof.json
          if-no-files-found: ignore
          retention-days: 14
