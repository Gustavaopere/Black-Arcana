name: Reliquified Ars Nouveau 0.8.1 SHA-exact ability discovery
on:
  push:
    branches:
      - 'audit/reliquified-ars-nouveau-081-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify official JAR vs physical SHA and inspect relic registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request,pathlib,zipfile,subprocess,re
          wanted='4be1f4b0fd7fbec6618596e2e7c3705db88a7579'
          urls=[
            'https://cursemaven.com/curse/maven/reliquified-ars-nouveau-1196449/8104341/reliquified-ars-nouveau-1196449-8104341.jar',
            'https://mediafilez.forgecdn.net/files/8104/341/reliquified_ars_nouveau-1.21.1-0.8.1.jar',
            'https://media.forgecdn.net/files/8104/341/reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-cleanroom'})
              with urllib.request.urlopen(req,timeout=85) as r:data=r.read(15000000)
              sha=hashlib.sha1(data).hexdigest()
              print('CANDIDATE_BYTES='+str(len(data))+' SHA1='+sha,flush=True)
              if sha!=wanted:continue
              jar.write_bytes(data)
              break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:220],flush=True)
          else:raise SystemExit('FAIL-CLOSED: physical SHA mismatch')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('CERTIFIED_FILE_ID=8104341 BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            files=z.namelist()
            meta=z.read('META-INF/neoforge.mods.toml').decode('utf8','replace')
          assert re.search(r'modId\s*=\s*["\x27]reliquified_ars_nouveau',meta)
          print('MODID_VERIFIED=TRUE')
          classes=[x[:-6].replace('/','.') for x in files if x.endswith('.class') and '$' not in x]
          registry=[x for x in classes if 'ItemRegistry' in x or 'ItemsRegistry' in x]
          print('ITEM_REGISTRARS='+repr(registry))
          print('CLASSFILES='+str(len(classes)))
          for name in registry:
            out=subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,timeout=30)
            if out.returncode:continue
            for l in out.stdout.splitlines():
              if any(t in l for t in ('public static final ', '// String ', 'register','static {};')):
                print('ITEM_BYTECODE='+l.strip()[:210])
          items=[x for x in classes if x.lower().endswith(('relic','item')) and ('reliquified' in x.lower())]
          print('RELIC_CLASS_CANDIDATES='+repr(items[:110]))
          print('DISCOVERY_ONLY=TRUE')
          PY

      - name: Discover Relics ability builders for nineteen physical owner items
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,zipfile,hashlib,re,subprocess
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='4be1f4b0fd7fbec6618596e2e7c3705db88a7579'
          base='it.hurts.shatterbyte.reliquified_ars_nouveau.'
          def disasm(name):
            p=subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,timeout=25)
            assert p.returncode==0,(name,p.stderr[:180])
            return p.stdout
          reg=disasm(base+'init.ItemRegistry')
          initializer=reg.split('static {};',1)[1]
          names=re.findall(r'// String ([a-z][a-z0-9_]*)',initializer)
          registrations=re.findall(r'// Method net/neoforged/neoforge/registries/DeferredRegister.register:\\(Ljava/lang/String;Ljava/util/function/Supplier;\\)',initializer)
          print('PHYSICAL_ITEM_NAMES='+repr(names))
          print('ITEM_REGISTRATION_CALLS='+str(len(registrations)))
          print('INITIALIZER_BRANCHES='+repr([l.strip() for l in initializer.splitlines() if re.search(r'^\s*\d+:\s+(?:ifne|ifeq|goto|tableswitch|lookupswitch)\\b',l)][:15]))
          with zipfile.ZipFile(jar) as z:
            classes=[x[:-6].replace('/','.') for x in z.namelist() if x.endswith('.class') and '$' not in x
                     and '/items/' in x and x.endswith('Item.class')]
          abilityclasses=[]
          for c in classes:
            body=disasm(c)
            builders=[line.strip() for line in body.splitlines() if 'AbilityTemplate.builder:' in line or 'AbilityTemplate.builder' in line]
            strings=re.findall(r'// String ([a-z][a-z0-9_]*)',body)
            if builders:
              abilityclasses.append(c)
              print('RELIC_ABILITY_CLASS='+c+'|BUILDER_CALLS='+str(len(builders))+'|LITERALS='+repr(strings[:22]))
          print('RELIC_ABILITY_CLASS_COUNT='+str(len(abilityclasses)))
          print('REGISTRY_DISCOVERY_ONLY=TRUE')
          PY

      - name: Assert all nineteen unique provider item and root ability IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,re,subprocess,zipfile
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          assert jar.is_file() and hashlib.sha1(jar.read_bytes()).hexdigest()=='4be1f4b0fd7fbec6618596e2e7c3705db88a7579'
          base='it.hurts.shatterbyte.reliquified_ars_nouveau.'
          def javap(cls):
            p=subprocess.run(['javap','-c','-p','-classpath',str(jar),base+cls],capture_output=True,text=True,timeout=35)
            assert p.returncode==0,(cls,p.stderr[:120])
            return p.stdout
          registry=javap('init.ItemRegistry')
          block=registry.split('static {};',1)[1]
          items=re.findall(r'// String ([a-z][a-z0-9_]*)',block)
          assert items[0]=='reliquified_ars_nouveau'
          items=items[1:]
          expected=[
            ('architects_staff','items.ArchitectsStaffItem','bridgecraft'),
            ('archmage_glove','items.hands.ArchmageGloveItem','multicasted'),
            ('ballistarian_bracer','items.bracelet.BallistarianBracerItem','ballistary'),
            ('cloak_of_concealment','items.back.CloakOfConcealmentItem','absorption'),
            ('emblem_of_assault','items.charm.EmblemOfAssaultItem','onslaught'),
            ('emblem_of_defense','items.charm.EmblemOfDefenseItem','sentinel'),
            ('emblem_of_devotion','items.charm.EmblemOfDevotionItem','devotion'),
            ('flaming_bracer','items.bracelet.FlamingBracerItem','pyroclastic'),
            ('horn_of_the_wild_hunter','items.head.HornOfWildHunterItem','summoner'),
            ('illusionists_mantle','items.back.IllusionistsMantleItem','deception'),
            ('mana_ring','items.ring.ManaRingItem','resonance'),
            ('quantum_bubble','items.head.QuantumBubbleItem','stasis'),
            ('ring_of_last_will','items.ring.RingOfLastWillItem','last_will'),
            ('ring_of_thrift','items.ring.RingOfThriftItem','thrift'),
            ('spiked_cloak','items.back.SpikedCloakItem','thorn_burst'),
            ('staff_of_the_spectral_walker','items.StaffOfTheSpectralWalkerItem','spectral'),
            ('whirling_broom','items.WhirlingBroomItem','broom'),
            ('whirlisprig_petals','items.WhirlisprigPetalsItem','petal_lift'),
            ('wing_of_the_wild_stalker','items.body.WingWildStalkerItem','wild_flight')
          ]
          assert len(items)==19 and len(set(items))==19
          assert set(items)=={x[0] for x in expected},(items,expected)
          # Disambiguate the root's literal from the four subsequent provider-native
          # subabilities without counting their strings as independent roots.
          for i,(item,cls,root) in enumerate(expected,1):
            body=javap(cls)
            builders=[l for l in body.splitlines() if 'AbilityTemplate.builder:' in l]
            names=re.findall(r'// String ([a-z][a-z0-9_]*)',body)
            assert len(builders)==1,(item,len(builders))
            assert names and names[0]==root,(item,root,names[:6])
            print(f'EXACT_RELIC_{i}=reliquified_ars_nouveau:{item}|{cls}|{root}')
          count=block.count('DeferredRegister.register:(Ljava/lang/String;Ljava/util/function/Supplier;)')
          assert count==19,('item registry calls',count)
          assert not re.search(r'^\s*\d+:\s+(?:ifne|ifeq|ifnull|ifnonnull|goto|tableswitch|lookupswitch)\b',block,re.M)
          print('PHYSICAL_RELIC_ITEM_REGISTRATIONS=19')
          print('UNIQUE_ROOT_ABILITY_BUILDERS=19')
          print('STATIC_REGISTRY_BRANCHES=0')
          print('NEW_SEMANTIC_ROOTS=0')
          print('EXACT_STATIC_REGISTRY_AUDIT=PASS')
          print('RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY
