name: Reliquified Ars Nouveau 0.8.1 SHA-exact ability discovery
on:
  push:
    branches:
      - 'audit/reliquified-ars-nouveau-081-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify official JAR vs physical SHA and inspect relic registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request,pathlib,zipfile,subprocess,re
          wanted='4be1f4b0fd7fbec6618596e2e7c3705db88a7579'
          urls=[
            'https://cursemaven.com/curse/maven/reliquified-ars-nouveau-1196449/8104341/reliquified-ars-nouveau-1196449-8104341.jar',
            'https://mediafilez.forgecdn.net/files/8104/341/reliquified_ars_nouveau-1.21.1-0.8.1.jar',
            'https://media.forgecdn.net/files/8104/341/reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'reliquified_ars_nouveau-1.21.1-0.8.1.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-cleanroom'})
              with urllib.request.urlopen(req,timeout=85) as r:data=r.read(15000000)
              sha=hashlib.sha1(data).hexdigest()
              print('CANDIDATE_BYTES='+str(len(data))+' SHA1='+sha,flush=True)
              if sha!=wanted:continue
              jar.write_bytes(data)
              break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:220],flush=True)
          else:raise SystemExit('FAIL-CLOSED: physical SHA mismatch')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('CERTIFIED_FILE_ID=8104341 BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            files=z.namelist()
            meta=z.read('META-INF/neoforge.mods.toml').decode('utf8','replace')
          assert re.search(r'modId\s*=\s*["\x27]reliquified_ars_nouveau',meta)
          print('MODID_VERIFIED=TRUE')
          classes=[x[:-6].replace('/','.') for x in files if x.endswith('.class') and '$' not in x]
          registry=[x for x in classes if 'ItemRegistry' in x or 'ItemsRegistry' in x]
          print('ITEM_REGISTRARS='+repr(registry))
          print('CLASSFILES='+str(len(classes)))
          for name in registry:
            out=subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,timeout=30)
            if out.returncode:continue
            for l in out.stdout.splitlines():
              if any(t in l for t in ('public static final ', '// String ', 'register','static {};')):
                print('ITEM_BYTECODE='+l.strip()[:210])
          items=[x for x in classes if x.lower().endswith(('relic','item')) and ('reliquified' in x.lower())]
          print('RELIC_CLASS_CANDIDATES='+repr(items[:110]))
          print('DISCOVERY_ONLY=TRUE')
          PY
