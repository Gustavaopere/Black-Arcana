name: Alex's Caves 1.0.10 Raygun selected branch consumer ABI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-branch-consumers.yml'
      - 'docs/qa/alexscaves_1010_raygun_branch_consumers_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_branch_consumers_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-branch-consumers-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-BRANCH-CONSUMERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-branch-consumers.yml'
      - 'docs/qa/alexscaves_1010_raygun_branch_consumers_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_branch_consumers_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-branch-consumers-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-BRANCH-CONSUMERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'

permissions:
  contents: read

jobs:
  raygun_consumer_seams:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic read-only and fail-closed regression tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_branch_consumers_probe.py docs/qa/alexscaves_1010_raygun_branch_consumers_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_branch_consumers_probe_test.py -v
      - name: Download pinned publisher JAR
        run: |
          mkdir -p build/raygun-1010-consumer-seams
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/raygun-1010-consumer-seams/alexscaves-1.0.10.jar
      - name: Verify exact Raygun branches and downstream calls
        run: |
          SEAL=wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-BRANCH-CONSUMERS-1.0.10.json
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_raygun_branch_consumers_probe.py \
              --jar build/raygun-1010-consumer-seams/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/raygun-1010-consumer-seams/consumer-seams.json
          else
            echo 'UNSEALED EXACT RAYGUN CONSUMER DISCOVERY - do not merge.'
            python3 docs/qa/alexscaves_1010_raygun_branch_consumers_probe.py \
              --jar build/raygun-1010-consumer-seams/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/raygun-1010-consumer-seams/consumer-seams.json
          fi
          python3 -m json.tool build/raygun-1010-consumer-seams/consumer-seams.json
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raygun-1010-branch-consumer-evidence
          path: build/raygun-1010-consumer-seams/consumer-seams.json
          if-no-files-found: ignore
          retention-days: 14
