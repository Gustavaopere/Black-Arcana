name: Alex's Caves 1.0.10 Far Flung exact Candy Cane Hook evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-far-flung.yml'
      - 'docs/qa/alexscaves_1010_far_flung_probe.py'
      - 'docs/qa/alexscaves_1010_far_flung_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FAR-FLUNG-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/far-flung.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-far-flung.yml'
      - 'docs/qa/alexscaves_1010_far_flung_probe.py'
      - 'docs/qa/alexscaves_1010_far_flung_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FAR-FLUNG-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/far-flung.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'

permissions:
  contents: read

jobs:
  exact_far_flung:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Python syntax and synthetic fail-closed tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_far_flung_probe.py docs/qa/alexscaves_1010_far_flung_probe_test.py
          python3 docs/qa/alexscaves_1010_far_flung_probe_test.py -v
      - name: Download publisher SHA-exact 1.0.10 JAR
        run: |
          mkdir -p build/alexscaves-far-flung-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-far-flung-1010/alexscaves-1.0.10.jar
      - name: Read exact enchantment JSON and selected JVM anchors
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FAR-FLUNG-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_far_flung_probe.py \
              --jar build/alexscaves-far-flung-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-far-flung-1010/evidence.json
          else
            echo 'UNSEALED_DISCOVERY_ONLY — not merge certification'
            python3 docs/qa/alexscaves_1010_far_flung_probe.py \
              --jar build/alexscaves-far-flung-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-far-flung-1010/evidence.json
          fi
      - name: Check generated provider indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive selected exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-far-flung-evidence
          path: build/alexscaves-far-flung-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
