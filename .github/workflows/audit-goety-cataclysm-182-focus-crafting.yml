name: Audit 4 ordinary Goety Cataclysm 1.8.2 Focus recipes
on:
  push:
    branches: [audit/goety-cataclysm-182-4-crafting-focus-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_crafting_recipe_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify publisher JAR vs physical SHA-1
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/goety_cataclysm-1.21.1-1.8.2.jar"
          urls=(
            "https://www.curseforge.com/api/v1/mods/1224214/files/8518940/download"
            "https://mediafilez.forgecdn.net/files/8518/940/goety_cataclysm-1.21.1-1.8.2.jar"
            "https://edge.forgecdn.net/files/8518/940/goety_cataclysm-1.21.1-1.8.2.jar"
          )
          exact=0
          for url in "${urls[@]}"; do
            rm -f "$jar"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 120 "$url" -o "$jar"; then
              if [ "$(sha1sum "$jar" | awk '{print $1}')" = "4e3052a082200371b36e1a88fdce05e294d82757" ]; then
                exact=1; break
              fi
            fi
          done
          test "$exact" -eq 1 || { echo "EXACT ARTIFACT UNAVAILABLE - FAIL CLOSED"; exit 1; }
      - name: Extract exact paths and output identities only
        env:
          EXACT_JAR_PATH: ${{ runner.temp }}/goety_cataclysm-1.21.1-1.8.2.jar
        run: python3 .github/goety_cataclysm_182_focus_crafting_audit.py
      - name: Ensure no downloaded binary is committed
        run: test ! -e ./goety_cataclysm-1.21.1-1.8.2.jar
