          rep(semantic, "| **Strict total** |  | **874** |  |  |", "| **Strict total** |  | **888** |  |  |")
          rep(semantic, "Bloodlines remains **28 counted actions**; after later provider closures, the global strict total is **874**.", "Bloodlines remains **28 counted actions**; after later provider closures, the global strict total is **888**.")
          rep(semantic, "These rows are deliberately **not additive to 874** until their exact/current inventory and deduplication state meet the inclusion rule.", "These rows are deliberately **not additive to 888** until their exact/current inventory and deduplication state meet the inclusion rule.")
