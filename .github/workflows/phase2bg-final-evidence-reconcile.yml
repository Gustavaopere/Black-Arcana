              "- `main` canônica após Phase 2BG durable / PR #195: `88f042f68429ff920314a7ec3a6923369edc93fd`; HEAD limpo `a9d7b55044230bbb011f7233ffd75d9a8321489b` passou CI #2503 e o exact-SHA post-merge CI #2504 ficou GREEN, incluindo canonical QA-JAR publication;")
          rep(queue,
              "A reconstrução canônica após Phase 2BE fecha **874 objetos mágicos semânticos** com o inventário exato Cataclysm 1.1.13.",
              "A reconstrução canônica após Phase 2BG fecha **888 objetos mágicos semânticos** com a promoção exata de Leyline Spellbooks 1.0.3.")
          rep(queue,
              "- delta semântico Somake 1.0.8-fix Phase 2BF: **+0** (`67 exact registry`, reachability/config efetivo ainda `CONDITIONAL`);\n- mínimo estrito global canônico: **874**;",
              "- delta semântico Somake 1.0.8-fix Phase 2BF: **+0** (`67 exact registry`, reachability/config efetivo ainda `CONDITIONAL`);\n- delta semântico Leyline Spellbooks 1.0.3 Phase 2BG: **+14** (`14 exact unconditional registry identities`);\n- mínimo estrito global canônico: **888**;")
          rep(queue,
