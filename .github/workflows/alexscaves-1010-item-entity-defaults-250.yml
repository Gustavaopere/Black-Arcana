name: Alex's Caves 1.0.10 item component defaults and Ink Bomb entity builder discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-item-entity-defaults-250.yml'
      - 'docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_destroyed_item_engine_reference.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ITEM-ENTITY-DEFAULTS-21.1.250.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_item_entity_defaults_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and scope filters
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py
          python3 docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py --self-test
      - name: Download exact official NeoForge 21.1.250 server installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/item-entity-defaults-250
          cd build/item-entity-defaults-250
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "$base/neoforge-21.1.250-installer.jar" -o installer.jar
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 60 "$base/neoforge-21.1.250-installer.jar.sha256" -o installer.jar.sha256
          actual="$(sha256sum installer.jar | cut -d' ' -f1)"
          expect="$(head -c 64 installer.jar.sha256)"
          [[ "$expect" =~ ^[0-9a-fA-F]{64}$ ]]
          test "$actual" = "${expect,,}"
          test "$actual" = '0e47a91ba2139a8db4bf7627af081f7b5789b508bb039ee8dea1272b79693d60'
          echo "NEOFORGE_EXACT_INSTALLER_SHA256 $actual"
          unzip -tq installer.jar
      - name: Materialize publisher-exact server/SRG distributions (not a running game)
        shell: bash
        run: |
          set -euo pipefail
          cd build/item-entity-defaults-250
          java -jar installer.jar --installServer > install.log 2>&1 || {
            echo "::error::NEOFORGE_211250_INSTALL_SERVER_FAILED"
            tail -n 80 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Fetch official universal artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/item-entity-defaults-250
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250'
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "$base/neoforge-21.1.250-universal.jar" -o universal.jar
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$base/neoforge-21.1.250-universal.jar.sha256" -o universal.jar.sha256
          unzip -tq universal.jar
      - name: Download exact publisher artifact
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/item-entity-defaults-250/publisher.jar
      - name: Inspect component and entity defaults
        run: |
          python3 docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py \
            --installer build/item-entity-defaults-250/installer.jar \
            --server build/item-entity-defaults-250/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/item-entity-defaults-250/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/item-entity-defaults-250/universal.jar \
            --publisher build/item-entity-defaults-250/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/item-entity-defaults-250/report.json
      - name: Replay bounded discovery
        run: |
          python3 docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py \
            --installer build/item-entity-defaults-250/installer.jar \
            --server build/item-entity-defaults-250/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/item-entity-defaults-250/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/item-entity-defaults-250/universal.jar \
            --publisher build/item-entity-defaults-250/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/item-entity-defaults-250/replay.json
      - name: Require deterministic report
        run: |
          cmp build/item-entity-defaults-250/report.json build/item-entity-defaults-250/replay.json
          test "$(wc -c < build/item-entity-defaults-250/report.json)" -eq 322625
          echo '448111136166191329351f06376741dc040bb6a6ee9f8f624ae8b915d5fae944  build/item-entity-defaults-250/report.json' | sha256sum -c -
      - name: Replay separate codec and supplier linkage
        run: |
          python3 docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py \
            --installer build/item-entity-defaults-250/installer.jar \
            --server build/item-entity-defaults-250/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/item-entity-defaults-250/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/item-entity-defaults-250/universal.jar \
            --publisher build/item-entity-defaults-250/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --linkage --output build/item-entity-defaults-250/linkage.json
          python3 docs/qa/alexscaves_1010_item_entity_defaults_250_probe.py \
            --installer build/item-entity-defaults-250/installer.jar \
            --server build/item-entity-defaults-250/libraries/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-server.jar \
            --srg build/item-entity-defaults-250/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/item-entity-defaults-250/universal.jar \
            --publisher build/item-entity-defaults-250/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --linkage --output build/item-entity-defaults-250/linkage-replay.json
          cmp build/item-entity-defaults-250/linkage.json build/item-entity-defaults-250/linkage-replay.json
          test "$(wc -c < build/item-entity-defaults-250/linkage.json)" -eq 380596
          echo 'aab3ae48b827b010a92197e8c0c56bc9be8cbb35cadb1e8c0809a9542cc5bcdb  build/item-entity-defaults-250/linkage.json' | sha256sum -c -
      - name: Reproduce canonical indexes for individual Hot Chocolate certificate
        run: |
          python3 scripts/catalog/generate_perk_ready_indexes.py
          git diff --exit-code -- wiki/modpack-catalog/providers
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive bounded discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: item-entity-defaults-250
          path: |
            build/item-entity-defaults-250/report.json
            build/item-entity-defaults-250/linkage.json
          if-no-files-found: warn
          retention-days: 14
