name: Vanilla Backport 1.1.7.10 minimal NeoForge server bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vanillabackport-11710-minimal-server-bootstrap.yml'
      - 'docs/qa/vanillabackport_11710_minimal_bootstrap.py'
      - 'wiki/modpack-catalog/providers/✅-backported-spellbooks/EXACT-RUNTIME-VANILLABACKPORT-MINIMAL-SERVER-1.1.7.10.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vanilla_backport_minimal_server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare exact NeoForge 21.1.250 server distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vb-minimal-11710/server
          cd build/vb-minimal-11710/server
          BASE=https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 110 \
            "$BASE/neoforge-21.1.250-installer.jar.sha256" -o neoforge-installer.sha256
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 110 \
            "$BASE/neoforge-21.1.250-installer.jar" -o neoforge-21.1.250-installer.jar
          test "$(sha256sum neoforge-21.1.250-installer.jar | cut -d' ' -f1)" \
               = "$(awk '{print $1}' neoforge-installer.sha256)"
          test "$(sha256sum neoforge-21.1.250-installer.jar | cut -d' ' -f1)" \
               = '0e47a91ba2139a8db4bf7627af081f7b5789b508bb039ee8dea1272b79693d60'
          java -jar neoforge-21.1.250-installer.jar --installServer > installer.log 2>&1
          echo 'NEOFORGE_211250_EXACT_INSTALL=PASS'

      - name: Download official Platform 1.3.3 and Vanilla Backport 1.1.7.10 JARs
        shell: bash
        run: |
          set -euo pipefail
          cd build/vb-minimal-11710/server
          mkdir -p mods
          fetch_publisher() {
            local name="$1"
            local file_id_path="$2"
            local cf_project="$3"
            local cf_file="$4"
            local result="mods/$name"
            local candidate
            local ok=0
            for candidate in \
              "https://mediafilez.forgecdn.net/files/$file_id_path/$name" \
              "https://media.forgecdn.net/files/$file_id_path/$name" \
              "https://www.curseforge.com/api/v1/mods/$cf_project/files/$cf_file/download"; do
              rm -f "$result"
              if curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 90 \
                "$candidate" --output "$result" && unzip -tq "$result" >/dev/null 2>&1; then
                ok=1; break
              fi
            done
            test "$ok" -eq 1
            echo "PUBLISHER_FILE_SHA256[$name]=$(sha256sum "$result" | cut -d' ' -f1)"
            echo "PUBLISHER_FILE_BYTES[$name]=$(wc -c < "$result")"
          }
          fetch_publisher 'Platform-neoforge-1.21.1-1.3.3.jar' '8075/942' '997634' '8075942'
          # Publisher 1.3.3 checksum obtained in prior successful minimal boot
          test "$(sha256sum mods/Platform-neoforge-1.21.1-1.3.3.jar | cut -d' ' -f1)" \
            = '2d7175e43943d22cbb4f8d4533f0ad620f87a3ac12c77a4f15c3a35d965c4f18'
          echo 'PLATFORM_133_EXACT_PUBLISHER_SHA256=PASS'
          fetch_publisher 'VanillaBackport-neoforge-1.21.1-1.1.7.10.jar' '8229/724' '417430' '8229724'
          # Independently pinned publisher SHA from the earlier exact host QA
          test "$(sha256sum mods/VanillaBackport-neoforge-1.21.1-1.1.7.10.jar | cut -d' ' -f1)" \
            = 'ecd807ac358e243ede17819455788c7b7a0ce5e0af4aecee82c1c62c586d818d'
          echo 'VANILLABACKPORT_PUBLISHER_IDENTITY=PASS'
          printf 'eula=true\n' > eula.txt

      - name: Fail-closed dedicated-server log regression tests
        run: python3 docs/qa/vanillabackport_11710_minimal_bootstrap.py --self-test

      - name: Bounded headless dedicated-server startup, no world or client from user
        shell: bash
        run: |
          set -euo pipefail
          cd build/vb-minimal-11710/server
          set +e
          JAVA_TOOL_OPTIONS='-Dmixin.debug.verbose=true -Dmixin.debug.countInjections=true' \
            timeout --signal=TERM --kill-after=15 105 ./run.sh nogui > server-bootstrap.log 2>&1
          CODE=$?
          set -e
          echo "MINIMAL_SERVER_EXIT_CODE=$CODE"
          echo "MINIMAL_SERVER_LOG_TAIL_BEGIN"
          tail -n 95 server-bootstrap.log
          echo "MINIMAL_SERVER_LOG_TAIL_END"
          python3 ../../../docs/qa/vanillabackport_11710_minimal_bootstrap.py \
            --log server-bootstrap.log \
            --exit-code "$CODE" \
            --output ../minimal-bootstrap-evidence.json

      - name: Publish only redacted bounded JSON metadata, never mod JAR or server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanilla-backport-11710-minimal-server-${{ github.sha }}
          path: build/vb-minimal-11710/minimal-bootstrap-evidence.json
          if-no-files-found: ignore
          retention-days: 14
