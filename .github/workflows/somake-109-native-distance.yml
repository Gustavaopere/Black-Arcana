name: Somake 1.0.9 final numeric target branch (Java 21 SHA-exact)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-native-distance.yml'
      - 'docs/qa/somake_109_native_distance_branch.py'
      - 'docs/qa/somake_109_native_distance_branch_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/registry-1.0.9/funeral-bloom.md'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-RADIUS-CONSUMERS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distance_branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests with original synthetic fixtures
        run: python3 docs/qa/somake_109_native_distance_branch_test.py -v
      - name: Retrieve publisher JAR and validate physical SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-distance
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-distance/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-distance/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Probe typed final branch only; fail closed on unknown operations
        run: |
          python3 docs/qa/somake_109_native_distance_branch.py \
            --jar build/somake-distance/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-distance/result.json
      - name: Export bounded derived evidence JSON only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-distance-${{ github.sha }}
          path: build/somake-distance/result.json
          if-no-files-found: ignore
          retention-days: 14
