name: Dreamless 1.1.9 ABI Audit (temporary)

on:
  push:
    branches:
      - audit/dreamless-119-spell-abi-20261027

permissions:
  contents: read

jobs:
  exact-spells:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact SHA verification and narrow ABI calls probe
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='d51960bfb8af1aafa5d716ef9a48c3135f36b956'
          for URL in \
            'https://mediafilez.forgecdn.net/files/7905/334/dreamless_spells-1.1.9.jar' \
            'https://media.forgecdn.net/files/7905/334/dreamless_spells-1.1.9.jar' \
            'https://www.curseforge.com/api/v1/mods/1250250/files/7905334/download'; do
              if curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 100 "$URL" -o dreamless.jar; then
                if [[ "$(sha1sum dreamless.jar | cut -d' ' -f1)" == "$EXPECTED" ]]; then break; fi
              fi
          done
          printf '%s  dreamless.jar\n' "$EXPECTED" | sha1sum -c -
          mkdir -p audit
          python3 - <<'PY'
          import re, hashlib, zipfile, subprocess
          from collections import defaultdict
          from pathlib import Path
          jar=Path("dreamless.jar")
          expected="d51960bfb8af1aafa5d716ef9a48c3135f36b956"
          assert hashlib.sha1(jar.read_bytes()).hexdigest()==expected
          base="net.Iceforkkk.DreamlessAditions."
          targets={
            "DrainedSpell":"spells.empty.DrainedSpell",
            "DullardSpell":"spells.empty.DullardSpell",
            "MuteSpell":"spells.empty.MuteSpell",
            "JadeskinSpell":"spells.ice.JadeskinSpell",
            "ServerEvents":"events.ServerEvents",
            "CounterspellSpellMixin":"mixin.CounterspellSpellMixin",
            "DSSSchoolRegistry":"registries.DSSSchoolRegistry",
            "DSSSpells":"spells.DSSSpells",
            "DSSEffects":"effect.DSSEffects",
            "DrainedEffect":"effect.DrainedEffect",
            "DullardEffect":"effect.DullardEffect",
            "EmptiedEffect":"effect.EmptiedEffect",
            "JadeskinEffect":"effect.JadeskinEffect",
          }
          wanted=re.compile(r"onCast|checkPreCastConditions|getDuration|getAmplifier|getUniqueInfo|getSchoolType|onPlayerCastEvent|onPreCast|addEffect|Target|target|PreCast|Cancel|cancel|effect|Effect|MagicData|CastSource|getSpellPower|SpellRegistry|register|MAX_TARGETS|Emptied|emptied|ServerPlayer|radius|spellLevel|school|School|onHit",re.I)
          report=["DREAMLESS SPELLS 1.1.9 SHA-EXACT SYMBOLIC ABI",
                  f"sha1={expected}","CurseForge project/file=1250250/7905334",
                  "method-scoped call references and field names ONLY",
                  "NO executable method bodies, constants, branches, code, assets or textures preserved"]
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            names=set(z.namelist())
            for alias,tail in targets.items():
              cls=base+tail
              found=cls.replace(".","/")+".class" in names
              report.append(f"CLASS={alias} PRESENT={str(found).lower()} PATH={cls}")
              if alias in ("DrainedSpell","DullardSpell","MuteSpell","JadeskinSpell"):assert found,alias
              if not found:continue
              result=subprocess.run(["javap","-p","-c","-classpath",str(jar),cls],capture_output=True,text=True,check=True).stdout
              current="<init>"
              calls=defaultdict(list)
              declarations=set()
              for line in result.splitlines():
                s=line.strip()
                if s.endswith(";") and "(" in s and not re.match(r"^\d+:",s) and not s.startswith(("descriptor:","Code:","//")):
                  m=re.search(r"([\w$<>]+)\([^)]*\)(?:\s+throws .*)?;$",s)
                  if m:
                    current=m.group(1)
                    declarations.add(current)
                    calls.setdefault(current,[])
                m=re.match(r"^\s*\d+:\s+(invoke\w+|getfield|putfield|getstatic|putstatic)\s+(.*)$",line)
                if not m:continue
                op,other=m.groups()
                comment=other.partition("//")[2].strip()
                if op.startswith("invoke") and comment.startswith(("Method ","InterfaceMethod ")):
                  target=comment.split(" ",1)[1].split(":",1)[0].replace('"',"")
                  if "." in target:
                    owner,member=target.rsplit(".",1)
                    owner=owner.replace("/",".")
                  else:owner,member=cls,target
                  if wanted.search(member):
                    calls[current].append(("CALL",owner,member))
                elif op in ("getfield","putfield","getstatic","putstatic") and comment.startswith("Field "):
                  target=comment.split(" ",1)[1].split(":",1)[0]
                  if "." in target:
                    owner,field=target.rsplit(".",1)
                    owner=owner.replace("/",".")
                  else:owner,field=cls,target
                  if wanted.search(field):calls[current].append((op.upper(),owner,field))
              for meth in sorted(declarations):
                if wanted.search(meth):
                  report.append(f"METHOD={alias}.{meth} PRESENT=true")
                  rows=calls[meth]
                  for op,owner,member in rows[:35]:
                    report.append(f"  {op}={owner}.{member}")
                  if len(rows)>35:report.append(f"  OMITTED_REFERENCES={len(rows)-35}")
              if alias in ("DrainedSpell","DullardSpell","MuteSpell","JadeskinSpell"):
                for name in ("onCast",):
                  assert name in declarations, f"missing {alias}.{name}"
          report.append("BOUNDARY=Static reference presence is not proof of execution, numeric balance, cast effectiveness, hook safety, source identity or physical client-server behavior.")
          Path("audit/dreamless-119-spell-abi.txt").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("\n".join(report))
          PY
      - name: Upload sanitized symbolic report
        uses: actions/upload-artifact@v7
        with:
          name: dreamless-119-exact-symbols
          path: audit/dreamless-119-spell-abi.txt
          if-no-files-found: error
          retention-days: 30
