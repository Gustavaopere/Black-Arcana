name: Alex's Caves 1.0.10 Burrowing Arrow entity read-only bytecode
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-burrowing-entity-probe.yml'
      - 'docs/qa/alexscaves_1010_burrowing_entity_probe.py'
      - 'docs/qa/alexscaves-1010-burrowing-arrow-causal-handoff.md'
      - 'docs/qa/alexscaves_1010_burrowing_entity_static_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-BURROWING-ARROW-CAUSAL-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  burrowing_arrow_entity_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate bytecode-auditor syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_burrowing_entity_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_burrowing_entity_static_checks.py
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/burrowing-arrow-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/burrowing-arrow-1010/alexscaves-1.0.10.jar
      - name: Capture exact item, entity and dispenser paths without mutation
        run: |
          python3 docs/qa/alexscaves_1010_burrowing_entity_probe.py \
            --jar build/burrowing-arrow-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output-dir build/burrowing-arrow-1010/bytecode
      - name: Assert exact local entity branches and safety boundaries
        run: |
          python3 docs/qa/alexscaves_1010_burrowing_entity_static_checks.py \
            --transcript-dir build/burrowing-arrow-1010/bytecode
      - name: Archive SHA-exact bytecode evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-burrowing-arrow-entity-discovery
          path: build/burrowing-arrow-1010/bytecode/
          retention-days: 14
