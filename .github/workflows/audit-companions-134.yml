name: Companions 1.3.4 physical Magic Book registry audit
on:
  push:
    branches:
      - 'audit/companions-134-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact physical JAR and discover Magic Book registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,hashlib,urllib.request,pathlib,subprocess,re
          sha_expected='23f6e4f27a457a8d016412e495e417c0b36fdcc1'
          urls=[
            'https://cursemaven.com/curse/maven/companions-mod-1300341/8857294/companions-mod-1300341-8857294.jar',
            'https://mediafilez.forgecdn.net/files/8857/294/companions-neoforge-1.21.1-1.3.4.jar',
            'https://media.forgecdn.net/files/8857/294/companions-neoforge-1.21.1-1.3.4.jar',
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'companions-neoforge-1.21.1-1.3.4.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-audit'})
              with urllib.request.urlopen(req,timeout=100) as res:
                data=res.read(26000000)
              digest=hashlib.sha1(data).hexdigest()
              print('CANDIDATE_BYTES='+str(len(data))+' SHA1='+digest,flush=True)
              if digest==sha_expected:
                jar.write_bytes(data)
                break
            except Exception as exc:
              print('CANDIDATE_ERROR='+repr(exc)[:250],flush=True)
          else:raise SystemExit('FAIL-CLOSED: no publisher binary matches physical modlist SHA-1')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('CERTIFIED_FILE_ID=8857294')
          print('CERTIFIED_BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            paths=z.namelist()
            manifests=[p for p in paths if p.endswith('neoforge.mods.toml')]
            print('MANIFESTS='+repr(manifests[:6]))
            if manifests:
              meta=z.read(manifests[0]).decode('utf8','replace')
              print('META_IDS='+repr([x.strip() for x in meta.splitlines() if 'modId' in x][:10]))
              assert re.search(r'modId\s*=\s*["\x27]companions["\x27]',meta), 'incorrect modid'
          classes=[p[:-6].replace('/','.') for p in paths if p.endswith('.class') and '$' not in p]
          books=[p for p in classes if 'MagicBook' in p or 'CompanionsItems' in p or ('Magic' in p and 'Book' in p)]
          print('MAGIC_BOOK_CLASSES='+repr(books[:100]))
          register=[p for p in classes if 'CompanionsItems' in p or p.endswith('.CompanionsMod')]
          print('REGISTRY_CANDIDATES='+repr(register))
          for name in register:
            try:
              out=subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,timeout=35)
              if out.returncode or ('book_' not in out.stdout and 'BOOK_' not in out.stdout):continue
              print('REGISTRAR_CLASS='+name)
              for line in out.stdout.splitlines():
                if ('book_' in line or 'BOOK_' in line or 'MagicBook' in line or 'register(' in line or 'static {};' in line or 'ifne' in line):
                  print('REG_BYTECODE='+line.strip()[:270])
            except Exception as e:print('DISCOVERY_ERROR='+repr(e)[:180])
          print('STATIC_DISCOVERY_ONLY=TRUE')
          PY

      - name: Inspect exact nine item factory call sites and book inheritance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,subprocess,zipfile,re
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'companions-neoforge-1.21.1-1.3.4.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='23f6e4f27a457a8d016412e495e417c0b36fdcc1'
          def javap(c):
            p=subprocess.run(['javap','-c','-p','-classpath',str(jar),c],capture_output=True,text=True,timeout=50)
            assert p.returncode==0,(c,p.stderr[:180])
            return p.stdout
          cls='dev.xylonity.companions.registry.CompanionsItems'
          text=javap(cls)
          lines=text.splitlines()
          static=text.split('static {};',1)[1]
          expected=['book_ice_shard','book_ice_tornado','book_fire_mark','book_heal_ring','book_stone_spikes','book_brace','book_magic_ray','book_black_hole','book_naginata']
          names=re.findall(r'// String (book_[a-z_]+)',static)
          print('ALL_COMPILED_BOOK_IDS='+repr(names))
          assert names==expected,(names,expected)
          for key in expected:
            indices=[i for i,line in enumerate(lines) if '// String '+key in line and lines.index('  static {};')<i]
            assert len(indices)==1,(key,indices)
            idx=indices[0]
            print('BOOK_REGISTER_SITE='+key+'|'+repr([s.strip() for s in lines[idx-1:idx+13]]))
          print('BOOK_STATIC_BRANCHES='+repr([x.strip() for x in static.splitlines() if re.search(r'^\s*(?:3[3-9]\d|4\d\d): (?:if|goto|tableswitch|lookupswitch)',x)]))
          print('METHOD_NAMES='+repr([s.strip() for s in lines if (s.startswith('  private ') or s.startswith('  public ')) and ('lambda$' in s or 'register' in s.lower())][:95]))
          with zipfile.ZipFile(jar) as z:
            physical=[x[:-6].replace('/','.') for x in z.namelist()
                      if x.endswith('.class') and x.startswith('dev/xylonity/companions/common/item/book/')]
          print('BOOK_CLASSFILES='+repr(physical[:110]))
          for name in physical:
            if '$' in name or name.endswith('AbstractMagicBook'):continue
            details=javap(name)
            title=next((x.strip() for x in details.splitlines() if x.startswith('public class ') or x.startswith('public abstract class ')),'')
            print('BOOK_HIERARCHY='+name+'|'+title)
          print('NINE_BOOK_STATIC_DISCOVERY=PASS')
          PY

      - name: Resolve per-ID LambdaMetafactory to nine concrete MagicBook classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,hashlib,subprocess,re,zipfile
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'companions-neoforge-1.21.1-1.3.4.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='23f6e4f27a457a8d016412e495e417c0b36fdcc1'
          target='dev.xylonity.companions.registry.CompanionsItems'
          def javap(*opts):
            p=subprocess.run(['javap',*opts,'-classpath',str(jar),target],capture_output=True,text=True,timeout=70)
            assert p.returncode==0,p.stderr[:300]
            return p.stdout
          code=javap('-c','-p')
          verbose=javap('-v','-p')
          print('BOOTSTRAPS_FOR_BOOKS_START')
          lines=verbose.split('BootstrapMethods:',1)[1].split('InnerClasses:',1)[0]
          for l in lines.splitlines():
            if re.search(r'^\s*(?:1[7-9]|2[0-5]):',l) or 'REF_invokeStatic dev/xylonity/companions/registry/CompanionsItems.lambda$static$' in l:
              print('BOOK_BOOTSTRAP='+l.strip()[:280])
          print('BOOK_BOOTSTRAPS_END')
          for m in re.finditer(r'private static net\.minecraft\.world\.item\.Item (lambda\$static\$\d+)\(\);',code):
            name=m.group(1)
            section=code[m.end():].split('\n  private ',1)[0].split('\n  public ',1)[0].split('\n  static {};',1)[0]
            news=re.findall(r'// class (dev/xylonity/companions/common/item/book/books/[A-Za-z0-9_]+)',section)
            if news:print('BOOK_FACTORY='+name+'|'+repr(news))
          print('NINE_FACTORY_INSPECTION=PASS')
          PY

      - name: Certify all nine Magic Book ID-to-factory mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,subprocess,re,zipfile
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'companions-neoforge-1.21.1-1.3.4.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='23f6e4f27a457a8d016412e495e417c0b36fdcc1'
          def javap(cls,verbose=False):
            p=subprocess.run(['javap','-v' if verbose else '-c','-p','-classpath',str(jar),cls],capture_output=True,text=True,timeout=70)
            assert p.returncode==0,(cls,p.stderr[:190])
            return p.stdout
          cls='dev.xylonity.companions.registry.CompanionsItems'
          code=javap(cls)
          verbose=javap(cls,True)
          static=code.split('static {};',1)[1]
          bootstrap=verbose.split('BootstrapMethods:',1)[1].split('InnerClasses:',1)[0]
          expected=[
            ('book_ice_shard','IceShardBook'),('book_ice_tornado','IceTornadoBook'),
            ('book_fire_mark','FireMarkBook'),('book_heal_ring','HealRingBook'),
            ('book_stone_spikes','StoneSpikesBook'),('book_brace','BraceBook'),
            ('book_magic_ray','MagicRayBook'),('book_black_hole','BlackHoleBook'),
            ('book_naginata','NaginataBook')]
          actual=re.findall(r'// String (book_[a-z_]+)',static)
          assert actual==[id for id,cl in expected],(actual,expected)
          for slot,(ident,itemcls) in enumerate(expected,17):
            statlines=static.splitlines()
            ix=[i for i,s in enumerate(statlines) if '// String '+ident in s]
            assert len(ix)==1,(ident,ix)
            invocation='\n'.join(statlines[ix[0]:ix[0]+5])
            assert 'InvokeDynamic #'+str(slot)+':get' in invocation,ident
            assert 'ResourceRegistry.register:(Ljava/lang/String;Ljava/util/function/Supplier;)' in invocation,ident
            assert 'putstatic' in invocation and 'BOOK_'+ident[5:].upper() in invocation,ident
            entry=re.search(r'^\s*'+str(slot)+r':[^\n]*\n(?:(?!\n\s*\d+:)[\s\S])*?CompanionsItems.lambda\$static\$'+str(slot)+r':',bootstrap,re.M)
            assert entry,('missing bootstrap mapping',ident,slot)
            method=re.search(r'  private static net\.minecraft\.world\.item\.Item lambda\$static\$'+str(slot)+r'\(\);([\s\S]*?)(?=^  (?:private|public|static) |\Z)',code,re.M)
            assert method,('lambda method missing',slot)
            assert '// class dev/xylonity/companions/common/item/book/books/'+itemcls in method.group(1),(ident,itemcls)
            item=javap('dev.xylonity.companions.common.item.book.books.'+itemcls)
            assert 'extends dev.xylonity.companions.common.item.book.AbstractMagicBook' in item,itemcls
            print('EXACT_MAGIC_BOOK_'+str(slot-16)+'=companions:'+ident+'|'+itemcls+'|AbstractMagicBook')
          lines=static.splitlines()
          start=next(i for i,l in enumerate(lines) if '// String book_ice_shard' in l)
          finish=next(i for i,l in enumerate(lines) if '// Field BOOK_NAGINATA:' in l)
          active='\n'.join(lines[start:finish+1])
          assert not re.search(r'^\s*\d+:\s+(?:ifne|ifeq|ifnull|ifnonnull|if_icmp\w+|goto|tableswitch|lookupswitch)\b',active,re.M)
          print('EXACT_PHYSICAL_ITEM_MAGIC_REGISTRATIONS=9')
          print('PROVIDER_NATIVE_MAGIC_BOOK_CLASSES=9')
          print('STATIC_ITEM_REGISTRATION_CONDITIONS=0')
          print('NEW_SEMANTIC_ROOTS=0')
          print('EXACT_STATIC_REGISTRY_AUDIT=PASS')
          print('RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY
