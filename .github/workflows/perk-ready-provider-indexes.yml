name: Perk-ready provider index coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATION-RULES.md'
      - 'scripts/catalog/check_perk_ready_indexes.py'
      - 'scripts/catalog/check_perk_ready_indexes_test.py'
      - '.github/workflows/perk-ready-provider-indexes.yml'
  push:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATION-RULES.md'
      - 'scripts/catalog/check_perk_ready_indexes.py'
      - 'scripts/catalog/check_perk_ready_indexes_test.py'
      - '.github/workflows/perk-ready-provider-indexes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider_index_consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic index integrity and false-green tests
        run: python3 scripts/catalog/check_perk_ready_indexes_test.py -v
      - name: Verify every mod and subfolder index, item link and completion numerator
        run: python3 scripts/catalog/check_perk_ready_indexes.py
