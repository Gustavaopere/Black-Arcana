name: Perk-ready provider index coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATION-RULES.md'
      - 'wiki/modpack-catalog/meta/ALPHABETICAL-CATALOG-STATUS.json'
      - 'scripts/catalog/check_perk_ready_indexes.py'
      - 'scripts/catalog/check_perk_ready_indexes_test.py'
      - 'scripts/catalog/generate_perk_ready_indexes.py'
      - 'scripts/catalog/generate_perk_ready_indexes_test.py'
      - 'scripts/catalog/check_ars_effects_static_test.py'
      - 'scripts/catalog/check_ars_rituals_static_test.py'
      - 'scripts/catalog/check_ars_familiars_static_test.py'
      - 'scripts/catalog/check_ars_perks_advanced_static_test.py'
      - '.github/workflows/perk-ready-provider-indexes.yml'
  push:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATION-RULES.md'
      - 'wiki/modpack-catalog/meta/ALPHABETICAL-CATALOG-STATUS.json'
      - 'scripts/catalog/check_perk_ready_indexes.py'
      - 'scripts/catalog/check_perk_ready_indexes_test.py'
      - 'scripts/catalog/generate_perk_ready_indexes.py'
      - 'scripts/catalog/generate_perk_ready_indexes_test.py'
      - 'scripts/catalog/check_ars_effects_static_test.py'
      - 'scripts/catalog/check_ars_rituals_static_test.py'
      - 'scripts/catalog/check_ars_familiars_static_test.py'
      - 'scripts/catalog/check_ars_perks_advanced_static_test.py'
      - '.github/workflows/perk-ready-provider-indexes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider_index_consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic index integrity and false-green tests
        run: python3 scripts/catalog/check_perk_ready_indexes_test.py -v
      - name: Synthetic update/regenerate nested index tests
        run: python3 scripts/catalog/generate_perk_ready_indexes_test.py -v
      - name: Verify five static Ars Effect contracts and non-proof boundaries
        run: python3 scripts/catalog/check_ars_effects_static_test.py -v
      - name: Verify first five Ars Ritual static contracts and safety boundaries
        run: python3 scripts/catalog/check_ars_rituals_static_test.py -v
      - name: Verify six Ars Familiar source-only contracts and evidence boundaries
        run: python3 scripts/catalog/check_ars_familiars_static_test.py -v
      - name: Verify source-only Ars armor Thread contracts and lifecycle boundaries
        run: python3 scripts/catalog/check_ars_perks_advanced_static_test.py -v
      - name: Verify every mod and subfolder index, item link and completion numerator
        run: python3 scripts/catalog/check_perk_ready_indexes.py
      - name: Verify index generator read-only check mode
        run: python3 scripts/catalog/generate_perk_ready_indexes.py --check
