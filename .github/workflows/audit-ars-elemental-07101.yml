name: Ars Elemental 0.7.10.1 exact physical registry audit
on:
  push:
    branches:
      - 'audit/ars-elemental-07101-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch publisher JAR matching exact physical SHA1 or fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,hashlib,zipfile,pathlib
          name="ars_elemental-1.21.1-0.7.10.1.jar"
          sha_expected="a1e4021177aae0e16c1f7c6487a82f0b68bbade3"
          paths=[
            "https://mediafilez.forgecdn.net/files/8399/862/"+name,
            "https://media.forgecdn.net/files/8399/862/"+name,
            "https://cursemaven.com/curse/maven/ars-elemental-561470/8399862/ars-elemental-561470-8399862.jar"
          ]
          jar=pathlib.Path(os.environ["RUNNER_TEMP"])/name
          for url in paths:
            try:
              print("SOURCE="+url,flush=True)
              req=urllib.request.Request(url,headers={"User-Agent":"Black-Arcana-clean-room-physical-audit/1"})
              with urllib.request.urlopen(req,timeout=85) as response:
                data=response.read(12000000)
              digest=hashlib.sha1(data).hexdigest()
              print("BYTES="+str(len(data))+" SHA1="+digest,flush=True)
              if digest!=sha_expected:continue
              jar.write_bytes(data)
              with zipfile.ZipFile(jar) as z: assert z.testzip() is None
              print("EXACT_PUBLISHER_PHYSICAL_HASH=PASS",flush=True)
              with open(os.environ["GITHUB_ENV"],"a") as f:f.write("EXACT_JAR="+str(jar)+"\n")
              break
            except Exception as exc: print("SOURCE_FAILURE="+repr(exc)[:200],flush=True)
          else:
            raise SystemExit("Cannot fetch SHA-exact Ars Elemental 0.7.10.1; no promotion")
          PY
      - name: Inspect exact 39 production glyph fields, eight rituals and identity suffixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,zipfile
          jar=os.environ['EXACT_JAR']
          def java(c):
            p=subprocess.run(['javap','-p','-c','-classpath',jar,c],text=True,capture_output=True,timeout=45)
            assert p.returncode==0,(c,p.stderr[:180])
            return p.stdout
          reg=java('alexthw.ars_elemental.ArsNouveauRegistry')
          def method(name):
            anchor='public static void '+name+'();'
            assert anchor in reg,anchor
            lines=reg.split(anchor,1)[1].splitlines()
            pos=next((i for i,line in enumerate(lines[2:],2) if line.startswith('  public ') or line.startswith('  private ') or line.startswith('  static {};')),len(lines))
            return '\n'.join(lines[:pos])
          glyph=method('registerGlyphs')
          ritual=method('registerRituals')
          print('PRODUCTION_STATIC_REGISTER_CALLS='+str(glyph.count('// Method register:(Lcom/hollingsworth/arsnouveau/api/spell/AbstractSpellPart;)V')))
          print('REGISTRAR_BRANCHES='+repr([line.strip() for line in glyph.splitlines() if re.search(r'\bifne\b|\bifeq\b|\bifnull\b|\bgoto\b',line)]))
          print('RITUAL_STATIC_REGISTER_CALLS='+str(ritual.count('// Method registerRitual:(Lcom/hollingsworth/arsnouveau/api/ritual/AbstractRitual;)V')))
          print('RITUAL_BRANCHES='+repr([line.strip() for line in ritual.splitlines() if re.search(r'\bifne\b|\bifeq\b|\bgoto\b',line)]))
          print('GLYPH_FIELDS_START')
          fields=re.findall(r'// Field ([\w/$]+)\.(INSTANCE|NOT_INSTANCE):',glyph)
          print('FIELD_COUNT='+str(len(fields)))
          for i,(cls,field) in enumerate(fields,1):
            print('GLYPH_FIELD_'+str(i)+'='+cls.replace('/','.')+'.'+field)
          print('GLYPH_FIELDS_END')
          ritual_classes=re.findall(r'// class (alexthw/ars_elemental/common/rituals/[\w/$]+)',ritual)
          print('RITUAL_CLASS_COUNT='+str(len(ritual_classes)))
          for i,c in enumerate(ritual_classes,1):print('RITUAL_CLASS_'+str(i)+'='+c.replace('/','.'))
          print('ENTRYPOINT_INIT='+str('ArsNouveauRegistry.init:()V' in java('alexthw.ars_elemental.ArsElemental')))
          print('INIT_CALLS='+repr([s.strip() for s in method('init').splitlines() if 'registerGlyphs:' in s or 'registerRituals:' in s]))
          print('GLYPH_IDENTITIES_START')
          by_cls=sorted(set(x[0] for x in fields))
          for c in by_cls:
            text=java(c.replace('/','.'))
            lines=[l.strip() for l in text.splitlines() if ('// String ' in l or 'ArsElemental.prefix:' in l or 'ArsNouveau.prefix:' in l or 'GlyphLib.' in l or 'ResourceLocation' in l and ('prefix' in l or 'fromNamespace' in l))]
            print('GLYPH_IDENTITY_CLASS='+c.replace('/','.'))
            for line in lines[:20]:print('GLYPH_CONSTRUCTOR='+line[:260])
          print('GLYPH_IDENTITIES_END')
          print('RITUAL_IDENTITIES_START')
          for c in ritual_classes:
            text=java(c.replace('/','.'))
            lines=[l.strip() for l in text.splitlines() if '// String ' in l or 'ArsElemental.prefix:' in l or 'ArsNouveau.prefix:' in l or 'ResourceLocation' in l and 'fromNamespace' in l]
            print('RITUAL_IDENTITY_CLASS='+c.replace('/','.'))
            for line in lines[:25]:print('RITUAL_CONSTRUCTOR='+line[:245])
          print('RITUAL_IDENTITIES_END')
          with zipfile.ZipFile(jar) as z:
            metadata=next((x for x in z.namelist() if x.endswith('neoforge.mods.toml')),None)
            print('MODS_METADATA='+str(metadata))
            if metadata:
              data=z.read(metadata).decode('utf8')
              print('MOD_ID='+repr(re.findall(r'modId\s*=\s*["\x27]([^"\x27]+)',data)[:10]))
          print('BINARY_DISCOVERY_COMPLETE=TRUE')
          PY
