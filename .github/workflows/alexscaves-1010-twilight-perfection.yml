name: Alex's Caves 1.0.10 Twilight Perfection SHA-exact individual audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-twilight-perfection.yml'
      - 'docs/qa/alexscaves_1010_twilight_perfection_probe.py'
      - 'docs/qa/alexscaves_1010_twilight_perfection_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/twilight-perfection.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TWILIGHT-PERFECTION-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-twilight-perfection.yml'
      - 'docs/qa/alexscaves_1010_twilight_perfection_probe.py'
      - 'docs/qa/alexscaves_1010_twilight_perfection_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/twilight-perfection.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TWILIGHT-PERFECTION-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
permissions:
  contents: read
jobs:
  exact_twilight_perfection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Twilight Perfection deterministic negative gates
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_twilight_perfection_probe.py docs/qa/alexscaves_1010_twilight_perfection_probe_test.py
          python3 docs/qa/alexscaves_1010_twilight_perfection_probe_test.py -v
      - name: Download installed publisher SHA-exact 1.0.10
        run: |
          mkdir -p build/alexscaves-twilight
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-twilight/alexscaves-1.0.10.jar
      - name: Verify exact publisher resource and JVM consumers
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TWILIGHT-PERFECTION-CONTRACT-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_twilight_perfection_probe.py \
              --jar build/alexscaves-twilight/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DREADBOW-CONTRACTS-1.0.10.json' --seal "$SEAL" \
              --output build/alexscaves-twilight/individual-evidence.json
          else
            echo 'TWILIGHT UNSEALED DISCOVERY - no certificate'
            python3 docs/qa/alexscaves_1010_twilight_perfection_probe.py \
              --jar build/alexscaves-twilight/alexscaves-1.0.10.jar \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DREADBOW-CONTRACTS-1.0.10.json' \
              --output build/alexscaves-twilight/individual-evidence.json
          fi
      - name: Check provider indexes remain canonical
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-twilight-perfection-audit
          path: build/alexscaves-twilight/individual-evidence.json
          if-no-files-found: ignore
          retention-days: 14
