name: Alex's Caves 1.0.10 consolidated Raygun static contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-contract.yml'
      - 'docs/qa/alexscaves_1010_*.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'scripts/catalog/*perk_ready_indexes*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-contract.yml'
      - 'docs/qa/alexscaves_1010_*.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'scripts/catalog/*perk_ready_indexes*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raygun_static_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AC_RAYGUN_CONTRACT_JAR: '${{ github.workspace }}/build/raygun-contract-1010/alexscaves-1.0.10.jar'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch and fingerprint exact publisher artifact
        run: |
          mkdir -p build/raygun-contract-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output "$AC_RAYGUN_CONTRACT_JAR"
          echo '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c  build/raygun-contract-1010/alexscaves-1.0.10.jar' | sha256sum --check --strict
      - name: Native negative regressions, physical CLI idempotence and semantic cards
        run: |
          export AC_RAYGUN_CONTRACT_JAVAP="$JAVA_HOME/bin/javap"
          python3 docs/qa/alexscaves_1010_raygun_contract_audit_test.py -v
          python3 docs/qa/alexscaves_1010_raygun_contract_cards_test.py -v
      - name: Verify consolidated Raygun contract against publisher JAR
        run: |
          python3 docs/qa/alexscaves_1010_raygun_contract_audit.py \
            --jar "$AC_RAYGUN_CONTRACT_JAR" --javap "$JAVA_HOME/bin/javap" \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CONTRACT-1.0.10.json' \
            --output build/raygun-contract-1010/raygun-contract-evidence.json
      - name: Verify canonical catalog indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive bounded static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-static-contract
          path: build/raygun-contract-1010/raygun-contract-evidence.json
          if-no-files-found: ignore
          retention-days: 14
