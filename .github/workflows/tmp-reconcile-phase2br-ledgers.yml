          s=replace_once(s,'| **Strict total** |  | **1332** |  |  |','| **Strict total** |  | **1344** |  |  |','semantic strict table total')
          s=replace_once(s,'These rows are deliberately **not additive to 1332** until their exact/current inventory and deduplication state meet the inclusion rule.','These rows are deliberately **not additive to 1344** until their exact/current inventory and deduplication state meet the inclusion rule.','semantic lower bound intro')
          s=replace_once(s,'1. **1332 is not “1332 / unknown”.** It is a reconstructible counted minimum while the denominator remains open.','1. **1344 is not “1344 / unknown”.** It is a reconstructible counted minimum while the denominator remains open.','semantic rule1')
          s=replace_once(s,'2. Do not divide 1332 by the 100 provider-component denominator. The current component target is `65/100`; provider-component coverage and semantic-magic coverage answer different questions.','2. Do not divide 1344 by the 100 provider-component denominator. The current component target is `66/100`; provider-component coverage and semantic-magic coverage answer different questions.','semantic rule2')
          s=replace_once(s,'3. Do not add public lower bounds to 1332 and call the result complete.','3. Do not add public lower bounds to 1344 and call the result complete.','semantic rule3')
          write(semantic,s)

          # Provider README final shared accounting
          s=read(provider)
          s=replace_once(s,
            'Status: `EXACT RELEASE ARTIFACT CLOSED / COUNTED_RELEASE_BOUNDED CANDIDATE +12 / COMPONENT #66 CANDIDATE / CURRENT-HOST RUNTIME QA FAIL-CLOSED`',
            'Status: `COUNTED_RELEASE_BOUNDED / +12 / COMPONENT #66 / CURRENT-HOST RUNTIME QA FAIL-CLOSED`',
            'provider status')
          old='''## Component accounting\n\nThis durable provider record proposes GTBC's Geomancy Plus as **component #66** with semantic delta **+12 `COUNTED_RELEASE_BOUNDED`**. It does not by itself alter the canonical shared ledgers.\n\nUntil a separate latest-main shared-ledger reconciliation is reviewed, passes exact-HEAD CI, merges, and passes exact merge-SHA post-merge CI:\n\n- canonical semantic minimum remains **1332**;\n- canonical technical component closure remains **65/100**;\n- this provider remains `COMPONENT #66 CANDIDATE` / `+12 CANDIDATE`.\n\nSee [`EXACT-1.1.0-ARTIFACT-AUDIT.md`](./EXACT-1.1.0-ARTIFACT-AUDIT.md) and the Phase 2BR checkpoint for evidence details.'''
          new='''## Component accounting\n\nDurable Phase 2BR provider evidence is canonical via PR #226, squash-merged as `main@4ab4ad990d453938e67f3d2b7cfa878bbe031ef0`. That exact merge SHA passed Black Arcana CI **#2654** / run `34738972649` and published QA artifact `10311522907` (`sha256:c815f684a7a6dec192dd995bb6fbd6784c35faa0b0d21ae39bb9de89b93cec16`).\n\nThis shared-ledger reconciliation promotes GTBC's Geomancy Plus as **component #66** and adds **+12 `COUNTED_RELEASE_BOUNDED`** semantic objects. The canonical shared values become **1344 semantic magic objects minimum / 66 of 100 technical components** after this reconciliation itself merges and its exact merge SHA passes post-merge CI. The 66/100 component metric is not spell/magic percentage coverage.\n\nCurrent-host runtime integration remains fail-closed as documented above; semantic/component catalog closure does not promote an adapter or runtime PASS.\n\nSee [`EXACT-1.1.0-ARTIFACT-AUDIT.md`](./EXACT-1.1.0-ARTIFACT-AUDIT.md) and the Phase 2BR checkpoint for evidence details.'''
          s=replace_once(s,old,new,'provider component accounting')
          write(provider,s)

          # Verify working tree modifications are exactly the five intended docs.
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
            'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
            'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
            'wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'
            'wiki/modpack-catalog/providers/gtbcs-geomancy-plus/README.md'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected changed files:\n'; printf '%s\n' "${changed[@]}"; exit 1
          fi
          git diff --check

      - name: Self-remove helper and commit reconciliation docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-reconcile-phase2br-ledgers.yml
