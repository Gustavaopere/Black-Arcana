          s=replace_once(s,
            '| 65 | 2BQ / #223 | `ars_two_way_portals` | EVIDÊNCIA DURÁVEL em `main@bc5428b5...`; `ZERO_SEMANTIC_PORTAL_INFRA`; +0 semântico; exact-artifact; post-merge CI #2622 GREEN; promovido por esta reconciliação; runtime host QA fail-closed |',
            '| 66 | 2BR / #226 | `gtbcs_geomancy_plus` | EVIDÊNCIA DURÁVEL em `main@4ab4ad99...`; +12 `COUNTED_RELEASE_BOUNDED`; 10 Geo + 2 Holy; registry/reachability auditados; post-merge CI #2654 GREEN; promovido por esta reconciliação; runtime host QA fail-closed |\n| 65 | 2BQ / #223 | `ars_two_way_portals` | CANÔNICO em `main@bc5428b5...`; `ZERO_SEMANTIC_PORTAL_INFRA`; +0 semântico; exact-artifact; post-merge CI #2622 GREEN; runtime host QA fail-closed |',
