          s=replace_once(s,
            "Phase 2BF / Somake, Phase 2BG / Leylines, Phase 2BH / Goety, Phase 2BL / Goety addons, Phase 2BM / Ars Polymorphia, Phase 2BN / Ars Sable, Phase 2BO / Farmer's Spell, Phase 2BP / Aeromancy Additions e Phase 2BQ / Ars Nouveau: Two-Way Portals já foram reconciliadas no nível de evidência descrito acima.",
            "Phase 2BF / Somake, Phase 2BG / Leylines, Phase 2BH / Goety, Phase 2BL / Goety addons, Phase 2BM / Ars Polymorphia, Phase 2BN / Ars Sable, Phase 2BO / Farmer's Spell, Phase 2BP / Aeromancy Additions, Phase 2BQ / Ars Nouveau: Two-Way Portals e Phase 2BR / GTBC's Geomancy Plus já foram reconciliadas no nível de evidência descrito acima.",
