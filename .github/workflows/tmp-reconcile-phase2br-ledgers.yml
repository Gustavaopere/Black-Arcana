name: Temporary Phase 2BR Ledger Reconciliation

on:
  push:
    branches:
      - docs/reconcile-provider-ledgers-phase2br

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shared ledgers assertively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s, encoding='utf-8')
          def replace_once(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {n}')
              return s.replace(old,new,1)
          def insert_before(s, marker, block, label):
              return replace_once(s, marker, block + marker, label)

          coverage='wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
          current='wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
          queue='wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
          semantic='wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md'
          provider='wiki/modpack-catalog/providers/gtbcs-geomancy-plus/README.md'

          # CATALOG-COVERAGE-CURRENT
          s=read(coverage)
          s=replace_once(s,
            'Phase 2BQ then closes Ars Nouveau: Two-Way Portals 2.0.0 as exact hash-matched `ZERO_SEMANTIC_PORTAL_INFRA` with **+0**. The current strict minimum therefore remains **1332**.',
            'Phase 2BQ then closes Ars Nouveau: Two-Way Portals 2.0.0 as exact hash-matched `ZERO_SEMANTIC_PORTAL_INFRA` with **+0**; Phase 2BR closes GTBC\'s Geomancy Plus 1.1.0-1.21.1 at **+12 `COUNTED_RELEASE_BOUNDED`** from the exact publisher-release registry plus provider/host reachability evidence. The current strict minimum therefore becomes **1344**.',
            'coverage top semantic current state')
          phase2br_cov = '''Phase 2BR has a semantic delta of **+12 `COUNTED_RELEASE_BOUNDED`**: exact publisher release file `7041615` closes twelve unconditional `GGSpells` registrations — ten Geo and two Holy — while `EarthshatterSpell` is present but unregistered and the non-registry adaptation classes add zero provider identities. The repository does not preserve an independent local physical-JAR hash, so this is release-bounded rather than `COUNTED_EXACT`. A dedicated exact-release audit proves all ten registered Geo classes inherit Iron's `allowCrafting`, `isEnabled` and `canBeCraftedBy` host gates; exact Geo focus data plus the canonical Iron's Scroll Forge contract close catalog-level Geo reachability, while exact Umvuthi loot identifiers and the exact file changelog close catalog-level acquisition for `solar_beam` and `solar_storm`. This shared reconciliation raises the strict minimum to **1344** and closes provider component **#66**, while assembled-pack runtime/config/protection behavior remains fail-closed. See [`../providers/gtbcs-geomancy-plus/README.md`](../providers/gtbcs-geomancy-plus/README.md), [`../providers/gtbcs-geomancy-plus/EXACT-1.1.0-ARTIFACT-AUDIT.md`](../providers/gtbcs-geomancy-plus/EXACT-1.1.0-ARTIFACT-AUDIT.md) and [`PHASE2BR-GTBC-GEOMANCY-PLUS-1.1.0-EXACT-CHECKPOINT.md`](./PHASE2BR-GTBC-GEOMANCY-PLUS-1.1.0-EXACT-CHECKPOINT.md).\n\n'''
          s=insert_before(s,'Phase 2BQ has a semantic delta of **0**:',phase2br_cov,'coverage Phase2BR section')
          s=replace_once(s,
            '- semantic numerator/denominator delta attributable to Ars Nouveau: Two-Way Portals 2.0.0 exact closure: **+0**;',
            '- semantic numerator delta from GTBC\'s Geomancy Plus 1.1.0-1.21.1 release-bounded closure: **+12**;\n- semantic numerator/denominator delta attributable to Ars Nouveau: Two-Way Portals 2.0.0 exact closure: **+0**;',
            'coverage delta bullet')
          s=replace_once(s,'- strict reconstructible semantic minimum: **1332**;','- strict reconstructible semantic minimum: **1344**;','coverage strict total')
          s=replace_once(s,
            '**Canonical provider-component coverage after the Phase 2BQ shared-ledger reconciliation: 65/100 = 65%.**',
            '**Canonical provider-component coverage after the Phase 2BR shared-ledger reconciliation: 66/100 = 66%.**',
            'coverage component headline')
          phase2br_ci = '''Phase 2BR / PR #226 was squash-merged as `4ab4ad990d453938e67f3d2b7cfa878bbe031ef0`; that exact durable merge SHA passed post-merge Black Arcana CI **#2654** / run `34738972649`, including unit tests, diff sanity, NeoForge build, built-JAR verification, Foundation GameTest server, dedicated-server smoke and canonical QA artifact `10311522907` (`sha256:c815f684a7a6dec192dd995bb6fbd6784c35faa0b0d21ae39bb9de89b93cec16`). The provider contributes semantic **+12 `COUNTED_RELEASE_BOUNDED`** and this reconciliation closes technical component **#66**.\n\n'''
