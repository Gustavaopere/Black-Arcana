name: Somake 1.0.9 Funeral Bloom controller radius field bridge (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-controller-radius-bridge.yml'
      - 'docs/qa/somake_109_controller_radius_bridge.py'
      - 'docs/qa/somake_109_controller_radius_bridge_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-CONTROLLER-RADIUS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_radius_field_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic positive and negative direct-field regressions
        run: python3 docs/qa/somake_109_controller_radius_bridge_test.py -v
      - name: Download only exact publisher JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-radius-bridge
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-radius-bridge/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-radius-bridge/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Audit constructor float arguments and controller radius getter
        run: |
          python3 docs/qa/somake_109_controller_radius_bridge.py \
            --jar build/somake-radius-bridge/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-radius-bridge/proof.json
      - name: Publish bounded symbolic proof only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-radius-field-${{ github.sha }}
          path: build/somake-radius-bridge/proof.json
          if-no-files-found: ignore
          retention-days: 14
