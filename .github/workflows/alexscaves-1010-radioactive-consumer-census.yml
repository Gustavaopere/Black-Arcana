name: Alex's Caves 1.0.10 radioactive item consumer census
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_radioactive_consumer_census.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - '.github/workflows/alexscaves-1010-radioactive-consumer-census.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RADIOACTIVE-CONSUMER-CENSUS-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RADIOACTIVE-ITEM-CERTIFICATION-1.0.10.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_consumer_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and exercise exact ID and tag traversal
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_radioactive_consumer_census.py
          python3 docs/qa/alexscaves_1010_radioactive_consumer_census.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/radioactive-consumer-census
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/radioactive-consumer-census/publisher.jar
      - name: Census and deterministic replay
        run: |
          python3 docs/qa/alexscaves_1010_radioactive_consumer_census.py --jar build/radioactive-consumer-census/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-consumer-census/report.json --seal "wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RADIOACTIVE-ITEM-CERTIFICATION-1.0.10.json"
          python3 docs/qa/alexscaves_1010_radioactive_consumer_census.py --jar build/radioactive-consumer-census/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-consumer-census/replay.json
          cmp build/radioactive-consumer-census/report.json build/radioactive-consumer-census/replay.json
          echo "b3407f8baf4ce60a35f0ba7cc06cbf5d042e6d02f3d3781a4f48c8e45f267cf5  build/radioactive-consumer-census/report.json" | sha256sum -c -
      - name: Replay prior exact native producer evidence
        run: |
          python3 docs/qa/alexscaves_1010_radioactive_items_probe.py --jar build/radioactive-consumer-census/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/radioactive-consumer-census/native.json
          test "$(wc -c < build/radioactive-consumer-census/native.json)" -eq 232851
          echo "b8fd8880d0f888ee137a436ec0aa81ea7916c6e6883acc0237d2915525499c97  build/radioactive-consumer-census/native.json" | sha256sum -c -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: radioactive-consumer-census
          path: build/radioactive-consumer-census/report.json
          if-no-files-found: warn
          retention-days: 14
