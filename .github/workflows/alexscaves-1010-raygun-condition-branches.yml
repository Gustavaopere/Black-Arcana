name: Alex's Caves 1.0.10 Raygun X_RAY and GAMMA_RAY selected branch checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-condition-branches.yml'
      - 'docs/qa/alexscaves_1010_raygun_condition_branches_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_condition_branches_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-condition-branches-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CONDITION-BRANCHES-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-condition-branches.yml'
      - 'docs/qa/alexscaves_1010_raygun_condition_branches_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_condition_branches_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-condition-branches-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CONDITION-BRANCHES-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'

permissions:
  contents: read

jobs:
  selected_condition_branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed JVM branch checks
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_condition_branches_probe.py docs/qa/alexscaves_1010_raygun_condition_branches_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_condition_branches_probe_test.py -v
      - name: Fetch exact 1.0.10 publisher JAR
        run: |
          mkdir -p build/raygun-1010-conditions
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/raygun-1010-conditions/alexscaves-1.0.10.jar
      - name: SHA-pinned conditional branch observations
        run: |
          SEAL=wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CONDITION-BRANCHES-1.0.10.json
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_raygun_condition_branches_probe.py \
              --jar build/raygun-1010-conditions/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/raygun-1010-conditions/branch-evidence.json
          else
            echo 'UNSEALED BRANCH DISCOVERY: do not merge or certify.'
            python3 docs/qa/alexscaves_1010_raygun_condition_branches_probe.py \
              --jar build/raygun-1010-conditions/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/raygun-1010-conditions/branch-evidence.json
          fi
          python3 -m json.tool build/raygun-1010-conditions/branch-evidence.json
      - name: Archive bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-conditional-branches
          path: build/raygun-1010-conditions/branch-evidence.json
          if-no-files-found: ignore
          retention-days: 14
