name: Audit physical Ars Hex 5.0.4b Malum gated glyph
on:
  push:
    branches: [audit/ars-hex-504b-physical-soul-shatter-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_glyph_exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and SHA match publisher vs physical JAR
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/ars_hex-1.21.1-5.0.4b.jar"
          urls=(
            "https://www.curseforge.com/api/v1/mods/1357380/files/7404679/download"
            "https://mediafilez.forgecdn.net/files/7404/679/ars_hex-1.21.1-5.0.4b.jar"
            "https://edge.forgecdn.net/files/7404/679/ars_hex-1.21.1-5.0.4b.jar"
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f "$artifact"
            if curl -fLSs --retry 2 --connect-timeout 15 --max-time 120 "$url" -o "$artifact"; then
              if [[ "$(sha1sum "$artifact" | awk '{print $1}')" == "2354710ea312e2a6e0fbc3eb2dbafb8e06f10cf4" ]]; then ok=1;break;fi
            fi
          done
          test "$ok" == 1 || { echo "EXACT PHYSICAL SHA MATCH UNAVAILABLE - FAIL CLOSED"; exit 1; }
      - name: Inspect symbolic conditional glyph registration only
        env:
          EXACT_JAR: ${{ runner.temp }}/ars_hex-1.21.1-5.0.4b.jar
        run: python3 .github/ars_hex_504b_physical_glyph_audit.py
      - name: No publisher binary committed
        run: test ! -e ./ars_hex-1.21.1-5.0.4b.jar
