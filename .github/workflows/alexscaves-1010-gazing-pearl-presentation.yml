name: Alex's Caves 1.0.10 Gazing Pearl presentation and acquisition discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-presentation.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_presentation_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-PRESENTATION-ACQUISITION-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_presentation_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_presentation_probe.py
          python3 docs/qa/alexscaves_1010_gazing_pearl_presentation_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/gazing-presentation
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' -o build/gazing-presentation/publisher.jar
      - name: Replay bounded linkage and resource discovery
        run: |
          for n in report replay; do
            python3 docs/qa/alexscaves_1010_gazing_pearl_presentation_probe.py --jar build/gazing-presentation/publisher.jar --javap "$JAVA_HOME/bin/javap" --output "build/gazing-presentation/$n.json"
          done
          cmp build/gazing-presentation/report.json build/gazing-presentation/replay.json
          test "$(wc -c < build/gazing-presentation/report.json)" -eq 163013
          echo '258579e263ef54487b374c67cd6157180af2281608725f20963f84026df7000e  build/gazing-presentation/report.json' | sha256sum -c -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gazing-presentation
          path: build/gazing-presentation/report.json
          if-no-files-found: warn
          retention-days: 14
