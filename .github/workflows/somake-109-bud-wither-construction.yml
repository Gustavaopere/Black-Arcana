name: Somake 1.0.9 Funeral Bloom bud constructor Wither provenance (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-bud-wither-construction.yml'
      - 'docs/qa/somake_109_bud_wither_construction.py'
      - 'docs/qa/somake_109_bud_wither_construction_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/registry-1.0.9/funeral-bloom.md'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-RADIUS-CONSUMERS-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_wither_construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Original negative regression fixtures
        run: python3 docs/qa/somake_109_bud_wither_construction_test.py -v
      - name: Retrieve publisher Somake release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-bud-ctor
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-bud-ctor/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-bud-ctor/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Inspect only bounded derived constructor and wave metadata
        run: |
          python3 docs/qa/somake_109_bud_wither_construction.py \
            --jar build/somake-bud-ctor/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-bud-ctor/evidence.json
      - name: Publish derived evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-wither-construction
          path: build/somake-bud-ctor/evidence.json
          if-no-files-found: ignore
          retention-days: 14
