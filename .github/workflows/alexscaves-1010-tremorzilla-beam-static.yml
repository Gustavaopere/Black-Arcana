name: Alex's Caves 1.0.10 Tremorzilla Beam full-method static discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-tremorzilla-beam-static.yml'
      - 'docs/qa/alexscaves_1010_tremorzilla_beam_static_audit.py'
      - 'docs/qa/alexscaves_1010_tremorzilla_beam_static_audit_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-BEAM-STATIC-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/tremorzilla-beam.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-tremorzilla-beam-static.yml'
      - 'docs/qa/alexscaves_1010_tremorzilla_beam_static_audit.py'
      - 'docs/qa/alexscaves_1010_tremorzilla_beam_static_audit_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-BEAM-STATIC-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/tremorzilla-beam.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'

permissions:
  contents: read
jobs:
  beam_static_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run fail-closed synthetic tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_tremorzilla_beam_static_audit.py docs/qa/alexscaves_1010_tremorzilla_beam_static_audit_test.py
          python3 docs/qa/alexscaves_1010_tremorzilla_beam_static_audit_test.py -v
      - name: Download publisher JAR with SHA-256 check
        run: |
          set -euo pipefail
          mkdir -p build/tremorzilla-beam-static
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/tremorzilla-beam-static/alexscaves-1.0.10.jar
          printf '%s  %s\n' \
            '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c' \
            'build/tremorzilla-beam-static/alexscaves-1.0.10.jar' | sha256sum -c -
      - name: Audit 12 compiled bodies and separate beam damage from stomp/body helpers
        run: |
          set -euo pipefail
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-BEAM-STATIC-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_tremorzilla_beam_static_audit.py \
              --jar build/tremorzilla-beam-static/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/tremorzilla-beam-static/report.json
          else
            echo 'UNSEALED_DISCOVERY_ONLY — no static certificate'
            python3 docs/qa/alexscaves_1010_tremorzilla_beam_static_audit.py \
              --jar build/tremorzilla-beam-static/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --inspect \
              --output build/tremorzilla-beam-static/report.json
          fi
      - name: Canonical index validity
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Save read-only candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-tremorzilla-beam-1010-static-candidate
          path: build/tremorzilla-beam-static/report.json
          if-no-files-found: ignore
          retention-days: 14
