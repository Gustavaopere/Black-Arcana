name: Alex's Caves 1.0.10 Holocoder presentation and state bridge discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_holocoder_presentation_probe.py'
      - '.github/workflows/alexscaves-1010-holocoder-presentation.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/holocoder.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_holocoder_presentation_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_holocoder_presentation_probe.py
          python3 docs/qa/alexscaves_1010_holocoder_presentation_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/holocoder-presentation
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/holocoder-presentation/publisher.jar
      - name: Project exact presentation and state consumers
        run: |
          python3 docs/qa/alexscaves_1010_holocoder_presentation_probe.py --jar build/holocoder-presentation/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/holocoder-presentation/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_holocoder_presentation_probe.py --jar build/holocoder-presentation/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/holocoder-presentation/replay.json
          cmp build/holocoder-presentation/report.json build/holocoder-presentation/replay.json
          test "$(wc -c < build/holocoder-presentation/report.json)" -eq 611890
          echo 'b3a0f6cda62bacace3859ec5435b6e1b909234aa260fa2f2d79151c2c49831e6  build/holocoder-presentation/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: holocoder-presentation
          path: build/holocoder-presentation/report.json
          if-no-files-found: warn
          retention-days: 14
