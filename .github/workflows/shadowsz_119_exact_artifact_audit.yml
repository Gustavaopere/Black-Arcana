name: ShadowsZ 1.1.9 exact artifact audit

on:
  push:
    branches:
      - audit/shadowsz-119-exact-artifact-2026-09-28
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref_name == 'audit/shadowsz-119-exact-artifact-2026-09-28' || github.head_ref == 'audit/shadowsz-119-exact-artifact-2026-09-28'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and inspect exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/shadowsz-audit
          python3 - <<'PY'
          import hashlib, json, re, subprocess, urllib.request, zipfile
          from pathlib import Path

          expected_sha1 = "f946eb3a8181e1964279f163f430ccbba6c4edcd"
          urls = [
              "https://cdn.modrinth.com/data/MQQV5K0S/versions/Z5VFhs8D/shadowsz-1.1.9.jar",
              "https://cursemaven.com/curse/maven/shadowsz-1582485/8626238/shadowsz-1582485-8626238.jar",
          ]
          jar = Path("build/shadowsz-audit/shadowsz-1.1.9.jar")
          source_url = None
          errors = []
          for url in urls:
              try:
                  urllib.request.urlretrieve(url, jar)
                  source_url = url
                  break
              except Exception as exc:
                  errors.append(f"{url}: {exc}")
          if source_url is None:
              raise SystemExit("Could not download exact publisher artifact: " + " | ".join(errors))

          sha1 = hashlib.sha1(jar.read_bytes()).hexdigest()
          if sha1 != expected_sha1:
              raise SystemExit(f"SHA-1 mismatch: expected {expected_sha1}, got {sha1}")

          report = {
              "source_url": source_url,
              "sha1": sha1,
              "expected_sha1": expected_sha1,
          }

          def class_utf8_constants(data: bytes):
              # Parse only CONSTANT_Utf8 entries from the class constant pool.
              if data[:4] != b"\xca\xfe\xba\xbe":
                  return []
              cp_count = int.from_bytes(data[8:10], "big")
              i = 10
              idx = 1
              out = []
              while idx < cp_count:
                  tag = data[i]
                  i += 1
                  if tag == 1:
                      n = int.from_bytes(data[i:i+2], "big")
                      i += 2
                      out.append(data[i:i+n].decode("utf-8", "replace"))
                      i += n
                  elif tag in (3,4):
                      i += 4
                  elif tag in (5,6):
                      i += 8
                      idx += 1
                  elif tag in (7,8,16,19,20):
                      i += 2
                  elif tag in (9,10,11,12,17,18):
                      i += 4
                  elif tag == 15:
                      i += 3
                  else:
                      raise ValueError(f"unknown constant-pool tag {tag}")
                  idx += 1
              return out

          with zipfile.ZipFile(jar) as zf:
              names = sorted(zf.namelist())
              class_paths = [n for n in names if n.endswith(".class") and not n.startswith("META-INF/versions/")]
              provider_classes = [
                  n for n in class_paths
                  if "shadowsz" in n.lower() or "/shadow" in n.lower()
              ]
              if not provider_classes:
                  provider_classes = class_paths

              report["class_count"] = len(class_paths)
              report["provider_class_count"] = len(provider_classes)

              semantic_name_rx = re.compile(
                  r"(spell|config|network|packet|command|key|shadow|umbral|power|ability|menu|screen|event|handler|capabil|data|storage|group|party|swap|fusion|equipment)",
                  re.I,
              )
              report["semantic_class_paths"] = [n for n in provider_classes if semantic_name_rx.search(n)]

              namespace_paths = [
                  n for n in names
                  if (n.startswith("assets/shadowsz/") or n.startswith("data/shadowsz/")) and not n.endswith("/")
              ]
              report["namespace_resource_paths"] = namespace_paths

              metadata_path = None
              for mp in ("META-INF/neoforge.mods.toml", "META-INF/mods.toml"):
                  if mp in names:
                      metadata_path = mp
                      txt = zf.read(mp).decode("utf-8", "replace")
                      report["metadata_path"] = mp
                      for key in ("modId", "version", "displayName"):
                          m = re.search(rf"(?m)^\s*{key}\s*=\s*['\"]([^'\"]+)['\"]", txt)
                          if m:
                              report[f"metadata_{key}"] = m.group(1)
                      break

              lang_path = "assets/shadowsz/lang/en_us.json"
              lang_keys = []
              if lang_path in names:
                  obj = json.loads(zf.read(lang_path).decode("utf-8"))
                  if isinstance(obj, dict):
                      lang_keys = sorted(obj.keys())
              report["lang_key_count"] = len(lang_keys)
              report["spell_lang_keys"] = [
                  k for k in lang_keys
                  if k.startswith("spell.shadowsz.") and not k.endswith(".description")
              ]
              report["keybind_lang_keys"] = [
                  k for k in lang_keys
                  if k.startswith("key.") or ".key." in k or "keybind" in k.lower()
              ]
              report["action_like_lang_keys"] = [
                  k for k in lang_keys
                  if re.search(r"(arising|eyes|swap|summon|dismiss|despawn|attack|release|fusion|equipment|group|stance|behavior|power|claim|miasma|umbral|monarch)", k, re.I)
              ]

              filtered_constants = {}
              interesting = re.compile(
                  r"(shadowsz|arising|shadow.?eyes|position.?swap|summon.?all|dismiss.?all|despawn|attack.?order|release|fusion|equipment|progress.?mode|restrict.?powers|miasma|umbral|monarch|gamerule|key\.|config)",
                  re.I,
              )
              for path in provider_classes:
                  try:
                      constants = class_utf8_constants(zf.read(path))
                  except Exception:
                      continue
                  hits = sorted({
                      s for s in constants
                      if 2 <= len(s) <= 240 and interesting.search(s)
                  })
                  if hits:
                      filtered_constants[path] = hits
              report["filtered_utf8_constants_by_class"] = filtered_constants

          # Signature-only inspection. No -c bytecode output is generated or retained.
          candidate_classes = [
              p[:-6].replace("/", ".")
              for p in report["semantic_class_paths"]
              if "$" not in p
          ]
          signature_facts = {}
          signature_terms = re.compile(
              r"(spell|config|packet|payload|command|key|shadow|power|ability|summon|dismiss|despawn|attack|release|swap|fusion|equipment|progress|gamerule|group|party|storage|menu|screen|event|handler)",
              re.I,
          )
          for cls in sorted(candidate_classes):
              cp = subprocess.run(
                  ["javap", "-p", "-constants", "-classpath", str(jar), cls],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False
              )
              kept = []
              for line in cp.stdout.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if stripped.startswith(("public class ", "public final class ", "public abstract class ", "class ", "interface ", "public interface ")):
                      kept.append(stripped)
                  elif signature_terms.search(stripped):
                      kept.append(stripped)
              if kept:
                  signature_facts[cls] = kept
          report["signature_facts"] = signature_facts

          out = Path("build/shadowsz-audit/report.json")
          out.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")

          print(json.dumps({
              "source_url": source_url,
              "sha1": sha1,
              "metadata": {k:v for k,v in report.items() if k.startswith("metadata_")},
              "class_count": report["class_count"],
              "provider_class_count": report["provider_class_count"],
              "semantic_class_paths": report["semantic_class_paths"],
              "namespace_resource_paths": report["namespace_resource_paths"],
              "spell_lang_keys": report["spell_lang_keys"],
              "keybind_lang_keys": report["keybind_lang_keys"],
              "action_like_lang_keys": report["action_like_lang_keys"],
              "filtered_utf8_constants_by_class": report["filtered_utf8_constants_by_class"],
              "signature_facts": report["signature_facts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Extract narrow action and config denominator facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          jar = Path("build/shadowsz-audit/shadowsz-1.1.9.jar")
          report = json.loads(Path("build/shadowsz-audit/report.json").read_text(encoding="utf-8"))

          def javap(cls, *opts):
              cp = subprocess.run(
                  ["javap", *opts, "-classpath", str(jar), cls],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False
              )
              if cp.returncode != 0:
                  raise SystemExit(f"javap failed for {cls}: {cp.stderr}")
              return cp.stdout

          def int_constants(cls):
              txt = javap(cls, "-p", "-constants")
              return {
                  name:int(value)
                  for name,value in re.findall(r"public static final int ([A-Z0-9_]+) = (-?\\d+);", txt)
              }

          def method_signatures(cls):
              txt=javap(cls, "-p")
              return [
                  line.strip() for line in txt.splitlines()
                  if line.strip().endswith(";") and "(" in line and not line.strip().startswith("Compiled from")
              ]

          def method_block(disasm, method_header):
              lines=disasm.splitlines()
              start=None
              for i,line in enumerate(lines):
                  if method_header in line:
                      start=i
                      break
              if start is None:
                  return []
              out=[]
              for line in lines[start+1:]:
                  if re.match(r"^  (public|private|protected|static)", line) and out:
                      break
                  out.append(line)
              return out

          def switch_calls(cls, method_header):
              block=method_block(javap(cls, "-c", "-p"), method_header)
              cases={}
              in_switch=False
              for line in block:
                  if "tableswitch" in line or "lookupswitch" in line:
                      in_switch=True
                      continue
                  if in_switch:
                      m=re.match(r"\\s*(-?\\d+):\\s+(\\d+)", line)
                      if m:
                          cases[int(m.group(1))]=int(m.group(2))
                          continue
                      if "}" in line:
                          in_switch=False
              inst=[]
              for line in block:
                  m=re.match(r"\\s*(\\d+):\\s+(.*)", line)
                  if m:
                      inst.append((int(m.group(1)),m.group(2)))
              targets=sorted(set(cases.values()))
              by_case={}
              for case,target in sorted(cases.items()):
                  later=[x for x in targets if x>target]
                  stop=min(later) if later else 10**9
                  calls=[]
                  strings=[]
                  for off,body in inst:
                      if not (target<=off<stop):
                          continue
                      mm=re.search(r"// Method ([^:]+)\\.(\\w+):", body)
                      if mm:
                          calls.append(mm.group(1).replace("/",".")+"."+mm.group(2))
                      sm=re.search(r"// String (.+)$",body)
                      if sm:
                          strings.append(sm.group(1))
                  by_case[str(case)]={"target":target,"calls":sorted(set(calls)),"strings":strings}
              return by_case

          def boolean_config_defaults(cls, field_names):
              lines=javap(cls, "-c", "-p").splitlines()
              found={}
              for i,line in enumerate(lines):
                  m=re.search(r"putstatic\\s+.*// Field ([A-Z0-9_]+):Lnet/neoforged/neoforge/common/ModConfigSpec\\$BooleanValue;", line)
                  if not m or m.group(1) not in field_names:
                      continue
                  field=m.group(1)
                  window=lines[max(0,i-16):i+1]
                  key=None
                  default=None
                  for w in window:
                      sm=re.search(r"// String ([A-Za-z0-9_.-]+)$", w)
                      if sm:
                          key=sm.group(1)
                  for w in reversed(window):
                      if re.search(r"\\biconst_0\\b",w):
                          default=False; break
                      if re.search(r"\\biconst_1\\b",w):
                          default=True; break
                  found[field]={"key":key,"default":default}
              return found

          def gamerule_default():
              cls="com.pumpking.shadowsz.ModGameRules"
              lines=javap(cls, "-c", "-p").splitlines()
              key=None
              default=None
              for i,line in enumerate(lines):
                  if "putstatic" in line and "RESTRICT_POWERS" in line:
                      window=lines[max(0,i-20):i+1]
                      for w in window:
                          sm=re.search(r"// String (shadowszRestrictPowers)$",w)
                          if sm: key=sm.group(1)
                      for w in reversed(window):
                          if re.search(r"\\biconst_0\\b",w):
                              default=False; break
                          if re.search(r"\\biconst_1\\b",w):
                              default=True; break
              return {"key":key,"default":default}

          action_cls="com.pumpking.shadowsz.network.ShadowActionC2S"
          group_cls="com.pumpking.shadowsz.network.ShadowGroupC2S"
          action_constants=int_constants(action_cls)
          group_constants=int_constants(group_cls)
          action_routes=switch_calls(action_cls, "public static void handle(")
          group_routes=switch_calls(group_cls, "public static void handle(")

          spell_cls="com.pumpking.shadowsz.spell.ModSpells"
          spell_sig=javap(spell_cls, "-p", "-constants")
          spell_fields=sorted(re.findall(
              r"public static final .*DeferredHolder<.*> ([A-Z0-9_]+);", spell_sig
          ))
          spell_dis=javap(spell_cls, "-c", "-p")
          spell_ids=[]
          lines=spell_dis.splitlines()
          for i,line in enumerate(lines):
              if "DeferredRegister.register:" not in line:
                  continue
              for prev in reversed(lines[max(0,i-8):i]):
                  sm=re.search(r"// String ([a-z0-9_]+)$",prev)
                  if sm:
                      spell_ids.append(sm.group(1)); break
          spell_ids=sorted(set(spell_ids))
          branch_count=sum(
              1 for line in method_block(spell_dis, "static {};")
              if re.search(r"\\b(if[a-z_]*|goto|tableswitch|lookupswitch)\\b",line)
          )

          bool_fields={"PROGRESS_MODE","LEVELING_ENABLED","BLACK_TEXTURE","FUSION_ENABLED","EQUIPMENT_ENABLED"}
          config_defaults=boolean_config_defaults("com.pumpking.shadowsz.config.ShadowConfig",bool_fields)
          config_dis=javap("com.pumpking.shadowsz.config.ShadowConfig", "-c", "-p")
          config_initializer_facts=[
              line.strip() for line in method_block(config_dis, "static {};")
              if ("define" in line or "putstatic" in line or "// String " in line or re.search(r"\\biconst_[01]\\b",line))
          ]

          denominator={
              "sha1":report["sha1"],
              "action_constants":action_constants,
              "group_action_constants":group_constants,
              "action_case_routes":action_routes,
              "group_case_routes":group_routes,
              "spell_registry_fields":spell_fields,
              "spell_registry_ids":spell_ids,
              "spell_registry_branch_count":branch_count,
              "boolean_config_defaults":config_defaults,
              "config_initializer_facts":config_initializer_facts,
              "restrict_powers_gamerule":gamerule_default(),
              "shadow_events_methods":method_signatures("com.pumpking.shadowsz.shadow.ShadowEvents"),
              "shadow_summoner_methods":method_signatures("com.pumpking.shadowsz.shadow.ShadowSummoner"),
              "attunement_methods":method_signatures("com.pumpking.shadowsz.network.AttunementChoiceC2S"),
          }

          expected_spells={"miasma","umbral_bond","aura_of_the_monarch"}
          if set(spell_ids)!=expected_spells:
              raise SystemExit(f"Unexpected exact spell ids: {spell_ids}")
          if len(spell_fields)!=3 or branch_count!=0:
              raise SystemExit(f"Unexpected spell registry structure: fields={spell_fields}, branches={branch_count}")
          if denominator["restrict_powers_gamerule"]["key"]!="shadowszRestrictPowers":
              raise SystemExit(f"Unexpected gamerule fact: {denominator['restrict_powers_gamerule']}")

          Path("build/shadowsz-audit/denominator.json").write_text(
              json.dumps(denominator,indent=2,sort_keys=True),encoding="utf-8"
          )
          print(json.dumps(denominator,indent=2,sort_keys=True))
          PY

      - name: Upload bounded audit report
        uses: actions/upload-artifact@v4
        with:
          name: shadowsz-1.1.9-exact-artifact-audit
          path: |
            build/shadowsz-audit/report.json
            build/shadowsz-audit/denominator.json
          if-no-files-found: error
          retention-days: 3