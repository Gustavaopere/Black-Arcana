name: Alex's Caves 1.0.10 Raygun charge and ammo causal discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-charge-ammo-flow.yml'
      - 'docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-charge-ammo-flow-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CHARGE-AMMO-FLOW-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-charge-ammo-flow.yml'
      - 'docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe_test.py'
      - 'docs/qa/alexscaves-1010-raygun-charge-ammo-flow-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CHARGE-AMMO-FLOW-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'

permissions:
  contents: read

jobs:
  raygun_charge_ammo_flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Python syntax and negative tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe.py docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe_test.py -v
      - name: Fetch SHA-exact publisher JAR
        run: |
          set -euo pipefail
          mkdir -p build/raygun-charge-ammo
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/raygun-charge-ammo/alexscaves-1.0.10.jar
          printf '%s  %s\n' '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c' \
            'build/raygun-charge-ammo/alexscaves-1.0.10.jar' | sha256sum -c -
      - name: Replay SHA-exact charge and ammo native JVM branch seal
        run: |
          python3 docs/qa/alexscaves_1010_raygun_charge_ammo_flow_probe.py \
            --jar build/raygun-charge-ammo/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/raygun-charge-ammo/report.json \
            --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-CHARGE-AMMO-FLOW-1.0.10.json'
      - name: Verify canonical index invariants
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raygun-1010-charge-ammo-bounded-cfg-report
          path: build/raygun-charge-ammo/report.json
          if-no-files-found: ignore
          retention-days: 14
