name: Alex's Caves 1.0.10 Detonating Death causal pre-certification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-detonating-death-causal.yml'
      - 'docs/qa/alexscaves_1010_detonating_death_causal_probe.py'
      - 'docs/qa/alexscaves_1010_detonating_death_causal_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/detonating-death.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-detonating-death-causal.yml'
      - 'docs/qa/alexscaves_1010_detonating_death_causal_probe.py'
      - 'docs/qa/alexscaves_1010_detonating_death_causal_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/detonating-death.md'
permissions:
  contents: read
jobs:
  detonating_death_static:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed synthetic tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_detonating_death_causal_probe.py docs/qa/alexscaves_1010_detonating_death_causal_probe_test.py
          python3 docs/qa/alexscaves_1010_detonating_death_causal_probe_test.py -v
      - name: Obtain exact 1.0.10 publisher JAR
        run: |
          mkdir -p build/alexscaves-detonating-death
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-detonating-death/alexscaves-1.0.10.jar
      - name: Reproduce causal methods, direct branches, publisher metadata and resource hashes
        run: |
          python3 docs/qa/alexscaves_1010_detonating_death_causal_probe.py \
            --jar build/alexscaves-detonating-death/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TECHNICAL-CONTRACTS-1.0.10.json' \
            --output build/alexscaves-detonating-death/causal.json
      - name: Verify canonical indices without promoting a partial contract
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-1010-detonating-death-causal
          path: build/alexscaves-detonating-death/causal.json
          if-no-files-found: ignore
          retention-days: 14
