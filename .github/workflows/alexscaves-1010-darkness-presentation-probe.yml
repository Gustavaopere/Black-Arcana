name: Alex's Caves 1.0.10 Darkness and presentation interface discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-darkness-presentation-probe.yml'
      - 'docs/qa/alexscaves_1010_darkness_presentation_probe.py'
      - 'docs/qa/alexscaves_1010_darkness_presentation_static_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darkness_presentation_exact_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate probe syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_darkness_presentation_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_darkness_presentation_static_checks.py
      - name: Download exact publisher release
        run: |
          mkdir -p build/darkness-presentation-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            -o build/darkness-presentation-1010/alexscaves-1.0.10.jar
      - name: Verify publisher and audit typed interfaces and Darkness classes
        run: |
          python3 docs/qa/alexscaves_1010_darkness_presentation_probe.py \
            --jar build/darkness-presentation-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output-dir build/darkness-presentation-1010/evidence
      - name: Assert SHA-pinned presentation and Darkness pathways
        run: |
          python3 docs/qa/alexscaves_1010_darkness_presentation_static_checks.py \
            --transcript-dir build/darkness-presentation-1010/evidence
      - name: Preserve bounded SHA-exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-darkness-presentation-discovery
          path: build/darkness-presentation-1010/evidence/
          if-no-files-found: ignore
          retention-days: 14
