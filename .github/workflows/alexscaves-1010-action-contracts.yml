name: Alex's Caves 1.0.10 exact static contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'docs/qa/alexscaves_1010_action_contract_audit.py'
      - 'docs/qa/alexscaves_1010_action_contract_audit_test.py'
      - 'docs/qa/alexscaves_1010_gumball_cards_test.py'
      - '.github/workflows/alexscaves-1010-action-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'docs/qa/alexscaves_1010_action_contract_audit.py'
      - 'docs/qa/alexscaves_1010_action_contract_audit_test.py'
      - 'docs/qa/alexscaves_1010_gumball_cards_test.py'
      - '.github/workflows/alexscaves-1010-action-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_action_static_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic immutable-evidence and scope regressions
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit_test.py -v
          python3 docs/qa/alexscaves_1010_gumball_cards_test.py -v
      - name: Download the exact publisher artifact
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Verify sealed action cards and bounded exact bytecode anchors
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TECHNICAL-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/evidence.json
      - name: Verify the eight sealed effect contracts in a separate family
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile effects \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EFFECT-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/effect-evidence.json
      - name: Verify the sealed Dreadbow and Dark Arrow contracts
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile dreadbow \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DREADBOW-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/dreadbow-evidence.json
      - name: Verify the sealed Acid damage contract and its two native emitters
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile acid \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ACID-CONTRACT-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/acid-evidence.json
      - name: Verify the sealed Desolate Dagger equipment and damage contracts
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile desolate_dagger \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-DESOLATE-DAGGER-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/desolate-dagger-evidence.json
      - name: Verify the sealed Forsaken Sonic Boom contract
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile forsaken \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FORSAKEN-CONTRACT-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/forsaken-evidence.json
      - name: Verify the sealed Shot Gum and Gumball contracts
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile gumball \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/gumball-evidence.json
      - name: Export bounded JSON evidence only
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-static-contracts
          path: |
            build/alexscaves-1010/evidence.json
            build/alexscaves-1010/effect-evidence.json
            build/alexscaves-1010/dreadbow-evidence.json
            build/alexscaves-1010/acid-evidence.json
            build/alexscaves-1010/desolate-dagger-evidence.json
            build/alexscaves-1010/forsaken-evidence.json
            build/alexscaves-1010/gumball-evidence.json
          if-no-files-found: error
          retention-days: 14
