name: Temporary Phase 2BQ ledger reconciliation v2

on:
  push:
    branches:
      - docs/reconcile-provider-ledgers-phase2bq

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/reconcile-provider-ledgers-phase2bq
          fetch-depth: 0

      - name: Patch shared ledgers assertively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_before(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, got {count}: {marker!r}')
              p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          current = 'wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md'
