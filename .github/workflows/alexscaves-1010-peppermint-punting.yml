name: Alex's Caves 1.0.10 Peppermint Punting exact resource

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_peppermint_punting_probe.py'
      - '.github/workflows/alexscaves-1010-peppermint-punting.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/peppermint-punting.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PEPPERMINT-PUNTING-CONTRACT-1.0.10.json'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_peppermint_punting_probe.py'
      - '.github/workflows/alexscaves-1010-peppermint-punting.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/peppermint-punting.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-PEPPERMINT-PUNTING-CONTRACT-1.0.10.json'

permissions:
  contents: read

jobs:
  exact_punting_resource:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile docs/qa/alexscaves_1010_peppermint_punting_probe.py
      - name: Download the exact Alex's Caves publisher artifact
        run: |
          mkdir -p build/alexscaves-punting
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-punting/alexscaves-1.0.10.jar
      - name: Verify and report Punting JSON + inherited native consumer evidence
        run: |
          python3 docs/qa/alexscaves_1010_peppermint_punting_probe.py \
            --jar build/alexscaves-punting/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-MULTIPLE-MINT-CONTRACT-1.0.10.json' \
            --output build/alexscaves-punting/evidence.json
      - name: Print exact Peppermint Punting card SHA-256
        run: sha256sum 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/peppermint-punting.md'
      - name: Publish bounded JSON inspection artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-peppermint-punting-evidence
          path: build/alexscaves-punting/evidence.json
          retention-days: 14
          if-no-files-found: ignore
