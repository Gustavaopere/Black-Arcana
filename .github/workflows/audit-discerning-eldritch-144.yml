name: Discerning The Eldritch 1.4.4 physical registry discovery
on:
  push:
    branches:
      - 'audit/discerning-eldritch-144-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Match publisher CurseForge JAR to physical SHA and discover registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile, os, re, subprocess
          expected='cf35c225aced23b705d1e0fd1bc5c62d96540e0c'
          urls=[
            'https://cursemaven.com/curse/maven/discerning-the-eldritch-1143065/8816497/discerning-the-eldritch-1143065-8816497.jar',
            'https://mediafilez.forgecdn.net/files/8816/497/discerning_the_eldritch-1.4.4-1.21.jar',
            'https://media.forgecdn.net/files/8816/497/discerning_the_eldritch-1.4.4-1.21.jar',
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'discerning_the_eldritch-1.4.4-1.21.jar'
          for url in urls:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-clean-room'})
              with urllib.request.urlopen(request,timeout=110) as response:
                blob=response.read(40000000)
              sha=hashlib.sha1(blob).hexdigest()
              print('CANDIDATE_BYTES='+str(len(blob))+' SHA1='+sha,flush=True)
              if sha==expected:
                jar.write_bytes(blob)
                break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:240],flush=True)
          else:raise SystemExit('FAIL-CLOSED: cannot match physical modlist SHA1')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('FILE_ID=8816497 BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            names=z.namelist()
            metadata=z.read('META-INF/neoforge.mods.toml').decode('utf8','replace')
          assert re.search(r'modId\s*=\s*["\x27]discerning_the_eldritch',metadata), 'mod ID mismatch'
          print('NEOFORGE_MODID_VERIFIED=TRUE')
          classes=[s[:-6].replace('/','.') for s in names if s.endswith('.class') and '$' not in s]
          registrars=[x for x in classes if any(y in x.lower() for y in ('spellregistr','spellregistry','schoolregistr'))]
          print('CANDIDATE_REGISTRARS='+repr(registrars[:40]))
          for c in registrars:
            if 'spell' not in c.lower():continue
            p=subprocess.run(['javap','-p','-c','-classpath',str(jar),c],capture_output=True,text=True,timeout=30)
            if p.returncode or 'AbstractSpell' not in p.stdout:continue
            print('REGISTRAR_CLASS='+c)
            v=p.stdout
            for line in v.splitlines():
              if any(x in line for x in ('public static final ', '// class ', '// String ', 'DeferredRegister.', 'SpellRegistry.SPELL_REGISTRY_KEY', 'Method register:', 'Method registerSpell:', 'static {};')):
                print('REG_BYTECODE='+line.strip()[:220])
          print('DISCOVERY_NOT_SURVIVAL=TRUE')
          PY

      - name: Assert twenty-two unconditional compiled registrations and discover exact resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,zipfile,re,collections
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'discerning_the_eldritch-1.4.4-1.21.jar'
          assert jar.is_file()
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='cf35c225aced23b705d1e0fd1bc5c62d96540e0c'
          prefix='net.acetheeldritchking.discerning_the_eldritch.'
          def javap(name):
            p=subprocess.run(['javap','-c','-p','-classpath',str(jar),name],capture_output=True,text=True,timeout=35)
            assert p.returncode==0,(name,p.stderr[:200])
            return p.stdout
          reg=javap(prefix+'registries.SpellRegistries')
          assert 'SpellRegistry.SPELL_REGISTRY_KEY:' in reg
          assert '// String discerning_the_eldritch' in reg
          assert 'DeferredRegister.create:' in reg
          assert 'DeferredRegister.register:(Ljava/lang/String;Ljava/util/function/Supplier;)' in reg
          assert 'DeferredRegister.register:(Lnet/neoforged/bus/api/IEventBus;)V' in reg
          block=reg.split('static {};',1)[1]
          entries=re.findall(r'// class net/acetheeldritchking/discerning_the_eldritch/spells/([a-z]+)/([A-Za-z0-9_]+Spell)',block)
          assert len(entries)==22 and len(set(entries))==22,entries
          assert block.count('Method registerSpell:(Lio/redspace/ironsspellbooks/api/spells/AbstractSpell;)')==22
          assert not re.search(r'^\s*\d+:\s+(?:ifne|ifeq|ifnull|ifnonnull|if_icmp\w+|goto|tableswitch|lookupswitch)\b',block,re.M)
          expected={'eldritch':9,'blood':1,'evocation':2,'fire':2,'holy':1,'ice':2,'ritual':5}
          assert collections.Counter(f for f,_ in entries)==expected
          print('STATIC_REGISTERED_SPELLS=22')
          print('STATIC_REGISTRY_BRANCHES=0')
          with zipfile.ZipFile(jar) as z:files=set(z.namelist())
          for idx,(fam,cls) in enumerate(entries,1):
            target='net/acetheeldritchking/discerning_the_eldritch/spells/'+fam+'/'+cls+'.class'
            assert target in files,target
            text=javap(prefix+'spells.'+fam+'.'+cls)
            constants=re.findall(r'// String ([A-Za-z0-9_.:-]+)',text)
            getter=text.find('getSpellResource')
            assert getter>=0 or 'ResourceLocation' in text,cls
            print('CANDIDATE_'+str(idx)+'='+fam+'.'+cls+' STRINGS='+repr(constants[:35])+' RESOURCE_LINES='+repr([l.strip() for l in text.splitlines() if 'ResourceLocation' in l][:12]))
          with zipfile.ZipFile(jar) as z:
            clslist=[x[:-6].replace('/','.') for x in z.namelist()
                     if x.endswith('.class') and '$' not in x and x.startswith('net/acetheeldritchking/discerning_the_eldritch/')
                     and x.count('/')<=5]
          callers=[]
          for name in clslist:
            p=subprocess.run(['javap','-c','-p','-classpath',str(jar),name],capture_output=True,text=True,timeout=20)
            if p.returncode==0 and 'SpellRegistries.register:' in p.stdout:
              callers.append(name)
          print('BOOTSTRAP_CALLERS='+repr(callers))
          assert callers
          print('REGISTRY_STATIC_PROOF=PASS')
          print('DYNAMIC_RUNTIME_UNVERIFIED=TRUE')
          PY

      - name: Prove 22 exact ResourceLocations and default-school references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,re,collections,zipfile
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'discerning_the_eldritch-1.4.4-1.21.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='cf35c225aced23b705d1e0fd1bc5c62d96540e0c'
          root='net.acetheeldritchking.discerning_the_eldritch.'
          def disasm(name):
            p=subprocess.run(['javap','-c','-p','-classpath',str(jar),name],capture_output=True,text=True,timeout=30)
            assert p.returncode==0,(name,p.stderr[:200])
            return p.stdout
          code=disasm(root+'registries.SpellRegistries')
          block=code.split('static {};',1)[1]
          spells=re.findall(r'// class net/acetheeldritchking/discerning_the_eldritch/spells/([a-z]+)/([A-Za-z0-9_]+Spell)',block)
          assert len(spells)==22 and len(set(spells))==22
          assert block.count('// Method registerSpell:(Lio/redspace/ironsspellbooks/api/spells/AbstractSpell;)')==22
          assert not re.search(r'^\s*\d+:\s+(?:ifne|ifeq|ifnull|ifnonnull|if_icmp\w+|goto|tableswitch|lookupswitch)\b',block,re.M)
          assert collections.Counter(f for f,c in spells)=={'eldritch':9,'blood':1,'evocation':2,'fire':2,'holy':1,'ice':2,'ritual':5}
          identities=[]
          for n,(school,cls) in enumerate(spells,1):
            body=disasm(root+'spells.'+school+'.'+cls)
            lines=body.splitlines()
            pairs=[]
            for i,l in enumerate(lines):
              if 'ResourceLocation.fromNamespaceAndPath:' not in l:continue
              preceding=lines[max(0,i-4):i]
              suffixes=[m.group(1) for s in preceding if (m:=re.search(r'// String ([A-Za-z0-9_:.-]+)',s))]
              if len(suffixes)<2 or suffixes[-2]!='discerning_the_eldritch':continue
              nextlines=lines[i+1:i+5]
              if not any('// Field spellId:' in s for s in nextlines):continue
              pairs.append(suffixes[-1])
            assert len(pairs)==1,(cls,pairs,[s.strip() for s in lines if 'ResourceLocation.fromNamespaceAndPath:' in s])
            suffix=pairs[0]
            assert re.fullmatch(r'[a-z0-9_]+',suffix)
            id='discerning_the_eldritch:'+suffix
            assert id not in identities,id
            identities.append(id)
            if school=='ritual':
              token='DTESchoolRegistry.RITUAL_RESOURCE:'
            else:
              token='SchoolRegistry.'+school.upper()+'_RESOURCE:'
            assert token in body,('school',cls,token)
            assert 'DefaultConfig.setSchoolResource:' in body,('no default school setter',cls)
            print('EXACT_SPELL_'+str(n)+'='+id+'|'+school+'.'+cls)
          assert len(identities)==22
          assert 'SpellRegistries.register:' in disasm(root+'DiscerningTheEldritch')
          print('CERTIFIED_FILE_ID=8816497')
          print('CERTIFIED_BYTES='+str(jar.stat().st_size))
          print('PHYSICAL_SPELL_REGISTRATIONS=22')
          print('STATIC_INITIALIZER_BRANCHES=0')
          print('NEW_SEMANTIC_ROOTS=0')
          print('EXACT_STATIC_REGISTRY_AUDIT=PASS')
          print('RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY
