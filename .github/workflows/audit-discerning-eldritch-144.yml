name: Discerning The Eldritch 1.4.4 physical registry discovery
on:
  push:
    branches:
      - 'audit/discerning-eldritch-144-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Match publisher CurseForge JAR to physical SHA and discover registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile, os, re, subprocess
          expected='cf35c225aced23b705d1e0fd1bc5c62d96540e0c'
          urls=[
            'https://cursemaven.com/curse/maven/discerning-the-eldritch-1143065/8816497/discerning-the-eldritch-1143065-8816497.jar',
            'https://mediafilez.forgecdn.net/files/8816/497/discerning_the_eldritch-1.4.4-1.21.jar',
            'https://media.forgecdn.net/files/8816/497/discerning_the_eldritch-1.4.4-1.21.jar',
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'discerning_the_eldritch-1.4.4-1.21.jar'
          for url in urls:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-clean-room'})
              with urllib.request.urlopen(request,timeout=110) as response:
                blob=response.read(40000000)
              sha=hashlib.sha1(blob).hexdigest()
              print('CANDIDATE_BYTES='+str(len(blob))+' SHA1='+sha,flush=True)
              if sha==expected:
                jar.write_bytes(blob)
                break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:240],flush=True)
          else:raise SystemExit('FAIL-CLOSED: cannot match physical modlist SHA1')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('FILE_ID=8816497 BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            names=z.namelist()
            metadata=z.read('META-INF/neoforge.mods.toml').decode('utf8','replace')
          assert re.search(r'modId\s*=\s*["\x27]discerning_the_eldritch',metadata), 'mod ID mismatch'
          print('NEOFORGE_MODID_VERIFIED=TRUE')
          classes=[s[:-6].replace('/','.') for s in names if s.endswith('.class') and '$' not in s]
          registrars=[x for x in classes if any(y in x.lower() for y in ('spellregistr','spellregistry','schoolregistr'))]
          print('CANDIDATE_REGISTRARS='+repr(registrars[:40]))
          for c in registrars:
            if 'spell' not in c.lower():continue
            p=subprocess.run(['javap','-p','-c','-classpath',str(jar),c],capture_output=True,text=True,timeout=30)
            if p.returncode or 'AbstractSpell' not in p.stdout:continue
            print('REGISTRAR_CLASS='+c)
            v=p.stdout
            for line in v.splitlines():
              if any(x in line for x in ('public static final ', '// class ', '// String ', 'DeferredRegister.', 'SpellRegistry.SPELL_REGISTRY_KEY', 'Method register:', 'Method registerSpell:', 'static {};')):
                print('REG_BYTECODE='+line.strip()[:220])
          print('DISCOVERY_NOT_SURVIVAL=TRUE')
          PY
