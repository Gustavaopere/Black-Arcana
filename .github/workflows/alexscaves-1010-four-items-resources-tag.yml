name: Alex's Caves 1.0.10 four items acquisition and tag consumers discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_four_items_resources_tag_probe.py'
      - '.github/workflows/alexscaves-1010-four-items-resources-tag.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOUR-ITEMS-ACQUISITION-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_acquisition_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_four_items_resources_tag_probe.py
          python3 docs/qa/alexscaves_1010_four_items_resources_tag_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/four-items-acquisition
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/four-items-acquisition/publisher.jar
      - name: Project exact acquisition resources and tag field consumers
        run: |
          python3 docs/qa/alexscaves_1010_four_items_resources_tag_probe.py --jar build/four-items-acquisition/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/four-items-acquisition/report.json
      - name: Verify exact report seal
        run: |
          test "$(wc -c < build/four-items-acquisition/report.json)" = 178620
          echo '534c8c6a7534d203d994ea1e4f4948b03c5a0ed01c79a5d97aa6a5eb2fdf79c2  build/four-items-acquisition/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: four-items-acquisition
          path: build/four-items-acquisition/report.json
          if-no-files-found: warn
          retention-days: 14
