name: audit-pufferfishs-unofficial-additions-2.2.8

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/pufferfish-unofficial
          cd build/audit/pufferfish-unofficial
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/pufferfishs-unofficial-additions-935166/7389968/pufferfishs-unofficial-additions-935166-7389968.jar" \
            -o pufferfish_unofficial_additions-1.21.1-2.2.8.jar
          test -s pufferfish_unofficial_additions-1.21.1-2.2.8.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/pufferfish-unofficial
          EXPECTED_SHA1="b273ea691e027b33fb9a19fb966c5f072edfa5c0"
          ACTUAL_SHA1="$(sha1sum pufferfish_unofficial_additions-1.21.1-2.2.8.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum pufferfish_unofficial_additions-1.21.1-2.2.8.jar | awk '{print $1}')"
          BYTES="$(stat -c %s pufferfish_unofficial_additions-1.21.1-2.2.8.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=935166/7389968"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Inventory exact provider surface
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/pufferfish-unofficial
          jar tf pufferfish_unofficial_additions-1.21.1-2.2.8.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib,re,zipfile
          jar=pathlib.Path('pufferfish_unofficial_additions-1.21.1-2.2.8.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              provider_data=[n for n in names if n.startswith('data/pufferfish_unofficial_additions/')]
              semantic=[n for n in names if re.search(r'(spell|magic|ritual|rite|ability|mana|arcane|glyph|summon|teleport)',n,re.I)]
              exp=[n for n in names if re.search(r'(experience|source|reward|effect|harvest|fish|iron)',n,re.I)]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\n'
                  f'provider_data={len(provider_data)}\nsemantic_path_hits={len(semantic)}\nexperience_reward_path_hits={len(exp)}\n',encoding='utf-8')
              pathlib.Path('provider-data.txt').write_text('\n'.join(provider_data)+'\n',encoding='utf-8')
              pathlib.Path('semantic-paths.txt').write_text('\n'.join(semantic)+'\n',encoding='utf-8')
              pathlib.Path('experience-reward-paths.txt').write_text('\n'.join(exp)+'\n',encoding='utf-8')
          PY

      - name: Dump exact provider classes
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/pufferfish-unofficial
          : > javap-all.txt
          grep '[.]class$' jar-entries.txt | while IFS= read -r path; do
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all.txt
            javap -classpath pufferfish_unofficial_additions-1.21.1-2.2.8.jar -p -c -constants "$cls" >> javap-all.txt 2>&1 || true
          done
          grep -Ei 'reward|experience|harvest|fishing|spell|iron|mana|effect|immun|powder|attribute|command|register|source|cast' javap-all.txt > semantic-seams.txt || true

      - name: Extract exact built-in source and reward classes
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/pufferfish-unofficial
          grep -Ei '(experience|source|reward|effect).*\.class$' jar-entries.txt > source-reward-classes.txt || true
          python3 - <<'PY'
          import json,pathlib,zipfile
          rows=[]
          with zipfile.ZipFile('pufferfish_unofficial_additions-1.21.1-2.2.8.jar') as z:
              for name in sorted(z.namelist()):
                  if name.startswith('data/pufferfish_unofficial_additions/') and name.endswith('.json'):
                      try: data=json.loads(z.read(name)); compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                      except Exception as e: compact='INVALID_JSON:'+type(e).__name__
                      rows.append((name,compact))
          pathlib.Path('provider-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
          pathlib.Path('provider-json-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pufferfishs-unofficial-additions-2.2.8-exact-artifact-audit
          path: |
            build/audit/pufferfish-unofficial/hashes.txt
            build/audit/pufferfish-unofficial/inventory.txt
            build/audit/pufferfish-unofficial/jar-entries.txt
            build/audit/pufferfish-unofficial/provider-data.txt
            build/audit/pufferfish-unofficial/semantic-paths.txt
            build/audit/pufferfish-unofficial/experience-reward-paths.txt
            build/audit/pufferfish-unofficial/javap-all.txt
            build/audit/pufferfish-unofficial/semantic-seams.txt
            build/audit/pufferfish-unofficial/source-reward-classes.txt
            build/audit/pufferfish-unofficial/provider-json.txt
            build/audit/pufferfish-unofficial/provider-json-count.txt
          if-no-files-found: error
