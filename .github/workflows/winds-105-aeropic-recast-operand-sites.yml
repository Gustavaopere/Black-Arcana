name: Wind's 1.0.5 Aeropic recast operand-adjacency evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/winds-105-aeropic-recast-operand-sites.yml'
      - 'docs/qa/winds_105_aeropic_recast_operand_sites.py'
      - 'docs/qa/winds_105_aeropic_recast_operand_sites_test.py'
      - 'docs/qa/winds-105-aeropic-recast-operand-provenance.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/wind/aeropic.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/winds-105-aeropic-recast-operand-sites.yml'
      - 'docs/qa/winds_105_aeropic_recast_operand_sites.py'
      - 'docs/qa/winds_105_aeropic_recast_operand_sites_test.py'
      - 'docs/qa/winds-105-aeropic-recast-operand-provenance.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/wind/aeropic.md'
      - 'wiki/modpack-catalog/providers/✅-winds-spellbooks/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_operand_adjacency:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed Aeropic adjacency tests
        run: python3 docs/qa/winds_105_aeropic_recast_operand_sites_test.py -v
      - name: Download only SHA-frozen Wind's 1.0.5 publisher binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/winds-105
          JAR=build/winds-105/wind_spellbooks-1.0.5.jar
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://mediafilez.forgecdn.net/files/8485/822/wind_spellbooks-1.0.5.jar' \
            --output "$JAR"
          echo "8744886899bc245ae147a44baa2b183689cec7da  $JAR" | sha1sum --check
      - name: Record bounded JVM symbol vicinity without publishing bytecode
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/winds_105_aeropic_recast_operand_sites.py \
            --jar build/winds-105/wind_spellbooks-1.0.5.jar \
            --output build/winds-105/aeropic-operand-sites.json
      - name: Upload only clean-room JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wind-105-aeropic-recast-adjacency
          path: build/winds-105/aeropic-operand-sites.json
          if-no-files-found: ignore
          retention-days: 14
