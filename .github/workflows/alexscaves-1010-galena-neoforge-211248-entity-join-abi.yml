name: Alexs Caves 1.0.10 Galena NeoForge 21.1.248 entity join ABI discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-neoforge-211248-entity-join-abi.yml'
      - 'docs/qa/alexscaves_1010_galena_neoforge_211248_entity_join_abi_probe.py'
      - 'docs/qa/alexscaves_1010_galena_neoforge_entity_join_abi_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ENTITY-JOIN-ABI-21.1.248.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ENTITY-JOIN-ABI-21.1.248.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/equipment/galena-gauntlet.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream_entity_join_abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax gate for read-only ABI discovery
        run: python3 -m py_compile docs/qa/alexscaves_1010_galena_neoforge_211248_entity_join_abi_probe.py docs/qa/alexscaves_1010_galena_neoforge_entity_join_abi_checks.py
      - name: Fetch exact 21.1.248 artifacts and verify upstream checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/galena-211248-entity-join-abi
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          for kind in universal sources; do
            name="neoforge-21.1.248-${kind}.jar"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "${base}/${name}" -o "build/galena-211248-entity-join-abi/${name}"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 60 "${base}/${name}.sha256" -o "build/galena-211248-entity-join-abi/${name}.sha256"
            expected="$(head -c 64 "build/galena-211248-entity-join-abi/${name}.sha256")"
            [[ "${expected}" =~ ^[0-9a-fA-F]{64}$ ]]
            actual="$(sha256sum "build/galena-211248-entity-join-abi/${name}" | cut -d ' ' -f1)"
            test "${actual}" = "${expected,,}"
            echo "Upstream SHA-256 ${name}: ${actual}"
          done
      - name: Probe declared event ABI without executing game or provider code
        run: |
          python3 docs/qa/alexscaves_1010_galena_neoforge_211248_entity_join_abi_probe.py \
            --universal build/galena-211248-entity-join-abi/neoforge-21.1.248-universal.jar \
            --sources build/galena-211248-entity-join-abi/neoforge-21.1.248-sources.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-211248-entity-join-abi/report.json
      - name: Verify target 21.1.248 SHA-exact report and 25 adversarial forgeries
        shell: bash
        run: |
          set -euo pipefail
          report=build/galena-211248-entity-join-abi/report.json
          test "$(stat -c %s "$report")" -eq 11559
          test "$(sha256sum "$report" | cut -d ' ' -f1)" = '002f2f736ccd9e3af35f0c4bebfac03cc58127b40cdfaad5cca70a8a964aa3c1'
          python3 docs/qa/alexscaves_1010_galena_neoforge_entity_join_abi_checks.py \
            --report "$report" \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ENTITY-JOIN-ABI-21.1.248.json' \
            --adversarial
      - name: Preserve observational report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: galena-neoforge-211248-entity-join-abi
          path: build/galena-211248-entity-join-abi/report.json
          if-no-files-found: warn
          retention-days: 14
