name: Alex's Caves 1.0.10 Remote Detonator acquisition and criterion discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_remote_recipe_criterion_probe.py'
      - '.github/workflows/alexscaves-1010-remote-recipe-criterion.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-RECIPE-CRITERION-1.0.10.md'
      - 'docs/qa/alexscaves_1010_remote_detonator_resource_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_remote_recipe_criterion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and recipe multiplicity
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_remote_recipe_criterion_probe.py
          python3 docs/qa/alexscaves_1010_remote_recipe_criterion_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/remote-recipe-criterion
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/remote-recipe-criterion/publisher.jar
      - name: Read and replay pinned recipe and advancement
        run: |
          for report in report replay; do
            python3 docs/qa/alexscaves_1010_remote_recipe_criterion_probe.py --jar build/remote-recipe-criterion/publisher.jar --javap "$JAVA_HOME/bin/javap" --output "build/remote-recipe-criterion/$report.json"
          done
          cmp build/remote-recipe-criterion/report.json build/remote-recipe-criterion/replay.json
          test "$(wc -c < build/remote-recipe-criterion/report.json)" -eq 76088
          echo '1f395158611697e883fbad1ca5cfa7b741305f46a475dd1e40eb88d00bacb24e  build/remote-recipe-criterion/report.json' | sha256sum -c -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: remote-recipe-criterion
          path: build/remote-recipe-criterion/report.json
          if-no-files-found: warn
          retention-days: 14
