name: Alex's Caves 1.0.10 Forsaken AI lifecycle ABI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_probe.py'
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_probe_test.py'
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_cards_test.py'
      - '.github/workflows/alexscaves-1010-forsaken-lifecycle.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/forsaken-sonic-boom.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-LIFECYCLE-1.0.10.json'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_probe.py'
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_probe_test.py'
      - 'docs/qa/alexscaves_1010_forsaken_lifecycle_cards_test.py'
      - '.github/workflows/alexscaves-1010-forsaken-lifecycle.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/forsaken-sonic-boom.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-LIFECYCLE-1.0.10.json'
permissions:
  contents: read
jobs:
  exact_forsaken_lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and deterministic audit regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_forsaken_lifecycle_probe.py docs/qa/alexscaves_1010_forsaken_lifecycle_probe_test.py docs/qa/alexscaves_1010_forsaken_lifecycle_cards_test.py
          python3 docs/qa/alexscaves_1010_forsaken_lifecycle_probe_test.py -v
      - name: Match documented Forsaken lifecycle to exact evidence
        run: python3 docs/qa/alexscaves_1010_forsaken_lifecycle_cards_test.py -v
      - name: Download pinned installed publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Inspect selected exact compiled Forsaken lifecycle methods
        run: |
          python3 docs/qa/alexscaves_1010_forsaken_lifecycle_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-LIFECYCLE-1.0.10.json' \
            --output build/alexscaves-1010/forsaken-lifecycle.json
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-forsaken-ai-lifecycle-anchors
          path: build/alexscaves-1010/forsaken-lifecycle.json
          retention-days: 14
          if-no-files-found: error
