name: Phase 2BD Alshanex Catalog Closure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-catalog-closure:
    if: github.head_ref == 'docs/alshanex-4.0.3-exact-catalog-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact-artifact catalog closure
        env:
          PR_NUMBER: ${{ github.event.number }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f wiki/modpack-catalog/meta/PHASE2BD-ALSHANEX-4.0.3-EXACT-CHECKPOINT.md; then
            echo 'Phase 2BD closure already applied; nothing to do.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          ROOT = Path('.')
          pr = os.environ['PR_NUMBER']
          base = 'dbdc952bdf528866ea4959876d1c493f4ecdb31c'
          jar = 'alshanex_familiars-1.21.1_v4.0.3.jar'
          sha1 = 'e5051c2385a426d05bf203ba8081a23d891f6686'
          audit_run = '34649305941'
          audit_job = '103427464735'
          audit_artifact = '10283338450'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise AssertionError(f'{label}: expected one regex match, found {n}')
              return out

          # Provider root README: exact-current identity/count closure, runtime/API semantics still fail-closed.
          provider_readme = f'''# Alshanex's Familiars 4.0.3 — exact artifact catalog

