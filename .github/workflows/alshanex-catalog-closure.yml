          queue_marker = '## Reconciliação Gaze 1.1.7.1 — PR #180 — parcial, sem incremento de cobertura'
          queue_section = f'''## Phase 2BD — Alshanex's Familiars 4.0.3 — componente #54

| Mod ID | Artefato físico | Estado |
|---|---|---|
