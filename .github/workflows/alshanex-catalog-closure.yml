          assert '54/100 = 54%' in queue
          assert len(list((ROOT / 'wiki/modpack-catalog/providers/alshanex-familiars/spells').glob('*.md'))) == 7
          assert len(list((ROOT / 'wiki/modpack-catalog/providers/alshanex-familiars/rituals').glob('*.md'))) == 11
