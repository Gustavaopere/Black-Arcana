name: Alex's Caves 1.0.10 Alex Meal static certification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-alex-meal-item-certification.yml'
      - 'docs/qa/alexscaves_1010_*.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'scripts/catalog/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-alex-meal-item-certification.yml'
      - 'docs/qa/alexscaves_1010_*.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'scripts/catalog/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alex_meal_item_static_certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify exact publisher artifact
        run: |
          mkdir -p build/alex-meal-certification-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alex-meal-certification-1010/alexscaves-1.0.10.jar
          test "$(stat -c %s build/alex-meal-certification-1010/alexscaves-1.0.10.jar)" = 75279314
          echo '6960b299a39a039ac8a5eb9b07be4ad0e3e0a570  build/alex-meal-certification-1010/alexscaves-1.0.10.jar' | sha1sum --check
          echo '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c  build/alex-meal-certification-1010/alexscaves-1.0.10.jar' | sha256sum --check
      - name: Replay preserved discovery evidence
        run: |
          python3 docs/qa/alexscaves_1010_alex_meal_item_probe.py \
            --jar build/alex-meal-certification-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alex-meal-certification-1010/discovery.json
          echo '7259e2bedc779f0f21574ddb599e06038bd62aa2344d591f34ad89483e34c25e  build/alex-meal-certification-1010/discovery.json' | sha256sum --check
          AC_MEAL_REPORT=build/alex-meal-certification-1010/discovery.json \
            python3 docs/qa/alexscaves_1010_alex_meal_item_probe_test.py -v
      - name: Reject unsupported claims and reproduce certificate twice
        env:
          AC_MEAL_JAR: build/alex-meal-certification-1010/alexscaves-1.0.10.jar
        run: |
          AC_MEAL_JAVAP="$JAVA_HOME/bin/javap" \
            python3 docs/qa/alexscaves_1010_alex_meal_item_certification_test.py -v
      - name: Produce exact read-only certification report
        run: |
          python3 docs/qa/alexscaves_1010_alex_meal_item_certification.py \
            --jar build/alex-meal-certification-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ALEX-MEAL-ITEM-CERTIFICATION-1.0.10.json' \
            --output build/alex-meal-certification-1010/certification.json
      - name: Verify generated catalog indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive reports without publisher JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-alex-meal-item-certification
          path: build/alex-meal-certification-1010/*.json
          retention-days: 14
          if-no-files-found: ignore
