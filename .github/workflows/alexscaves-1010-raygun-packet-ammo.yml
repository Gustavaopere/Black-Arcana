name: Alex's Caves 1.0.10 Raygun ammo and C2S packet boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_packet_ammo_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_packet_ammo_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-PACKET-AMMO-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-packet-ammo.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_raygun_packet_ammo_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_packet_ammo_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-PACKET-AMMO-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/raygun.md'
      - '.github/workflows/alexscaves-1010-raygun-packet-ammo.yml'

permissions:
  contents: read

jobs:
  exact_raygun_packet_ammo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic bounded packet validation
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_packet_ammo_probe.py docs/qa/alexscaves_1010_raygun_packet_ammo_probe_test.py
          python3 docs/qa/alexscaves_1010_raygun_packet_ammo_probe_test.py -v
      - name: Fetch exact publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Audit physical classfile callsites and packet owner
        run: |
          args=()
          if test -f 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-PACKET-AMMO-1.0.10.json'; then
            args=(--snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-PACKET-AMMO-1.0.10.json')
          fi
          python3 docs/qa/alexscaves_1010_raygun_packet_ammo_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/raygun-packet-ammo.json \
            "${args[@]}"
      - name: Export bounded evidence only
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-raygun-packet-ammo
          path: build/alexscaves-1010/raygun-packet-ammo.json
          if-no-files-found: error
          retention-days: 14
