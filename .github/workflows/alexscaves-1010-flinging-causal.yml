name: Alex's Caves 1.0.10 Flinging full-method static certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-flinging-causal.yml'
      - 'docs/qa/alexscaves_1010_flinging_causal_audit.py'
      - 'docs/qa/alexscaves_1010_flinging_causal_audit_test.py'
      - 'docs/qa/alexscaves_1010_flinging_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FLINGING-CAUSAL-1.0.10.*'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/flinging.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-flinging-causal.yml'
      - 'docs/qa/alexscaves_1010_flinging_causal_audit.py'
      - 'docs/qa/alexscaves_1010_flinging_causal_audit_test.py'
      - 'docs/qa/alexscaves_1010_flinging_causal_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FLINGING-CAUSAL-1.0.10.*'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/flinging.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'

permissions:
  contents: read

jobs:
  flinging_static_causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reject unsafe claims, malformed JVM topology and documentary regressions
        run: |
          python3 docs/qa/alexscaves_1010_flinging_causal_audit_test.py -v
          python3 docs/qa/alexscaves_1010_flinging_causal_cards_test.py -v
      - name: Download the exact publisher artifact
        run: |
          mkdir -p build/flinging-causal
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/flinging-causal/alexscaves-1.0.10.jar
      - name: Verify full methods, branches, resources, ownership and individual pivots
        run: |
          python3 docs/qa/alexscaves_1010_flinging_causal_audit.py \
            --jar build/flinging-causal/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/flinging-causal/report.json
      - name: Verify canonical provider ledger and indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flinging-1010-static-causal-report
          path: build/flinging-causal/report.json
          if-no-files-found: ignore
          retention-days: 14
