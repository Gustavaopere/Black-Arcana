name: Alex's Caves 1.0.10 exact Dreadbow decisions

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_dreadbow_decision_probe.py'
      - 'docs/qa/alexscaves_1010_dreadbow_decision_probe_test.py'
      - '.github/workflows/alexscaves-1010-dreadbow-decisions.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/**'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_dreadbow_decision_probe.py'
      - 'docs/qa/alexscaves_1010_dreadbow_decision_probe_test.py'
      - '.github/workflows/alexscaves-1010-dreadbow-decisions.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/**'
permissions:
  contents: read

jobs:
  exact_dreadbow_decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Deterministic negative and positive tests
        run: python3 docs/qa/alexscaves_1010_dreadbow_decision_probe_test.py -v
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Verify compiled Dreadbow methods and branch anchors
        run: |
          python3 docs/qa/alexscaves_1010_dreadbow_decision_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/dreadbow-decisions.json
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-dreadbow-decision-anchors
          path: build/alexscaves-1010/dreadbow-decisions.json
          if-no-files-found: error
          retention-days: 14
