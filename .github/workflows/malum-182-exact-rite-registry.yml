name: Malum 1.8.2 exact installed 26 Spirit Rite static registry proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/malum-182-exact-rite-registry.yml'
      - 'docs/qa/malum_182_rite_registry_binary_audit.py'
      - 'docs/qa/malum_182_rite_registry_binary_audit_test.py'
      - 'docs/qa/fixtures/MalumRiteRegistryFixture.java'
      - 'wiki/modpack-catalog/providers/✅-malum/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/malum-182-exact-rite-registry.yml'
      - 'docs/qa/malum_182_rite_registry_binary_audit.py'
      - 'docs/qa/malum_182_rite_registry_binary_audit_test.py'
      - 'docs/qa/fixtures/MalumRiteRegistryFixture.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_compiled_spirit_rite_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify fail-closed clean-room synthetic Java21 fixtures
        run: python3 docs/qa/malum_182_rite_registry_binary_audit_test.py -v
      - name: Download official Modrinth 1.8.2 with installed physical SHA1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/malum-182
          curl --fail --show-error --silent --location --retry 3 --connect-timeout 20 --max-time 90 \
            'https://api.modrinth.com/v2/version/BIbVs1fo' --output build/malum-182/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          directory=Path("build/malum-182")
          doc=json.loads((directory/"version.json").read_text())
          assert doc["id"]=="BIbVs1fo" and doc["project_id"]=="jgzwYsAN"
          assert doc["version_number"]=="1.8.2"
          assert "1.21.1" in doc["game_versions"] and "neoforge" in doc["loaders"]
          matches=[x for x in doc["files"] if x["filename"]=="malum-1.21.1-1.8.2.jar"]
          assert len(matches)==1
          item=matches[0]
          assert item["hashes"]["sha1"]=="7bea3f874f186a17ad3e271df145c179e81c2a1d"
          uri=item["url"]
          u=urlparse(uri)
          assert u.scheme=="https" and u.hostname in ("cdn.modrinth.com","cdn-raw.modrinth.com")
          (directory/"url.txt").write_text(uri)
          PY
          curl --fail --show-error --silent --location --retry 3 --connect-timeout 20 --max-time 240 \
            "$(cat build/malum-182/url.txt)" --output build/malum-182/malum-1.21.1-1.8.2.jar
          echo '7bea3f874f186a17ad3e271df145c179e81c2a1d  build/malum-182/malum-1.21.1-1.8.2.jar' | sha1sum --check
      - name: Check compiled Malum 26 RiteHolder literal IDs and factory lambda
        run: |
          python3 docs/qa/malum_182_rite_registry_binary_audit.py \
            --jar build/malum-182/malum-1.21.1-1.8.2.jar \
            --output build/malum-182/evidence.json
      - name: Upload narrow JSON only; no proprietary provider JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: malum-182-26-rite-registry
          path: build/malum-182/evidence.json
          if-no-files-found: ignore
          retention-days: 14
