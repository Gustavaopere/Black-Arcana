name: Alex's Caves 1.0.10 Candy Cane Hook causal discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-candy-cane-hook-probe.yml'
      - 'docs/qa/alexscaves_1010_candy_cane_hook_probe.py'
      - 'docs/qa/alexscaves-1010-candy-cane-hook-handoff.md'
      - 'docs/qa/alexscaves_1010_candy_cane_hook_static_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/candy-cane-hook.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CANDY-CANE-HOOK-DISCOVERY-1.0.10.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candy_cane_hook_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check auditor syntax
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_candy_cane_hook_probe.py
          python3 -m py_compile docs/qa/alexscaves_1010_candy_cane_hook_static_checks.py
      - name: Download SHA-exact publisher JAR
        run: |
          mkdir -p build/candy-cane-hook-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/candy-cane-hook-1010/alexscaves-1.0.10.jar
      - name: Capture item, hook entity and six consumers
        run: |
          python3 docs/qa/alexscaves_1010_candy_cane_hook_probe.py \
            --jar build/candy-cane-hook-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output-dir build/candy-cane-hook-1010/report
      - name: Check SHA-pinned local causal branches
        run: |
          python3 docs/qa/alexscaves_1010_candy_cane_hook_static_checks.py \
            --transcript-dir build/candy-cane-hook-1010/report
      - name: Generate exact index deltas for review
        run: python3 scripts/catalog/generate_perk_ready_indexes.py
      - name: Archive regenerated index candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-candy-cane-hook-index-candidates
          path: |
            wiki/modpack-catalog/providers/INDEX.md
            wiki/modpack-catalog/providers/✅-alexs-caves-continued/INDEX.md
            wiki/modpack-catalog/providers/✅-alexs-caves-continued/items/INDEX.md
          retention-days: 14
      - name: Archive exact bytecode observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-candy-cane-hook-discovery
          path: build/candy-cane-hook-1010/report/
          retention-days: 14
