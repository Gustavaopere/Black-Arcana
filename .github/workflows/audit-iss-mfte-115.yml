name: ISS Magic From The East 1.1.5 clean-room binary discovery
on:
  push:
    branches:
      - 'audit/iss-mfte-115-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact CurseForge release and enforce physical SHA-1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request,pathlib,zipfile,re,subprocess
          expected='e3552ea6b7b32b843c48bf0d857237d4b7129ab0'
          urls=[
            'https://cursemaven.com/curse/maven/magic-from-the-east-1224162/7385201/magic-from-the-east-1224162-7385201.jar',
            'https://mediafilez.forgecdn.net/files/7385/201/iss_magicfromtheeast-1.1.5.jar',
            'https://media.forgecdn.net/files/7385/201/iss_magicfromtheeast-1.1.5.jar',
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'iss_magicfromtheeast-1.1.5.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-cleanroom-JAR-audit'})
              with urllib.request.urlopen(req,timeout=80) as r:data=r.read(20000000)
              sha=hashlib.sha1(data).hexdigest()
              print('CANDIDATE='+url+' BYTES='+str(len(data))+' SHA1='+sha,flush=True)
              if sha!=expected:continue
              jar.write_bytes(data)
              with zipfile.ZipFile(jar) as z:
                assert z.testzip() is None
                names=z.namelist()
                meta=z.read('META-INF/neoforge.mods.toml').decode('utf8')
              assert re.search(r'modId\s*=\s*["\x27]iss_magicfromtheeast',meta)
              print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
              print('CERTIFIED_BYTES='+str(len(data)))
              print('CERTIFIED_FILE_ID=7385201')
              print('TOTAL_CLASSFILES='+str(sum(x.endswith('.class') for x in names)))
              classes=[s[:-6].replace('/','.') for s in names if s.endswith('.class') and '$' not in s]
              match=[c for c in classes if any(t in c.lower() for t in ('spellregistr','spellregistry','spellregister','spell','mainmod'))]
              print('SPELLED_CLASSES='+repr(match[:120]))
              for c in match:
                if 'registr' not in c.lower():continue
                p=subprocess.run(['javap','-c','-p','-classpath',str(jar),c],capture_output=True,text=True,timeout=25)
                if p.returncode:continue
                if not any(x in p.stdout for x in ('AbstractSpell','SpellRegistry','DeferredRegister')):continue
                print('REGISTRAR_CLASS='+c)
                lines=p.stdout.splitlines()
                for line in lines:
                  if any(k in line for k in ('AbstractSpell','String ','new           #','registerSpell','DeferredRegister','SpellRegistry','ifne','ifeq','invokestatic')):
                    print('REG_BYTECODE='+line.strip()[:220])
              print('DISCOVERY_ONLY_NOT_RUNTIME=TRUE')
              break
            except Exception as e:
              print('CANDIDATE_ERROR='+repr(e)[:180],flush=True)
          else:
            raise SystemExit('FAIL-CLOSED: no official byte sequence matches physical modlist SHA')
          PY
