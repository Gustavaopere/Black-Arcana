name: Alex's Caves 1.0.10 Holocoder Hot Chocolate and Ink Bomb discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-holocoder-hot-chocolate-ink-bomb.yml'
      - 'docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_probe.py'
      - 'docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_consumers.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-HOLOCODER-HOT-CHOCOLATE-INK-BOMB-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_three_item_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax
        run: python3 -m py_compile docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_probe.py
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/alexscaves-three-items
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-three-items/publisher.jar
      - name: Discover native class bodies and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_probe.py \
            --jar build/alexscaves-three-items/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-three-items/report.json
      - name: Verify initial discovery seal
        run: |
          test "$(wc -c < build/alexscaves-three-items/report.json)" = 113270
          echo 'b1b37e98304c6a38c2eacd1167580a2ec843c1768a3dfcd9b84fa32396a224d5  build/alexscaves-three-items/report.json' | sha256sum -c -
      - name: Inspect literal producers, registry consumers and Ink Bomb projectile
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_consumers.py
          python3 docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_consumers.py --self-test
          python3 docs/qa/alexscaves_1010_holocoder_hot_chocolate_ink_bomb_consumers.py --jar build/alexscaves-three-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/alexscaves-three-items/consumers.json
      - name: Verify expanded discovery seal
        run: |
          test "$(wc -c < build/alexscaves-three-items/consumers.json)" = 645624
          echo '0ab600a51b26fd3da5e7360ad461deabf629f053817f1e210fe1e4a280821dac  build/alexscaves-three-items/consumers.json' | sha256sum -c -
      - name: Verify generated catalog indexes
        run: python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-three-item-native-discovery
          path: |
            build/alexscaves-three-items/report.json
            build/alexscaves-three-items/consumers.json
          if-no-files-found: warn
          retention-days: 14
