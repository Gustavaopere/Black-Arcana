name: Alex's Caves 1.0.10 adjacent item class discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-adjacent-items-probe.yml'
      - 'docs/qa/alexscaves_1010_adjacent_items_probe.py'
      - 'docs/qa/alexscaves_1010_adjacent_items_boundary.py'
      - 'docs/qa/alexscaves_1010_adjacent_items_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-ADJACENT-ITEMS-DISCOVERY-1.0.10.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adjacent_item_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/adjacent-items-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/adjacent-items-1010/alexscaves-1.0.10.jar
      - name: Audit five adjacent classes and finite typed consumers
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_adjacent_items_probe.py
          python3 docs/qa/alexscaves_1010_adjacent_items_probe.py \
            --jar build/adjacent-items-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/adjacent-items-1010/report.json
      - name: Replay exact five-class discovery
        run: AC_ADJACENT_REPORT=build/adjacent-items-1010/report.json python3 docs/qa/alexscaves_1010_adjacent_items_probe_test.py -v
      - name: Audit typed-only dispatch and native dependency bodies
        run: |
          python3 docs/qa/alexscaves_1010_adjacent_items_boundary.py --jar build/adjacent-items-1010/alexscaves-1.0.10.jar --javap "$JAVA_HOME/bin/javap" --initial build/adjacent-items-1010/report.json --output build/adjacent-items-1010/boundary.json
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-adjacent-items-discovery
          path: |
            build/adjacent-items-1010/report.json
            build/adjacent-items-1010/boundary.json
          retention-days: 14
          if-no-files-found: ignore
