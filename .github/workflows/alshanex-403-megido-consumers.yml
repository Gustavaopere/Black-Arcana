name: Alshanex 4.0.3 Megido same-class getter consumers
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-consumers.yml'
      - 'docs/qa/alshanex_403_megido_consumers.py'
      - 'docs/qa/alshanex_403_megido_consumers_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-consumers.yml'
      - 'docs/qa/alshanex_403_megido_consumers.py'
      - 'docs/qa/alshanex_403_megido_consumers_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  megido_consumer_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate fail-closed callsite parser using synthetic fixtures
        run: python3 docs/qa/alshanex_403_megido_consumers_test.py -v
      - name: Download exactly SHA-matched publisher JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/alshanex-megido-consumers
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alshanexs-familiars-1171602/8675568/alshanexs-familiars-1171602-8675568.jar' \
            --output build/alshanex-megido-consumers/provider.jar
          echo 'e5051c2385a426d05bf203ba8081a23d891f6686  build/alshanex-megido-consumers/provider.jar' | sha1sum --check
      - name: Audit symbolic same-class references without publishing bodies
        run: |
          python3 docs/qa/alshanex_403_megido_consumers.py \
            --jar build/alshanex-megido-consumers/provider.jar \
            --output build/alshanex-megido-consumers/evidence.json
      - name: Upload metadata JSON only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alshanex-403-megido-consumers
          path: build/alshanex-megido-consumers/evidence.json
          if-no-files-found: ignore
          retention-days: 14
