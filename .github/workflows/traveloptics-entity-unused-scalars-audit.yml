name: Traveloptics Entity-Unused Scalar Evaluation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Evaluate entity-unused numeric accessors
        shell: bash
        run: |
          set -euo pipefail

          URL='https://www.cursemaven.com/curse/maven/to-tweaks-irons-spells-1046916/6342780/to-tweaks-irons-spells-1046916-6342780.jar'
          EXPECTED_SHA1='3808493ce45cdfeb6408e85578adecf13df698e8'

          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 600 "$URL" -o traveloptics.jar
          test "$(sha1sum traveloptics.jar | awk '{print $1}')" = "$EXPECTED_SHA1"

          mkdir -p audit
          python3 - <<'PY'
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          jar = "traveloptics.jar"
          ENTITY = "Lnet/minecraft/world/entity/LivingEntity;"

          targets = [
              ("BloodHowlSpell","getRecastCount","(ILnet/minecraft/world/entity/LivingEntity;)I",5),
              ("AbyssalBlastSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("BlackoutSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("PsychicBoltSpell","getRecastCount","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("CursedMinefieldSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",8),
              ("VoidEruptionSpell","getRecastCount","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("VoidEruptionSpell","getRange","(ILnet/minecraft/world/entity/LivingEntity;)F",3),
              ("VortexPunchSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("GyroSlashSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",1),
              ("NullflareSpell","getRecastCount","(ILnet/minecraft/world/entity/LivingEntity;)I",5),
              ("DespairSpell","getRecastCount","(ILnet/minecraft/world/entity/LivingEntity;)I",10),
              ("DeathLaserSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",3),
              ("EmPulse","getRadius","(ILnet/minecraft/world/entity/LivingEntity;)F",5),
              ("AerialCollapseSpell","getEffectiveCastTime","(ILnet/minecraft/world/entity/LivingEntity;)I",5),
              ("AerialCollapseSpell","getRadius","(ILnet/minecraft/world/entity/LivingEntity;)F",5),
          ]

          with zipfile.ZipFile(jar) as z:
              entries = z.namelist()

          def fqcn_for(simple):
              suffix = "/" + simple + ".class"
              matches = [e for e in entries if e.endswith(suffix)]
              if len(matches) != 1:
                  raise RuntimeError(f"{simple}: class matches={matches}")
              return matches[0][:-6].replace("/", ".")

          def parse_num(s):
              s=s.strip()
              s=re.sub(r'[fFdDlL]$','',s)
              return float(s) if any(ch in s for ch in ".eE") else int(s)

          def class_constants(fqcn):
              p=subprocess.run(["javap","-classpath",jar,"-p","-constants",fqcn],check=True,text=True,capture_output=True)
              out={}
              for raw in p.stdout.splitlines():
                  line=raw.strip()
                  m=re.match(r'.*\b([A-Za-z_$][\w$]*)\s*=\s*(-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?[fFdDlL]?)\s*;',line)
                  if m:
                      out[m.group(1)]=parse_num(m.group(2))
              return out

          def parse_args(desc):
              i=1
              args=[]
              while desc[i] != ")":
                  start=i
                  while desc[i] == "[":
                      i+=1
                  if desc[i] == "L":
                      i=desc.index(";",i)+1
                  else:
                      i+=1
                  args.append(desc[start:i])
              return args

          def parameter_slots(desc,is_static):
              slot=0 if is_static else 1
              out=[]
              for arg in parse_args(desc):
                  out.append((arg,slot))
                  slot += 2 if arg in ("J","D") else 1
              return out

          insn_re=re.compile(r'^\s*(\d+):\s+(\S+)(?:\s+(.*))?$')

          def method_info(fqcn,method_name,descriptor):
              p=subprocess.run(["javap","-classpath",jar,"-c","-p","-s",fqcn],check=True,text=True,capture_output=True)
              lines=p.stdout.splitlines()
              for i,raw in enumerate(lines):
                  sig=raw.strip()
                  if not (sig.endswith(";") and re.search(r'\b'+re.escape(method_name)+r'\s*\(',sig)):
                      continue
                  desc=None
                  code_idx=None
                  for j in range(i+1,min(len(lines),i+10)):
                      s=lines[j].strip()
                      if s.startswith("descriptor:"):
                          desc=s.split("descriptor:",1)[1].strip()
                      if s=="Code:":
                          code_idx=j
                          break
                  if desc != descriptor or code_idx is None:
                      continue
                  instr=[]
                  for raw2 in lines[code_idx+1:]:
                      m=insn_re.match(raw2)
                      if m:
                          instr.append((int(m.group(1)),m.group(2),m.group(3) or ""))
                          continue
                      if instr:
                          break
                  return (" static " in (" "+sig+" ")),instr
              raise RuntimeError(f"{fqcn}.{method_name}{descriptor}: method not found")

          def load_slot(op,arg,prefix):
              m=re.fullmatch(prefix+r'_(\d+)',op)
              if m:
                  return int(m.group(1))
              if op==prefix:
                  return int(arg.split()[0])
              return None

          def eval_method(instr,constants,level_slot,level,is_static):
              stack=[]
              locals_={}
              if not is_static:
                  locals_[0]="THIS"
              locals_[level_slot]=level

              for _,op,arg in instr:
                  if op.startswith(("if","goto","tableswitch","lookupswitch","jsr","ret","athrow")):
                      return None,f"CONTROL_FLOW:{op}"
                  if op=="nop":
                      continue
                  if op.startswith("iconst_"):
                      tail=op[len("iconst_"):]
                      stack.append(-1 if tail=="m1" else int(tail)); continue
                  if op.startswith("fconst_"):
                      stack.append(float(op[-1])); continue
                  if op.startswith("dconst_"):
                      stack.append(float(op[-1])); continue
                  if op in ("bipush","sipush"):
                      stack.append(int(arg.split()[0])); continue
                  if op in ("ldc","ldc_w","ldc2_w"):
                      comment=arg.split("//",1)[1].strip() if "//" in arg else ""
                      m=re.search(r'\b(?:int|float|double|long)\s+(-?[^\s]+)',comment)
                      if not m:
                          return None,f"UNSUPPORTED_CONST:{arg}"
                      stack.append(parse_num(m.group(1))); continue

                  idx=load_slot(op,arg,"iload")
                  if idx is not None:
                      if idx not in locals_:
                          return None,f"UNKNOWN_LOCAL:{idx}"
                      stack.append(locals_[idx]); continue
                  idx=load_slot(op,arg,"fload")
                  if idx is not None:
                      if idx not in locals_:
                          return None,f"UNKNOWN_LOCAL:{idx}"
                      stack.append(locals_[idx]); continue

                  if op in ("i2f","i2d","i2l","f2d","f2i","d2f","d2i"):
                      if not stack:return None,"STACK_UNDERFLOW"
                      v=stack.pop()
                      if op.endswith("i"): v=int(v)
                      else: v=float(v)
                      stack.append(v); continue
                  if op in ("iadd","isub","imul","idiv","irem","fadd","fsub","fmul","fdiv","dadd","dsub","dmul","ddiv","ladd","lsub","lmul","ldiv"):
                      if len(stack)<2:return None,"STACK_UNDERFLOW"
                      b=stack.pop(); a=stack.pop()
                      if op.endswith("add"): v=a+b
                      elif op.endswith("sub"): v=a-b
                      elif op.endswith("mul"): v=a*b
                      elif op.endswith("div"): v=a/b
                      else: v=a%b
                      if op.startswith(("i","l")): v=int(v)
                      stack.append(v); continue
                  if op in ("ineg","fneg","dneg","lneg"):
                      if not stack:return None,"STACK_UNDERFLOW"
                      stack[-1]=-stack[-1]; continue
                  if op=="getstatic":
                      comment=arg.split("//",1)[1].strip() if "//" in arg else ""
                      m=re.search(r'Field\s+(?:[\w/$]+\.)?([\w$]+):',comment)
                      if not m or m.group(1) not in constants:
                          return None,f"UNKNOWN_GETSTATIC:{comment}"
                      stack.append(constants[m.group(1)]); continue
                  if op in ("dup","dup2"):
                      if not stack:return None,"STACK_UNDERFLOW"
                      stack.append(stack[-1]); continue
                  if op=="pop":
                      if not stack:return None,"STACK_UNDERFLOW"
                      stack.pop(); continue
                  if op=="iinc":
                      parts=arg.replace(","," ").split()
                      idx=int(parts[0]); inc=int(parts[1])
                      if idx not in locals_: return None,f"UNKNOWN_LOCAL:{idx}"
                      locals_[idx]+=inc; continue
                  if op in ("ireturn","freturn","dreturn","lreturn"):
                      if not stack:return None,"EMPTY_RETURN"
                      return stack.pop(),None
                  if op=="return":
                      return None,"VOID_RETURN"

                  # Any object access, invocation, field read, store or unsupported opcode is fail-closed.
                  return None,f"UNSUPPORTED:{op}"
              return None,"NO_RETURN"

          rows=[]
          for simple,method,desc,max_level in targets:
              fqcn=fqcn_for(simple)
              is_static,instr=method_info(fqcn,method,desc)
              slots=parameter_slots(desc,is_static)
              entity_slots=[slot for arg,slot in slots if arg==ENTITY]
              int_slots=[slot for arg,slot in slots if arg=="I"]
              if len(entity_slots)!=1 or len(int_slots)!=1:
                  raise RuntimeError(f"{simple}.{method}{desc}: unexpected parameter slots {slots}")
              eslot=entity_slots[0]
              lslot=int_slots[0]

              entity_loads=sum(
                  1 for _,op,arg in instr
                  if load_slot(op,arg,"aload")==eslot
              )
              if entity_loads != 0:
                  raise RuntimeError(f"{simple}.{method}{desc}: LivingEntity parameter unexpectedly loaded {entity_loads} times")

              consts=class_constants(fqcn)
              vals=[]
              err=None
              for level in range(1,max_level+1):
                  value,e=eval_method(instr,consts,lslot,level,is_static)
                  if e:
                      err=e
                      break
                  vals.append((level,value))
              rows.append((simple,method,desc,max_level,vals if err is None else None,err))

          report=Path("audit/report.txt")
          with report.open("w",encoding="utf-8") as f:
              f.write("Traveloptics exact-alpha ENTITY_UNUSED scalar evaluation\n")
              f.write("artifact=CurseForge 1046916/6342780\n")
              f.write("sha1=3808493ce45cdfeb6408e85578adecf13df698e8\n")
              f.write("authority=classification audit #616; only methods with zero LivingEntity local loads are eligible\n")
              f.write("scope=15 ENTITY_UNUSED numeric accessors\n")
              f.write("retention=method identity + exact evaluated return values by valid spell level or UNKNOWN reason; no bytecode/method bodies\n\n")
              ok=0
              for simple,method,desc,max_level,vals,err in rows:
                  if err is None:
                      ok+=1
                      s=",".join(f"L{lvl}={value}" for lvl,value in vals)
                      f.write(f"{simple}|{method}|{desc}|OK|{s}\n")
                  else:
                      f.write(f"{simple}|{method}|{desc}|UNKNOWN|reason={err}\n")
              f.write("\nsummary\n")
              f.write(f"targets={len(rows)}\n")
              f.write(f"ok={ok}\n")
              f.write(f"unknown={len(rows)-ok}\n")

          if len(rows)!=15:
              raise RuntimeError(f"expected 15 rows, got {len(rows)}")
          print(report.read_text(encoding="utf-8"))
          PY

      - name: Upload text-only audit
        uses: actions/upload-artifact@v7
        with:
          name: traveloptics-entity-unused-scalars-report
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
