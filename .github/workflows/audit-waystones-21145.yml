name: Waystones 21.1.45 exact physical magic surface audit
on:
  push:
    branches:
      - 'audit/waystones-21145-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce publisher JAR SHA then inspect physical magic surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib,zipfile,re,subprocess,os
          wanted='6ec1a176a102212db4f6391886db52ed103c830f'
          urls=[
            'https://cursemaven.com/curse/maven/waystones-245755/8873000/waystones-245755-8873000.jar',
            'https://mediafilez.forgecdn.net/files/8873/000/waystones-neoforge-1.21.1-21.1.45.jar',
            'https://media.forgecdn.net/files/8873/000/waystones-neoforge-1.21.1-21.1.45.jar'
          ]
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'waystones-neoforge-1.21.1-21.1.45.jar'
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Black-Arcana-cleanroom-waystones'})
              with urllib.request.urlopen(req,timeout=75) as res:data=res.read(15000000)
              sha=hashlib.sha1(data).hexdigest()
              print('CANDIDATE_BYTES='+str(len(data))+' SHA1='+sha,flush=True)
              if sha!=wanted: continue
              jar.write_bytes(data)
              break
            except Exception as e:print('CANDIDATE_ERROR='+repr(e)[:180],flush=True)
          else:raise SystemExit('FAIL-CLOSED: publisher archive does not match physical SHA')
          print('PUBLISHER_EQUALS_PHYSICAL_SHA1=PASS')
          print('CERTIFIED_FILE_ID=8873000')
          print('CERTIFIED_BYTES='+str(jar.stat().st_size))
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            paths=z.namelist()
            manifests=[p for p in paths if p.endswith('neoforge.mods.toml')]
            print('MANIFESTS='+repr(manifests))
            if manifests:
              meta=z.read(manifests[0]).decode('utf8','replace')
              print('MODID_DECLARATIONS='+repr([l.strip() for l in meta.splitlines() if 'modId' in l][:8]))
              assert re.search(r'modId\s*=\s*["\x27]waystones["\x27]',meta)
          classes=[p[:-6].replace('/','.') for p in paths if p.endswith('.class') and '$' not in p]
          candidates=[x for x in classes if any(y in x.lower() for y in ('portalscroll','twinboundfeather','warpportalmanager','waystonesapi','warpstone','warpplate','blankscroll','warpteleport','waystoneblock','warpstoneitem'))]
          print('CANDIDATE_CLASSES='+repr(candidates[:120]))
          print('TOTAL_CLASSFILES='+str(len(classes)))
          for name in candidates:
            if not any(z in name.lower() for z in ('portalscroll','twinboundfeather','warpportalmanager','waystonesapi')):continue
            p=subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,timeout=30)
            if p.returncode:continue
            print('CLASS='+name)
            for line in p.stdout.splitlines():
              if any(t in line for t in ('spawnPortal','tryTeleportAsync','link','teleport','getBoundWaystone','useOn','use(','register','getPortal','setBoundWaystone')):
                print('BYTECODE='+line.strip()[:215])
          print('DISCOVERY_ONLY_NOT_RUNTIME=TRUE')
          PY

      - name: Reconcile exact compiled player actions and exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,hashlib,subprocess,zipfile,re
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'waystones-neoforge-1.21.1-21.1.45.jar'
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='6ec1a176a102212db4f6391886db52ed103c830f'
          prefix='net.blay09.mods.waystones.'
          targets=[
            'api.WaystonesAPI',
            'core.WarpPortalManager',
            'item.PortalScrollItem',
            'item.TwinboundFeatherItem',
            'component.TwinboundFeatherLinksComponent',
            'core.TwinboundFeatherTargets',
            'item.WarpStoneItem',
            'item.BlankScrollItem',
            'block.WaystoneBlock',
            'block.entity.WarpPlateBlockEntity',
            'block.WarpPlateBlock'
          ]
          def javap(clazz):
            p=subprocess.run(['javap','-p','-c','-classpath',str(jar),prefix+clazz],capture_output=True,text=True,timeout=30)
            assert p.returncode==0,(clazz,p.stderr[:150])
            return p.stdout
          for clazz in targets:
            code=javap(clazz)
            print('CLASS_AUDITED='+clazz)
            signatures=[x.strip() for x in code.splitlines() if x.startswith('  public ') or x.startswith('  private ') or x.startswith('  protected ')]
            filtered=[s for s in signatures if any(t in s.lower() for t in ('teleport','portal','twinbound','link','use(','useon(','activate','attune','tick','warp','interact','bind','handle'))]
            print('RELEVANT_METHODS='+repr(filtered[:50]))
            calls=[x.strip() for x in code.splitlines() if ('// Method ' in x or '// InterfaceMethod ' in x) and any(t in x for t in ('tryTeleportAsync','spawnPortal','TwinboundFeatherLinksComponent','setBoundWaystone','PlayerWaystoneManager','attuneShard','activateWaystone','teleportFromPortal','activate','setLinked','addLink'))]
            print('RELEVANT_CALLS='+repr(calls[:70]))
          api=javap('api.WaystonesAPI')
          manager=javap('core.WarpPortalManager')
          portal=javap('item.PortalScrollItem')
          feather=javap('item.TwinboundFeatherItem')
          blank=javap('item.BlankScrollItem')
          assert 'tryTeleportAsync(' in api
          assert 'InternalMethods.tryTeleportAsync:' in api
          assert 'spawnPortal(' in manager
          assert 'WarpPortalManager.spawnPortal:' in portal
          assert 'WaystonesAPI.tryTeleportAsync:' in manager
          assert 'TwinboundFeatherLinksComponent.links:' in feather
          assert 'WaystonesAPI.setBoundWaystone:' in blank
          print('THREE_PHYSICAL_ACTION_FAMILIES_DISCOVERED=TRUE')
          print('RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY

      - name: Certify three distinct causal roots and prevent setup overcount
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,hashlib,subprocess,re
          jar=pathlib.Path(os.environ['RUNNER_TEMP'])/'waystones-neoforge-1.21.1-21.1.45.jar'
          assert jar.is_file() and hashlib.sha1(jar.read_bytes()).hexdigest()=='6ec1a176a102212db4f6391886db52ed103c830f'
          p='net.blay09.mods.waystones.'
          def compiled(name):
            q=subprocess.run(['javap','-p','-c','-classpath',str(jar),p+name],capture_output=True,text=True,timeout=35)
            assert q.returncode==0,(name,q.stderr[:140])
            return q.stdout
          api=compiled('api.WaystonesAPI')
          portal=compiled('item.PortalScrollItem')
          manager=compiled('core.WarpPortalManager')
          feather=compiled('item.TwinboundFeatherItem')
          component=compiled('component.TwinboundFeatherLinksComponent')
          blank=compiled('item.BlankScrollItem')
          plate=compiled('block.entity.WarpPlateBlockEntity')
          activation=compiled('block.WaystoneBlock')
          stone=compiled('item.WarpStoneItem')
          assert 'InternalMethods.tryTeleportAsync:' in api
          assert 'WaystonesAPI.tryTeleportAsync:' in manager
          assert 'WaystonesAPI.tryTeleportAsync:' in plate
          assert 'use(net.minecraft.world.level.Level' in stone
          print('EXACT_ACTION_1=WAYSTONE_WARP_TELEPORT|WaystonesAPI.tryTeleportAsync|WarpPortalManager.teleportFromPortal|WarpPlateBlockEntity')
          assert 'WarpPortalManager.spawnPortal:' in portal
          assert 'public static boolean spawnPortal(' in manager
          assert 'WaystonesAPI.tryTeleportAsync:' not in portal
          print('EXACT_ACTION_2=WARP_PORTAL_CONJURATION|PortalScrollItem|WarpPortalManager.spawnPortal')
          assert 'onUseTick(' in feather and 'use(net.minecraft.world.level.Level' in feather
          assert 'TwinboundFeatherLinksComponent.with:' in feather
          assert 'TwinboundFeatherLinksComponent.links:' in feather
          assert 'public net.blay09.mods.waystones.component.TwinboundFeatherLinksComponent with(java.util.UUID)' in component
          assert 'WaystonesAPI.tryTeleportAsync:' not in feather
          print('EXACT_ACTION_3=TWINBOUND_LINK|TwinboundFeatherItem.onUseTick|TwinboundFeatherLinksComponent.with')
          assert 'WaystonesAPI.setBoundWaystone:' in blank
          assert 'PlayerWaystoneManager.activateWaystone:' in activation
          assert 'WaystonesAPI.setBoundWaystone:' in plate
          assert 'attuneShard(' in plate and 'serverTick()' in plate
          print('EXCLUSION_1=WAYSTONE_ACTIVATION|SETUP_DISCOVERY')
          print('EXCLUSION_2=BLANK_SCROLL_BINDING|ITEM_PREPARATION')
          print('EXCLUSION_3=WARP_PLATE_ATTUNEMENT|AUTOMATED_INFRA_PREPARATION')
          print('PHYSICAL_SEMANTIC_ROOTS=3')
          print('NEW_SEMANTIC_ROOTS=0')
          print('EXACT_STATIC_ACTION_AUDIT=PASS')
          print('RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY
