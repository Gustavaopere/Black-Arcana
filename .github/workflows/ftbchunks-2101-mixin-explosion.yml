name: FTB Chunks 2101.1.22 exact mixin and explosion registration census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ftbchunks-2101-mixin-explosion.yml'
      - 'docs/qa/ftbchunks_2101_mixin_registration_probe.py'
      - 'docs/qa/ftbchunks_2101_mixin_registration_probe_test.py'
      - 'docs/qa/ftbchunks-2101-mixin-explosion-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/FTBCHUNKS-2101-MIXIN-REGISTRATION-ABI.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/tremorzilla-beam.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftbchunks-2101-mixin-explosion.yml'
      - 'docs/qa/ftbchunks_2101_mixin_registration_probe.py'
      - 'docs/qa/ftbchunks_2101_mixin_registration_probe_test.py'
      - 'docs/qa/ftbchunks-2101-mixin-explosion-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/FTBCHUNKS-2101-MIXIN-REGISTRATION-ABI.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/tremorzilla-beam.md'

permissions:
  contents: read

jobs:
  exact_mixin_registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic mixin and callsite fail-closed regressions
        run: |
          python3 -m py_compile docs/qa/ftbchunks_2101_mixin_registration_probe.py docs/qa/ftbchunks_2101_mixin_registration_probe_test.py
          python3 docs/qa/ftbchunks_2101_mixin_registration_probe_test.py -v
      - name: Download official FTB 2101.1.22 publisher artifact
        run: |
          mkdir -p build/ftbchunks-2101-mixin
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://maven.ftb.dev/releases/dev/ftb/mods/ftb-chunks-neoforge/2101.1.22/ftb-chunks-neoforge-2101.1.22.jar' \
            --output build/ftbchunks-2101-mixin/ftb-chunks-neoforge-2101.1.22.jar
      - name: SHA-exact mixin declarations and JVM invocation census
        run: |
          SEAL=wiki/modpack-catalog/providers/✅-alexs-caves-continued/FTBCHUNKS-2101-MIXIN-REGISTRATION-ABI.json
          if test -f "$SEAL"; then
            python3 docs/qa/ftbchunks_2101_mixin_registration_probe.py \
              --jar build/ftbchunks-2101-mixin/ftb-chunks-neoforge-2101.1.22.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/ftbchunks-2101-mixin/mixin-evidence.json
          else
            echo 'UNSEALED MIXIN DISCOVERY: do not merge or certify.'
            python3 docs/qa/ftbchunks_2101_mixin_registration_probe.py \
              --jar build/ftbchunks-2101-mixin/ftb-chunks-neoforge-2101.1.22.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/ftbchunks-2101-mixin/mixin-evidence.json
          fi
          python3 -m json.tool build/ftbchunks-2101-mixin/mixin-evidence.json
      - name: Archive bounded compiled evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftbchunks-2101-mixin-registration-evidence
          path: build/ftbchunks-2101-mixin/mixin-evidence.json
          if-no-files-found: ignore
          retention-days: 14
