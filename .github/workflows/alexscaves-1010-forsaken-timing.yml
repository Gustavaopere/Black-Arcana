name: Alex's Caves 1.0.10 Forsaken timing and persistence ABI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_forsaken_timing_probe.py'
      - 'docs/qa/alexscaves_1010_forsaken_timing_probe_test.py'
      - 'docs/qa/alexscaves_1010_forsaken_timing_cards_test.py'
      - '.github/workflows/alexscaves-1010-forsaken-timing.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/forsaken-sonic-boom.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-TIMING-1.0.10.json'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_forsaken_timing_probe.py'
      - 'docs/qa/alexscaves_1010_forsaken_timing_probe_test.py'
      - 'docs/qa/alexscaves_1010_forsaken_timing_cards_test.py'
      - '.github/workflows/alexscaves-1010-forsaken-timing.yml'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/forsaken-sonic-boom.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-TIMING-1.0.10.json'
permissions:
  contents: read
jobs:
  exact_forsaken_timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and deterministic probe tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_forsaken_timing_probe.py docs/qa/alexscaves_1010_forsaken_timing_probe_test.py docs/qa/alexscaves_1010_forsaken_timing_cards_test.py
          python3 docs/qa/alexscaves_1010_forsaken_timing_probe_test.py -v
      - name: Verify documented timing and exact own-NBT state
        run: python3 docs/qa/alexscaves_1010_forsaken_timing_cards_test.py -v
      - name: Download hash-pinned installed 1.0.10 JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: SHA-exact compiled timing and NBT method audit
        run: |
          python3 docs/qa/alexscaves_1010_forsaken_timing_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/EXACT-FORSAKEN-TIMING-1.0.10.json' \
            --output build/alexscaves-1010/forsaken-timing.json
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-forsaken-timing-and-own-nbt
          path: build/alexscaves-1010/forsaken-timing.json
          retention-days: 14
          if-no-files-found: error
