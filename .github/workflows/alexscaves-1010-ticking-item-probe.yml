name: Alex's Caves 1.0.10 ACTickingItem exact discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-ticking-item-probe.yml'
      - 'docs/qa/alexscaves_1010_ticking_item_probe.py'
      - 'docs/qa/alexscaves_1010_ticking_item_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TICKING-ITEM-DISCOVERY-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TICKING-ITEM-DISCOVERY-1.0.10.md'
      - 'docs/qa/alexscaves_1010_ticking_item_boundary.py'
      - 'docs/qa/alexscaves_1010_ticking_item_boundary_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TICKING-ITEM-BOUNDARY-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TICKING-ITEM-BOUNDARY-1.0.10.md'
      - 'docs/qa/alexscaves_1010_ticking_item_extra.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticking_item_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact publisher artifact
        run: |
          mkdir -p build/ticking-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/ticking-1010/alexscaves-1.0.10.jar
      - name: Inspect interface and native consumer candidates
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_ticking_item_probe.py
          python3 docs/qa/alexscaves_1010_ticking_item_probe.py \
            --jar build/ticking-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/ticking-1010/report.json
      - name: Replay native tick crosswalk
        run: AC_TICK_REPORT=build/ticking-1010/report.json python3 docs/qa/alexscaves_1010_ticking_item_probe_test.py -v
      - name: Audit mixin annotation, callbacks and official inventory tick boundary
        run: |
          for kind in universal userdev; do
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 120 \
              "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-$kind.jar" \
              --output "build/ticking-1010/$kind.jar"
          done
          python3 docs/qa/alexscaves_1010_ticking_item_boundary.py \
            --jar build/ticking-1010/alexscaves-1.0.10.jar \
            --universal build/ticking-1010/universal.jar \
            --userdev build/ticking-1010/userdev.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/ticking-1010/boundary.json
      - name: Replay exact inventory tick boundary
        run: AC_TICK_BOUNDARY=build/ticking-1010/boundary.json python3 docs/qa/alexscaves_1010_ticking_item_boundary_test.py -v
      - name: Inspect upper inventory caller, damage setter and radiation parameters
        run: |
          python3 docs/qa/alexscaves_1010_ticking_item_extra.py \
            --jar build/ticking-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/ticking-1010/extra.json
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-ticking-item-discovery
          path: |
            build/ticking-1010/report.json
            build/ticking-1010/boundary.json
            build/ticking-1010/extra.json
          retention-days: 14
          if-no-files-found: ignore
