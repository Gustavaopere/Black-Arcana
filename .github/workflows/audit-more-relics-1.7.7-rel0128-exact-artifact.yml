name: Audit More Relics 1.7.7 Relics 0.12.8 exact artifact

on:
  push:
    branches:
      - audit/more-relics-1.7.7-rel0128-exact-artifact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Materialize exact publisher artifact and verify physical hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-out
          target="$RUNNER_TEMP/morerelics-1.7.7-forRelics-0.12.8-1.0-1.21.1.jar"
          urls=(
            'https://www.curseforge.com/api/v1/mods/1269280/files/8859015/download'
            'https://edge.forgecdn.net/files/8859/015/morerelics-1.7.7-forRelics-0.12.8-1.0-1.21.1.jar'
            'https://mediafilez.forgecdn.net/files/8859/015/morerelics-1.7.7-forRelics-0.12.8-1.0-1.21.1.jar'
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f "$target"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 120 "$url" -o "$target"; then
              got="$(sha1sum "$target" | awk '{print $1}')"
              if [ "$got" = 'bc220ed291187c97bd1896f1fdd29b2377879ae1' ]; then
                printf 'publisher_url=%s\n' "$url" > audit-out/identity.txt
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1
          printf 'filename=morerelics-1.7.7-forRelics-0.12.8-1.0-1.21.1.jar\n' >> audit-out/identity.txt
          printf 'curseforge_project=1269280\n' >> audit-out/identity.txt
          printf 'curseforge_file=8859015\n' >> audit-out/identity.txt
          printf 'physical_sha1=bc220ed291187c97bd1896f1fdd29b2377879ae1\n' >> audit-out/identity.txt
          printf 'audit_sha1=%s\n' "$(sha1sum "$target" | awk '{print $1}')" >> audit-out/identity.txt
          printf 'audit_sha256=%s\n' "$(sha256sum "$target" | awk '{print $1}')" >> audit-out/identity.txt
          printf 'size_bytes=%s\n' "$(stat -c '%s' "$target")" >> audit-out/identity.txt
          unzip -t "$target" >/dev/null

      - name: Extract clean-room semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          python .github/more_relics_exact_audit.py             "$RUNNER_TEMP/morerelics-1.7.7-forRelics-0.12.8-1.0-1.21.1.jar"             audit-out

      - name: Publish text-only clean-room evidence
        uses: actions/upload-artifact@v4
        with:
          name: more-relics-1.7.7-rel0128-exact-artifact-evidence
          path: audit-out
          retention-days: 7
          if-no-files-found: error
