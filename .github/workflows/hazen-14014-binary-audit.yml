name: Hazen 1.4.0.14 exact-JAR spell registry proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hazen-14014-binary-audit.yml'
      - 'docs/qa/hazen_14014_binary_audit.py'
      - 'docs/qa/hazen_14014_binary_audit_test.py'
      - 'docs/qa/hazen-14014-binary-registry.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hazen-14014-binary-audit.yml'
      - 'docs/qa/hazen_14014_binary_audit.py'
      - 'docs/qa/hazen_14014_binary_audit_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_spell_registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify synthetic Javap collector (not physical runtime QA)
        run: python3 docs/qa/hazen_14014_binary_audit_test.py -v

      - name: Download CurseForge 8277644 exact JAR with installed SHA-1 gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hazen-14014-evidence
          JAR='build/hazen-14014-evidence/hazennstuff-1.4.0.14.jar'
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://mediafilez.forgecdn.net/files/8277/644/hazennstuff-1.4.0.14.jar' \
            --output "$JAR"
          echo "3be20bacb44c1923348ab6f61b685eec6aacfdcd  $JAR" | sha1sum --check --status
          test "$(stat -c %s "$JAR")" -gt 500000

      - name: Audit source-cataloged spell class IDs in exact compiled registry
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/qa/hazen_14014_binary_audit.py \
            --jar build/hazen-14014-evidence/hazennstuff-1.4.0.14.jar \
            --output build/hazen-14014-evidence/evidence.json

      - name: Upload narrow JSON report only (no third-party JAR)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hazen-14014-registry-binary-${{ github.sha }}
          path: build/hazen-14014-evidence/evidence.json
          if-no-files-found: ignore
          retention-days: 14
