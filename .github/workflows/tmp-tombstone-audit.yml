name: Temporary Tombstone Catalog Audit NON-MERGE

on:
  push:
    branches:
      - feat/audit-corail-tombstone-9.5.6-non-merge-2026-09-24

jobs:
  tombstone-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exact publisher artifact discovery
        run: python3 .github/scripts/tmp_corail_tombstone_9_5_6_discovery.py
      - name: Run focused signature audit
        run: python3 .github/scripts/tmp_corail_tombstone_9_5_6_focus.py
      - name: Run executable item surface audit
        run: python3 .github/scripts/tmp_corail_tombstone_9_5_6_itemmap.py
      - name: Map Tombstone prayer and rite identities
        run: python3 .github/scripts/tmp_corail_tombstone_9_5_6_actionmap.py
      - name: Audit Tombstone prayer rite reachability
        run: python3 .github/scripts/tmp_corail_tombstone_9_5_6_reachability.py
