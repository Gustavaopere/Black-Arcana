name: Phase 2BK Ignis exact reconciliation

on:
  push:
    branches:
      - docs/magic-catalog-phase2bk-ignis-soulfires-spellbooks-exact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase 2BK documentation
        shell: bash
        run: |
          set -euo pipefail
          python .github/phase2bk_finalize.py

      - name: Validate Phase 2BK postconditions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'ZERO_BRIDGE_INFRA / EXACT ARTIFACT CLOSED / +0' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '**1250 semantic magic objects are currently reconstructible' wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md
          grep -F '**Canonical provider-component coverage after Phase 2BK: 58/100 = 58%.**' wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md
          grep -F '| 58 | Phase 2BK | `ignissoulfires_spellbooks` |' wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md
          grep -F 'componente **#58 / 58/100**' wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md
          grep -F 'NON-MERGE PR #203' SOURCES.md
          grep -F '| Ignis Soulfires: Spellbooks | installed `1.1.0`' THIRD_PARTY_NOTICES.md
          ! git diff --name-only | grep -E '^src/'

      - name: Commit durable docs and self-clean harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCES.md THIRD_PARTY_NOTICES.md wiki/modpack-catalog/meta/SEMANTIC-MAGIC-COVERAGE.md wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md wiki/modpack-catalog/meta/CURRENT-MAGIC-PROVIDERS.md wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md
          git commit -m 'docs: reconcile Phase 2BK exact zero closure'
          git rm -f .github/phase2bk_finalize.py .github/workflows/phase2bk-finalize.yml
          git commit -m 'ci: remove Phase 2BK reconciliation harness'
          git push
