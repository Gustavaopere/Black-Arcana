name: Alex's Caves 1.0.10 Gazing Pearl ACPlatform storage bridge discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-gazing-pearl-acplatform-discovery.yml'
      - 'docs/qa/alexscaves_1010_gazing_pearl_acplatform_probe.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-ACPLATFORM-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GAZING-PEARL-ACPLATFORM-1.0.10.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gazing_pearl_acplatform_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check the read-only ACPlatform probe
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_gazing_pearl_acplatform_probe.py
      - name: Download the publisher JAR pinned to Alex's Caves 1.0.10
        run: |
          mkdir -p build/gazing-pearl-acplatform-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/gazing-pearl-acplatform-1010/publisher.jar
      - name: Read exact native ACPlatform storage declaration and invocation sites
        run: |
          python3 docs/qa/alexscaves_1010_gazing_pearl_acplatform_probe.py \
            --jar build/gazing-pearl-acplatform-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-acplatform-1010/report.json
      - name: Reject wrong report scope and unsafe promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('build/gazing-pearl-acplatform-1010/report.json').read_text())
          assert report['schema_version']==1
          assert report['scope']=='GAZING_PEARL_ACPLATFORM_STORAGE_BRIDGE_DISCOVERY_ONLY'
          assert report['native']['classfiles_scanned']==1555
          assert report['native']['exact_declaration']['name']=='computeIfAbsent'
          assert 'com/github/alexmodguy/alexscaves/server/level/storage/ACWorldData' in report['native']['direct_referencing_owners']
          assert report['artifact']['installed_binary_parity']=='NOT_VERIFIED'
          assert report['static_contract']=='NOT_CERTIFIED'
          assert report['mutating_hook']=='NOT_VERIFIED'
          assert report['physical_qa']=='NOT_TESTED'
          assert report['mutation']=='NO_MUTATION'
          print('PASS: bounded ACPlatform bridge discovery; no mutation or physical claim')
          PY
      - name: Upload exact native storage bridge report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gazing-pearl-acplatform
          path: build/gazing-pearl-acplatform-1010/report.json
          retention-days: 14
          if-no-files-found: warn
