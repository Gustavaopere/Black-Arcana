name: Alex's Caves 1.0.10 Crystallization exact Galena Gauntlet evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-crystallization.yml'
      - 'docs/qa/alexscaves_1010_crystallization_probe.py'
      - 'docs/qa/alexscaves_1010_crystallization_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/crystallization.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-crystallization.yml'
      - 'docs/qa/alexscaves_1010_crystallization_probe.py'
      - 'docs/qa/alexscaves_1010_crystallization_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/crystallization.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'

permissions:
  contents: read

jobs:
  exact_crystallization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed JVM probe tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_crystallization_probe.py docs/qa/alexscaves_1010_crystallization_probe_test.py
          python3 docs/qa/alexscaves_1010_crystallization_probe_test.py -v
      - name: Acquire publisher binary with SHA verification
        run: |
          mkdir -p build/alexscaves-crystallization-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-crystallization-1010/alexscaves-1.0.10.jar
      - name: Verify exact publisher JSON and bounded JVM consumers
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-CRYSTALLIZATION-1.0.10.json'
          if test -f "$SEAL"; then
            python3 docs/qa/alexscaves_1010_crystallization_probe.py \
              --jar build/alexscaves-crystallization-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" --seal "$SEAL" \
              --output build/alexscaves-crystallization-1010/evidence.json
          else
            echo 'UNSEALED DISCOVERY ONLY — no certification or merge permitted'
            python3 docs/qa/alexscaves_1010_crystallization_probe.py \
              --jar build/alexscaves-crystallization-1010/alexscaves-1.0.10.jar \
              --javap "$JAVA_HOME/bin/javap" \
              --output build/alexscaves-crystallization-1010/evidence.json
          fi
      - name: Check canonical catalog indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive bounded publisher evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-crystallization-evidence
          path: build/alexscaves-crystallization-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
