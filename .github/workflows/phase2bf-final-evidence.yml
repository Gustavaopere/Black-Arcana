name: Phase 2BF final evidence reconciliation

on:
  push:
    branches:
      - docs/phase2bf-final-evidence

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase2bf-final-evidence
      - name: Record exact Phase 2BF merge evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'wiki/modpack-catalog/meta/PHASE2BF-SOMAKE-1.0.8-FIX-EXACT-CHECKPOINT.md'
          old = 'PR #191 is an evidence-only draft/non-merge audit branch. The exact artifact was repeatedly materialized and hash-checked before factual inspection. Key runs: `34659320633`, `34664093646`, and targeted gate run `34664411845` at HEAD `397e09e4bfd65f66b82b1b82151915a91c15148d`.'
          new = old + '\n\nDurable reconciliation was audited on PR #192 at exact clean HEAD `85b15aec9faf395cef5460d06a17be58ccd16af8`; Black Arcana CI **#2490** (`34664717042`) was GREEN with unit tests, diff sanity, NeoForge build, built-JAR verification, Foundation GameTest and dedicated-server smoke. PR #192 was squash-merged as `cc4cfc1d740f7714188e25a3586d8b43bb5eb969`; Black Arcana CI **#2491** (`34664871048`) was GREEN on that exact `main` SHA, including canonical QA-JAR publication.'
          replace(path, old, new)

          path = 'wiki/modpack-catalog/meta/CATALOG-COVERAGE-CURRENT.md'
          old = 'Phase 2BF exact-artifact reconciliation closes Somake 1.0.8-fix registry identity at 67 current registrations under the physical optional-provider set, but the provider remains `CONDITIONAL` because the deployed COMMON spell-lock config and complete survival acquisition/reachability are not authoritative. Phase 2BF therefore changes neither metric: **874** strict semantic objects and **55/100** closed provider components.'
          new = old + '\n\nPhase 2BF / PR #192 was audited at exact clean HEAD `85b15aec9faf395cef5460d06a17be58ccd16af8`, which passed Black Arcana CI **#2490**. It was squash-merged as `cc4cfc1d740f7714188e25a3586d8b43bb5eb969`; that exact merge SHA passed post-merge Black Arcana CI **#2491**, including unit tests, diff sanity, NeoForge build, built-JAR verification, Foundation GameTest, dedicated-server smoke and canonical QA-JAR publication.'
          replace(path, old, new)

          path = 'wiki/modpack-catalog/meta/PROVIDER-AUDIT-QUEUE.md'
          old = '- `main` canônica de referência para Phase 2BF: `41e96385c7ef5903b2595a4b027c9e2d053f09d6`; Phase 2BE foi fechada por PR #189/#190, com HEAD de catálogo `e787699d25b283b8040cd179f605143e8ee396de` CI #2483 GREEN, merge de catálogo `cce7f51794e4e65b0d97511eb55f710afc6e02f0` CI #2484 attempt 2 GREEN, e reconciliação final `main@41e96385c7ef5903b2595a4b027c9e2d053f09d6` CI #2486 GREEN;'
          new = '- `main` canônica após Phase 2BF / PR #192: `cc4cfc1d740f7714188e25a3586d8b43bb5eb969`; HEAD limpo auditado `85b15aec9faf395cef5460d06a17be58ccd16af8` CI #2490 GREEN; post-merge CI #2491 GREEN no merge SHA exato, incluindo canonical QA-JAR publication;'
          replace(path, old, new)

          old = '- isolated non-merge evidence PR #191; initial exact-registry run `34659320633`, reachability run `34664093646`, targeted gate run `34664411845`;'
          new = old + '\n- durable PR #192: clean HEAD `85b15aec9faf395cef5460d06a17be58ccd16af8` / CI #2490 GREEN; squash merge `cc4cfc1d740f7714188e25a3586d8b43bb5eb969` / post-merge CI #2491 GREEN;'
          replace(path, old, new)
          PY

      - name: Commit exact evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/modpack-catalog/meta
          git diff --cached --check
          git commit -m 'docs: record Phase 2BF final merge evidence'
          git push origin HEAD:docs/phase2bf-final-evidence
