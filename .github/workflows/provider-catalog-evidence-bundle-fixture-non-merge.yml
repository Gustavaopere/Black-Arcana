name: Provider Catalog Evidence Bundle Fixture NON-MERGE

on:
  push:
    branches:
      - qa/catalog-evidence-bundle-probe-log-2026-09-20
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundled runtime probe parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile docs/qa/provider-catalog-deployed-evidence-collector.py

          root="$(mktemp -d)"
          instance="$root/instance"
          mkdir -p "$instance/mods" "$instance/config" "$instance/logs"

          cat > "$instance/logs/latest.log" <<'EOF'
          [00:00:00] [Server thread/INFO] unrelated SUPER_SECRET_LOG_TEXT
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=begin schema=2
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=mod id=gaze loaded=true
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=spell id=somakespells:test_spell status=OBSERVED school=somakespells:aqua enabled=true allow_crafting=false
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=summary namespace=somakespells registered_count=1
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=loot_modifier_serializer id=traveloptics:key_loot status=OBSERVED
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=loot_modifier_serializer id=traveloptics:universal_loot status=OBSERVED
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=loot_modifier_pair namespace=traveloptics status=OBSERVED distinct_codec_instances=true
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=mod id=not_a_target loaded=true secret=PREFIXED_SECRET
          [00:00:01] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=end schema=2
          [00:00:02] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=begin schema=2
          [00:00:02] [Server thread/INFO] [BLACK_ARCANA_CATALOG_PROBE] type=mod id=gaze loaded=false
          EOF

          python3 docs/qa/provider-catalog-deployed-evidence-collector.py "$instance" --output "$root/default.json"

          python3 - "$root/default.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schema"] == 3
          probe = data["runtime_probe"]
          assert probe["status"] == "COMPLETE"
          assert probe["schema"] == 2
          assert probe["ignored_prefixed_rows"] == 1
          assert {"type": "mod", "id": "gaze", "loaded": True} in probe["rows"]
          assert {"type": "mod", "id": "gaze", "loaded": False} not in probe["rows"]
          assert {
              "type": "loot_modifier_pair",
              "namespace": "traveloptics",
              "status": "OBSERVED",
              "distinct_codec_instances": True,
          } in probe["rows"]
          serialized = json.dumps(data)
          assert "SUPER_SECRET_LOG_TEXT" not in serialized
          assert "PREFIXED_SECRET" not in serialized
          assert "Server thread" not in serialized
          PY

          cat > "$root/external.log" <<'EOF'
          [BLACK_ARCANA_CATALOG_PROBE] type=begin schema=1
          [BLACK_ARCANA_CATALOG_PROBE] type=summary namespace=asterismarcanum registered_count=11
          [BLACK_ARCANA_CATALOG_PROBE] type=end schema=1
          EOF

          python3 docs/qa/provider-catalog-deployed-evidence-collector.py "$instance" \
            --probe-log "$root/external.log" \
            --output "$root/explicit.json"

          python3 - "$root/explicit.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          probe = data["runtime_probe"]
          assert probe["status"] == "COMPLETE"
          assert probe["schema"] == 1
          assert probe["source"] == "external.log"
          assert probe["rows"] == [{
              "type": "summary",
              "namespace": "asterismarcanum",
              "registered_count": 11,
          }]
          PY
