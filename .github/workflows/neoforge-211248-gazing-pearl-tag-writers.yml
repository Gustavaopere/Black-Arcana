name: NeoForge 21.1.248 Gazing Pearl exact NBT Tag writer discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neoforge-211248-gazing-pearl-tag-writers.yml'
      - 'docs/qa/neoforge_211248_gazing_pearl_tag_writer_probe.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_tag_writer_checks.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_tag_writer_negative.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-TAG-WRITERS.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-TAG-WRITERS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_tag_write_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax check for bounded exact-distribution auditor
        run: |
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_tag_writer_probe.py
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_tag_writer_checks.py
          python3 -m py_compile docs/qa/neoforge_211248_gazing_pearl_tag_writer_negative.py
      - name: Fetch official NeoForge 21.1.248 installer with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gazing-pearl-tag-write-211248/server
          cd build/gazing-pearl-tag-write-211248/server
          BASE='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar.sha256" -o installer.sha256
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$BASE/neoforge-21.1.248-installer.jar" -o neoforge-installer.jar
          EXPECTED="$(awk '{print $1}' installer.sha256)"
          ACTUAL="$(sha256sum neoforge-installer.jar | awk '{print $1}')"
          test "$(printf '%s' "$EXPECTED" | wc -c)" -eq 64
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = '68eeab77059ba53df1812f1afa5bf530ab2566a3cdcd5f924aa6e71be42e410c'
          unzip -tq neoforge-installer.jar
      - name: Install official NeoForge server distribution
        shell: bash
        run: |
          set -euo pipefail
          cd build/gazing-pearl-tag-write-211248/server
          java -jar neoforge-installer.jar --installServer > install.log 2>&1 || {
            tail -n 90 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Discover concrete NBT Tag writer bodies, hashes and JVM calls
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_tag_writer_probe.py \
            --server build/gazing-pearl-tag-write-211248/server/libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar \
            --srg build/gazing-pearl-tag-write-211248/server/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/gazing-pearl-tag-write-211248/report.json
      - name: Fail closed against unproven runtime, persistence or hook assertions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/gazing-pearl-tag-write-211248/report.json').read_text())
          assert report['schema_version']==1
          assert report['scope']=='NEOFORGE_211248_NBT_TAG_WRITERS_DISTRIBUTED_DISCOVERY_ONLY'
          assert report['distribution']['neoforge_version']=='21.1.248'
          assert len(report['classes'])==6
          assert len(set(x['owner'] for x in report['classes']))==6
          assert report['all_tag_implementations_audited'] is False
          for x in report['classes']:
              assert x['class_major']==65
              assert x['source_archive'] in ('NEOFORGE_OVERLAY','INSTALLED_MINECRAFT_SRG')
              assert len(x['class_sha256'])==64
              assert x['selected_methods'] or x['non_executable_selected']
          assert report['live_modlauncher']=='NOT_OBSERVED'
          assert report['installed_modpack_parity']=='NOT_VERIFIED'
          assert report['filesystem_write_or_restart']=='NOT_TESTED'
          assert report['actual_nbt_reload']=='NOT_TESTED'
          assert report['shutdown_wait_callsite']=='NOT_VERIFIED'
          assert report['physical_qa']=='NOT_TESTED'
          assert report['static_contract']=='NOT_CERTIFIED'
          assert report['mutating_hook']=='NOT_VERIFIED'
          assert report['mutation']=='NO_MUTATION'
          assert report['provider_universe_closed'] is False
          assert report['semantic_magic_roots_delta']==0
          print('PASS: discovery only, no executable hook, no physical acceptance')
          PY
      - name: Verify exact Tag.write signatures and causal JVM opcodes
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_tag_writer_checks.py \
            --report build/gazing-pearl-tag-write-211248/report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-TAG-WRITERS.json'
          test "$(sha256sum build/gazing-pearl-tag-write-211248/report.json | cut -d ' ' -f1)" = \
            'c80b30aaac9a243f83af59c581800bb565653adc7fc7d1ada4a6b14546667351'
      - name: Reject 11 forged writer pivots with recomputed manifest hashes
        run: |
          python3 docs/qa/neoforge_211248_gazing_pearl_tag_writer_negative.py \
            --report build/gazing-pearl-tag-write-211248/report.json \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NEOFORGE-211248-GAZING-PEARL-TAG-WRITERS.json' \
            --checker docs/qa/neoforge_211248_gazing_pearl_tag_writer_checks.py
      - name: Upload report only (never official JARs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-211248-gazing-pearl-tag-writer-discovery
          path: build/gazing-pearl-tag-write-211248/report.json
          if-no-files-found: ignore
          retention-days: 14
