name: Alex's Caves 1.0.10 Gumball bounded probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_gumball_probe.py'
      - '.github/workflows/alexscaves-1010-gumball-probe.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_gumball_probe.py'
      - '.github/workflows/alexscaves-1010-gumball-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_gumball_selected_anchors:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate probe syntax
        run: python3 -m py_compile docs/qa/alexscaves_1010_gumball_probe.py
      - name: Download the exact publisher artifact
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Probe bounded exact Gumball impact instructions
        run: |
          python3 docs/qa/alexscaves_1010_gumball_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-1010/gumball-evidence.json
      - name: Publish bounded static evidence for review
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-gumball-probe
          path: build/alexscaves-1010/gumball-evidence.json
          if-no-files-found: error
          retention-days: 14
