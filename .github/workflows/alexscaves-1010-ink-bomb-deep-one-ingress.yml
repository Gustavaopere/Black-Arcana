name: Alex's Caves 1.0.10 Ink Bomb Deep One producer ingress discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_ink_bomb_deep_one_ingress_probe.py'
      - '.github/workflows/alexscaves-1010-ink-bomb-deep-one-ingress.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-INK-BOMB-DEEP-ONE-INGRESS-1.0.10.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_ink_bomb_producer_ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_ink_bomb_deep_one_ingress_probe.py
          python3 docs/qa/alexscaves_1010_ink_bomb_deep_one_ingress_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/ink-bomb-deep-one-ingress
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/ink-bomb-deep-one-ingress/publisher.jar
      - name: Project exact typed producer ingress and barter references
        run: |
          python3 docs/qa/alexscaves_1010_ink_bomb_deep_one_ingress_probe.py --jar build/ink-bomb-deep-one-ingress/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/ink-bomb-deep-one-ingress/report.json
      - name: Replay deterministic discovery
        run: |
          python3 docs/qa/alexscaves_1010_ink_bomb_deep_one_ingress_probe.py --jar build/ink-bomb-deep-one-ingress/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/ink-bomb-deep-one-ingress/replay.json
          cmp build/ink-bomb-deep-one-ingress/report.json build/ink-bomb-deep-one-ingress/replay.json
          test "$(wc -c < build/ink-bomb-deep-one-ingress/report.json)" -eq 137731
          echo '5e6f799b338bea093af675e9d8a4864fb959baea9e977b9b4c2012f5a3cae854  build/ink-bomb-deep-one-ingress/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ink-bomb-deep-one-ingress
          path: build/ink-bomb-deep-one-ingress/report.json
          if-no-files-found: warn
          retention-days: 14
