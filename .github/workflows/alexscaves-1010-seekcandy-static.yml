name: Alex's Caves 1.0.10 Seekcandy SHA-exact static contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-seekcandy-static.yml'
      - 'docs/qa/alexscaves_1010_seekcandy_static_probe.py'
      - 'docs/qa/alexscaves_1010_seekcandy_static_probe_test.py'
      - 'docs/qa/alexscaves_1010_seekcandy_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-seekcandy-static.yml'
      - 'docs/qa/alexscaves_1010_seekcandy_static_probe.py'
      - 'docs/qa/alexscaves_1010_seekcandy_static_probe_test.py'
      - 'docs/qa/alexscaves_1010_seekcandy_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
permissions:
  contents: read
jobs:
  seekcandy_static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify fail-closed probes
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_seekcandy_static_probe.py docs/qa/alexscaves_1010_seekcandy_static_probe_test.py
          python3 docs/qa/alexscaves_1010_seekcandy_static_probe_test.py -v
      - name: Download exact published NeoForge JAR
        run: |
          mkdir -p build/seekcandy-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/seekcandy-1010/publisher.jar
      - name: Audit exact consumer graph and seals
        run: |
          SEAL='wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-SEEKCANDY-STATIC-1.0.10.json'
          test -f "$SEAL"
          python3 docs/qa/alexscaves_1010_seekcandy_static_probe.py \
            --jar build/seekcandy-1010/publisher.jar --javap "$JAVA_HOME/bin/javap" \
            --seal "$SEAL" --output build/seekcandy-1010/evidence.json
          python3 docs/qa/alexscaves_1010_seekcandy_cards_test.py -v
      - name: Verify catalog and alphabetical indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alexscaves-seekcandy-1010-static-discovery
          path: build/seekcandy-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
