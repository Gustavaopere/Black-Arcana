name: Alex's Caves 1.0.10 Hazmat Armor exact static discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-hazmat-armor-discovery.yml'
      - 'docs/qa/alexscaves_1010_hazmat_armor_discovery.py'
      - 'docs/qa/alexscaves_1010_hazmat_armor_discovery_checks.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hazmat_armor_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only probe and fail-closed checker
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_hazmat_armor_discovery.py
          python3 -m py_compile docs/qa/alexscaves_1010_hazmat_armor_discovery_checks.py
      - name: Download publisher JAR (SHA identity verified in probe)
        run: |
          mkdir -p build/hazmat-armor-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/hazmat-armor-1010/publisher.jar
      - name: Discover exact Hazmat Armor native methods, consumers and resource hashes
        run: |
          python3 docs/qa/alexscaves_1010_hazmat_armor_discovery.py \
            --jar build/hazmat-armor-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/hazmat-armor-1010/report.json
      - name: Validate bounded discovery evidence and a malformed-report rejection
        run: |
          python3 docs/qa/alexscaves_1010_hazmat_armor_discovery_checks.py \
            --report build/hazmat-armor-1010/report.json
          echo '{}' > build/hazmat-armor-1010/bad.json
          if python3 docs/qa/alexscaves_1010_hazmat_armor_discovery_checks.py \
              --report build/hazmat-armor-1010/bad.json; then
            echo 'FAIL: malformed Hazmat evidence accepted'
            exit 1
          fi
      - name: Preserve unmodified discovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-hazmat-armor-discovery
          path: build/hazmat-armor-1010/report.json
          if-no-files-found: warn
          retention-days: 14
