name: audit-create-teleporters-2.0.2b

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/create-teleporters
          cd build/audit/create-teleporters
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/create-teleporters-829272/8010045/create-teleporters-829272-8010045.jar" \
            -o createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar
          test -s createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          EXPECTED_SHA1="76fe16fb464351859113102477bf91f100984257"
          ACTUAL_SHA1="$(sha1sum createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar | awk '{print $1}')"
          BYTES="$(stat -c %s createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=829272/8010045"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Inventory exact artifact
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          jar tf createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib,re,zipfile
          jar='createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar'
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              sem=re.compile(r'(teleport|portal|quantum|link|dimension|warp|spell|magic|ritual|ability)',re.I)
              cand=[n for n in names if sem.search(n)]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\nsemantic_like_paths={len(cand)}\n',encoding='utf-8')
              pathlib.Path('classes.txt').write_text('\n'.join(classes)+'\n',encoding='utf-8')
              pathlib.Path('semantic-like-paths.txt').write_text('\n'.join(cand)+'\n',encoding='utf-8')
          PY

      - name: Dump exact teleport and portal seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          : > javap-semantic.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              *Teleport*|*teleport*|*Portal*|*portal*|*Quantum*|*quantum*|*TPLink*|*Link*) ;;
              *) continue ;;
            esac
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-semantic.txt
            javap -classpath createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar -p -c -constants "$cls" >> javap-semantic.txt 2>&1 || true
          done < classes.txt
          grep -nEi 'teleportTo|changeDimension|ServerLevel|portal|link|quantum|entity|item|spell|magic|ritual|ability|use\(|useOn|tick\(' javap-semantic.txt > teleport-portal-seams.txt || true

      - name: Extract exact provider data
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          python3 - <<'PY'
          import json,pathlib,zipfile
          jar='createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar'
          rows=[]
          with zipfile.ZipFile(jar) as z:
              for name in sorted(z.namelist()):
                  if not name.startswith('data/') or not name.endswith('.json'): continue
                  try:
                      obj=json.loads(z.read(name))
                      compact=json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  except Exception as e:
                      compact='INVALID_JSON:'+type(e).__name__
                  rows.append((name,compact))
          pathlib.Path('provider-data-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
          pathlib.Path('provider-data-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Close exact player-facing transfer surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          : > javap-player-transfer.txt
          for cls in \
            net.createteleporters.item.PocketDimensionRemoteItem \
            net.createteleporters.item.TpLinkItem \
            net.createteleporters.item.ADVTplinkItem \
            net.createteleporters.procedures.PocketDimensionRemoteRightclickedProcedure \
            net.createteleporters.procedures.TpLinkRightclickedProcedure \
            net.createteleporters.procedures.AdvTpLinkRightclickedProcedure \
            net.createteleporters.procedures.BindCustomPortalProcedure \
            net.createteleporters.procedures.PocketGenProcedure \
            net.createteleporters.util.PocketDimensionTracker; do
              echo "===== $cls =====" >> javap-player-transfer.txt
              javap -classpath createteleporters-remastered-2.0.2b-neoforge-1.21.1.jar -p -c -constants "$cls" >> javap-player-transfer.txt 2>&1 || true
          done
          grep -nEi 'use\(|right|teleport|dimension|changeDimension|setPos|moveTo|portal|link|pocket|ServerLevel|cooldown|item|player' \
            javap-player-transfer.txt > player-transfer-seams.txt || true

      - name: Prove absence of magic registries/resources
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/create-teleporters
          python3 - <<'PY' | tee magic-keyword-counts.txt
          import pathlib,re
          text=pathlib.Path('jar-entries.txt').read_text(encoding='utf-8',errors='replace')
          for term in ('spell','magic','ritual','ability','mana','arcane','glyph'):
              print(f'{term}={len(re.findall(term,text,re.I))}')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: create-teleporters-2.0.2b-exact-artifact-audit
          path: |
            build/audit/create-teleporters/hashes.txt
            build/audit/create-teleporters/inventory.txt
            build/audit/create-teleporters/jar-entries.txt
            build/audit/create-teleporters/semantic-like-paths.txt
            build/audit/create-teleporters/javap-semantic.txt
            build/audit/create-teleporters/teleport-portal-seams.txt
            build/audit/create-teleporters/provider-data-json.txt
            build/audit/create-teleporters/provider-data-count.txt
            build/audit/create-teleporters/javap-player-transfer.txt
            build/audit/create-teleporters/player-transfer-seams.txt
            build/audit/create-teleporters/magic-keyword-counts.txt
          if-no-files-found: error
