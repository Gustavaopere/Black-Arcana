name: Alex's Caves 1.0.10 Tremorzilla exact grief helper ABI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe.py'
      - 'docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-GRIEF-HELPERS-1.0.10.json'
      - 'docs/qa/alexscaves-1010-tremorzilla-grief-helper-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-GRIEF-HELPERS-1.0.10.json'
      - '.github/workflows/alexscaves-1010-tremorzilla-grief-helper.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe.py'
      - 'docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-GRIEF-HELPERS-1.0.10.json'
      - 'docs/qa/alexscaves-1010-tremorzilla-grief-helper-handoff.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-GRIEF-HELPERS-1.0.10.json'
      - '.github/workflows/alexscaves-1010-tremorzilla-grief-helper.yml'

permissions:
  contents: read

jobs:
  exact_grief_helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic helper boundary regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe.py docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe_test.py
          python3 docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe_test.py -v
      - name: Acquire exact published 1.0.10 artifact
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Inspect exact native grief and compatibility helpers
        run: |
          python3 docs/qa/alexscaves_1010_tremorzilla_grief_helper_probe.py \
            --jar build/alexscaves-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-TREMORZILLA-GRIEF-HELPERS-1.0.10.json' \
            --output build/alexscaves-1010/tremorzilla-grief-helper-evidence.json
      - name: Upload bounded ABI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-tremorzilla-grief-helper-evidence
          path: build/alexscaves-1010/tremorzilla-grief-helper-evidence.json
          if-no-files-found: ignore
          retention-days: 14
