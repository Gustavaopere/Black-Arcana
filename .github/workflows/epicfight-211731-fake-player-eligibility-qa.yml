name: Epic Fight 21.17.3.1 fake player patch lifecycle eligibility (NeoForge 21.1.250)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/epicfight-211731-fake-player-eligibility-qa.yml'
      - 'src/epicFightCatalogQa/**'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_attachment_fake_player_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and fingerprint exact physical Epic Fight artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/epicfight-loaded-qa
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://cursemaven.com/curse/maven/epic-fight-mod-405076/8175609/epic-fight-mod-405076-8175609.jar' \
            --output build/epicfight-loaded-qa/epicfight-exact.jar
          echo 'fb199b7bbea2fc402da28ab586e73f47e32f8fc0  build/epicfight-loaded-qa/epicfight-exact.jar' | sha1sum --check
          echo '8b882554cf10086398340fbdc741819ee72a801a3adce516c7f4768326a39526  build/epicfight-loaded-qa/epicfight-exact.jar' | sha256sum --check
          jar tf build/epicfight-loaded-qa/epicfight-exact.jar | grep -Fx 'yesman/epicfight/registry/EpicFightRegistries.class'
          javap -classpath build/epicfight-loaded-qa/epicfight-exact.jar -p yesman.epicfight.skill.Skill | grep -F 'attributes;'

      - name: Build isolated QA companion with physical NeoForge release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pneo_version=21.1.250 epicFightCatalogQaJar
          QAJAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_epicfight_qa-*.jar' | head -n 1)"
          test -n "$QAJAR"
          jar tf "$QAJAR" | grep -Fx 'dev/gustavopere/blackarcana/qa/epicfight/EpicFightCatalogQaMod.class'
          unzip -p "$QAJAR" META-INF/neoforge.mods.toml | grep -Fq 'modId="epicfight"'
          unzip -p "$QAJAR" META-INF/neoforge.mods.toml | grep -Fq 'versionRange="[21.1.250,)"'
          ./gradlew --no-daemon -Pneo_version=21.1.250 jar
          PROD="$(find build/libs -maxdepth 1 -type f -name 'black_arcana-*.jar' | head -n 1)"
          test -n "$PROD"
          if jar tf "$PROD" | grep -Fq 'EpicFightCatalogQaMod'; then
            echo 'QA-only class leaked into production JAR'
            exit 1
          fi

      - name: Boot provider JAR as real NeoForge mod, record loaded skill entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server/mods build/epicfight-loaded-qa
          PUBLISHER="$PWD/build/epicfight-loaded-qa/epicfight-exact.jar"
          QAJAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_epicfight_qa-*.jar' | head -n 1)"
          cp "$PUBLISHER" runs/server/mods/epicfight-21.17.3.1.jar
          cp "$QAJAR" runs/server/mods/"$(basename "$QAJAR")"
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/epicfight-loaded-qa/server.log"
          BLACK_ARCANA_EPICFIGHT_QA_FAKE_PLAYER_PREFLIGHT=1 \
            ./gradlew --no-daemon -Pneo_version=21.1.250 runServer > "$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -f runs/server/mods/epicfight-21.17.3.1.jar
            rm -f runs/server/mods/black_arcana_epicfight_qa-*.jar
          }
          trap cleanup EXIT
          COMPLETE=0
          for _ in $(seq 1 150); do
            if grep -Fq '[BLACK_ARCANA_EPICFIGHT_FAKE_PLAYER_PREFLIGHT] type=end status=' "$LOG" && \
               grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              COMPLETE=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              tail -n 100 "$LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$COMPLETE" != 1 ]]; then
            tail -n 100 "$LOG"
            echo 'Loaded provider QA evidence not available'
            exit 1
          fi

      - name: Verify naturally attached patch lifecycle; never equip a fake player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path("build/epicfight-loaded-qa/server.log").read_text(errors="replace")
          assert re.search(r"\[BLACK_ARCANA_EPICFIGHT_LOADED_QA\] type=begin provider=epicfight loaded=true\b", log), "Exact Epic Fight not loaded"
          tag = r"\[BLACK_ARCANA_EPICFIGHT_FAKE_PLAYER_PREFLIGHT\]"
          results = re.findall(tag + r" type=end status=([A-Z0-9_]+)", log)
          assert len(results) == 1, f"Expected exactly one fake-player preflight: {results}"
          allowed = {
              "PATCH_ATTACHED_UNINITIALIZED_REQUIRES_JOIN_LIFECYCLE",
              "PATCH_ATTACHED_INITIALIZED_FAKE_PLAYER_NOT_CONNECTED",
          }
          assert results[0] in allowed, f"No valid Epic Fight ServerPlayerPatch eligibility observation: {results[0]}"
          detail = re.findall(tag + r" type=observation provider=epicfight fake_player=true patch=ServerPlayerPatch attached=true initialized=(true|false) max_health_base=([0-9.]+)", log)
          assert len(detail) == 1, f"Expected one non-mutating fake-player attribute baseline: {detail}"
          assert (detail[0][0] == "true") == (results[0] == "PATCH_ATTACHED_INITIALIZED_FAKE_PLAYER_NOT_CONNECTED")
          assert " equip_invoked=false attribute_mutated=false" in log
          data = {
              "scope": "FAKE_PLAYER_ATTACHMENT_AND_NATIVE_PLAYER_PATCH_INITIALIZATION_ONLY",
              "status": results[0],
              "epicfight": "21.17.3.1",
              "neoforge": "21.1.250",
              "fake_player": True,
              "patch": "ServerPlayerPatch",
              "patch_initialized": detail[0][0] == "true",
              "max_health_base": float(detail[0][1]),
              "skill_equipped": False,
              "attribute_mutated": False,
              "not_evidenced": ["connected_server_player", "skill_container_setSkill",
                                "onInitiate", "onRemoved", "actual_attribute_modifier",
                                "addon_modpack", "client_sync", "mastery_hook"],
          }
          path = pathlib.Path("build/epicfight-loaded-qa/fake-player-patch-eligibility.json")
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Publish bounded evidence without publisher or QA JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epicfight-fake-player-patch-eligibility-${{ github.sha }}
          path: build/epicfight-loaded-qa/fake-player-patch-eligibility.json
          if-no-files-found: error
          retention-days: 14
