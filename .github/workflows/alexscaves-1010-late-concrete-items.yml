name: Alex's Caves 1.0.10 Late concrete item families discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_late_concrete_items_probe.py'
      - '.github/workflows/alexscaves-1010-late-concrete-items.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-LATE-CONCRETE-ITEMS-1.0.10.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_late_concrete_items_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_late_concrete_items_probe.py
          python3 docs/qa/alexscaves_1010_late_concrete_items_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/late-concrete-items
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/late-concrete-items/publisher.jar
      - name: Project bounded exact item classes and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_late_concrete_items_probe.py --jar build/late-concrete-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/late-concrete-items/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_late_concrete_items_probe.py --jar build/late-concrete-items/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/late-concrete-items/replay.json
          cmp build/late-concrete-items/report.json build/late-concrete-items/replay.json
          test "$(wc -c < build/late-concrete-items/report.json)" -eq 425337
          echo 'aa6b3b052b975590f56dd2fa62773fe907346495093ef1842b0405de17b585a2  build/late-concrete-items/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: late-concrete-items
          path: build/late-concrete-items/report.json
          if-no-files-found: warn
          retention-days: 14
