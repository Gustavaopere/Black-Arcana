name: Alex's Caves 1.0.10 Galena Teletor controller separation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-teletor-controller.yml'
      - 'docs/qa/alexscaves_1010_galena_teletor_controller_probe.py'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_galena_motion_dataflow_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-TELETOR-CONTROLLER-1.0.10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_controller_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_galena_teletor_controller_probe.py
          python3 docs/qa/alexscaves_1010_galena_teletor_controller_probe.py --self-test
      - name: Download exact publisher
        run: |
          mkdir -p build/galena-teletor
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' -o build/galena-teletor/publisher.jar
      - name: Replay controller selection
        run: |
          for name in report replay; do
            python3 docs/qa/alexscaves_1010_galena_teletor_controller_probe.py --jar build/galena-teletor/publisher.jar --javap "$JAVA_HOME/bin/javap" --output "build/galena-teletor/$name.json"
          done
          cmp build/galena-teletor/report.json build/galena-teletor/replay.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: galena-teletor
          path: build/galena-teletor/report.json
          if-no-files-found: warn
          retention-days: 14
