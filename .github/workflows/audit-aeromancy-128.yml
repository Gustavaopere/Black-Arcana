name: Aeromancy Additions 1.2.8 exact publisher JAR audit
on:
  push:
    branches:
      - 'audit/aeromancy-128-binary-*'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify official CurseForge release SHA, leave physical parity unclaimed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,urllib.request,zipfile,pathlib
          name="aero_additions-1.2.8.jar"
          expected="dee32c9fa84a9b3796e39846608f8f77591ea56f"
          urls=[
            "https://mediafilez.forgecdn.net/files/8251/034/"+name,
            "https://media.forgecdn.net/files/8251/034/"+name,
            "https://cursemaven.com/curse/maven/snackpirates-aeromancy-additions-1160104/8251034/snackpirates-aeromancy-additions-1160104-8251034.jar",
          ]
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/name
          for url in urls:
            try:
              print("PUBLISHER_SOURCE="+url,flush=True)
              req=urllib.request.Request(url,headers={"User-Agent":"Black-Arcana-static-binary-registry-audit/1"})
              with urllib.request.urlopen(req,timeout=90) as response:
                data=response.read(12000000)
              sha=hashlib.sha1(data).hexdigest()
              print("ARTIFACT_BYTES="+str(len(data))+" SHA1="+sha,flush=True)
              if sha!=expected:continue
              path.write_bytes(data)
              with zipfile.ZipFile(path) as archive:
                assert archive.testzip() is None
              print("OFFICIAL_PUBLISHER_SHA_VERIFIED=PASS; PHYSICAL_SHA_UNKNOWN=TRUE",flush=True)
              with open(os.environ["GITHUB_ENV"],"a") as f:f.write("AERO_JAR="+str(path)+"\n")
              break
            except Exception as exc:
              print("PUBLISHER_SOURCE_ERROR="+repr(exc)[:200],flush=True)
          else:
            raise SystemExit("FAIL-CLOSED: exact publisher release could not be verified")
          PY
      - name: Enumerate Java 21 compiled spell registry and entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,subprocess,re
          jar=os.environ["AERO_JAR"]
          def java(cls):
            p=subprocess.run(["javap","-c","-p","-classpath",jar,cls],text=True,capture_output=True,timeout=35)
            assert p.returncode==0,(cls,p.stderr[:220])
            return p.stdout
          with zipfile.ZipFile(jar) as z:
            paths=z.namelist()
            print("TOTAL_CLASSES="+str(sum(s.endswith(".class") for s in paths)),flush=True)
            print("SPELL_CLASSES="+repr([s for s in paths if s.endswith("Spell.class") and s.startswith("com/snackpirate/aeromancy/spells/")]),flush=True)
            for s in paths:
              if s.endswith("neoforge.mods.toml"):
                t=z.read(s).decode("utf8")
                print("META_MOD_IDS="+repr(re.findall(r'modId\s*=\s*["\x27]([^"\x27]+)',t)),flush=True)
            print("JARJAR_EXPANDABILITY="+repr([s for s in paths if "expandability" in s.lower() and s.endswith(".jar")]),flush=True)
          root=java("com.snackpirate.aeromancy.Aeromancy")
          reg=java("com.snackpirate.aeromancy.spells.AASpells")
          print("AEROMANCY_BOOTSTRAP_LINES="+repr([x.strip() for x in root.splitlines() if "AASpells.register:" in x or "AASpells" in x][:20]))
          print("REGISTRAR_BODY_BEGIN",flush=True)
          for line in reg.splitlines():
            if line.strip().startswith("static {};"):
              print("BEGIN_CLINIT",flush=True)
            if "registerSpell" in line or "DeferredRegister" in line or "new           #" in line or "// class com/snackpirate/aeromancy/spells/" in line or "ifeq" in line or "ifne" in line or "goto" in line:
              print("BC_"+line.strip()[:300],flush=True)
          print("REGISTRAR_BODY_END",flush=True)
          print("SOURCE_CATALOG_IDS="+repr(["wind_charge","updraft","airstep","asphyxiate","feather_fall","wind_shield","airblast","wind_blade","flush","dash"]))
          print("PUBLISHER_DISCOVERY_ONLY_PHYSICAL_PARITY_NOT_PROVEN=TRUE")
          PY
      - name: Assert ten unconditional publisher-release spell identities, exclude five unpublished spells
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,zipfile
          jar=os.environ["AERO_JAR"]
          expected=[
            ('wind_charge','wind_charge.WindChargeSpell'),
            ('updraft','updraft.UpdraftSpell'),
            ('airstep','airstep.AirstepSpell'),
            ('asphyxiate','asphyxiate.AsphyxiateSpell'),
            ('feather_fall','feather_fall.FeatherFallSpell'),
            ('wind_shield','wind_shield.WindShieldSpell'),
            ('airblast','airblast.AirblastSpell'),
            ('wind_blade','wind_blade.WindBladeSpell'),
            ('flush','flush.FlushSpell'),
            ('dash','dash.DashSpell'),
          ]
          def javap(c):
            p=subprocess.run(['javap','-p','-c','-classpath',jar,c],capture_output=True,text=True,timeout=45)
            assert p.returncode==0,(c,p.stderr[:250])
            return p.stdout
          with zipfile.ZipFile(jar) as z:
            files=set(z.namelist())
            meta=z.read('META-INF/neoforge.mods.toml').decode('utf8')
            assert re.search(r'modId\s*=\s*"aero_additions"',meta)
            assert 'META-INF/jarjar/expandability-neoforge-12.0.0.jar' in files
          base='com.snackpirate.aeromancy.'
          root=javap(base+'Aeromancy')
          assert 'AASpells.register:(Lnet/neoforged/bus/api/IEventBus;)V' in root
          reg=javap(base+'spells.AASpells')
          assert 'SpellRegistry.SPELL_REGISTRY_KEY:' in reg and 'DeferredRegister.create:' in reg
          wrapper=reg.split('private static java.util.function.Supplier',1)[1].split('public static void register(',1)[0]
          assert 'DeferredRegister.register:(Ljava/lang/String;Ljava/util/function/Supplier;)' in wrapper
          assert 'getSpellName:' in wrapper
          bus=reg.split('public static void register(',1)[1].split('private static',1)[0]
          assert 'DeferredRegister.register:(Lnet/neoforged/bus/api/IEventBus;)V' in bus
          static=reg.split('static {};',1)[1]
          observed=re.findall(r'// class com/snackpirate/aeromancy/spells/([A-Za-z_0-9/]+Spell)',static)
          expected_cls=[name.replace('.','/') for _,name in expected]
          assert observed==expected_cls,('constructor order mismatch',observed)
          assert static.count('// Method registerSpell:(Lio/redspace/ironsspellbooks/api/spells/AbstractSpell;)')==10,'unexpected registration count'
          assert not re.search(r'^\s*\d+:\s+(?:ifeq|ifne|ifnull|ifnonnull|goto|tableswitch|lookupswitch)\b',static,re.M),'conditional registration in static block'
          # The bytecode actual classes, not source placeholders, must expose the ID suffix via own getSpellResource.
          for i,(suffix,cls) in enumerate(expected,1):
            f='com/snackpirate/aeromancy/spells/'+cls.replace('.','/')+'.class'
            assert f in files,('missing concrete class',f)
            out=javap(base+'spells.'+cls)
            assert 'extends io.redspace.ironsspellbooks.api.spells.AbstractSpell' in out,cls
            assert 'getSpellResource();' in out,(cls,'no spell id getter')
            assert '// String '+suffix in out,('compiled suffix missing',cls,suffix)
            assert 'Aeromancy.id:' in out,(cls,'namespace resource helper absent')
            print('PUBLISHER_SPELL_ID_'+str(i)+'=aero_additions:'+suffix+'|'+cls)
          for excluded in ['TornadoSpell','ThunderclapSpell','SummonBreezeSpell','TelelinkSpell','ShapeshiftSpell']:
            assert excluded not in '/'.join(observed),'an excluded class is now active'
          print('PUBLISHER_EXACT_STATIC_SPELLS=10')
          print('UNREGISTERED_SOURCE_CANDIDATES_EXCLUDED=5')
          print('JARJAR_EXPANDABILITY=12.0.0')
          print('PUBLISHER_STATIC_IDENTITY_AUDIT=PASS')
          print('PHYSICAL_INSTALLED_JAR_SHA_UNVERIFIED=TRUE')
          print('COMPATIBILITY_RUNTIME_SURVIVAL_NOT_VERIFIED=TRUE')
          PY
