name: Minecraft 1.21.1 official ArmorItem.Type exact enum discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/minecraft-1211-armor-type-enum.yml'
      - 'docs/qa/minecraft_1211_armor_type_enum_probe.py'
      - 'docs/qa/minecraft_1211_armor_type_enum_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  armor_enum_upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate deterministic parser and negative fixtures
        run: |
          python3 -m py_compile docs/qa/minecraft_1211_armor_type_enum_probe.py
          python3 docs/qa/minecraft_1211_armor_type_enum_probe.py --test
      - name: Inspect authenticated official Minecraft 1.21.1 ArmorItem.Type bytecode
        run: |
          mkdir -p build/armor-enum-1211
          python3 docs/qa/minecraft_1211_armor_type_enum_probe.py \
            --outdir build/armor-enum-1211/input \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/armor-enum-1211/report.json \
            > build/armor-enum-1211/probe.log
          cat build/armor-enum-1211/probe.log
      - name: Preserve bounded read-only evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-1211-armor-type-official-enum-discovery
          path: |
            build/armor-enum-1211/report.json
            build/armor-enum-1211/probe.log
          if-no-files-found: warn
          retention-days: 14
