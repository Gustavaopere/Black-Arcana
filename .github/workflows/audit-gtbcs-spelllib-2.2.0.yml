name: audit-gtbcs-spelllib-2.2.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/gtbcs_spelllib
          cd build/audit/gtbcs_spelllib
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/gtbcs-spelllib-1194714/8824651/gtbcs-spelllib-1194714-8824651.jar" \
            -o gtbcs_spell_lib-2.2.0-1.21.1.jar
          test -s gtbcs_spell_lib-2.2.0-1.21.1.jar

      - name: Verify physical hash equality
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/gtbcs_spelllib
          EXPECTED_SHA1="36cce8ab3117e89ae992a84a566d596709db2ffe"
          ACTUAL_SHA1="$(sha1sum gtbcs_spell_lib-2.2.0-1.21.1.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum gtbcs_spell_lib-2.2.0-1.21.1.jar | awk '{print $1}')"
          BYTES="$(stat -c %s gtbcs_spell_lib-2.2.0-1.21.1.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_file=1194714/8824651"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Extract complete archive inventory
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/gtbcs_spelllib
          jar tf gtbcs_spell_lib-2.2.0-1.21.1.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib,re,zipfile
          jar=pathlib.Path('gtbcs_spell_lib-2.2.0-1.21.1.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              data=[n for n in names if n.startswith('data/gtbcs_spell_lib/')]
              spell_classes=[n for n in classes if re.search(r'(spell|ritual|rite|ability|magic|glyph|focus)',n,re.I)]
              semantic_paths=[n for n in names if re.search(r'(spell|ritual|rite|ability|magic|glyph|focus|summon|mana|arcane)',n,re.I)]
              registry_classes=[n for n in classes if re.search(r'(registry|registries|register|moditems|modattributes|items|attributes)',n,re.I)]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\n'
                  f'provider_data={len(data)}\nspell_like_classes={len(spell_classes)}\nsemantic_paths={len(semantic_paths)}\nregistry_classes={len(registry_classes)}\n',
                  encoding='utf-8')
              pathlib.Path('classes.txt').write_text('\n'.join(classes)+'\n',encoding='utf-8')
              pathlib.Path('provider-data.txt').write_text('\n'.join(data)+'\n',encoding='utf-8')
              pathlib.Path('spell-like-classes.txt').write_text('\n'.join(spell_classes)+'\n',encoding='utf-8')
              pathlib.Path('semantic-paths.txt').write_text('\n'.join(semantic_paths)+'\n',encoding='utf-8')
              pathlib.Path('registry-classes.txt').write_text('\n'.join(registry_classes)+'\n',encoding='utf-8')
          PY

      - name: Dump complete provider bytecode surface
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/gtbcs_spelllib
          : > javap-all.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all.txt
            javap -classpath gtbcs_spell_lib-2.2.0-1.21.1.jar -p -c -constants "$cls" >> javap-all.txt 2>&1 || true
          done < classes.txt

      - name: Extract registry and semantic seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/gtbcs_spelllib
          grep -nEi 'DeferredRegister|register\(|AbstractSpell|SpellRegistry|ritual|rite|ability|glyph|focus|summon|mana|arcane|Treasure|Pouch|keep.?inventory|attribute|painting|loot|use\(|useOn|finishUsingItem|inventoryTick|KeyMapping|payload|packet' javap-all.txt > registry-semantic-seams.txt || true
          grep -nEi 'AbstractSpell|extends .*Spell|SpellRegistry|DeferredHolder.*Spell|spell.*register' javap-all.txt > spell-registration-seams.txt || true

      - name: Extract provider JSON surface
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/gtbcs_spelllib
          python3 - <<'PY'
          import json,pathlib,zipfile
          rows=[]
          with zipfile.ZipFile('gtbcs_spell_lib-2.2.0-1.21.1.jar') as z:
              for name in sorted(z.namelist()):
                  if not name.startswith('data/gtbcs_spell_lib/') or not name.endswith('.json'): continue
                  try:
                      data=json.loads(z.read(name))
                      compact=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  except Exception as e:
                      compact='INVALID_JSON:'+type(e).__name__
                  rows.append((name,compact))
          pathlib.Path('provider-json.txt').write_text('\n'.join(f'===== {n} =====\n{j}' for n,j in rows)+'\n',encoding='utf-8')
          pathlib.Path('provider-json-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gtbcs-spelllib-2.2.0-exact-artifact-audit
          path: |
            build/audit/gtbcs_spelllib/hashes.txt
            build/audit/gtbcs_spelllib/inventory.txt
            build/audit/gtbcs_spelllib/jar-entries.txt
            build/audit/gtbcs_spelllib/classes.txt
            build/audit/gtbcs_spelllib/provider-data.txt
            build/audit/gtbcs_spelllib/spell-like-classes.txt
            build/audit/gtbcs_spelllib/semantic-paths.txt
            build/audit/gtbcs_spelllib/registry-classes.txt
            build/audit/gtbcs_spelllib/javap-all.txt
            build/audit/gtbcs_spelllib/registry-semantic-seams.txt
            build/audit/gtbcs_spelllib/spell-registration-seams.txt
            build/audit/gtbcs_spelllib/provider-json.txt
            build/audit/gtbcs_spelllib/provider-json-count.txt
          if-no-files-found: error
