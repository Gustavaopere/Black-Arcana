name: Black Arcana CI

on:
  push:
    branches:
      - main
      - round-1-foundation
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: black-arcana-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            git diff --check HEAD^ HEAD
          else
            BASE="$(git merge-base origin/main HEAD)"
            git diff --check "$BASE" HEAD
          fi

      - name: NeoForge build
        run: ./gradlew --no-daemon build

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana-*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$JAR" | grep -Fx 'dev/gustavopere/blackarcana/BlackArcanaMod.class'

      - name: Foundation GameTest server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/gameTestServer
          printf 'eula=true\n' > runs/gameTestServer/eula.txt
          ./gradlew --no-daemon runGameTestServer

      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/server build
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/server-smoke.log"
          ./gradlew --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG"; then
              grep -Fq 'Black Arcana foundation loaded' "$LOG" || {
                cat "$LOG"
                exit 1
              }
              echo 'Dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1

      - name: Publish canonical QA JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: black-arcana-${{ github.sha }}
          path: build/libs/black_arcana-*.jar
          if-no-files-found: error
          retention-days: 7
