  stage05_qa_companion_smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Stage 05 QA companion JAR
        run: ./gradlew --no-daemon stage05QaFixtureJar

      - name: Stage 05 QA companion dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_JAR="$(find build/libs -maxdepth 1 -type f -name 'black_arcana_stage05_qa-*.jar' | head -n 1)"
          test -n "$FIXTURE_JAR"
          mkdir -p runs/server/mods build
          COPIED_FIXTURE="runs/server/mods/$(basename "$FIXTURE_JAR")"
          cp "$FIXTURE_JAR" "$COPIED_FIXTURE"
          printf 'eula=true\n' > runs/server/eula.txt
          LOG="$PWD/build/stage05-qa-companion-server-smoke.log"
          ./gradlew --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -f "$COPIED_FIXTURE"
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$LOG" \
              && grep -Fq 'Black Arcana foundation loaded' "$LOG" \
              && grep -Fq 'Black Arcana Stage 05 QA fixture installed 16 server-authoritative selection-only spells' "$LOG"; then
              echo 'Stage 05 QA companion dedicated-server smoke test: PASS'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1
)"
          test "$(printf '%s\n' "$REG113" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$REG114" | grep -c .)" -eq 1
          echo "CATACLYSM_1_1_13_REGISTRY_CLASS=$REG113"
          echo "CATACLYSM_1_1_14_REGISTRY_CLASS=$REG114"

          unzip -p "$TMP/1.1.13.jar" "$REG113" > "$TMP/registry-113.class"
          unzip -p "$TMP/1.1.14.jar" "$REG114" > "$TMP/registry-114.class"
          echo "CATACLYSM_1_1_13_REGISTRY_SHA256=$(sha256sum "$TMP/registry-113.class" | awk '{print $1}')"
          echo "CATACLYSM_1_1_14_REGISTRY_SHA256=$(sha256sum "$TMP/registry-114.class" | awk '{print $1}')"
          if cmp -s "$TMP/registry-113.class" "$TMP/registry-114.class"; then
            echo "CATACLYSM_REGISTRY_CLASS_IDENTICAL=true"
          else
            echo "CATACLYSM_REGISTRY_CLASS_IDENTICAL=false"
          fi

          python3 - "$TMP/1.1.13.jar" "$TMP/1.1.14.jar" <<'PY'
          import json
          import re
          import sys
          import zipfile

          spell_root = re.compile(r"^spell\.cataclysm_spellbooks\.[^.]+$")

          def inspect(path):
              with zipfile.ZipFile(path) as zf:
                  names = set(zf.namelist())
                  spell_classes = {
                      n for n in names
                      if n.endswith(".class")
                      and "/spells/" in n.lower()
                      and n.rsplit("/", 1)[-1].endswith("Spell.class")
                  }
                  lang_path = "assets/cataclysm_spellbooks/lang/en_us.json"
                  lang = json.loads(zf.read(lang_path))
                  roots = {k for k in lang if spell_root.match(k)}
                  return spell_classes, roots

          classes113, roots113 = inspect(sys.argv[1])
          classes114, roots114 = inspect(sys.argv[2])

          def emit_delta(label, old, new):
              print(f"{label}_1_1_13_COUNT={len(old)}")
              print(f"{label}_1_1_14_COUNT={len(new)}")
              print(f"{label}_ADDED_COUNT={len(new-old)}")
              for item in sorted(new-old):
                  print(f"{label}_ADDED={item}")
              print(f"{label}_REMOVED_COUNT={len(old-new)}")
              for item in sorted(old-new):
                  print(f"{label}_REMOVED={item}")

          emit_delta("CATACLYSM_SPELL_CLASS_PATHS", classes113, classes114)
          emit_delta("CATACLYSM_ROOT_LANG_KEYS", roots113, roots114)
          PY

