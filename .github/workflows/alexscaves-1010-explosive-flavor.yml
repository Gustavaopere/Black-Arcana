name: Alex's Caves 1.0.10 Explosive Flavor static contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-explosive-flavor.yml'
      - 'docs/qa/alexscaves_1010_explosive_flavor_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EXPLOSIVE-FLAVOR-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/explosive-flavor.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/ENCHANTMENT-PERK-CROSSWALK-1.0.10.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-explosive-flavor.yml'
      - 'docs/qa/alexscaves_1010_explosive_flavor_cards_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-EXPLOSIVE-FLAVOR-CAUSAL-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/enchantments/explosive-flavor.md'
      - 'wiki/modpack-catalog/meta/PERK-READY-CERTIFICATIONS.json'
      - 'wiki/modpack-catalog/providers/**/INDEX.md'

permissions:
  contents: read

jobs:
  explosive_flavor_static:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed native causal tests and negative mutation tests
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_explosive_flavor_cards_test.py
          python3 docs/qa/alexscaves_1010_explosive_flavor_cards_test.py -v
      - name: Fetch exact 1.0.10 publisher JAR and validate physical resource and classes
        run: |
          set -euo pipefail
          mkdir -p build/explosive-flavor
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/explosive-flavor/alexscaves-1.0.10.jar
          python3 docs/qa/alexscaves_1010_explosive_flavor_cards_test.py \
            --jar build/explosive-flavor/alexscaves-1.0.10.jar
      - name: Reaudit exact Gumball producer and consumer JVM manifest
        run: |
          python3 docs/qa/alexscaves_1010_action_contract_audit.py \
            --profile gumball \
            --jar build/explosive-flavor/alexscaves-1.0.10.jar \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GUMBALL-CONTRACTS-1.0.10.json' \
            --provider-root 'wiki/modpack-catalog/providers/✅-alexs-caves-continued' \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/explosive-flavor/gumball-exact-audit.json
      - name: Verify independent certificate and generated indexes
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: explosive-flavor-1010-static-evidence
          path: build/explosive-flavor/gumball-exact-audit.json
          if-no-files-found: ignore
          retention-days: 14
