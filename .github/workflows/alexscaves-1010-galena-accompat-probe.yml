name: Alex's Caves 1.0.10 Galena ACCompat JVM helper discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-accompat-probe.yml'
      - 'docs/qa/alexscaves_1010_galena_accompat_probe.py'
      - 'docs/qa/alexscaves_1010_galena_accompat_checks.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ACCOMPAT-HELPERS-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-ACCOMPAT-HELPERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/equipment/galena-gauntlet.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_galena_accompat_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate observational helper probe
        run: python3 -m py_compile docs/qa/alexscaves_1010_galena_accompat_probe.py
      - name: Download and verify exact installed-version publisher artifact
        run: |
          mkdir -p build/galena-accompat-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/galena-accompat-1010/publisher.jar
          test "$(sha256sum build/galena-accompat-1010/publisher.jar | cut -d ' ' -f1)" = \
            '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c'
          test "$(wc -c < build/galena-accompat-1010/publisher.jar)" -eq 75279314
          unzip -tq build/galena-accompat-1010/publisher.jar
      - name: Reproduce Galena item and magnetic weapon caller roster
        run: |
          python3 docs/qa/alexscaves_1010_galena_gauntlet_discovery.py \
            --jar build/galena-accompat-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-accompat-1010/caller-report.json \
            > build/galena-accompat-1010/caller-discovery.log
          test "$(sha256sum build/galena-accompat-1010/caller-report.json | cut -d ' ' -f1)" = \
            'c91a48f9892be09c4ab951c8083703b0c5ffbb026fc43e7d808c2033dde8bba9'
      - name: Discover ten exact ACCompat method bodies and caller identities
        run: |
          python3 docs/qa/alexscaves_1010_galena_accompat_probe.py \
            --jar build/galena-accompat-1010/publisher.jar \
            --caller-report build/galena-accompat-1010/caller-report.json \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-accompat-1010/accompat-report.json \
            > build/galena-accompat-1010/accompat-discovery.log
          test -s build/galena-accompat-1010/accompat-report.json
      - name: Preserve read-only helper evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-galena-accompat-helper-evidence
          path: |
            build/galena-accompat-1010/accompat-report.json
            build/galena-accompat-1010/accompat-discovery.log
          if-no-files-found: warn
          retention-days: 14
