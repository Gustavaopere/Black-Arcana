name: Alex's Caves 1.0.10 Raygun full declared method census discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-method-census.yml'
      - 'docs/qa/alexscaves_1010_raygun_method_census_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_method_census_probe_test.py'
      - 'docs/qa/alexscaves_1010_raygun_all_method_seal.py'
      - 'docs/qa/alexscaves_1010_raygun_all_method_seal_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ALL-METHODS-1.0.10.json'
      - 'docs/qa/alexscaves-1010-raygun-method-census-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-raygun-method-census.yml'
      - 'docs/qa/alexscaves_1010_raygun_method_census_probe.py'
      - 'docs/qa/alexscaves_1010_raygun_method_census_probe_test.py'
      - 'docs/qa/alexscaves_1010_raygun_all_method_seal.py'
      - 'docs/qa/alexscaves_1010_raygun_all_method_seal_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ALL-METHODS-1.0.10.json'
      - 'docs/qa/alexscaves-1010-raygun-method-census-handoff.md'

permissions:
  contents: read

jobs:
  raygun_all_method_census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Static safety regression suite
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_raygun_method_census_probe.py docs/qa/alexscaves_1010_raygun_method_census_probe_test.py docs/qa/alexscaves_1010_raygun_all_method_seal.py docs/qa/alexscaves_1010_raygun_all_method_seal_test.py
          python3 docs/qa/alexscaves_1010_raygun_method_census_probe_test.py -v
          python3 docs/qa/alexscaves_1010_raygun_all_method_seal_test.py -v
      - name: Fetch exact publisher JAR and SHA-256 verify
        run: |
          set -euo pipefail
          mkdir -p build/raygun-native-census
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/raygun-native-census/alexscaves-1.0.10.jar
          printf '%s  %s\n' \
            '36ae0a3cbd028df466a37c671ba2fdf021c060ca1c9c1c32e9f2e95bffae0e7c' \
            'build/raygun-native-census/alexscaves-1.0.10.jar' | sha256sum -c -
      - name: Survey all 26 native RaygunItem methods
        run: |
          python3 docs/qa/alexscaves_1010_raygun_method_census_probe.py \
            --jar build/raygun-native-census/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/raygun-native-census/evidence.json
      - name: Inspect all method fingerprints and prepare exact seal
        run: |
          python3 docs/qa/alexscaves_1010_raygun_all_method_seal.py \
            --report build/raygun-native-census/evidence.json \
            --seal 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-RAYGUN-ALL-METHODS-1.0.10.json'
      - name: Ensure catalog indexes unchanged
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raygun-1010-all-declared-methods-read-only-evidence
          path: build/raygun-native-census/evidence.json
          if-no-files-found: ignore
          retention-days: 14
