name: Alshanex 4.0.3 Megido numeric dependency footprints
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-numeric-footprint.yml'
      - 'docs/qa/alshanex_403_megido_numeric_footprint.py'
      - 'docs/qa/alshanex_403_megido_numeric_footprint_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alshanex-403-megido-numeric-footprint.yml'
      - 'docs/qa/alshanex_403_megido_numeric_footprint.py'
      - 'docs/qa/alshanex_403_megido_numeric_footprint_test.py'
      - 'wiki/modpack-catalog/providers/✅-alshanex-familiars/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  megido_numeric_footprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run synthetic footprint and fail-closed tests
        run: python3 docs/qa/alshanex_403_megido_numeric_footprint_test.py -v
      - name: Download SHA-matched provider JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/alshanex-megido-numeric
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/alshanexs-familiars-1171602/8675568/alshanexs-familiars-1171602-8675568.jar' \
            --output build/alshanex-megido-numeric/provider.jar
          echo 'e5051c2385a426d05bf203ba8081a23d891f6686  build/alshanex-megido-numeric/provider.jar' | sha1sum --check
      - name: Audit exact arithmetic and dependency categories
        run: |
          python3 docs/qa/alshanex_403_megido_numeric_footprint.py \
            --jar build/alshanex-megido-numeric/provider.jar \
            --output build/alshanex-megido-numeric/evidence.json
      - name: Upload metadata JSON only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alshanex-403-megido-numeric-footprint
          path: build/alshanex-megido-numeric/evidence.json
          if-no-files-found: ignore
          retention-days: 14
