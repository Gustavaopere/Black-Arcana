name: Alex's Caves 1.0.10 Remote Detonator source and state discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-remote-detonator-source-state.yml'
      - 'docs/qa/alexscaves_1010_remote_detonator_source_state_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_resource_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/neoforge_211248_gazing_pearl_saveddata_engine_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-REMOTE-DETONATOR-SOURCE-STATE-21.1.248.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_source_state_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and scope filters
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_remote_detonator_source_state_probe.py
          python3 docs/qa/alexscaves_1010_remote_detonator_source_state_probe.py --self-test
      - name: Download exact official NeoForge 21.1.248 server installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/remote-source-state
          cd build/remote-source-state
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 "$base/neoforge-21.1.248-installer.jar" -o installer.jar
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 60 "$base/neoforge-21.1.248-installer.jar.sha256" -o installer.jar.sha256
          actual="$(sha256sum installer.jar | cut -d' ' -f1)"
          expect="$(head -c 64 installer.jar.sha256)"
          [[ "$expect" =~ ^[0-9a-fA-F]{64}$ ]]
          test "$actual" = "${expect,,}"
          test "$actual" = '68eeab77059ba53df1812f1afa5bf530ab2566a3cdcd5f924aa6e71be42e410c'
          echo "NEOFORGE_EXACT_INSTALLER_SHA256 $actual"
          unzip -tq installer.jar
      - name: Materialize publisher-exact server/SRG distributions (not a running game)
        shell: bash
        run: |
          set -euo pipefail
          cd build/remote-source-state
          java -jar installer.jar --installServer > install.log 2>&1 || {
            echo "::error::NEOFORGE_211248_INSTALL_SERVER_FAILED"
            tail -n 80 install.log
            exit 1
          }
          test -f libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar
          test -f libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar
      - name: Fetch official universal artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/remote-source-state
          base='https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248'
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "$base/neoforge-21.1.248-universal.jar" -o universal.jar
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$base/neoforge-21.1.248-universal.jar.sha256" -o universal.jar.sha256
          unzip -tq universal.jar
      - name: Download exact publisher artifact
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/remote-source-state/publisher.jar
      - name: Inspect source, arithmetic and persistent component boundaries
        run: |
          python3 docs/qa/alexscaves_1010_remote_detonator_source_state_probe.py \
            --server build/remote-source-state/libraries/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-server.jar \
            --srg build/remote-source-state/libraries/net/minecraft/server/1.21.1-20240808.144430/server-1.21.1-20240808.144430-srg.jar \
            --universal build/remote-source-state/universal.jar \
            --publisher build/remote-source-state/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/remote-source-state/report.json
      - name: Verify exact expanded report seal
        run: |
          test "$(wc -c < build/remote-source-state/report.json)" = 491777
          echo '1c4e740204ade70a59c75466bd4ccee623ec178a9d79d413b35c5d372a744f1d  build/remote-source-state/report.json' | sha256sum -c -
      - name: Archive bounded discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-detonator-source-state
          path: build/remote-source-state/report.json
          if-no-files-found: warn
          retention-days: 14
