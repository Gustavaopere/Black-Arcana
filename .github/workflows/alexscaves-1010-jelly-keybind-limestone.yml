name: Alex's Caves 1.0.10 Jelly Bean, armor keybind and Limestone Spear discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_jelly_keybind_limestone_probe.py'
      - '.github/workflows/alexscaves-1010-jelly-keybind-limestone.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-JELLY-KEYBIND-LIMESTONE-1.0.10.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_jelly_keybind_limestone_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_jelly_keybind_limestone_probe.py
          python3 docs/qa/alexscaves_1010_jelly_keybind_limestone_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/jelly-keybind-limestone
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/jelly-keybind-limestone/publisher.jar
      - name: Project three exact item outer classes and typed consumers
        run: |
          python3 docs/qa/alexscaves_1010_jelly_keybind_limestone_probe.py --jar build/jelly-keybind-limestone/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/jelly-keybind-limestone/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_jelly_keybind_limestone_probe.py --jar build/jelly-keybind-limestone/publisher.jar --javap "$JAVA_HOME/bin/javap" --output build/jelly-keybind-limestone/replay.json
          cmp build/jelly-keybind-limestone/report.json build/jelly-keybind-limestone/replay.json
          test "$(wc -c < build/jelly-keybind-limestone/report.json)" -eq 186937
          echo '61a6010adbe0c6f41968a6ffc8f85e8c4c6e013175007f6be93280d3cf2da0ed  build/jelly-keybind-limestone/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jelly-keybind-limestone
          path: build/jelly-keybind-limestone/report.json
          if-no-files-found: warn
          retention-days: 14
