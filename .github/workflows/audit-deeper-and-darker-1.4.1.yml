name: audit-deeper-and-darker-1.4.1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact publisher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/audit/deeperdarker
          cd build/audit/deeperdarker
          curl -fL --retry 3 --retry-all-errors \
            "https://cursemaven.com/curse/maven/deeperdarker-659011/8201775/deeperdarker-659011-8201775.jar" \
            -o deeperdarker-neoforge-1.21.1-1.4.1.jar
          test -s deeperdarker-neoforge-1.21.1-1.4.1.jar

      - name: Record publisher versus physical hash relation
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/deeperdarker
          EXPECTED_SHA1="83f7edd0a8516b2767c2cda7a3b2402f9e290d88"
          ACTUAL_SHA1="$(sha1sum deeperdarker-neoforge-1.21.1-1.4.1.jar | awk '{print $1}')"
          ACTUAL_SHA256="$(sha256sum deeperdarker-neoforge-1.21.1-1.4.1.jar | awk '{print $1}')"
          BYTES="$(stat -c %s deeperdarker-neoforge-1.21.1-1.4.1.jar)"
          {
            echo "expected_physical_sha1=$EXPECTED_SHA1"
            echo "publisher_release=CurseForge 659011/8201775"
            echo "publisher_sha1=$ACTUAL_SHA1"
            echo "publisher_sha256=$ACTUAL_SHA256"
            echo "bytes=$BYTES"
          } | tee hashes.txt
          if [ "$ACTUAL_SHA1" = "$EXPECTED_SHA1" ]; then
            echo "artifact_relation=EXACT_PHYSICAL_EQUALS_PUBLISHER" | tee -a hashes.txt
          else
            echo "artifact_relation=OTHER_VERIFIED_PUBLISHER_DIFFERS_FROM_PHYSICAL" | tee -a hashes.txt
          fi

      - name: Inventory exact provider artifact
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/deeperdarker
          jar tf deeperdarker-neoforge-1.21.1-1.4.1.jar | sort > jar-entries.txt
          python3 - <<'PY'
          import pathlib, zipfile
          jar=pathlib.Path('deeperdarker-neoforge-1.21.1-1.4.1.jar')
          with zipfile.ZipFile(jar) as z:
              names=sorted(z.namelist())
              classes=[n for n in names if n.endswith('.class')]
              resources=[n for n in names if not n.endswith('.class')]
              data=[n for n in names if n.startswith('data/deeperdarker/')]
              pathlib.Path('inventory.txt').write_text(
                  f'entries={len(names)}\nclasses={len(classes)}\nresources={len(resources)}\nprovider_data={len(data)}\n',encoding='utf-8')
              pathlib.Path('class-list.txt').write_text('\n'.join(classes)+'\n',encoding='utf-8')
              pathlib.Path('provider-data.txt').write_text('\n'.join(data)+'\n',encoding='utf-8')
          PY

      - name: Exhaustively index player activation surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/deeperdarker
          : > javap-all.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            cls="${path%.class}"
            cls="${cls//\//.}"
            echo "===== $cls =====" >> javap-all.txt
            javap -classpath deeperdarker-neoforge-1.21.1-1.4.1.jar -p -c -constants "$cls" >> javap-all.txt 2>&1 || true
          done < class-list.txt
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('javap-all.txt').read_text(encoding='utf-8',errors='replace')
          sections=re.split(r'^===== (.+?) =====$',text,flags=re.M)
          methods=('use','useOn','releaseUsing','onUseTick','finishUsingItem','interactLivingEntity','inventoryTick','onArmorTick','hurtEnemy','mineBlock')
          rows=[]
          for i in range(1,len(sections),2):
              cls,body=sections[i],sections[i+1]
              found=[m for m in methods if re.search(r'\b'+re.escape(m)+r'\s*\(',body)]
              if found: rows.append((cls,','.join(found)))
          pathlib.Path('activation-index.txt').write_text('\n'.join(f'{c}\t{m}' for c,m in rows)+'\n',encoding='utf-8')
          PY

      - name: Extract portal staff and progression seams
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/deeperdarker
          grep -nEi 'SonorousStaff|sonorous_staff|HEART_OF_THE_DEEP|heart_of_the_deep|OthersidePortal|otherside_portal|spawnPortal|ignition|ReinforcedDeepslate|soul_elytra|SoulElytra' javap-all.txt > semantic-seams.txt || true
          grep -Ei 'sonorous_staff|heart_of_the_deep|otherside_portal|soul_elytra|warden|portal|recipe|loot' provider-data.txt > semantic-data-paths.txt || true

      - name: Extract exact recipes and loot references
        shell: bash
        run: |
          set -euo pipefail
          cd build/audit/deeperdarker
          python3 - <<'PY'
          import json,pathlib,zipfile
          with zipfile.ZipFile('deeperdarker-neoforge-1.21.1-1.4.1.jar') as z:
              names=sorted(z.namelist())
              rows=[]
              for name in names:
                  if not name.endswith('.json') or not name.startswith('data/'): continue
                  try: raw=z.read(name).decode('utf-8')
                  except Exception: continue
                  low=raw.lower()
                  if any(k in low for k in ('deeperdarker:sonorous_staff','deeperdarker:heart_of_the_deep','deeperdarker:soul_elytra')):
                      rows.append((name,raw))
              pathlib.Path('semantic-json-references.txt').write_text(
                  '\n'.join(f'===== {n} =====\n{raw}' for n,raw in rows)+'\n',encoding='utf-8')
              pathlib.Path('semantic-json-reference-count.txt').write_text(f'count={len(rows)}\n',encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: deeper-and-darker-1.4.1-exact-artifact-audit
          path: |
            build/audit/deeperdarker/hashes.txt
            build/audit/deeperdarker/inventory.txt
            build/audit/deeperdarker/jar-entries.txt
            build/audit/deeperdarker/class-list.txt
            build/audit/deeperdarker/provider-data.txt
            build/audit/deeperdarker/activation-index.txt
            build/audit/deeperdarker/semantic-seams.txt
            build/audit/deeperdarker/semantic-data-paths.txt
            build/audit/deeperdarker/semantic-json-references.txt
            build/audit/deeperdarker/semantic-json-reference-count.txt
          if-no-files-found: error
