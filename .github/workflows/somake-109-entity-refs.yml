name: Somake 1.0.9 five exact downstream entity references (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-entity-refs.yml'
      - 'docs/qa/somake_109_entity_method_probe.py'
      - 'docs/qa/somake_109_entity_method_probe_test.py'
      - 'docs/qa/somake_109_cast_refs.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-ENTITY-CALLSITES-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_entity_methods:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test bounded clean-room entity-reference parser
        run: python3 docs/qa/somake_109_entity_method_probe_test.py -v
      - name: Resolve installed exact Somake publisher JAR by pinned SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-109-entities
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-109-entities/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-109-entities/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Audit five compiled downstream entity method references
        run: |
          python3 docs/qa/somake_109_entity_method_probe.py \
            --jar build/somake-109-entities/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-109-entities/evidence.json
      - name: Upload narrow symbolic evidence JSON (no JAR)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-entity-symbols-${{ github.sha }}
          path: build/somake-109-entities/evidence.json
          if-no-files-found: ignore
          retention-days: 14
