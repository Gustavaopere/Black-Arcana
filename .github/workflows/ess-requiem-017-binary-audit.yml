name: Requiem 0.1.7 exact-JAR registration evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ess-requiem-017-binary-audit.yml'
      - 'docs/qa/ess_requiem_017_binary_audit.py'
      - 'docs/qa/ess_requiem_017_binary_audit_test.py'
      - 'wiki/modpack-catalog/providers/✅-enders-spells-and-stuff-requiem/SOURCE-0.1.7-SPELL-INVENTORY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ess-requiem-017-binary-audit.yml'
      - 'docs/qa/ess_requiem_017_binary_audit.py'
      - 'docs/qa/ess_requiem_017_binary_audit_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled_spell_id_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify synthetic fail-closed validator contracts
        run: python3 docs/qa/ess_requiem_017_binary_audit_test.py -v
      - name: Download official CurseForge 8762149 and require installed SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ess-requiem-017
          JAR='build/ess-requiem-017/ess_requiem-0.1.7.jar'
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://mediafilez.forgecdn.net/files/8762/149/ess_requiem-0.1.7.jar' \
            --output "$JAR"
          echo "c4648cced4f9e96527cfa4e3f5edcdcead43abb1  $JAR" | sha1sum --check
      - name: Inspect compiled registry field signatures (read-only diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/ess-requiem-017/ess_requiem-0.1.7.jar'
          for C in 'net.ender.ess_requiem.registries.GGSpellRegistry' 'net.ender.ess_requiem.compat.dte.dte_registry.DTESpellRegistry'; do
            echo "REGISTRY=$C"
            javap -p -classpath "$JAR" "$C" | grep -E '^  public static' | head -n 70
          done
      - name: Audit 55 base and three conditional DTE registry identities
        run: |
          python3 docs/qa/ess_requiem_017_binary_audit.py \
            --jar build/ess-requiem-017/ess_requiem-0.1.7.jar \
            --output build/ess-requiem-017/evidence.json
      - name: Upload narrow JSON, never distribute the publisher JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ess-requiem-017-binary-${{ github.sha }}
          path: build/ess-requiem-017/evidence.json
          if-no-files-found: ignore
          retention-days: 14
