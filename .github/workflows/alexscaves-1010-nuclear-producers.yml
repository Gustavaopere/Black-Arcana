name: Alex's Caves 1.0.10 NuclearExplosion producer references

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_producer_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_producer_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-PRODUCERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - '.github/workflows/alexscaves-1010-nuclear-producers.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_nuclear_producer_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_producer_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-PRODUCERS-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/intentional-game-design.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/damage-types/nuke.md'
      - '.github/workflows/alexscaves-1010-nuclear-producers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_nuclear_producers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic producer reference regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_nuclear_producer_probe.py
          python3 docs/qa/alexscaves_1010_nuclear_producer_probe_test.py -v
      - name: Download exact installed publisher JAR
        run: |
          mkdir -p build/alexscaves-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/alexscaves-1010/alexscaves-1.0.10.jar
      - name: Probe SHA-exact NuclearExplosion producer references
        run: |
          args=()
          if [ -f 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-PRODUCERS-1.0.10.json' ]; then
            args+=(--snapshot 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-NUCLEAR-PRODUCERS-1.0.10.json')
          fi
          python3 docs/qa/alexscaves_1010_nuclear_producer_probe.py --jar build/alexscaves-1010/alexscaves-1.0.10.jar --javap "$JAVA_HOME/bin/javap" --output build/alexscaves-1010/nuclear-producers.json "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-nuclear-producer-references
          path: build/alexscaves-1010/nuclear-producers.json
          if-no-files-found: error
          retention-days: 14
