name: Goety 3.1.4 Three Combat Focus ABI Audit (temporary)

on:
  push:
    branches:
      - audit/goety-314-three-combat-focuses-20261027

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect exact class surfaces and method-scoped references
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 300 \
            'https://www.cursemaven.com/curse/maven/goety-586095/8689429/goety-586095-8689429.jar' -o goety.jar
          echo 'a0770e180e4e8b1b87d8fa9c8356e9dbf34d82a7  goety.jar' | sha1sum -c -
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, zipfile
          JAR=Path('goety.jar')
          SHA='a0770e180e4e8b1b87d8fa9c8356e9dbf34d82a7'
          assert hashlib.sha1(JAR.read_bytes()).hexdigest()==SHA
          TARGETS={
            'FireBreath':'com.Polarice3.Goety.common.magic.spells.FireBreathSpell',
            'BreathingSpell':'com.Polarice3.Goety.common.magic.BreathingSpell',
            'IBreathingSpell':'com.Polarice3.Goety.api.magic.IBreathingSpell',
            'FrostNova':'com.Polarice3.Goety.common.magic.spells.frost.FrostNovaSpell',
            'ElectroOrbSpell':'com.Polarice3.Goety.common.magic.spells.storm.ElectroOrbSpell',
            'ElectroOrb':'com.Polarice3.Goety.common.entities.projectiles.ElectroOrb',
            'SpellThrowableProjectile':'com.Polarice3.Goety.common.entities.projectiles.SpellThrowableProjectile',
          }
          TARGET_METHODS={
            'FireBreath':('SpellResult','showWandBreath','defaultStats','baseDamage','conditionsMet'),
            'IBreathingSpell':('getBreathTarget',),
            'FrostNova':('SpellResult','hasCustomCooldown','createParticleBall','defaultStats'),
            'ElectroOrbSpell':('SpellResult','defaultStats'),
            'ElectroOrb':('onHit','finalizeExplosion','tick','getTargetingVec','canHitEntity','getDefaultGravity'),
          }
          PAT=re.compile(r'hurt|Damage|damage|fire|Fire|ignite|setBlock|cool|Cool|Spell|spell|Enchant|Target|target|Breath|breath|Soul|soul|Ring|Curio|Range|range|Radius|radius|Duration|duration|spawn|Fresh|Orb|orb|Extra|extra|Explosion|explosion|Chain|chain|addEffect|Weather|Rain|Raining|Thunder|Discount|discount|getStat|stats|radius|setStaff|Staff|staff|Frost|frost|setPos|shoot|Shoot|Projectile|projectile', re.I)
          with zipfile.ZipFile(JAR) as z:
            classes=set(z.namelist())
            evidence=['GOETY 3.1.4 EXACT THREE-COMBAT-FOCUS ABI AUDIT',
              'sha1='+SHA, 'source=CurseMaven 586095/8689429',
              'scope=class availability, method declaration and selected method-scoped symbolic invocations',
              'boundary=NO METHOD BODIES, OPERANDS, BRANCHES, CONSTANTS OR ASSETS RETAINED']
            for label, name in TARGETS.items():
              found=(name.replace('.','/')+'.class') in classes
              evidence.extend(['',f'CLASS={label} {name}',f'PRESENT={str(found).lower()}'])
              if not found:continue
              s=subprocess.run(['javap','-p','-c','-classpath',str(JAR),name],capture_output=True,text=True,check=True).stdout
              current='<class>'
              declaration_names=[]
              call_lines=[]
              for line in s.splitlines():
                t=line.strip()
                if t.endswith(';') and '(' in t and not re.match(r'^\d+:',t) and not t.startswith(('descriptor:','//','Code:')):
                  m=re.search(r'([\w$<>]+)\([^)]*\)(?:\s+throws .*)?;$',t)
                  if m:
                    current=m.group(1)
                    declaration_names.append(current)
                if label not in TARGET_METHODS or current not in TARGET_METHODS[label]:continue
                m=re.match(r'^\s*\d+:\s+([a-z][a-z0-9_]*)\b(.*)$',line)
                if not m:continue
                op,rest=m.group(1),m.group(2)
                comment=rest.partition('//')[2].strip()
                if op.startswith('invoke') and comment.startswith(('Method ','InterfaceMethod ')):
                  target=comment.split(' ',1)[1].split(':',1)[0].replace('"','')
                  if '.' in target:
                    owner,method=target.rsplit('.',1)
                    owner=owner.replace('/','.')
                  else:
                    owner,method=name,target
                  if PAT.search(method):
                    call_lines.append((current,'CALL',owner,method))
                if op in ('getfield','putfield','getstatic','putstatic') and comment.startswith('Field '):
                  target=comment.split(' ',1)[1].split(':',1)[0]
                  if '.' in target:
                    owner,field=target.rsplit('.',1)
                    owner=owner.replace('/','.')
                  else:
                    owner,field=name,target
                  if PAT.search(field):
                    call_lines.append((current,op.upper(),owner,field))
              for meth in TARGET_METHODS.get(label,()):
                evidence.append(f'METHOD={label}.{meth} present={str(meth in declaration_names).lower()}')
                relevant=[x for x in call_lines if x[0]==meth]
                evidence.append(f'RELEVANT_CALL_SITES={len(relevant)}')
                for _,op,owner,method in relevant[:70]:
                  evidence.append(f'{op}={label}.{meth}->{owner}.{method}')
                if len(relevant)>70:evidence.append(f'CALL_SITES_OMITTED={len(relevant)-70}')
            assert all(x.replace('.','/')+'.class' in classes for x in TARGETS.values()), 'Missing exact 3.1.4 class; report first'
            Path('audit/report.txt').write_text('\n'.join(evidence)+'\n',encoding='utf8')
            print('\n'.join(evidence))
          PY
      - name: Upload bounded text-only evidence
        uses: actions/upload-artifact@v7
        with:
          name: goety-314-three-combat-focus-abi
          path: audit/report.txt
          if-no-files-found: error
          retention-days: 30
