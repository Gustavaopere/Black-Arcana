name: Alex's Caves 1.0.10 Sea Swing bounded publisher discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-sea-swing.yml'
      - 'docs/qa/alexscaves_1010_sea_swing_probe.py'
      - 'docs/qa/alexscaves_1010_sea_swing_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-sea-swing.yml'
      - 'docs/qa/alexscaves_1010_sea_swing_probe.py'
      - 'docs/qa/alexscaves_1010_sea_swing_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'

permissions:
  contents: read

jobs:
  sea_swing_exact_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and fail-closed producer regressions
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_sea_swing_probe.py docs/qa/alexscaves_1010_sea_swing_probe_test.py
          python3 docs/qa/alexscaves_1010_sea_swing_probe_test.py -v
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/alexscaves-sea-swing-1010
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/alexscaves-sea-swing-1010/alexscaves-1.0.10.jar
      - name: Extract bounded SHA-exact Sea Swing JVM evidence
        run: |
          python3 docs/qa/alexscaves_1010_sea_swing_probe.py \
            --jar build/alexscaves-sea-swing-1010/alexscaves-1.0.10.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/alexscaves-sea-swing-1010/evidence.json \
            > build/alexscaves-sea-swing-1010/discovery-stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/alexscaves-sea-swing-1010/evidence.json').read_text())
          print('Publisher:', x['artifact'])
          print('Sea Swing JSON:', x['enchantment'])
          print('Producer:', x['producer_method'])
          for section in x['consumers']:
              for method in section['methods']:
                  print(section['owner'], method['name'], method['descriptor'],
                        method['instruction_count'],
                        [(p['needle'],p['hits']) for p in method['pivots']])
          print('Limits:',x['limits'])
          PY
      - name: Audit generated catalog indices
        run: |
          python3 scripts/catalog/check_perk_ready_indexes.py
          python3 scripts/catalog/generate_perk_ready_indexes.py --check
      - name: Archive bounded read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-sea-swing-discovery
          path: build/alexscaves-sea-swing-1010/evidence.json
          if-no-files-found: ignore
          retention-days: 14
