name: Somake 1.0.9 Funeral Bloom bud exact JVM audit (Java 21)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/somake-109-funeral-bud.yml'
      - 'docs/qa/somake_109_funeral_bud_probe.py'
      - 'docs/qa/somake_109_funeral_bud_probe_test.py'
      - 'wiki/modpack-catalog/providers/✅-somake-spells/EXACT-BINARY-FUNERAL-BLOOM-BUD-1.0.9.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_funeral_bud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic positive/negative JVM parser regression
        run: python3 docs/qa/somake_109_funeral_bud_probe_test.py -v
      - name: Acquire publisher artifact with physical SHA gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/somake-109-funeral-bud
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 180 \
            'https://cursemaven.com/curse/maven/somake-spells-irons-spells-addon-1461634/8867079/somake-spells-irons-spells-addon-1461634-8867079.jar' \
            --output build/somake-109-funeral-bud/somakespells-1.0.9-1.21.1.jar
          echo '171841ac9f802be9309ecc166c1d972ac6d404c0  build/somake-109-funeral-bud/somakespells-1.0.9-1.21.1.jar' | sha1sum --check
      - name: Examine FuneralBloomBudEntity exact compiled JVM symbols
        run: |
          python3 docs/qa/somake_109_funeral_bud_probe.py \
            --jar build/somake-109-funeral-bud/somakespells-1.0.9-1.21.1.jar \
            --output build/somake-109-funeral-bud/evidence.json
      - name: Save bounded symbolic metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somake-109-bud-jvm-symbols-${{ github.sha }}
          path: build/somake-109-funeral-bud/evidence.json
          if-no-files-found: ignore
          retention-days: 14
