name: Alex's Caves 1.0.10 Galena Gauntlet exact static discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alexscaves-1010-galena-gauntlet-discovery.yml'
      - 'docs/qa/alexscaves_1010_galena_gauntlet_discovery.py'
      - 'docs/qa/alexscaves_1010_galena_gauntlet_static_checks.py'
      - 'docs/qa/alexscaves_1010_burrowing_cave_map_probe.py'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/**'
      - 'wiki/modpack-catalog/providers/INDEX.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  galena_gauntlet_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile read-only Python probe
        run: python3 -m py_compile docs/qa/alexscaves_1010_galena_gauntlet_discovery.py
      - name: Download exact publisher JAR
        run: |
          mkdir -p build/galena-gauntlet-1010
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' \
            --output build/galena-gauntlet-1010/publisher.jar
      - name: Audit native items, consumers and magnetic weapon
        run: |
          python3 docs/qa/alexscaves_1010_galena_gauntlet_discovery.py \
            --jar build/galena-gauntlet-1010/publisher.jar \
            --javap "$JAVA_HOME/bin/javap" \
            --output build/galena-gauntlet-1010/report.json
      - name: Verify SHA-exact method roster and reject wrong input
        run: |
          python3 docs/qa/alexscaves_1010_galena_gauntlet_static_checks.py \
            --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-GAUNTLET-DISCOVERY-1.0.10.json' \
            --report build/galena-gauntlet-1010/report.json
          echo '{}' > build/galena-gauntlet-1010/bad.json
          if python3 docs/qa/alexscaves_1010_galena_gauntlet_static_checks.py \
              --manifest 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-GALENA-GAUNTLET-DISCOVERY-1.0.10.json' \
              --report build/galena-gauntlet-1010/bad.json; then
            echo 'ERROR: malformed report was accepted'
            exit 1
          fi
      - name: Preserve full read-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alexscaves-1010-galena-gauntlet-discovery
          path: build/galena-gauntlet-1010/report.json
          if-no-files-found: warn
          retention-days: 14
