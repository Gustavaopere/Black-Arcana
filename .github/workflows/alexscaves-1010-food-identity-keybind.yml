name: Alex's Caves 1.0.10 Food identity, health and keybind closure candidates
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/alexscaves_1010_food_identity_keybind_probe.py'
      - 'docs/qa/alexscaves_1010_food_health_reference.py'
      - '.github/workflows/alexscaves-1010-food-identity-keybind.yml'
      - 'docs/qa/alexscaves_1010_armor_material_audit.py'
      - 'docs/qa/alexscaves_1010_enchantable_item_probe.py'
      - 'docs/qa/alexscaves_1010_galena_211248_spawn_denial_guards_probe.py'
      - 'docs/qa/alexscaves_1010_nuclear_explosion_effect_probe.py'
      - 'docs/qa/alexscaves_1010_remote_detonator_block_callbacks_probe.py'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-FOOD-IDENTITY-KEYBIND-CLOSURE-1.0.10.md'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-KEYBIND-USING-ARMOR-CONTRACT-1.0.10.json'
      - 'wiki/modpack-catalog/providers/✅-alexs-caves-continued/systems/keybind-using-armor.md'
      - 'docs/qa/alexscaves_1010_four_items_downstream_250_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_food_identity_keybind_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile probe and test scope
        run: |
          python3 -m py_compile docs/qa/alexscaves_1010_food_identity_keybind_probe.py
          python3 docs/qa/alexscaves_1010_food_identity_keybind_probe.py --self-test
      - name: Fetch exact publisher artifact
        run: |
          mkdir -p build/food-identity-keybind
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://edge.forgecdn.net/files/8856/293/alexscaves-1.0.10-neoforge%2B1.21.1.jar' --output build/food-identity-keybind/publisher.jar
      - name: Project exact field consumers and selected native methods
        run: |
          python3 docs/qa/alexscaves_1010_food_identity_keybind_probe.py --jar build/food-identity-keybind/publisher.jar --keybind-manifest "wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-KEYBIND-USING-ARMOR-CONTRACT-1.0.10.json" --javap "$JAVA_HOME/bin/javap" --output build/food-identity-keybind/report.json
      - name: Replay identical bounded projection
        run: |
          python3 docs/qa/alexscaves_1010_food_identity_keybind_probe.py --jar build/food-identity-keybind/publisher.jar --keybind-manifest "wiki/modpack-catalog/providers/✅-alexs-caves-continued/EXACT-KEYBIND-USING-ARMOR-CONTRACT-1.0.10.json" --javap "$JAVA_HOME/bin/javap" --output build/food-identity-keybind/replay.json
          cmp build/food-identity-keybind/report.json build/food-identity-keybind/replay.json
          test "$(wc -c < build/food-identity-keybind/report.json)" -eq 765144
          echo '6c8e0c98af51b60fe40d3bd0b326fb909525f1780b2086740748e158b6bd20ea  build/food-identity-keybind/report.json' | sha256sum -c -
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: food-identity-keybind
          path: build/food-identity-keybind/report.json
          if-no-files-found: warn
          retention-days: 14
  official_health_reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Replay bounded vanilla 1.21.1 health and potion reference
        run: |
          mkdir -p build/food-health-reference
          python3 -m py_compile docs/qa/alexscaves_1010_food_health_reference.py
          python3 docs/qa/alexscaves_1010_food_health_reference.py --javap "$JAVA_HOME/bin/javap" --output build/food-health-reference/report.json
          python3 docs/qa/alexscaves_1010_food_health_reference.py --javap "$JAVA_HOME/bin/javap" --output build/food-health-reference/replay.json
          cmp build/food-health-reference/report.json build/food-health-reference/replay.json
          test "$(wc -c < build/food-health-reference/report.json)" -eq 149285
          echo '41e941487c560cc8deb700af7952801d31731c83986e56770c13f29d0dea8e67  build/food-health-reference/report.json' | sha256sum -c -
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: food-health-reference
          path: build/food-health-reference/report.json
          if-no-files-found: warn
          retention-days: 14
