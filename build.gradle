plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://code.redspace.io/releases'
        content {
            includeGroup 'io.redspace'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

sourceSets {
    stage05QaFixture {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    catalogQaProbe {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Unit tests directly exercise Minecraft/NeoForge types (SavedData, packet codecs,
    // reload listeners). Make the modding classpath explicit for test compilation.
    addModdingDependenciesTo(sourceSets.test)

    // Stage 05 physical QA content is compiled as an isolated source set. It is not
    // registered as part of the production Black Arcana mod and cannot enter the
    // canonical production JAR unless an explicit fixture JAR task packages it.
    addModdingDependenciesTo(sourceSets.stage05QaFixture)

    // Provider-catalog runtime evidence is a separate removable QA companion. It
    // compiles against the same public dependency APIs but never enters production.
    addModdingDependenciesTo(sourceSets.catalogQaProbe)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            gameDirectory = project.file("runs/${name}")
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileOnly.extendsFrom compileOnly
    stage05QaFixtureImplementation.extendsFrom implementation
    stage05QaFixtureCompileOnly.extendsFrom compileOnly
    stage05QaFixtureRuntimeOnly.extendsFrom runtimeOnly
    catalogQaProbeImplementation.extendsFrom implementation
    catalogQaProbeCompileOnly.extendsFrom compileOnly
    catalogQaProbeRuntimeOnly.extendsFrom runtimeOnly
}

sourceSets.test.runtimeClasspath += sourceSets.stage05QaFixture.output

dependencies {
    // Stable addon-facing Iron's API only. The full mod remains an optional runtime dependency.
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"

    // Ars Nouveau does not publish a dedicated API classifier; compile against the exact
    // installed-pack release mirrored by Modrinth, without transitives, and isolate provider
    // loading behind entrypoints.
    compileOnly("maven.modrinth:${ars_nouveau_modrinth_project_id}:${ars_nouveau_modrinth_version_id}") {
        transitive = false
    }

    // Eidolon 1.21.1 exposes its ritual classes in an api package but no standalone API jar.
    // Compile against the exact installed-pack release mirrored by Modrinth; all binary
    // references remain in optional adapter classes.
    compileOnly("maven.modrinth:${eidolon_repraised_modrinth_project_id}:${eidolon_repraised_modrinth_version_id}") {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    dependsOn tasks.named('stage05QaFixtureClasses')
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

var stage05QaFixtureProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_version             : mod_version,
]

tasks.named('processStage05QaFixtureResources', ProcessResources).configure {
    inputs.properties stage05QaFixtureProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand stage05QaFixtureProperties
    }
}

var catalogQaProbeProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_version             : mod_version,
]

tasks.named('processCatalogQaProbeResources', ProcessResources).configure {
    inputs.properties catalogQaProbeProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand catalogQaProbeProperties
    }
}

tasks.register('stage05QaFixtureJar', Jar) {
    dependsOn tasks.named('stage05QaFixtureClasses')
    archiveBaseName.set('black_arcana_stage05_qa')
    archiveVersion.set(project.mod_version)
    from(sourceSets.stage05QaFixture.output)
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    manifest {
        attributes('Automatic-Module-Name': 'dev.gustavopere.blackarcana.stage05qa')
    }
}

tasks.register('catalogQaProbeJar', Jar) {
    dependsOn tasks.named('catalogQaProbeClasses')
    archiveBaseName.set('black_arcana_catalog_qa')
    archiveVersion.set(project.mod_version)
    from(sourceSets.catalogQaProbe.output)
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    manifest {
        attributes('Automatic-Module-Name': 'dev.gustavopere.blackarcana.catalogqa')
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
