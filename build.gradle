plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://code.redspace.io/releases'
        content {
            includeGroup 'io.redspace'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Unit tests directly exercise Minecraft/NeoForge types (SavedData, packet codecs,
    // reload listeners). Make the modding classpath explicit for test compilation.
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            gameDirectory = project.file("runs/${name}")
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileOnly.extendsFrom compileOnly
}

dependencies {
    // Stable addon-facing Iron's API only. The full mod remains an optional runtime dependency.
    compileOnly "io.redspace:irons_spellbooks:${irons_spells_version}:api"

    // Ars Nouveau does not publish a dedicated API classifier; compile against the exact
    // installed-pack baseline without transitives and isolate provider loading behind entrypoints.
    compileOnly("curse.maven:ars-nouveau-401955:${ars_nouveau_file_id}") {
        transitive = false
    }
    // The Stage 07.07 provider contract test instantiates the public IFamiliar API directly.
    // Keep the same exact optional jar on the unit-test runtime without making it a production runtime dependency.
    testRuntimeOnly("curse.maven:ars-nouveau-401955:${ars_nouveau_file_id}") {
        transitive = false
    }

    // Eidolon 1.21.1 exposes its ritual classes in an api package but no standalone API jar.
    // Compile against the exact pack release; all binary references remain in optional adapter classes.
    compileOnly("curse.maven:eidolon-repraised-870250:${eidolon_repraised_file_id}") {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
